<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- User Avatar 2 - Creative Design -->
  <defs>
    <linearGradient id="avatar2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#avatar2)"/>
  
  <!-- Head -->
  <circle cx="100" cy="65" r="38" fill="#fff"/>
  
  <!-- Hair -->
  <path d="M 62 40 Q 60 15 100 10 Q 140 15 138 40 Q 135 50 100 55 Q 65 50 62 40" fill="#8b4513"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="60" r="5" fill="#2c3e50"/>
  <circle cx="115" cy="60" r="5" fill="#2c3e50"/>
  <circle cx="87" cy="58" r="2" fill="#fff"/>
  <circle cx="117" cy="58" r="2" fill="#fff"/>
  
  <!-- Nose -->
  <line x1="100" y1="65" x2="100" y2="75" stroke="#d4a574" stroke-width="2"/>
  
  <!-- Smile -->
  <path d="M 85 80 Q 100 88 115 80" stroke="#2c3e50" stroke-width="2.5" fill="none"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="40" ry="50" fill="#fff"/>
  
  <!-- Shirt -->
  <rect x="70" y="110" width="60" height="25" fill="#f5576c" rx="3"/>
  
  <!-- Collar accent -->
  <circle cx="85" cy="120" r="3" fill="#f093fb"/>
  <circle cx="115" cy="120" r="3" fill="#f093fb"/>
</svg>
