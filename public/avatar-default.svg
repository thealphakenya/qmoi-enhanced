<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Generic User Avatar - Default -->
  <defs>
    <linearGradient id="avatar3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#avatar3)"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="40" fill="#ffffff"/>
  
  <!-- Hair top -->
  <path d="M 60 50 Q 60 20 100 15 Q 140 20 140 50 L 130 65 Q 100 70 70 65 Z" fill="#333333"/>
  
  <!-- Ears -->
  <circle cx="58" cy="70" r="8" fill="#ffffff"/>
  <circle cx="142" cy="70" r="8" fill="#ffffff"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="65" r="6" fill="#333333"/>
  <circle cx="115" cy="65" r="6" fill="#333333"/>
  <ellipse cx="86" cy="63" rx="2" ry="3" fill="#ffffff"/>
  <ellipse cx="116" cy="63" rx="2" ry="3" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M 78 55 Q 85 52 92 55" stroke="#333333" stroke-width="1.5" fill="none"/>
  <path d="M 108 55 Q 115 52 122 55" stroke="#333333" stroke-width="1.5" fill="none"/>
  
  <!-- Nose -->
  <path d="M 100 65 L 100 80" stroke="#666666" stroke-width="1.5" fill="none"/>
  
  <!-- Mouth -->
  <path d="M 85 88 Q 100 95 115 88" stroke="#333333" stroke-width="2" fill="none"/>
  
  <!-- Body -->
  <path d="M 70 110 L 70 180 Q 100 190 130 180 L 130 110 Q 100 130 70 110" fill="#ffffff"/>
  
  <!-- Shirt shade -->
  <rect x="70" y="110" width="60" height="30" fill="#4facfe" opacity="0.3"/>
  
  <!-- Shoulders -->
  <ellipse cx="70" cy="115" rx="8" ry="12" fill="#ffffff"/>
  <ellipse cx="130" cy="115" rx="8" ry="12" fill="#ffffff"/>
</svg>
