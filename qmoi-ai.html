<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QMOI AI (Redirect)</title>
    <meta http-equiv="refresh" content="0; url=/pwa_apps/qmoi-ai/index.html" />
    <script>
      // Ensure unique URL so browsers open a new tab/window
      (function () {
        const target = "/pwa_apps/qmoi-ai/index.html?_open=" + Date.now();
        if (location.pathname !== target.split("?")[0]) {
          location.replace(target);
        }
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting to QMOI AI...
      <a href="/pwa_apps/qmoi-ai/index.html">Open QMOI AI</a>
    </p>
  </body>
</html>
