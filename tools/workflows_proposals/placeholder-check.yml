name: Prevent P0 Placeholder Merges

on:
  pull_request:
    branches: [ '**' ]

jobs:
  placeholder-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run placeholder scan
        run: |
          python3 tools/find_placeholders.py
          # Count matches in critical paths (P0) — app/api or src/services or backend
          python3 - <<'PY'
import json,sys
with open('matches.json') as f:
    matches=json.load(f)
count=sum(1 for m in matches if m['file'].startswith('app/api/') or m['file'].startswith('qmoi-enhanced/app/api/') or m['file'].startswith('src/services/') or m['file'].startswith('backend/') )
if count>0:
    print(f'Found {count} placeholder match(es) in critical paths — block merge')
    sys.exit(1)
else:
    print('No P0 placeholder matches found')
PY

