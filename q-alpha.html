<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Q Alpha (Redirect)</title>
        <meta http-equiv="refresh" content="0; url=/pwa_apps/q-alpha/index.html" />
        <script>
            (function(){
                const target = '/pwa_apps/q-alpha/index.html?_open=' + Date.now();
                if (location.pathname !== target.split('?')[0]) {
                    location.replace(target);
                }
            })();
        </script>
    </head>
    <body>
        <p>Redirecting to Q Alpha... <a href="/pwa_apps/q-alpha/index.html">Open Q Alpha</a></p>
    </body>
</html>
