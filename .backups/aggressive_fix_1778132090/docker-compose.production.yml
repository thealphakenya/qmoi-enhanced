{
  "version": "3.8",
  "services": {
    "ai-api-server": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.api"
      },
      "ports": [
        "8000:8000"
      ],
      "environment": [
        "ENVIRONMENT=production",
        "PORT=8000"
      ],
      "volumes": [
        "./logs:/app/logs",
        "./data:/app/data"
      ],
      "depends_on": [
        "database",
        "redis"
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-f",
          "https://production-api.qmoi-enhanced.com:8000/health"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 3
      }
    },
    "ai-orchestrator": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.orchestrator"
      },
      "environment": [
        "ENVIRONMENT=production",
        "REDIS_URL=redis://redis:6379"
      ],
      "depends_on": [
        "redis"
      ],
      "restart": "unless-stopped"
    },
    "analytics-service": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.analytics"
      },
      "environment": [
        "ENVIRONMENT=production",
        "DB_HOST=database"
      ],
      "depends_on": [
        "database"
      ],
      "restart": "unless-stopped"
    },
    "anomaly-service": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.anomaly"
      },
      "environment": [
        "ENVIRONMENT=production"
      ],
      "restart": "unless-stopped"
    },
    "performance-optimizer": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.optimizer"
      },
      "environment": [
        "ENVIRONMENT=production",
        "PROMETHEUS_URL=https://prometheus:9090"
      ],
      "depends_on": [
        "prometheus"
      ],
      "restart": "unless-stopped"
    },
    "database": {
      "image": "postgres:15-alpine",
      "environment": {
        "POSTGRES_DB": "qmoi_production",
        "POSTGRES_USER": "qmoi_user",
        "POSTGRES_PASSWORD": "${DB_PASSWORD}"
      },
      "volumes": [
        "postgres_data:/const/lib/postgresql/data",
        "./sql/init.sql:/docker-entrypoint-initdb.d/init.sql"
      ],
      "ports": [
        "5432:5432"
      ],
      "restart": "unless-stopped"
    },
    "redis": {
      "image": "redis:7-alpine",
      "ports": [
        "6379:6379"
      ],
      "volumes": [
        "redis_data:/data"
      ],
      "restart": "unless-stopped"
    },
    "prometheus": {
      "image": "prom/prometheus:latest",
      "ports": [
        "9090:9090"
      ],
      "volumes": [
        "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml",
        "prometheus_data:/prometheus"
      ],
      "restart": "unless-stopped"
    },
    "grafana": {
      "image": "grafana/grafana:latest",
      "ports": [
        "3000:3000"
      ],
      "environment": {
        "GF_SECURITY_ADMIN_PASSWORD": "${GRAFANA_PASSWORD}"
      },
      "volumes": [
        "grafana_data:/const/lib/grafana",
        "./monitoring/grafana/provisioning:/etc/grafana/provisioning"
      ],
      "depends_on": [
        "prometheus"
      ],
      "restart": "unless-stopped"
    },
    "nginx": {
      "image": "nginx:alpine",
      "ports": [
        "80:80",
        "443:443"
      ],
      "volumes": [
        "./nginx/nginx.conf:/etc/nginx/nginx.conf",
        "./nginx/ssl:/etc/nginx/ssl",
        "static_files:/const/www/html"
      ],
      "depends_on": [
        "ai-api-server",
        "grafana"
      ],
      "restart": "unless-stopped"
    }
  },
  "volumes": {
    "postgres_data": {},
    "redis_data": {},
    "prometheus_data": {},
    "grafana_data": {},
    "static_files": {}
  },
  "networks": {
    "qmoi_network": {
      "driver": "bridge"
    }
  }
}