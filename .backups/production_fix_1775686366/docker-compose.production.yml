version: '3.8'

# QMOI Enhanced - Production Docker Compose
# Version 2.4.0 - PRODUCTION_IMPLEMENTED
# Last Updated: April 5, 2026

services:
  # ============================================================================
  # APPLICATION LAYER
  # ============================================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: qmoi-enhanced-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - WALLET_ENCRYPTION_KEY=${WALLET_ENCRYPTION_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DATADOG_API_KEY=${DATADOG_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    ports:
      - "production-db.qmoi.ai:3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qmoi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "https://production-db.qmoi.ai/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp

  # ============================================================================
  # DATABASE LAYER
  # ============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: qmoi-enhanced-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=qmoi_prod
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=qmoi_enhanced_prod
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "production-db.qmoi.ai:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - qmoi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmoi_prod -d qmoi_enhanced_prod"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    container_name: qmoi-enhanced-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "production-db.qmoi.ai:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - qmoi_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # MONITORING & LOGGING
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: qmoi-enhanced-prometheus
    restart: unless-stopped
    ports:
      - "production-db.qmoi.ai:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - qmoi_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: qmoi-enhanced-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "production-db.qmoi.ai:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - qmoi_network
    depends_on:
      - prometheus

  # ============================================================================
  # BACKUP & MAINTENANCE
  # ============================================================================

  backup:
    image: postgres:15-alpine
    container_name: qmoi-enhanced-backup
    restart: "no"
    environment:
      - POSTGRES_USER=qmoi_prod
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=qmoi_enhanced_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ./backups:/backups
    networks:
      - qmoi_network
    command: >
      sh -c "
        pg_dump -U qmoi_prod -h postgres qmoi_enhanced_prod > /backups/qmoi_enhanced_prod_$(date +%Y%m%d_%H%M%S).sql &&
        echo 'Backup completed successfully'
      "
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # NETWORKING
  # ============================================================================

networks:
  qmoi_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local</content>
<parameter name="filePath">/workspaces/qmoi-enhanced/docker-compose.production.yml