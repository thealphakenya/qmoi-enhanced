name: Code Quality

on:
  pull_request:
    branches:
    - main
    - develop
jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Analysis
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run TypeScript check
      run: npx tsc --noEmit
    - name: Run ESLint
      run: npm run lint --if-present
    - name: Run tests with coverage
      run: npm run test:coverage --if-present
    - name: Check test coverage
      run: "# Verify minimum coverage thresholds\nif [ -f coverage/coverage-summary.json\
        \ ]; then\n  echo \"Coverage check would go here\"\nfi\n"
    - name: Comment PR with results
      if: always()
      uses: actions/github-script@v6
      with:
        script: "const fs = require('fs');\nif (fs.existsSync('coverage/coverage-summary.json'))\
          \ {\n  const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json',\
          \ 'utf8'));\n  const total = coverage.total;\n  \n  const comment = `##\
          \ Code Quality Report\n  \n  | Metric | Coverage |\n  |--------|----------|\n\
          \  | Lines | ${total.lines.pct}% |\n  | Functions | ${total.functions.pct}%\
          \ |\n  | Branches | ${total.branches.pct}% |\n  | Statements | ${total.statements.pct}%\
          \ |`;\n  \n  github.rest.issues.createComment({\n    issue_number: context.issue.number,\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    body:\
          \ comment\n  });\n}\n"
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
  workflow_dispatch: {}
