name: Sync Releases From Manifest

on:
  workflow_dispatch: {}
  schedule:
  - cron: 0 0 * * *
  push:
    tags:
    - v*
jobs:
  sync-draft:
    name: Sync assets to draft release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        '
    - name: Generate release manifest
      run: python3 scripts/generate_release_manifest.py
    - name: Sync assets to draft release
      env:
        GITHUB_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
      run: "TAG=\"${GITHUB_REF#refs/tags/}\"\nif [ \"$TAG\" = \"$GITHUB_REF\" ]; then\n\
        \  TAG=\"draft-$(git rev-parse --short HEAD)\"\nfi\npython3 scripts/sync_to_draft_release.py\
        \ --tag \"$TAG\"\n"
  sync-all-releases:
    name: Sync to all published releases (on-demand)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Generate release manifest
      run: python3 scripts/generate_release_manifest.py
    - name: Sync assets to all releases
      env:
        GITHUB_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
      run: 'python3 scripts/sync_all_releases.py

        '
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
  workflow_dispatch: {}
