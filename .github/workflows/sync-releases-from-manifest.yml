name: Sync Releases From Manifest

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  push:
    tags:
      - "v*"

jobs:
  sync-final:
    name: Sync assets to final release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Generate release manifest
        run: python3 scripts/generate_release_manifest.py

      - name: Sync assets to final release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="final-$(git rev-parse --short HEAD)"
          fi
          python3 scripts/sync_to_draft_release.py --tag "$TAG"

  sync-all-releases:
    name: Sync to all published releases (on-demand)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Generate release manifest
        run: python3 scripts/generate_release_manifest.py

      - name: Sync assets to all releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_all_releases.py
