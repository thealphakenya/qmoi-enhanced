name: Docker Build & Container Smoke

on:
  push:
    branches:
    - main
    - autosync-backup-20250926-232440
  pull_request:
    branches:
    - main
    - autosync-backup-20250926-232440
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: '${{ runner.os }}-node-

          '
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Build & (optionally) push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/autosync-backup-20250926-232440'
          }}
        tags: 'ghcr.io/${{ github.repository }}:latest

          ghcr.io/${{ github.repository }}:${{ github.sha }}

          '
        load: true
    - name: Run container for smoke tests
      run: 'docker run -d --rm -p 3000:3000 --name qmoi-ci ghcr.io/${{ github.repository
        }}:latest || true

        # give the app a few seconds to start

        sleep 3

        npm run -s --silent --prefix . ci:smoke

        '
      env:
        NODE_ENV: production
    - name: Stop container (cleanup)
      if: always()
      run: 'docker ps -a --filter "name=qmoi-ci" --format "{{.ID}}" | xargs -r docker
        stop || true

        '
'on':
  workflow_dispatch: {}
