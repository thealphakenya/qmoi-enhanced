name: Python Automation Tests

on:
  push:
    branches: ["**"]
    paths:
      - 'scripts/*.py'
      - 'scripts/*.test.py'
  pull_request:
    branches: ["**"]
    paths:
      - 'scripts/*.py'
      - 'scripts/*.test.py']

jobs:
  test-python-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      
      - name: Run All Percentages Automation Tests
        run: python scripts/all_percentages_automation.test.py
      
      - name: Run App Signing Automation Tests
        run: python scripts/app_signing_automation.test.py
      
      - name: Run prodice Orchestration Manager Tests
        run: python scripts/prodice_orchestration_manager.test.py
      
      - name: Run Autonomous Host Manager Tests
        run: python scripts/auto_host_manager.test.py
      
      - name: Run Real-time Email System Tests
        run: python scripts/realtime_email_tests.py</content>
