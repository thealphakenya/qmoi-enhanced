name: "VPN integration (manual, gated)"

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Set to '1' to confirm production mode and run live checks"
        required: true
        default: "0"

jobs:
  run-vpn-integration:
    name: "Run VPN integration checks (requires VPN_CONTROLLER_URL and confirm_production=1)"
    runs-on: ubuntu-latest
    if: ${{ secrets.VPN_CONTROLLER_URL && github.event.inputs.confirm_production == '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run VPN integration runner (TypeScript)
        env:
          VPN_CONTROLLER_URL: ${{ secrets.VPN_CONTROLLER_URL }}
          PRODUCTION_CONFIRMED: "1"
        run: npx ts-node ./src/scripts/integration/vpn_integration_runner.ts
