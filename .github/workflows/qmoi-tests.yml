name: QMOI Tests

on:
  push:
    branches:
      [main, autosync-backup-20250926-232440, ci-debug-output-manual-1766306758]
  pull_request:
    branches: [main]

jobs:
  node-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        continue-on-error: true
      - run: npm run ci:build --if-present
        continue-on-error: true
      - run: npm run test:quick-qmoi
        continue-on-error: true
      - run: npx jest --config=jest.config.cjs --runInBand --colors --verbose --detectOpenHandles || true
        continue-on-error: true
      - run: npm run test:qmoi-jest || true
        continue-on-error: true

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
        continue-on-error: true
      - run: python -m pip install pytest requests
        continue-on-error: true
      - run: pytest -q tests/test_qmoi_local_server.py -q || true
        continue-on-error: true
