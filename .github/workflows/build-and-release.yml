name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release-artifacts:
    name: Package and Release Artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare Android APK
        run: |
          mkdir -p release_artifacts
          find . -path "*/downloads/android/latest/*.apk" -o -path "*/Qmoi_downloaded_apps/android/latest/*.apk" | head -1 | xargs -I {} cp {} release_artifacts/app-release.apk 2>/dev/null || echo "No APK found"
          ls -lh release_artifacts/ || true
      
      - name: Prepare iOS IPA
        run: |
          find . -path "*/downloads/ios/latest/*.ipa" -o -path "*/Qmoi_downloaded_apps/ios/latest/*.ipa" | head -1 | xargs -I {} cp {} release_artifacts/ 2>/dev/null || echo "No IPA found"
          ls -lh release_artifacts/ || true
      
      - name: Prepare Windows EXE
        run: |
          find . -path "*/downloads/windows/latest/*.exe" -o -path "*/Qmoi_downloaded_apps/windows/latest/*.exe" | head -1 | xargs -I {} cp {} release_artifacts/qmoi.exe 2>/dev/null || echo "No EXE found"
          ls -lh release_artifacts/ || true
      
      - name: Package PWAs
        run: |
          for pwa in pwa_apps/admin pwa_apps/deals pwa_apps/q-alpha pwa_apps/qmoi pwa_apps/qmoi-ai pwa_apps/qmoi-space pwa_apps/qstore; do
            if [ -d "$pwa" ]; then
              name=$(basename $pwa)
              cd "$pwa"
              if [ -d dist ]; then
                cd dist && zip -rq ../../../release_artifacts/${name}.zip . && cd - >/dev/null
              else
                cd .. && zip -rq ../../release_artifacts/${name}.zip . -x "node_modules/*" && cd - >/dev/null
              fi
              echo "✓ Packaged $name"
            fi
          done
          ls -lh release_artifacts/ | tail -10
      
      - name: Generate Checksums
        run: |
          cd release_artifacts
          sha256sum * > SHA256SUMS.txt 2>/dev/null || echo "No files to checksum"
          echo "=== Release Checksums ==="
          cat SHA256SUMS.txt
      
      - name: Upload All Artifacts to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_artifacts/*
          draft: false
          prerelease: false
