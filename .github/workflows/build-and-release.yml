name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: qmoi-enhanced/mobile/android
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon -q 2>/dev/null || true
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: qmoi-enhanced/mobile/android/app/build/outputs/apk/**/app-*release*.apk

  build-pwas:
    name: Build PWAs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, deals, q-alpha, qmoi, qmoi-ai, qmoi-space, qstore]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build
        working-directory: pwa_apps/${{ matrix.app }}
        run: npm ci && npm run build || true
      - name: Package
        working-directory: pwa_apps/${{ matrix.app }}
        run: |
          mkdir -p ../../web_releases
          if [ -d dist ]; then
            cd dist && zip -rq ../../../web_releases/${{ matrix.app }}.zip .
          else
            cd .. && zip -rq ../../web_releases/${{ matrix.app }}.zip . -x "node_modules/*"
          fi
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: web_releases/${{ matrix.app }}.zip

  verify:
    name: Verify Artifacts
    runs-on: ubuntu-latest
    needs: [build-android, build-pwas]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Generate Checksums
        run: |
          mkdir -p checksums
          find . -name "*.apk" -o -name "*.zip" | head -20 | xargs -I {} sha256sum {} > checksums/SHA256SUMS.txt 2>/dev/null || echo "No artifacts"
          cat checksums/SHA256SUMS.txt || true
      - name: Upload Checksums
        uses: softprops/action-gh-release@v1
        with:
          files: checksums/SHA256SUMS.txt
