name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Collect APK
        run: |
          mkdir -p artifacts
          find . -name "qmoi_ai.apk" -type f 2>/dev/null | head -1 | xargs -I {} cp {} artifacts/qmoi-release.apk 2>/dev/null || echo "No APK"
          ls -lh artifacts/ || echo "empty"
      
      - name: Collect IPA
        run: find . -name "*.ipa" -type f 2>/dev/null | head -1 | xargs -I {} cp {} artifacts/ 2>/dev/null || echo "No IPA"
      
      - name: Collect EXE
        run: find . -name "qmoi*.exe" -type f 2>/dev/null | grep -E "(downloads|Qmoi_downloaded)" | head -1 | xargs -I {} cp {} artifacts/qmoi-release.exe 2>/dev/null || echo "No EXE"
      
      - name: Package PWAs
        run: |
          for app in admin deals q-alpha qmoi qmoi-ai qmoi-space qstore; do
            if [ -d "pwa_apps/$app" ]; then
              cd "pwa_apps/$app"
              if [ -d dist ]; then
                zip -rq ../../artifacts/$app.zip dist/
              else
                zip -rq ../../artifacts/$app.zip .  -x "node_modules/*" "*.git*"
              fi
              cd - >/dev/null
              echo "✓ $app packaged"
            fi
          done
      
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt 2>/dev/null; cat SHA256SUMS.txt || echo "empty"
      
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
