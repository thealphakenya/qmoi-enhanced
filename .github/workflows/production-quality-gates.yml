name: Production Quality Gates

on:
  push:
    branches: [feature/auth-prod-*, main, production]
  pull_request:
    branches: [main, production]
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run type-check
      
      - name: Report type errors
        if: failure()
        run: echo "::error::TypeScript compilation failed"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test -- --testPathPattern="(unit|__tests__)" --coverage
        env:
          MASTER_TOKEN: ${{ secrets.TEST_MASTER_TOKEN }}
          NODE_ENV: test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
      
      - name: Run integration tests
        run: npm test -- --testPathPattern="integration" --maxWorkers=2
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
          MASTER_TOKEN: ${{ secrets.TEST_MASTER_TOKEN }}
          BASE_URL: http://localhost:3000

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security tests
        run: npm test -- --testPathPattern="auth|webhook|security"
        env:
          MASTER_TOKEN: ${{ secrets.TEST_MASTER_TOKEN }}
      
      - name: Check for hardcoded secrets
        run: npm run lint -- --rule no-hardcoded-secrets

  health-check:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify production health
        run: |
          # Check that all critical endpoints are reachable
          [ -f "app/api/cashon/start-trading/route.ts" ] || exit 1
          [ -f "app/api/cashon/stop-trading/route.ts" ] || exit 1
          [ -f "app/api/cashon/balance/route.ts" ] || exit 1
          [ -f "app/api/cashon/signals/route.ts" ] || exit 1
          [ -f "services/monitoring.ts" ] || exit 1
          [ -f "services/adapters/binance.ts" ] || exit 1
          echo "✓ All critical files present"
      
      - name: Verify test coverage
        run: |
          [ -f "__tests__/api/cashon/endpoints.test.ts" ] || exit 1
          [ -f "__tests__/integration/trading-workflow.test.ts" ] || exit 1
          [ -f "__tests__/auth/master-token.test.ts" ] || exit 1
          echo "✓ All test suites present"
      
      - name: Verify documentation
        run: |
          grep -q "Production Implementation" HOOKS.md || exit 1
          grep -q "Production endpoints" WEBHOOKS.md || exit 1
          grep -q "Test Suite Status" ALLTESTSAUTOTESTS.md || exit 1
          echo "✓ Documentation complete"

  performance-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run performance benchmarks
        run: npm run bench || echo "Benchmarks not available"

  notify-completion:
    runs-on: ubuntu-latest
    needs: [type-check, unit-tests, integration-tests, security-tests, health-check]
    if: always()
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.type-check.result }}" = "failure" ] || [ "${{ needs.unit-tests.result }}" = "failure" ] || [ "${{ needs.security-tests.result }}" = "failure" ]; then
            echo "::error::Quality gates failed"
            exit 1
          fi
          echo "✓ All quality gates passed"
      
      - name: Slack notification
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ QMOI Production Build Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Quality gates failed for ${{ github.ref }}"
                  }
                }
              ]
            }
