name: Build and Push Docker image (GHCR)

on:
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/qvillage-standalone
        tags: 'type=raw,value=latest

          type=sha

          '
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.MY_CUSTOM_TOKEN != '' && secrets.MY_CUSTOM_TOKEN ||
          secrets.GITHUB_TOKEN }}
    - name: Build and Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.qvillage
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        sbom: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Notify QCity (optional)
      if: ${{ secrets.QCITY_DEPLOY_WEBHOOK }}
      run: "echo \"Triggering QCity deploy webhook...\"\ncurl --fail --silent --show-error\
        \ \\\n  -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -d \"{\\\
        \"image\\\":\\\"ghcr.io/${{ github.repository_owner }}/qvillage-standalone:latest\\\
        \"}\" \\\n  \"${{ secrets.QCITY_DEPLOY_WEBHOOK }}\" || true"
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
  workflow_dispatch: {}
