name: Build and Push Docker image (GHCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.qvillage
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qvillage-standalone:latest
            ghcr.io/${{ github.repository_owner }}/qvillage-standalone:${{ github.sha }}

      - name: Notify QCity (optional)
        if: ${{ secrets.QCITY_DEPLOY_WEBHOOK != '' }}
        run: |
          echo "Triggering QCity deploy webhook"
          curl -sSf -X POST -H "Content-Type: application/json" -d '{"image":"ghcr.io/'"${{ github.repository_owner }}"'/qvillage-standalone:latest"}' "${{ secrets.QCITY_DEPLOY_WEBHOOK }}" || true
