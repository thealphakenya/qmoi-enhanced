name: Auto-open PR for release branch

on:
  push:
    branches:
      - 'feature/ci-verify-and-release'

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open PR if missing
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'feature/ci-verify-and-release'
            const base = process.env.INPUT_BASE || 'autosync-backup-20250926-232440'
            const title = 'ci: verify & auto-release multi-platform builds'
            const body = `Automated PR: verify & auto-release multi-platform builds. See REPORT_CI_VERIFY_AND_RELEASE.md for details.`

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base,
              state: 'open'
            })

            if (pulls.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head: branch,
                base,
                body
              })
              core.info('PR created')
            } else {
              core.info('PR already exists, skipping')
            }