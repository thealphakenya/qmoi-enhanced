name: CI - Dry-run Tests

on:
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci || true
    - name: Run placeholder scanner (dry-run)
      run: python3 scripts/replace_placeholders.py
    - name: Run Rust lint/fix scaffold (dry-run)
      run: scripts/run_rust_lint_fix.sh
    - name: Run unit tests (fast)
      run: npm test --silent || true
    - name: Upload .qmoi_validation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qmoi-validation
        path: .qmoi_validation/**
'on':
  workflow_dispatch: {}
