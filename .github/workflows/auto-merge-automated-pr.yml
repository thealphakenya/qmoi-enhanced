name: Auto-merge automated proposals

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for automated PRs
    runs-on: ubuntu-latest

    if: >
      startsWith(github.event.pull_request.head.ref, 'automated/') ||
      startsWith(github.event.pull_request.head.ref, 'auto/')

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Automatic PR Merge"
          echo "=========================================="
          echo "Repository: ${REPOSITORY}"
          echo "PR:         #${PR_NUMBER}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: No GitHub token is available."
            exit 1
          fi

          echo "Checking pull request state..."

          PR_JSON="$(gh pr view "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --json number,state,isDraft,headRefName,baseRefName,url)"

          echo "${PR_JSON}" | jq .

          PR_STATE="$(echo "${PR_JSON}" | jq -r '.state')"
          IS_DRAFT="$(echo "${PR_JSON}" | jq -r '.isDraft')"
          HEAD_REF="$(echo "${PR_JSON}" | jq -r '.headRefName')"
          BASE_REF="$(echo "${PR_JSON}" | jq -r '.baseRefName')"

          echo "State:      ${PR_STATE}"
          echo "Draft:      ${IS_DRAFT}"
          echo "Head:       ${HEAD_REF}"
          echo "Base:       ${BASE_REF}"

          if [ "${PR_STATE}" != "OPEN" ]; then
            echo "PR is not open. Nothing to do."
            exit 0
          fi

          if [ "${IS_DRAFT}" = "true" ]; then
            echo "PR is still a draft. Nothing to do."
            exit 0
          fi

          case "${HEAD_REF}" in
            automated/*|auto/*)
              echo "Branch is eligible for automatic merging."
              ;;
            *)
              echo "Branch is not an approved automated branch."
              exit 0
              ;;
          esac

          echo "Checking whether auto-merge is already enabled..."

          AUTO_MERGE_STATE="$(gh pr view "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --json autoMergeRequest \
            --jq '.autoMergeRequest != null')"

          if [ "${AUTO_MERGE_STATE}" = "true" ]; then
            echo "Auto-merge is already enabled."
            exit 0
          fi

          echo "Enabling auto-merge..."

          if gh pr merge "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --auto \
            --merge; then

            echo "=========================================="
            echo "SUCCESS"
            echo "Auto-merge has been enabled."
            echo "PR: #${PR_NUMBER}"
            echo "=========================================="
          else
            echo "ERROR: GitHub rejected the auto-merge request."
            echo ""
            echo "Possible causes:"
            echo "  - Auto-merge is disabled in repository settings."
            echo "  - Branch protection/rulesets do not permit this merge."
            echo "  - Required status checks are not configured."
            echo "  - The supplied token lacks required permissions."
            echo "  - The PR is not currently eligible for auto-merge."
            exit 1
          fi