name: "Placeholder scan check"

on:
  pull_request:
    branches: ["**"]

jobs:
  placeholder-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
      - name: Run placeholder scanner
        run: |
          mkdir -p .qmoi_validation
          python3 scripts/placeholder_scanner.py --root . --report .qmoi_validation/placeholder_report.json --suggest .qmoi_validation/placeholder_suggestions.json || true
          python3 - <<'PY'
import json,sys
r=json.load(open('.qmoi_validation/placeholder_report.json'))
count=r.get('total',0)
print('Found',count,'placeholder items')
if count>0:
    print('FAIL: Found placeholders that must be reviewed before merging')
    sys.exit(1)
PY
