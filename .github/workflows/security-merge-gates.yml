name: Security and Merge Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-tests:
    name: Dependency audit and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run repository tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<<|>>>>>>>)' \
            -- ':!qmoi-enhanced-history-14' \
            ':!.github/workflows/security-merge-gates.yml'; then
            echo 'Unresolved merge markers found in live repository files.' >&2
            exit 1
          fi
