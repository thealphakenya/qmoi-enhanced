name: QMOI Enhanced CI/CD

on:
  push:
    branches: [main, autosync-backup-20250926-232440]
  pull_request:
    branches: [main, autosync-backup-20250926-232440]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci || true

      - name: Run linter
        run: npm run lint || true

      - name: Run tests
        run: npm test || true

      - name: Run build
        run: npm run build || true

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  NODE_VERSION: "18"
  QMOI_AUTOprod_ENABLED: "true"
