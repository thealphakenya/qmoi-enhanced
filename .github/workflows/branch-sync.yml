name: Branch Sync Monitor & Auto-Update

on:
  workflow_dispatch: {}

  schedule:
    - cron: '*/10 * * * *'

  push:
    branches:
      - main
      - autosync-backup

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: branch-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: ${{ github.repository }}
  TARGET_REPOSITORY: thealphakenya/Alpha-Q-ai
  SOURCE_MAIN_BRANCH: main
  SOURCE_BACKUP_BRANCH: autosync-backup
  TARGET_MAIN_BRANCH: main
  TARGET_BACKUP_BRANCH: autosync-backup

jobs:

  sync-branches:
    name: Synchronize branches across repositories
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout qmoi-enhanced
      # ------------------------------------------------------------
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------------------------
      # 2. Configure Git
      # ------------------------------------------------------------
      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Ollama Autonomous Agent"
          git config user.email "ollama-agent@qmoi.com"

          echo "Git identity configured."

      # ------------------------------------------------------------
      # 3. Validate required cross-repository token
      # ------------------------------------------------------------
      - name: Validate synchronization credentials
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::MY_CUSTOM_TOKEN is not configured."
            echo "::error::A token with write access to ${TARGET_REPOSITORY} is required."
            exit 1
          fi

          echo "Cross-repository synchronization token is available."

      # ------------------------------------------------------------
      # 4. Fetch source branches
      # ------------------------------------------------------------
      - name: Fetch source branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --prune

          echo "Available remote branches:"
          git branch -r

      # ------------------------------------------------------------
      # 5. Verify source main exists
      # ------------------------------------------------------------
      - name: Verify source main branch
        shell: bash
        run: |
          set -euo pipefail

          if ! git ls-remote \
            --exit-code \
            origin \
            "refs/heads/${SOURCE_MAIN_BRANCH}" \
            >/dev/null 2>&1
          then
            echo "::error::Source branch ${SOURCE_MAIN_BRANCH} does not exist."
            exit 1
          fi

          echo "Source main branch exists."

      # ------------------------------------------------------------
      # 6. Ensure source autosync-backup exists
      # ------------------------------------------------------------
      - name: Ensure source autosync-backup exists
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote \
            --exit-code \
            origin \
            "refs/heads/${SOURCE_BACKUP_BRANCH}" \
            >/dev/null 2>&1
          then
            echo "Source autosync-backup already exists."
          else
            echo "Source autosync-backup does not exist."
            echo "Creating it from source main..."

            git fetch origin "${SOURCE_MAIN_BRANCH}"

            git checkout -B "${SOURCE_BACKUP_BRANCH}" \
              "origin/${SOURCE_MAIN_BRANCH}"

            git push origin \
              "HEAD:${SOURCE_BACKUP_BRANCH}"

            echo "Source autosync-backup created."
          fi

      # ------------------------------------------------------------
      # 7. Make source autosync-backup exactly match main
      # ------------------------------------------------------------
      - name: Synchronize source autosync-backup with main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            "${SOURCE_MAIN_BRANCH}" \
            "${SOURCE_BACKUP_BRANCH}"

          MAIN_SHA="$(git rev-parse "origin/${SOURCE_MAIN_BRANCH}")"
          BACKUP_SHA="$(git rev-parse "origin/${SOURCE_BACKUP_BRANCH}")"

          echo "Source main SHA:            ${MAIN_SHA}"
          echo "Source autosync-backup SHA: ${BACKUP_SHA}"

          if [ "${MAIN_SHA}" != "${BACKUP_SHA}" ]; then
            echo "Source branches differ."
            echo "Updating autosync-backup to exactly match main..."

            git checkout -B "${SOURCE_BACKUP_BRANCH}" \
              "origin/${SOURCE_MAIN_BRANCH}"

            git push origin \
              "HEAD:${SOURCE_BACKUP_BRANCH}" \
              --force

            echo "Source autosync-backup synchronized."
          else
            echo "Source branches are already synchronized."
          fi

      # ------------------------------------------------------------
      # 8. Checkout source main again
      # ------------------------------------------------------------
      - name: Checkout validated source main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "${SOURCE_MAIN_BRANCH}"

          git checkout -B "${SOURCE_MAIN_BRANCH}" \
            "origin/${SOURCE_MAIN_BRANCH}"

          git reset --hard "origin/${SOURCE_MAIN_BRANCH}"

          echo "Validated source branch:"
          git rev-parse HEAD

      # ------------------------------------------------------------
      # 9. Configure Alpha-Q-ai remote
      # ------------------------------------------------------------
      - name: Configure Alpha-Q-ai remote
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_URL="https://x-access-token:${SYNC_TOKEN}@github.com/${TARGET_REPOSITORY}.git"

          git remote remove alpha-q-ai 2>/dev/null || true

          git remote add alpha-q-ai "${TARGET_URL}"

          echo "Alpha-Q-ai remote configured."

      # ------------------------------------------------------------
      # 10. Verify Alpha-Q-ai access
      # ------------------------------------------------------------
      - name: Verify Alpha-Q-ai repository access
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing access to ${TARGET_REPOSITORY}..."

          git ls-remote \
            alpha-q-ai \
            HEAD \
            >/dev/null

          echo "Successfully authenticated to ${TARGET_REPOSITORY}."

      # ------------------------------------------------------------
      # 11. Fetch target repository
      # ------------------------------------------------------------
      - name: Fetch Alpha-Q-ai branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch alpha-q-ai --prune

          echo "Alpha-Q-ai branches:"
          git branch -r | grep "alpha-q-ai/" || true

      # ------------------------------------------------------------
      # 12. Synchronize Alpha-Q-ai main
      # ------------------------------------------------------------
      - name: Synchronize Alpha-Q-ai main
        shell: bash
        run: |
          set -euo pipefail

          echo "Synchronizing:"
          echo "  ${SOURCE_REPOSITORY}:${SOURCE_MAIN_BRANCH}"
          echo "  ->"
          echo "  ${TARGET_REPOSITORY}:${TARGET_MAIN_BRANCH}"

          git push \
            alpha-q-ai \
            "origin/${SOURCE_MAIN_BRANCH}:${TARGET_MAIN_BRANCH}" \
            --force

          echo "Alpha-Q-ai main synchronized."

      # ------------------------------------------------------------
      # 13. Synchronize Alpha-Q-ai autosync-backup
      # ------------------------------------------------------------
      - name: Synchronize Alpha-Q-ai autosync-backup
        shell: bash
        run: |
          set -euo pipefail

          echo "Synchronizing:"
          echo "  ${SOURCE_REPOSITORY}:${SOURCE_MAIN_BRANCH}"
          echo "  ->"
          echo "  ${TARGET_REPOSITORY}:${TARGET_BACKUP_BRANCH}"

          git push \
            alpha-q-ai \
            "origin/${SOURCE_MAIN_BRANCH}:${TARGET_BACKUP_BRANCH}" \
            --force

          echo "Alpha-Q-ai autosync-backup synchronized."

      # ------------------------------------------------------------
      # 14. Fetch target again after synchronization
      # ------------------------------------------------------------
      - name: Refresh Alpha-Q-ai state
        shell: bash
        run: |
          set -euo pipefail

          git fetch alpha-q-ai --prune

          echo "Target repository state refreshed."

      # ------------------------------------------------------------
      # 15. Verify source branches
      # ------------------------------------------------------------
      - name: Verify source synchronization
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            "${SOURCE_MAIN_BRANCH}" \
            "${SOURCE_BACKUP_BRANCH}"

          SOURCE_MAIN_SHA="$(
            git rev-parse "origin/${SOURCE_MAIN_BRANCH}"
          )"

          SOURCE_BACKUP_SHA="$(
            git rev-parse "origin/${SOURCE_BACKUP_BRANCH}"
          )"

          echo "Source main:            ${SOURCE_MAIN_SHA}"
          echo "Source autosync-backup: ${SOURCE_BACKUP_SHA}"

          if [ "${SOURCE_MAIN_SHA}" != "${SOURCE_BACKUP_SHA}" ]; then
            echo "::error::Source branches are not synchronized."
            exit 1
          fi

          echo "Source branches verified."

      # ------------------------------------------------------------
      # 16. Verify Alpha-Q-ai synchronization
      # ------------------------------------------------------------
      - name: Verify Alpha-Q-ai synchronization
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="$(
            git rev-parse "origin/${SOURCE_MAIN_BRANCH}"
          )"

          TARGET_MAIN_SHA="$(
            git rev-parse "alpha-q-ai/${TARGET_MAIN_BRANCH}"
          )"

          TARGET_BACKUP_SHA="$(
            git rev-parse "alpha-q-ai/${TARGET_BACKUP_BRANCH}"
          )"

          echo "----------------------------------------"
          echo "Synchronization verification"
          echo "----------------------------------------"
          echo "Source main:              ${SOURCE_SHA}"
          echo "Alpha-Q-ai main:         ${TARGET_MAIN_SHA}"
          echo "Alpha-Q-ai autosync:     ${TARGET_BACKUP_SHA}"
          echo "----------------------------------------"

          if [ "${SOURCE_SHA}" != "${TARGET_MAIN_SHA}" ]; then
            echo "::error::Alpha-Q-ai main does not match source main."
            exit 1
          fi

          if [ "${SOURCE_SHA}" != "${TARGET_BACKUP_SHA}" ]; then
            echo "::error::Alpha-Q-ai autosync-backup does not match source main."
            exit 1
          fi

          echo "✅ Source main matches Alpha-Q-ai main."
          echo "✅ Source main matches Alpha-Q-ai autosync-backup."
          echo "✅ Cross-repository synchronization verified."

      # ------------------------------------------------------------
      # 17. Final status report
      # ------------------------------------------------------------
      - name: Report synchronization status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          script: |
            console.log('========================================');
            console.log('BRANCH SYNCHRONIZATION COMPLETE');
            console.log('========================================');
            console.log(`Source repository: ${context.repo.owner}/${context.repo.repo}`);
            console.log('Source branch: main');
            console.log('Source backup: autosync-backup');
            console.log('Target repository: thealphakenya/Alpha-Q-ai');
            console.log('Target branch: main');
            console.log('Target backup: autosync-backup');
            console.log('----------------------------------------');
            console.log('✅ Source branches synchronized');
            console.log('✅ Alpha-Q-ai/main synchronized');
            console.log('✅ Alpha-Q-ai/autosync-backup synchronized');
            console.log('✅ Cross-repository SHA verification passed');
            console.log('✅ Codespace independence maintained');
            console.log('========================================');