name: CI Verify & Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: false

env:
  REPO: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-matrix:
    name: Build & Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & Python
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci || npm install
          python -m pip install --upgrade pip setuptools wheel || true
          pip install -r requirements.txt || true

      - name: Generate icons & ensure files
        run: |
          npm run generate:icon || true
          npm run ensure:files || true

      - name: Build Electron (platform specific)
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run electron:build:win || npm run electron:build || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run electron:build:mac || npm run electron:build || true
          else
            npm run electron:build:linux || npm run electron:build || true
          fi
        shell: bash

      - name: Build PWA packages
        if: always()
        run: |
          set -e || true
          mkdir -p release_assets/pwa || true
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then VERSION="${{ github.run_number }}"; fi
          for d in pwa_apps/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d")
            zipfile="release_assets/pwa/${n}-pwa-${VERSION}.zip"
            (cd "$d" && zip -r "${{ github.workspace }}/$zipfile" . -q) || true
          done || true

      - name: Android build (Ubuntu runner)
        if: matrix.os == 'ubuntu-latest'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -f "mobile/android/gradlew" ]; then
            cd mobile/android
            if [ -n "$ANDROID_KEYSTORE" ] || [ -f "keystore.properties" ]; then
              echo "Signing keys present or keystore.properties found — attempting release build"
              ./gradlew assembleRelease || {
                echo "Release build failed — attempting debug build"
                ./gradlew assembleDebug || echo "Android debug build failed"
              }
            else
              echo "No signing keys found — building debug APK instead"
              ./gradlew assembleDebug || echo "Android debug build failed"
            fi
            cd - || true
          else
            echo "No Android gradle project found"
          fi

      - name: Set validation targets
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "VALIDATION_TARGETS=windows,pwa" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "VALIDATION_TARGETS=macos,ios,pwa" >> $GITHUB_ENV
          else
            echo "VALIDATION_TARGETS=linux,android,pwa" >> $GITHUB_ENV
          fi

      - name: Run artifact validator
        run: |
          python3 scripts/qmoi-app-validator.py

      - name: Archive discovered artifacts
        uses: actions/upload-artifact@v3
        with:
          name: qmoi-artifacts-${{ matrix.os }}
          path: |
            Qmoi_apps/**
            release_assets/**
            dist/**
            build/**
            pwa_apps/**

  publish-release:
    name: Publish Release & Upload Assets
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GH CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh jq zip unzip sha256sum || true

      - name: Discover artifacts
        id: discover
        run: |
          find Qmoi_apps release_assets pwa_apps dist build mobile mobile/android mobile/ios -type f \( -iname "*qmoi*" -o -iname "*.exe" -o -iname "*.dmg" -o -iname "*.deb" -o -iname "*.appimage" -o -iname "*.apk" -o -iname "*.aab" -o -iname "*.ipa" -o -iname "*.img" -o -iname "*.zip" \) 2>/dev/null | grep -v node_modules | sort -u > discovered_assets.txt || true
          # Create a machine-readable JSON list as well
          python3 - <<'PY'
import sys, json
assets=[]
try:
  with open('discovered_assets.txt','r') as f:
    for l in f:
      p=l.strip()
      if p:
        assets.append({'path':p,'name':p.split('/')[-1]})
except FileNotFoundError:
  pass
with open('discovered_assets.json','w') as out:
  json.dump({'count':len(assets),'assets':assets},out,indent=2)
print('Wrote discovered_assets.json with',len(assets),'assets')
PY
          echo "asset_count=$(wc -l < discovered_assets.txt || true)" >> $GITHUB_OUTPUT
          if [ -s discovered_assets.txt ]; then
            echo "Found assets:" && sed -n '1,200p' discovered_assets.txt || true
            echo "discovered_assets_json=discovered_assets.json" >> $GITHUB_OUTPUT
          else
            echo "No artifacts discovered locally"
          fi

      - name: Create GitHub Release (if not exists)
        id: create_release
        run: |
          VERSION=${{ github.ref_name }}
          if [ -z "$VERSION" ] || [[ "$VERSION" == "refs/*" ]]; then
            VERSION="v${{ github.run_number }}"
          fi
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}" || true
          gh release create "$VERSION" --notes-file - <<'EOF' || echo "Release may exist"
QMOI Auto-published release $VERSION
EOF
          echo "release=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload discovered assets to Release
        if: steps.discover.outputs.asset_count != '0'
        run: |
          VERSION=${{ steps.create_release.outputs.release || github.ref_name || "v${{ github.run_number }}" }}
          while read -r asset; do
            [ -f "$asset" ] || continue
            echo "Preparing $asset"
            sha256sum "$asset" > "${asset}.sha256" || true
            echo "Uploading $asset"
            gh release upload "$VERSION" "$asset" --clobber || echo "Upload failed for $asset"
            if [ -f "${asset}.sha256" ]; then
              gh release upload "$VERSION" "${asset}.sha256" --clobber || true
            fi
          done < discovered_assets.txt || true

      - name: Upload discovered_assets.json as artifact
        if: steps.discover.outputs.asset_count != '0'
        uses: actions/upload-artifact@v3
        with:
          name: discovered-assets-json
          path: discovered_assets.json

      - name: Final release summary
        run: |
          echo "Release publish step complete. Please verify on GitHub Releases."

      - name: Generate release docs from discovered assets
        if: steps.discover.outputs.asset_count != '0'
        run: |
          echo "Generating release docs snippet from discovered_assets.json"
          python3 tools/discovered_to_readme.py discovered_assets.json > release_assets_snippet.md || true

      - name: Commit release docs to branch and open PR
        if: steps.discover.outputs.asset_count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=${{ steps.create_release.outputs.release || github.ref_name || "v${{ github.run_number }}" }}
          BRANCH="release-docs-${VERSION}"
          git remote set-url origin "$REPO_URL"
          git fetch origin || true
          git checkout -b "$BRANCH"
          mkdir -p docs/release-assets
          mv release_assets_snippet.md docs/release-assets/${BRANCH}.md || true
          git add docs/release-assets/${BRANCH}.md || true
          if git diff --staged --quiet; then
            echo "No doc changes to commit"
          else
            git commit -m "docs(release): add discovered assets for ${VERSION}"
            git push --set-upstream origin "$BRANCH"
          fi

      - name: Open PR for release docs
        if: steps.discover.outputs.asset_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = `release-docs-${{ steps.create_release.outputs.release || github.ref_name || `v${{ github.run_number }}` }}`
            const base = 'autosync-backup-20250926-232440'
            const title = `chore(docs): add release assets for ${branch}`
            const body = `This PR adds a machine-generated release assets snippet for ${branch}.`;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base,
              state: 'open'
            })
            if (pulls.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head: branch,
                base,
                body
              })
              core.info('Docs PR created')
            } else {
              core.info('Docs PR already exists, skipping')
            }

    pwa-smoke:
      name: PWA Smoke Tests
      runs-on: ubuntu-latest
      needs: build-matrix
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Static PWA checks
          run: |
            echo "Running static checks for PWA manifests and service workers"
            set -e
            found=0
            for d in pwa_apps/*/; do
              [ -d "$d" ] || continue
              echo "Checking $d"
              if [ -f "$d/manifest.webmanifest" ] || [ -f "$d/manifest.json" ]; then
                echo "  manifest found"
              else
                echo "  ERROR: manifest missing in $d" && found=1
              fi
              if [ -f "$d/sw.js" ] || [ -f "$d/service-worker.js" ]; then
                echo "  service worker found"
              else
                echo "  WARN: service worker missing in $d"
              fi
            done
            if [ $found -ne 0 ]; then
              echo "PWA static checks failed" && exit 1
            fi

        - name: Optional headless PWA smoke (Playwright)
          if: env.RUN_PWA_HEADLESS == 'true'
          run: |
            echo "Running headless smoke checks with Playwright (this may download browsers)"
            npm ci || npm install
            npm install playwright@1.35.0 --save-dev || true
            node -e "(async()=>{const {chromium}=require('playwright');const fs=require('fs');for(const d of fs.readdirSync('pwa_apps')){const dir='pwa_apps/'+d; if(!fs.statSync(dir).isDirectory()) continue; const index=dir+'/index.html'; if(!fs.existsSync(index)) continue; const server=require('child_process').spawn('npx',['http-server',dir,'-p','8080'],{stdio:'inherit'}); await new Promise(r=>setTimeout(r,1500)); const browser=await chromium.launch(); const page=await browser.newPage(); await page.goto('http://127.0.0.1:8080'); console.log('Loaded',d); await browser.close(); server.kill(); }} )()" || true

    packaging:
      name: Packaging (auto when secrets present)
      needs: build-matrix
      runs-on: ubuntu-latest
      if: startsWith(github.ref, 'refs/tags/') && (secrets.ANDROID_KEYSTORE_BASE64 != '' || secrets.ANDROID_KEYSTORE != '' || secrets.APPLE_API_KEY != '')
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Prepare environment
          run: |
            echo "Preparing packaging environment"
            npm ci || npm install || true

        - name: Android packaging (if keystore present)
          if: secrets.ANDROID_KEYSTORE_BASE64 != ''
          env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          run: |
            echo "Decoding Android keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android_keystore.jks
            ls -la android_keystore.jks || true
            if [ -f mobile/android/gradlew ]; then
              cd mobile/android
              ./gradlew assembleRelease || ./gradlew assembleDebug || true
              cd -
            else
              echo "No Android gradle project found"
            fi

        - name: Electron packaging (template)
          run: |
            if [ -f package.json ]; then
              npx electron-builder --dir || echo "electron-builder template run (adjust for real builds)"
            else
              echo "No package.json found; skipping electron build"
            fi
