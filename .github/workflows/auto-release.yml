name: Auto Release Publisher

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish release via script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel || true
          pip install -r requirements.txt || true

      - name: Install GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh jq zip unzip || true

      - name: Run release publisher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ github.ref_name }}
          if [ -z "$VERSION" ]; then
            echo "No version tag found" && exit 1
          fi
          python3 publish-releases-realtime.py --version "$VERSION"
