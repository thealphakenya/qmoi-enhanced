name: CI

on:
  push:
    branches: [ main, autosync-backup-20250926-232440, auto/placeholders/auto-apply-final ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Run tests (if present)
        run: |
          if [ -f package.json ]; then
            if npm run | grep -q "test"; then
              npm test || true
            fi
          fi
  build:
name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-checks:
    name: Python checks & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python3 -m pip install -r requirements-dev.txt || true; fi
      - name: Validate required secrets (conditional)
        if: secrets.GITHUB_TOKEN != ''
        run: python3 scripts/env_manager.py --check
        shell: bash
      - name: Byte-compile repository
        run: python3 -m py_compile $(find . -name "*.py") || true
      - name: Lint with flake8
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 || true
          else
            echo "flake8 not installed"
          fi
      - name: Run pytest (if present)
        run: |
          if [ -d tests ] && ls tests/*.py >/dev/null 2>&1; then pytest -q || true; else echo "No pytest tests found"; fi

  node-build:
    name: Node build & lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate required secrets (conditional)
        if: secrets.GITHUB_TOKEN != ''
        run: python3 scripts/env_manager.py --check
        shell: bash
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci || npm install; else echo "No package.json"; fi
      - name: Lint & TypeScript (if present)
        run: |
          if [ -f package.json ]; then
            npx -y -s eslint . --ext .ts,.js || true
            npx -y -s tsc --noEmit || true
          else
            echo "No JS/TS project detected"
          fi
