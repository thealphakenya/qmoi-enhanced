name: CI (consolidated)

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: Run the complete CI suite including smoke checks
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt || true; fi
      - name: Byte-compile repository
        run: python -m py_compile $(find . -name "*.py") || true
      - name: Run pytest if available
        run: |
          if [ -d tests ] && ls tests/*.py >/dev/null 2>&1; then pytest -q || true; else echo "No pytest tests found"; fi

  node-build:
    name: Node build and lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci || npm install; else echo "No package.json"; fi
      - name: Lint and typecheck
        run: |
          if [ -f package.json ]; then
            npx -y -s eslint . --ext .ts,.js || true
            npx -y -s tsc --noEmit || true
          else
            echo "No JS/TS project detected"
          fi

  smoke-check:
    name: Smoke checks
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_full_suite != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run smoke check
        run: node scripts/smoke-check.js || true
