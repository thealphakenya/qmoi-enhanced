name: Payed Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ autosync-backup-20250926-232440 ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # No external test deps required; add here if needed in future

      - name: Run auto-enhance pipeline (dry-run)
        env:
          # ensure billing remains disabled in CI
          QMOI_ENABLE_BILLING: 'false'
        run: |
          python3 scripts/auto_enhance_pipeline.py

      - name: Upload pipeline summary
        uses: actions/upload-artifact@v4
        with:
          name: payed-pipeline-summary
          path: .qmoi_validation/pipeline_runs/
