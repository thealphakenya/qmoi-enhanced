name: Build Missing Platforms

on:
  workflow_dispatch: {}

jobs:
  build-raspberrypi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU and Docker buildx
      uses: docker/setup-buildx-action@v2
    - name: Build Raspberry Pi image (armhf)
      run: 'echo "Simulated Raspberry Pi image build"

        # Placeholder: call actual build scripts here

        ./scripts/build_raspberry_pi_image.sh ${{ github.event.inputs.version }} ||
        true

        '
  build-docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: 'echo "Simulated Docker image build"

        ./scripts/build_docker_image.sh ${{ github.event.inputs.version }} || true

        '
  build-wearos:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Wear OS APK (simulated)
      run: 'echo "Simulated Wear OS build"

        ./scripts/build_wearos_apk.sh ${{ github.event.inputs.version }} || true

        '
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
  workflow_dispatch: {}
