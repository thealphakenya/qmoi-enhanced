name: Build Missing Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build (e.g. v1.2.3)'
        required: true

jobs:
  build-raspberrypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU and Docker buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Raspberry Pi image (armhf)
        run: |
          echo "Simulated Raspberry Pi image build"
          # PLACEHOLDER (TBD: replace with production content; see PLACEHOLDER_REMEDIATION_PLAN.md): call actual build scripts here
          ./scripts/build_raspberry_pi_image.sh ${{ github.event.inputs.version }} || true

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo "Simulated Docker image build"
          ./scripts/build_docker_image.sh ${{ github.event.inputs.version }} || true

  build-wearos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Wear OS APK (simulated)
        run: |
          echo "Simulated Wear OS build"
          ./scripts/build_wearos_apk.sh ${{ github.event.inputs.version }} || true
