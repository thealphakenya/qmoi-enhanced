name: Build required Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build (e.g. v1.2.3)"
        required: true

jobs:
  build-raspberrypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU and Docker buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Raspberry Pi image (armhf)
        run: |
          echo "production Raspberry Pi image build"
          # Implementation: call actual build scripts here
          ./scripts/build_raspberry_pi_image.sh ${{ github.event.inputs.version }}

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo "production Docker image build"
          ./scripts/build_docker_image.sh ${{ github.event.inputs.version }}

  build-wearos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Wear OS APK (production)
        run: |
          echo "production Wear OS build"
          ./scripts/build_wearos_apk.sh ${{ github.event.inputs.version }}
