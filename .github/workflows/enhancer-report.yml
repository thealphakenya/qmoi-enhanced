name: Enhancement Report

on:
  pull_request:
    types:
    - opened
    - synchronize
    paths:
    - '**/*.md'
    - scripts/**
    - docs/**
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Run enhancers
      run: 'python3 scripts/qcity_enhancer.py --root .

        python3 scripts/lion_feature_enhancer.py --root .

        '
    - name: Read reports
      id: read-reports
      run: 'echo "QCITY_REPORT<<EOF" >> $GITHUB_ENV

        cat .qmoi_validation/qcity_enhancer.json >> $GITHUB_ENV

        echo "EOF" >> $GITHUB_ENV


        echo "LION_REPORT<<EOF" >> $GITHUB_ENV

        cat .qmoi_validation/lion_feature_enhancer.json >> $GITHUB_ENV

        echo "EOF" >> $GITHUB_ENV

        '
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: "const qcityReport = JSON.parse(process.env.QCITY_REPORT);\nconst\
          \ lionReport = JSON.parse(process.env.LION_REPORT);\n\nlet comment = '##\
          \ Enhancement Report\\n\\n';\n\n// qCity summary\ncomment += '### qCity\
          \ Platform Analysis\\n';\ncomment += `- Manifests found: ${qcityReport.manifests_found}\\\
          n`;\nif (qcityReport.details) {\n  comment += '- Suggestions:\\n';\n  for\
          \ (const [file, details] of Object.entries(qcityReport.details)) {\n   \
          \ comment += `  - ${file}:\\n`;\n    comment += details.suggestions.map(s\
          \ => `    - ${s}`).join('\\n');\n    comment += `\\n    Confidence: ${details.confidence}\\\
          n`;\n  }\n}\n\n// Lion feature summary  \ncomment += '\\n### Lion Feature\
          \ Analysis\\n';\ncomment += `- Features found: ${lionReport.found}\\n`;\n\
          if (lionReport.recommendations) {\n  comment += '- Recommendations:\\n';\n\
          \  for (const [file, details] of Object.entries(lionReport.recommendations))\
          \ {\n    comment += `  - ${file}:\\n`;\n    comment += details.recommendations.map(r\
          \ => `    - ${r}`).join('\\n');\n    comment += `\\n    Confidence: ${details.confidence}\\\
          n`;\n  }\n}\n\ncomment += '\\n---\\nThis is an automated enhancement report.\
          \ See `.qmoi_validation/` for full details.';\n\nawait github.rest.issues.createComment({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  issue_number:\
          \ context.issue.number,\n  body: comment\n});\n"
'on':
  workflow_dispatch: {}
