name: QVillage Sync - QMOI Memory ↔ HF Spaces

on:
  schedule:
    # Run sync every 6 hours
    - cron: "0 */6 * * *"

  # Manual trigger
  workflow_dispatch:

  # Trigger on push to main (tag releases)
  push:
    branches:
      - main
    paths:
      - "hf_space_qvillage/**"
      - "tools/qvillage_memory_sync.py"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx asyncio pydantic python-dotenv huggingface-hub

      - name: Configure environment
        run: |
          echo "QVILLAGE_API_URL=${{ secrets.QVILLAGE_INTERNAL_URL }}" >> $GITHUB_ENV
          echo "QMOI_MEMORY_URL=${{ secrets.QMOI_MEMORY_URL }}" >> $GITHUB_ENV
          echo "HF_SPACE_URL=https://huggingface.co/spaces/stableqmoi/qvillage" >> $GITHUB_ENV
          echo "HF_API_TOKEN=${{ secrets.HF_API_TOKEN }}" >> $GITHUB_ENV

      - name: Run QVillage Sync Engine (single cycle)
        run: |
          python tools/qvillage_memory_sync.py --run-once
        continue-on-error: true

      - name: Clone HF Space repository
        if: success()
        run: |
          git clone https://huggingface.co/spaces/stableqmoi/qvillage hf_space_tmp
          cd hf_space_tmp
          git config user.name "QMOI Automation"
          git config user.email "automation@qmoi.ai"

      - name: Update HF Space app files
        if: success()
        run: |
          cp hf_space_qvillage/app.py hf_space_tmp/app.py
          cp hf_space_qvillage/requirements.txt hf_space_tmp/requirements.txt

      - name: Commit and push to HF Space
        if: success()
        run: |
          cd hf_space_tmp
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push https://oauth2:${{ secrets.HF_API_TOKEN }}@huggingface.co/spaces/stableqmoi/qvillage)
        continue-on-error: true

      - name: Monitor HF Space compute costs
        if: always()
        run: |
          python tools/monitor_hf_costs.py
        env:
          HF_TOKEN: ${{ secrets.HF_API_TOKEN }}
        continue-on-error: true

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sync-logs
          path: |
            sync_*.log
            hf_cost_report.json
          retention-days: 7

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ QVillage sync failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*QVillage Sync Failed*\n*Repository:* ${{ github.repository }}\n*Workflow:* ${{ github.workflow }}\n*Branch:* ${{ github.ref }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Logs"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.24
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ QVillage sync completed successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*QVillage Sync complete* ✅\n• HF Space updated\n• Memory sync completed\n• Conflicts resolved\n• Consistency verified"
                  }
                }
              ]
            }
