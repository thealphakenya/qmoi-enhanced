name: Ollama trigger workflow

on:
  workflow_dispatch:
  push:
    branches:
      - autosync-backup-20250926-232440

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ollama-trigger-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  autonomous-agent:
    runs-on: ubuntu-latest
    env:
      AUTO_CONTINUE: "1"
      AUTO_CONTINUE_MAX: "20"
      AUTO_CONTINUE_BATCH: "200"
      AUTO_PUSH: "1"
      TARGET_BRANCH: "autosync"
      AUTO_MERGE: "0"
      GITHUB_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
      OLLAMA_TIMEOUT: "600"
      OLLAMA_BATCH_SIZE: "20"
      OLLAMA_MAX_WORKERS: "8"
      QMOI_CONFIDENCE_THRESHOLD: ${{ vars.QMOI_CONFIDENCE_THRESHOLD || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run regression checks
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_ollama_autonomous_agent.py

      - name: Run Ollama autonomous agent
        env:
          RUN_FULL_TESTS: "1"
        run: |
          set -euo pipefail
          python scripts/ollama_autonomous_agent.py 2>&1 | tee ollama-autonomous-agent.log

      - name: Upload Ollama live logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-trigger-logs
          path: |
            ollama-autonomous-agent.log
            OLLAMA_ACTIVITY_FEED.md
          if-no-files-found: ignore

      - name: Publish live GitHub notification summary
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          script: |
            try {
              const fs = require('fs');
              const path = require('path');
              const feed = path.join(process.cwd(), 'OLLAMA_ACTIVITY_FEED.md');
              const body = fs.existsSync(feed)
                ? fs.readFileSync(feed, 'utf8')
                : `Ollama run completed. View the workflow run for details.

Run: ${process.env.GH_RUN_URL}`;
              const title = 'Ollama activity update';
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              const existing = issues.find((issue) => issue.title === title);
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${body.slice(0, 5000)}

Workflow: ${process.env.GH_RUN_URL}`
              };
              if (existing) {
                await github.rest.issues.update({ ...payload, issue_number: existing.number });
              } else {
                await github.rest.issues.create(payload);
              }
              core.summary.addRaw(`## Ollama activity

${body.slice(0, 2000)}`);
              await core.summary.write();
            } catch (error) {
              core.info(`Notification summary failed: ${error}`);
            }

      - name: Upload notification feed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-activity-feed
          path: OLLAMA_ACTIVITY_FEED.md
          if-no-files-found: ignore

      - name: Finalize local autonomous state
        run: |
          if git status --porcelain | grep .; then
            git add .
            git commit -m "chore: sync autonomous agent manifests and resume state" || true
            git push origin HEAD:autosync || echo "Push to autosync failed; check permissions or branch protection."
          fi
