name: QMOI Autodev Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - autosync-backup-20250926-232440

jobs:
  validate-and-propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
      - name: Run discovery
        run: |
          python3 scripts/generate_allmdrefs.py --write
      - name: Run markdown validator (dry-run)
        run: |
          python3 scripts/validate_md.py
      - name: Run build validation
        run: |
          python3 scripts/validate_builds.py
      - name: Create release proposals
        run: |
          python3 scripts/release_automation.py
      - name: Emit LION orchestration
        run: |
          python3 scripts/lion_orchestrator.py
