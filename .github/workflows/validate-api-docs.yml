name: Validate API docs

on:
  pull_request:
  push:
    branches: [ autosync-backup-20250926-232440, main ]

jobs:
  validate-api-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip

      - name: Generate API inventory
        run: |
          python3 scripts/extract_apis.py

      - name: Generate API.md
        run: |
          python3 scripts/generate_api_md.py

      - name: Check for docs changes
        run: |
          git --no-pager status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo 'API docs are out of sync. Please run `python3 scripts/extract_apis.py && python3 scripts/generate_api_md.py` and commit the changes.'
            git --no-pager diff
            exit 1
          fi
