name: Dependency Security Autofix

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  security-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and security toolchain
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pip-audit

      - name: Run dependency audit and autofix if needed
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          manifests = sorted(p for p in Path('.').rglob('*') if p.is_file() and p.name.startswith('requirements') and p.suffix in {'.txt', '.in'})
          if not manifests:
              raise SystemExit('No requirement manifests found for audit.')
          for path in manifests:
              print(f'## Auditing {path}')
              import subprocess, sys
              proc = subprocess.run([sys.executable, '-m', 'pip_audit', '-r', str(path), '--progress-spinner', 'off'], check=False)
              if proc.returncode not in (0, 1):
                  raise SystemExit(proc.returncode)
          PY
          python scripts/qmoi_security_autofix.py

      - name: Re-run security audit
        run: |
          python - <<'PY'
          from pathlib import Path
          manifests = sorted(p for p in Path('.').rglob('*') if p.is_file() and p.name.startswith('requirements') and p.suffix in {'.txt', '.in'})
          if not manifests:
              raise SystemExit('No requirement manifests found for audit.')
          import subprocess, sys
          for path in manifests:
              print(f'## Verifying {path}')
              proc = subprocess.run([sys.executable, '-m', 'pip_audit', '-r', str(path), '--progress-spinner', 'off'], check=False)
              if proc.returncode != 0:
                  raise SystemExit(proc.returncode)
          PY

      - name: Create or update remediation PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: apply dependency security autofix'
          title: 'chore: dependency security autofix'
          body: |
            This PR applies the QMOI dependency security autofix for known vulnerable minimum versions and keeps the baseline dependency set aligned with the current security gates.
          branch: 'chore/security-autofix'
          delete-branch: true
          base: main
