name: Ensure Signed Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Ensure scripts executable
        run: |
          chmod +x ./scripts/ci/build_artifacts.sh || true

      - name: Build artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          mkdir -p artifacts
          ./scripts/ci/build_artifacts.sh "${{ matrix.os }}" "$RELEASE_TAG"

      - name: Compute sha256s
        run: |
          for f in artifacts/*; do sha256sum "$f" > "$f.sha256"; done

      - name: Sign artifacts (if GPG key)
        if: secrets.GPG_PRIVATE_KEY != ''
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          for f in artifacts/*; do gpg --batch --yes --passphrase "$GPG_PASSPHRASE" -o "$f.asc" --detach-sign "$f" || true; done

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then echo "No GITHUB_TOKEN available; skipping upload"; exit 0; fi
          upload_url="${{ github.event.release.upload_url }}"
          echo "Uploading artifacts to release via $upload_url"
          for file in artifacts/*; do
            echo "Uploading $file"
            curl -s -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/octet-stream" --data-binary @"$file" "${upload_url}?name=$(basename $file)" || true
          done
