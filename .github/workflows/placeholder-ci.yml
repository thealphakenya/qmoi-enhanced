name: Placeholder CI

on:
  push:
    branches: [main, 'dev', 'autosync-backup-20250926-232440']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run env setup
        run: npm run env-setup
      - name: Run placeholder scan (CI)
        run: npm run placeholder:ci
      - name: Run tests
        run: npm test
      - name: Build (Next)
        run: npm run build || true
      - name: Run lint again
        run: npm run lint || true
