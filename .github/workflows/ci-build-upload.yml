name: CI Build & Release

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

jobs:
  debug-info:
    name: Debug info
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Print environment
      run: 'echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"

        echo "GITHUB_REF=$GITHUB_REF"

        echo "GITHUB_SHA=$GITHUB_SHA"

        echo "Runner: $RUNNER_OS"

        env | sort

        '
    - name: Validate workflow YAML
      run: 'echo "Workflow path: $GITHUB_WORKFLOW"

        echo "OK"

        '
  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: 'if [ -f package.json ]; then npm ci || true; fi

        '
    - name: Build PWA
      run: 'chmod +x scripts/build-pwa-production.sh || true

        ./scripts/build-pwa-production.sh

        '
    - name: Upload PWA artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pwa-artifacts
        path: dist/pwa/release/**
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Linux build script
      run: 'chmod +x scripts/build-all-platforms.sh || true

        # only run the linux target to limit runner requirements

        BUILD_PWAS=false BUILD_WINDOWS=false BUILD_APPLE=false BUILD_ANDROID=false
        ./scripts/build-all-platforms.sh || true

        '
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: dist/combined_release/linux/**
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Windows build script
      shell: bash
      run: 'chmod +x scripts/build-windows-production.sh || true

        ./scripts/build-windows-production.sh || true

        '
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: dist/windows/release/**
  build-macos:
    name: Build macOS artifacts
    runs-on: macos-latest
    if: runner.os == 'macos'
    steps:
    - uses: actions/checkout@v4
    - name: Run Apple build script
      run: 'chmod +x scripts/build-apple-production.sh || true

        ./scripts/build-apple-production.sh || true

        '
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-artifacts
        path: dist/apple/release/**
  publish-release:
    name: Create draft release and upload artifacts
    runs-on: ubuntu-latest
    needs:
    - build-pwa
    - build-linux
    - build-windows
    - build-macos
    if: github.event.inputs.publish_release == 'true'
    steps:
    - uses: actions/checkout@v4
    - name: Download built artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    - name: Create or update draft release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ci-draft-${{ github.run_id }}
        name: CI draft ${{ github.run_id }}
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
    - name: Upload artifacts to release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**
      env:
        GITHUB_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
  workflow_dispatch: {}
