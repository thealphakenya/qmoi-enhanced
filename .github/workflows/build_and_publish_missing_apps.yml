name: Build and Publish Missing Apps

on:
  workflow_dispatch:
  push:
    branches:
      - chore/prepare-production-20251123T140000Z

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install common tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip

      - name: Prepare build list
        id: prepare
        run: |
          echo "MISSING_APPS=[{'app':'Qshare','version':'v1.0.0','platform':'all'},{'app':'Yap','version':'v1.1.0','platform':'all'},{'app':'Qstore','version':'v1.0.0','platform':'all'}]" >> props.txt
          cat props.txt

      - name: Build or package Qshare/Yap/Qstore
        run: |
          mkdir -p artifacts
          # For each expected app attempt to find a build dir, otherwise package source as best-effort
          APPS=("Qshare v1.0.0" "Yap v1.1.0" "Qstore v1.0.0")
          for a in "${APPS[@]}"; do
            name=$(echo "$a" | awk '{print $1}')
            ver=$(echo "$a" | awk '{print $2}')
            # guess directories
            dirs=("apps/$name" "$name" "pwa_apps/$name" "$name"/dist)
            packaged=false
            for d in "${dirs[@]}"; do
              if [ -d "$d" ]; then
                zip -r "artifacts/${name}-${ver}.zip" "$d" || true
                packaged=true
                break
              fi
            done
            if [ "$packaged" = false ]; then
              # create a best-effort zip: repo files that mention app name
              tmpdir=$(mktemp -d)
              grep -RIl "$name" . | head -n 100 | xargs -r -I{} cp --parents {} "$tmpdir" || true
              # fallback: add a README noting that a full build was not available
              echo "Best-effort package for $name $ver. No build output found in repo. Please replace with production artifacts." > "$tmpdir/README-${name}.txt"
              (cd "$tmpdir" && zip -r "$GITHUB_WORKSPACE/artifacts/${name}-${ver}.zip" .) || true
              rm -rf "$tmpdir"
            fi
          done

      - name: Create GitHub releases and upload assets
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report
        run: |
          echo "Artifacts created:" && ls -la artifacts || true
