name: Ollama Master Orchestrator - Enhanced Auto-Healing

# ============================================================================
# OLLAMA MASTER ORCHESTRATOR - ENHANCED AUTO-HEALING
# ============================================================================
#
# PURPOSE
# -------
# Central validation/orchestration workflow for:
#
#   - Pre-flight repository health checks
#   - Git/index recovery
#   - Python environment validation
#   - Platform validation
#   - Feature validation
#   - Full test-suite validation
#   - Automatic retries
#   - Automatic recovery between retries
#   - Durable validation telemetry
#   - Autonomous-agent triggering after successful validation
#   - Final validation reporting
#
# IMPORTANT
# ---------
# Artifact actions MUST use v4.
#
#   actions/upload-artifact@v4
#   actions/download-artifact@v4
#
# GitHub deprecated artifact action v3.
#
# This workflow is intentionally finite. It does not run as an infinite
# daemon.
#
# ============================================================================


# ============================================================================
# EVENTS
# ============================================================================

on:

  workflow_dispatch:

    inputs:

      debug_mode:
        description: "Enable debug logging"
        required: false
        type: boolean
        default: false

      auto_heal:
        description: "Enable automatic healing"
        required: false
        type: boolean
        default: true

  schedule:

    # Every 12 hours.
    - cron: "0 */12 * * *"


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  QSTEPS_MANAGER: "qsteps-v1"

  QMOI_AUTO_HEAL: ${{ github.event.inputs.auto_heal || 'true' }}

  QMOI_DEBUG: ${{ github.event.inputs.debug_mode || 'false' }}

  QMOI_RETRY_ATTEMPTS: "3"

  QMOI_RETRY_DELAY_BASE: "5"

  QMOI_TIMEOUT: "300"

  QSTEPS_MAX_ATTEMPTS: "3"

  AUTO_HEAL_ON_ERROR: "true"


# ============================================================================
# PERMISSIONS
# ============================================================================
#
# actions: write is required for dispatching the autonomous-agent workflow.
#
# contents: read is sufficient for checkout and repository inspection.
#
# ============================================================================

permissions:

  contents: read

  actions: write

  checks: read

  pull-requests: read

  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# Prevent multiple orchestrator instances from simultaneously modifying the
# same tracking state or dispatching overlapping agent runs.
#
# ============================================================================

concurrency:

  group: ollama-master-orchestrator-${{ github.ref }}

  cancel-in-progress: false


# ============================================================================
# JOBS
# ============================================================================

jobs:


  # ==========================================================================
  # PRE-FLIGHT CHECKS WITH AUTO-HEALING
  # ==========================================================================

  pre-flight-checks:

    name: Pre-Flight System Checks & Auto-Heal

    runs-on: ubuntu-latest

    timeout-minutes: 10

    outputs:

      system_healthy: ${{ steps.health_check.outputs.system_healthy }}

      healing_performed: ${{ steps.auto_heal.outputs.healing_performed }}


    steps:


      # ========================================================================
      # CHECKOUT
      # ========================================================================

      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Q Steps Manager start pre-flight
        run: python3 scripts/qsteps_manager.py start --step "${GITHUB_JOB}:pre-flight-checks"

      - name: Q Steps Manager validate repository
        run: python3 scripts/qsteps_manager.py validate-all --root . --skip-tests


      # ========================================================================
      # PYTHON
      # ========================================================================

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Validate workflow and agent sources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check -q pyyaml
          python3 -m py_compile scripts/*.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflows = sorted(Path('.github/workflows').glob('*.y*ml'))
          if not workflows:
              raise SystemExit('No workflow files found')
          for workflow in workflows:
              document = yaml.safe_load(workflow.read_text(encoding='utf-8'))
              if document.get('env', {}).get('QSTEPS_MANAGER') != 'qsteps-v1':
                  raise SystemExit(f'Missing QSTEPS_MANAGER in {workflow}')
          print(f'Validated {len(workflows)} workflow contracts and all Python scripts')
          PY


      # ========================================================================
      # SYSTEM HEALTH CHECK
      # ========================================================================

      - name: System health check
        id: health_check
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "OLLAMA MASTER ORCHESTRATOR - PRE-FLIGHT HEALTH CHECK"
          echo "============================================================"

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Pip:"
          python3 -m pip --version

          echo
          echo "Git:"
          git --version

          echo
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo
          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo
          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo
          echo "Git status:"

          if git status --short; then
            echo "Git repository is readable."
          else
            echo "::warning::Git status check failed."
            exit 1
          fi

          echo
          echo "Checking essential files..."

          ESSENTIAL_FILES=(
            "scripts/ollama_autonomous_agent.py"
            "tests/test_ollama_autonomous_agent.py"
            "requirements.txt"
          )

          for file in "${ESSENTIAL_FILES[@]}"; do

            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "::error::MISSING: $file"
              exit 1
            fi

          done

          echo
          echo "Checking autonomous-agent script syntax..."

          python3 -m py_compile \
            scripts/ollama_autonomous_agent.py

          echo
          echo "Checking tests directory..."

          if [ ! -d "tests" ]; then
            echo "::error::tests directory does not exist."
            exit 1
          fi

          echo
          echo "Pre-flight health check PASSED."

          echo "system_healthy=true" >> "$GITHUB_OUTPUT"


      # ========================================================================
      # AUTO-HEALING
      # ========================================================================

      - name: Auto-healing system recovery
        id: auto_heal
        if: always()
        shell: bash
        env:
          AUTO_HEAL_ENABLED: ${{ env.QMOI_AUTO_HEAL }}
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "AUTO-HEALING SYSTEM RECOVERY"
          echo "============================================================"

          HEALING_PERFORMED=false

          if [ "${AUTO_HEAL_ENABLED}" != "true" ]; then
            echo "Automatic healing is disabled."
            echo "healing_performed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo
          echo "Checking Git repository state..."

          if ! git status >/dev/null 2>&1; then

            echo "::warning::Git index appears unhealthy."
            echo "Rebuilding Git index..."

            INDEX_BACKUP="${RUNNER_TEMP}/qmoi-git-index-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bak"
            if [ -f .git/index ]; then
              cp .git/index "${INDEX_BACKUP}"
            fi

            rm -f .git/index

            git reset --quiet HEAD

            if git status >/dev/null 2>&1; then
              echo "Git index successfully rebuilt."
              HEALING_PERFORMED=true
            else
              if [ -f "${INDEX_BACKUP:-}" ]; then
                cp "${INDEX_BACKUP}" .git/index
              fi
              echo "::error::Unable to recover Git index."
              exit 1
            fi

          else

            echo "Git index is healthy."

          fi


          echo
          echo "Cleaning Python cache..."

          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} + \
            2>/dev/null || true

          find . \
            -type f \
            -name "*.pyc" \
            -delete \
            2>/dev/null || true

          rm -rf .pytest_cache

          HEALING_PERFORMED=true

          echo "Python cache cleaned."


          echo
          echo "Validating requirements.txt..."

          if [ -f requirements.txt ]; then

            python3 -m pip install \
              --disable-pip-version-check \
              -q \
              pyyaml \
              >/dev/null 2>&1 || true

            echo "requirements.txt exists."

          else

            echo "::error::requirements.txt is missing."
            exit 1

          fi


          echo
          echo "Auto-healing completed."

          echo "healing_performed=${HEALING_PERFORMED}" \
            >> "$GITHUB_OUTPUT"


  # ==========================================================================
  # COMPREHENSIVE VALIDATION
  # ==========================================================================

  comprehensive-validation:

    name: Comprehensive Validation Suite

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - pre-flight-checks

    if: >
      needs.pre-flight-checks.outputs.system_healthy == 'true'

    strategy:

      fail-fast: false

      matrix:

        validation_type:
          - platforms
          - features
          - tests
          - model


    steps:


      # ========================================================================
      # CHECKOUT
      # ========================================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Q Steps Manager start comprehensive validation
        run: python3 scripts/qsteps_manager.py start --step "${GITHUB_JOB}:comprehensive-validation"


      # ========================================================================
      # PYTHON
      # ========================================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt


      # ========================================================================
      # CREATE TRACKING DIRECTORY
      # ========================================================================

      - name: Prepare tracking directory
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ollamatracks

          touch ollamatracks/validation_metrics.jsonl

          echo "Tracking directory prepared."


      # ========================================================================
      # INSTALL DEPENDENCIES WITH RETRY
      # ========================================================================

      - name: Install dependencies with retry
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "INSTALLING VALIDATION DEPENDENCIES"
          echo "============================================================"

          MAX_ATTEMPTS=3
          INSTALL_SUCCESS=false

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            echo
            echo "Dependency installation attempt ${attempt}/${MAX_ATTEMPTS}"

            if python3 -m pip install --upgrade pip setuptools wheel && \
               python3 -m pip install \
                 pytest \
                 pytest-timeout \
                 pyyaml \
                 requests; then

              INSTALL_SUCCESS=true

              echo "Dependencies installed successfully."

              break

            fi

            echo "::warning::Dependency installation attempt ${attempt} failed."

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then

              delay=$((5 * attempt))

              echo "Waiting ${delay}s before retry..."

              sleep "$delay"

            fi

          done

          if [ "$INSTALL_SUCCESS" != "true" ]; then
            echo "::error::Dependency installation failed after ${MAX_ATTEMPTS} attempts."
            exit 1
          fi


      # ========================================================================
      # INSTALL PROJECT DEPENDENCIES
      # ========================================================================

      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f requirements.txt ]; then

            echo "Installing project requirements..."

            python3 -m pip install \
              -r requirements.txt

          else

            echo "::error::requirements.txt not found."
            exit 1

          fi


      # ========================================================================
      # RUN VALIDATION
      # ========================================================================

      - name: Run ${{ matrix.validation_type }} validation
        env:
          VALIDATION_TYPE: ${{ matrix.validation_type }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "OLLAMA VALIDATION"
          echo "============================================================"

          echo "Validation type: ${VALIDATION_TYPE}"

          START_TIME="$(date +%s%N)"

          case "${VALIDATION_TYPE}" in

            platforms)

              echo
              echo "Validating supported platforms..."

              python3 \
                scripts/ollama_autonomous_agent.py \
                validate-platforms

              ;;


            features)

              echo
              echo "Validating platform-specific features..."

              python3 \
                scripts/ollama_autonomous_agent.py \
                validate-all-features

              ;;


            tests)

              echo
              echo "Running comprehensive test suite..."

              python3 -m pytest \
                tests/ \
                -v \
                --tb=short \
                --timeout=60

              ;;


            model)

              echo
              echo "Validating QMOI model card, safety, provenance, and test contract..."

              python3 - <<'PY'
              from pathlib import Path
              import sys
              sys.path.insert(0, "scripts")
              from ollama_autonomous_agent import ModelCardGenerator

              result = ModelCardGenerator(Path(".")).validate_model_contract()
              if not result["passed"]:
                  raise SystemExit(f"Model contract failed: {result['missing_sections']}")
              print("QMOI model contract passed")
              PY

              ;;


            *)

              echo "::error::Unknown validation type: ${VALIDATION_TYPE}"
              exit 1

              ;;

          esac

          END_TIME="$(date +%s%N)"

          DURATION=$(( (END_TIME - START_TIME) / 1000000 ))

          echo
          echo "Validation duration: ${DURATION}ms"

          echo "VALIDATION_DURATION=${DURATION}" \
            >> "$GITHUB_ENV"

          echo "VALIDATION_RESULT=success" \
            >> "$GITHUB_ENV"


      # ========================================================================
      # RECORD VALIDATION METRICS
      # ========================================================================

      - name: Record validation metrics
        if: always()
        shell: bash
        env:
          VALIDATION_TYPE: ${{ matrix.validation_type }}
        run: |
          set -Eeuo pipefail

          mkdir -p ollamatracks

          RESULT="${VALIDATION_RESULT:-failed}"

          DURATION="${VALIDATION_DURATION:-0}"

          TIMESTAMP="$(
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          )"

          cat >> ollamatracks/validation_metrics.jsonl <<EOF
          {"validation_type":"${VALIDATION_TYPE}","timestamp":"${TIMESTAMP}","duration_ms":${DURATION},"result":"${RESULT}","run_id":"${GITHUB_RUN_ID}","run_attempt":"${GITHUB_RUN_ATTEMPT}"}
          EOF

          echo "Validation metric recorded."


      # ========================================================================
      # UPLOAD VALIDATION ARTIFACTS
      # ========================================================================

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.validation_type }}-logs
          path: |
            ollama_agent.log
            ollamatracks/
          if-no-files-found: warn
          retention-days: 30


  # ==========================================================================
  # ADVANCED TEST EXECUTION
  # ==========================================================================

  enhanced-test-execution:

    name: Enhanced Test Suite with Auto-Recovery

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - comprehensive-validation

    outputs:

      tests_passed: ${{ steps.test_result.outputs.tests_passed }}

      test_count: ${{ steps.test_result.outputs.test_count }}


    steps:


      # ========================================================================
      # CHECKOUT
      # ========================================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Q Steps Manager start enhanced tests
        run: python3 scripts/qsteps_manager.py start --step "${GITHUB_JOB}:enhanced-test-execution"


      # ========================================================================
      # PYTHON
      # ========================================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt


      # ========================================================================
      # PREPARE TEST ENVIRONMENT
      # ========================================================================

      - name: Prepare test environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Preparing test environment..."

          python3 -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python3 -m pip install \
            pytest \
            pytest-timeout \
            pytest-xdist

          if [ -f requirements.txt ]; then
            python3 -m pip install \
              -r requirements.txt
          fi

          mkdir -p ollamatracks

          echo "Test environment ready."


      # ========================================================================
      # RUN TESTS WITH RETRY
      # ========================================================================

      - name: Run tests with auto-retry and auto-healing
        id: test_execution
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "ENHANCED TEST EXECUTION"
          echo "============================================================"

          TOTAL_ATTEMPTS=3
          CURRENT_ATTEMPT=0
          TEST_PASSED=false

          while [ "$CURRENT_ATTEMPT" -lt "$TOTAL_ATTEMPTS" ]; do

            CURRENT_ATTEMPT=$((CURRENT_ATTEMPT + 1))

            echo
            echo "============================================================"
            echo "TEST ATTEMPT ${CURRENT_ATTEMPT}/${TOTAL_ATTEMPTS}"
            echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "============================================================"

            if python3 -m pytest \
              tests/ \
              -v \
              --tb=short \
              --timeout=60 \
              -x; then

              TEST_PASSED=true

              echo "ALL TESTS PASSED on attempt ${CURRENT_ATTEMPT}."

              break

            else

              TEST_EXIT_CODE=$?

              echo "::warning::Tests failed with exit code ${TEST_EXIT_CODE}."

            fi

            if [ "$CURRENT_ATTEMPT" -lt "$TOTAL_ATTEMPTS" ]; then

              echo
              echo "Activating auto-healing..."

              echo "Cleaning Python cache..."

              find . \
                -type d \
                -name "__pycache__" \
                -prune \
                -exec rm -rf {} + \
                2>/dev/null || true

              rm -rf .pytest_cache

              echo "Reinstalling pytest..."

              python3 -m pip install \
                --force-reinstall \
                -q \
                pytest \
                pytest-timeout

              if [ -f requirements.txt ]; then

                python3 -m pip install \
                  -r requirements.txt \
                  -q

              fi

              BACKOFF_DELAY=$((5 * CURRENT_ATTEMPT))

              echo "Waiting ${BACKOFF_DELAY}s before retry..."

              sleep "$BACKOFF_DELAY"

              echo "Checking Git state..."

              if ! git status >/dev/null 2>&1; then

                echo "Git index appears unhealthy."

                rm -f .git/index

                git reset --quiet HEAD

              fi

              echo "Auto-healing completed."

            fi

          done

          if [ "$TEST_PASSED" = "true" ]; then

            echo "tests_passed=true" \
              >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo "tests_passed=false" \
            >> "$GITHUB_OUTPUT"

          echo "::error::Test suite failed after ${TOTAL_ATTEMPTS} attempts."

          exit 1


      # ========================================================================
      # TEST REPORT
      # ========================================================================

      - name: Count tests and generate report
        id: test_result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Generating test report..."

          mkdir -p ollamatracks

          TEST_COUNT="0"

          if python3 -m pytest \
            tests/ \
            --collect-only \
            -q \
            > /tmp/pytest-collect.txt 2>&1; then

            TEST_COUNT="$(
              grep -E \
                '[0-9]+ test(s)? collected' \
                /tmp/pytest-collect.txt |
                tail -1 |
                grep -Eo '[0-9]+' |
                head -1 ||
                true
            )"

          fi

          if [ -z "${TEST_COUNT}" ]; then
            TEST_COUNT="0"
          fi

          echo "test_count=${TEST_COUNT}" \
            >> "$GITHUB_OUTPUT"


          if [ "${{ steps.test_execution.outcome }}" = "success" ]; then

            echo "tests_passed=true" \
              >> "$GITHUB_OUTPUT"

            STATUS="ALL TESTS PASSED"

          else

            echo "tests_passed=false" \
              >> "$GITHUB_OUTPUT"

            STATUS="TESTS FAILED"

          fi


          {
            echo "### Test Execution Report"
            echo
            echo "**Status:** ${STATUS}"
            echo
            echo "**Total Tests Collected:** ${TEST_COUNT}"
            echo
            echo "**Timestamp:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "**Run ID:** ${GITHUB_RUN_ID}"
            echo
            echo "**Attempt:** ${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_STEP_SUMMARY"


      # ========================================================================
      # UPLOAD TEST RESULTS
      # ========================================================================

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            ollamatracks/
            ollama_agent.log
          if-no-files-found: warn
          retention-days: 30


  # ==========================================================================
  # AUTO-TRIGGER AUTONOMOUS AGENT
  # ==========================================================================

  trigger-agent-on-success:

    name: Auto-Trigger Agent (Tests Success)

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs:
      - enhanced-test-execution

    if: >
      needs.enhanced-test-execution.outputs.tests_passed == 'true'

    permissions:

      contents: read

      actions: write


    steps:


      # ========================================================================
      # CHECKOUT
      # ========================================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Q Steps Manager start agent dispatch
        run: python3 scripts/qsteps_manager.py start --step "${GITHUB_JOB}:trigger-agent-on-success"


      # ========================================================================
      # SETUP PYTHON
      # ========================================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt


      # ========================================================================
      # PREPARE AGENT ENVIRONMENT
      # ========================================================================

      - name: Prepare agent environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "PREPARING AUTONOMOUS AGENT"
          echo "============================================================"

          echo "Tests PASSED."

          echo "Autonomous agent will now be dispatched."

          python3 -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          if [ -f requirements.txt ]; then

            python3 -m pip install \
              -r requirements.txt

          fi


      # ========================================================================
      # RECORD PRE-AGENT STATUS
      # ========================================================================

      - name: Record pre-agent status
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ollamatracks

          cat > ollamatracks/AGENT_TRIGGER.txt <<EOF
          OLLAMA AUTONOMOUS AGENT TRIGGER EVENT
          ======================================

          Triggered by:
          Ollama Master Orchestrator - Enhanced Auto-Healing

          Timestamp:
          $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Run ID:
          ${GITHUB_RUN_ID}

          Run Number:
          ${GITHUB_RUN_NUMBER}

          Branch:
          ${GITHUB_REF_NAME}

          Commit:
          ${GITHUB_SHA}

          Test Count:
          ${{ needs.enhanced-test-execution.outputs.test_count }}

          Tests Passed:
          ${{ needs.enhanced-test-execution.outputs.tests_passed }}

          Action:
          Dispatch autonomous-agent workflow in full validation mode.

          ======================================
          EOF

          cat ollamatracks/AGENT_TRIGGER.txt


      # ========================================================================
      # DISPATCH AUTONOMOUS AGENT
      # ========================================================================

      - name: Trigger ollama-autonomous-agent workflow
        id: dispatch_agent
        uses: actions/github-script@v7
        env:
          AGENT_WORKFLOW_FILE: ollama-autonomous-agent.yml
        with:
          github-token: ${{ github.token }}

          script: |
            const workflowId =
              process.env.AGENT_WORKFLOW_FILE;

            const owner =
              context.repo.owner;

            const repo =
              context.repo.repo;

            const ref =
              context.ref.replace(/^refs\/heads\//, "");

            core.info(
              `Dispatching ${workflowId} for ${owner}/${repo} on ref ${ref}`
            );

            try {

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: ref || "main",
                inputs: {
                  mode: "full",
                  auto_heal: "true",
                  verbose: "true"
                }
              });

              core.info(
                "Autonomous-agent workflow dispatched successfully."
              );

              core.setOutput(
                "dispatch_status",
                "success"
              );

            } catch (error) {

              core.error(
                `Autonomous-agent dispatch failed: ${error.message}`
              );

              core.setOutput(
                "dispatch_status",
                "failed"
              );

              throw error;
            }


      # ========================================================================
      # RECORD AGENT STATUS
      # ========================================================================

      - name: Record agent status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ollamatracks

          cat >> ollamatracks/AGENT_TRIGGER.txt <<EOF

          Dispatch Result:
          ${{ steps.dispatch_agent.outputs.dispatch_status || 'unknown' }}

          Job Status:
          ${GITHUB_JOB}

          Dispatch Time:
          $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Note:
          Autonomous-agent execution is asynchronous.
          Check GitHub Actions workflow runs for execution status.

          ======================================
          EOF

          cat ollamatracks/AGENT_TRIGGER.txt


      # ========================================================================
      # UPLOAD AGENT TRIGGER RECORD
      # ========================================================================

      - name: Upload agent trigger record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-trigger-record-${{ github.run_id }}
          path: ollamatracks/AGENT_TRIGGER.txt
          if-no-files-found: warn
          retention-days: 30


  # ==========================================================================
  # FINAL VALIDATION AND STATUS REPORT
  # ==========================================================================

  final-status-report:

    name: Final Validation & Status Report

    runs-on: ubuntu-latest

    timeout-minutes: 15

    needs:
      - pre-flight-checks
      - comprehensive-validation
      - enhanced-test-execution
      - trigger-agent-on-success

    if: always()


    steps:


      # ========================================================================
      # CHECKOUT
      # ========================================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Q Steps Manager start final report
        run: python3 scripts/qsteps_manager.py start --step "${GITHUB_JOB}:final-status-report"


      # ========================================================================
      # DETERMINE FINAL STATUS
      # ========================================================================

      - name: Determine final validation status
        id: final_status
        shell: bash
        run: |
          set -Eeuo pipefail

          TESTS_STATUS="${{ needs.enhanced-test-execution.outputs.tests_passed }}"

          if [ "${TESTS_STATUS}" = "true" ]; then
            FINAL_STATUS="PASSED"
          else
            FINAL_STATUS="FAILED"
          fi

          echo "final_status=${FINAL_STATUS}" \
            >> "$GITHUB_OUTPUT"

          echo "Final validation status: ${FINAL_STATUS}"


      # ========================================================================
      # COMPILE COMPREHENSIVE REPORT
      # ========================================================================

      - name: Compile comprehensive report
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Compiling comprehensive final report..."

          REPORT_FILE="VALIDATION_REPORT_$(date +%Y%m%d_%H%M%S).md"

          TESTS_STATUS="${{ needs.enhanced-test-execution.outputs.tests_passed }}"

          if [ "${TESTS_STATUS}" = "true" ]; then
            TEST_STATUS_TEXT="PASSED"
            AGENT_STATUS_TEXT="TRIGGERED"
          else
            TEST_STATUS_TEXT="FAILED"
            AGENT_STATUS_TEXT="NOT TRIGGERED"
          fi

          cat > "${REPORT_FILE}" <<EOF
          # Ollama Master Orchestrator Validation Report

          **Generated:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          **Run ID:** ${GITHUB_RUN_ID}

          **Run Number:** ${GITHUB_RUN_NUMBER}

          **Repository:** ${GITHUB_REPOSITORY}

          **Branch:** ${GITHUB_REF_NAME}

          **Commit:** ${GITHUB_SHA}

          ## Validation Results

          | Component | Status |
          |-----------|--------|
          | Pre-Flight Checks | ${{ needs.pre-flight-checks.result }} |
          | Platform Validation | ${{ needs.comprehensive-validation.result }} |
          | Feature Validation | ${{ needs.comprehensive-validation.result }} |
          | Comprehensive Test Suite | ${TEST_STATUS_TEXT} |
          | Autonomous Agent Trigger | ${AGENT_STATUS_TEXT} |

          ## Test Metrics

          - Total Tests: ${{ needs.enhanced-test-execution.outputs.test_count }}
          - Tests Passed: ${TESTS_STATUS}
          - Test Job Result: ${{ needs.enhanced-test-execution.result }}

          ## Auto-Healing

          - Auto-Healing Enabled: ${QMOI_AUTO_HEAL}
          - Healing Performed: ${{ needs.pre-flight-checks.outputs.healing_performed }}

          ## Validation Matrix

          The comprehensive validation stage evaluates:

          - Platform validation
          - Feature validation
          - Repository test suite
          - Dependency installation
          - Autonomous-agent compatibility

          ## Artifacts

          Validation artifacts are attached to this workflow run.

          ## Autonomous Agent

          The autonomous agent is dispatched only after the enhanced test suite
          reports successful completion.

          ## Final Status

          **${{ steps.final_status.outputs.final_status }}**

          ---

          **Auto-Generated:** Do not edit manually.
          EOF

          cat "${REPORT_FILE}"


      # ========================================================================
      # UPLOAD FINAL REPORT
      # ========================================================================

      - name: Upload comprehensive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-validation-report
          path: VALIDATION_REPORT_*.md
          if-no-files-found: warn
          retention-days: 90


      # ========================================================================
      # FINAL GITHUB SUMMARY
      # ========================================================================

      - name: Post final summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          TESTS_STATUS="${{ needs.enhanced-test-execution.outputs.tests_passed }}"

          if [ "${TESTS_STATUS}" = "true" ]; then

            TEST_STATUS="PASSED"

            AGENT_STATUS="AUTONOMOUS AGENT TRIGGERED"

          else

            TEST_STATUS="FAILED"

            AGENT_STATUS="AUTONOMOUS AGENT NOT TRIGGERED"

          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Ollama Master Orchestrator - Complete

          ## Summary

          | Component | Result |
          |---|---|
          | Pre-Flight Checks | ${{ needs.pre-flight-checks.result }} |
          | Platform Validation | ${{ needs.comprehensive-validation.result }} |
          | Feature Validation | ${{ needs.comprehensive-validation.result }} |
          | Test Suite | ${TEST_STATUS} |
          | Agent Trigger | ${AGENT_STATUS} |

          ## Test Details

          - Total collected: ${{ needs.enhanced-test-execution.outputs.test_count }}
          - Tests passed: ${TESTS_STATUS}
          - Test job: ${{ needs.enhanced-test-execution.result }}

          ## Auto-Healing

          - Enabled: ${QMOI_AUTO_HEAL}
          - Performed: ${{ needs.pre-flight-checks.outputs.healing_performed }}

          ## Workflow

          - Run ID: ${GITHUB_RUN_ID}
          - Run Number: ${GITHUB_RUN_NUMBER}
          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}

          ## Timestamp

          $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF


      # ========================================================================
      # FAIL FINAL JOB WHEN VALIDATION FAILED
      # ========================================================================
      #
      # The report is generated first, then the final job reflects the actual
      # validation outcome.
      #
      # ========================================================================

      - name: Enforce final validation result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          TESTS_STATUS="${{ needs.enhanced-test-execution.outputs.tests_passed }}"

          if [ "${TESTS_STATUS}" != "true" ]; then

            echo "::error::Final validation failed because the enhanced test suite did not pass."

            exit 1

          fi

          if [ "${{ needs.pre-flight-checks.result }}" != "success" ]; then

            echo "::error::Pre-flight checks did not complete successfully."

            exit 1

          fi

          if [ "${{ needs.comprehensive-validation.result }}" != "success" ]; then

            echo "::error::Comprehensive validation did not complete successfully."

            exit 1

          fi

          echo "============================================================"
          echo "OLLAMA MASTER ORCHESTRATOR VALIDATION PASSED"
          echo "============================================================"
