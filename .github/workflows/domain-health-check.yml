name: Domain Health & UI Validation

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  
  # Also run on demand
  workflow_dispatch:

jobs:
  domain-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests schedule
      
      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Run comprehensive domain health validation
        run: |
          python scripts/comprehensive_domain_health_validator.py
      
      - name: Run domain activation orchestrator
        run: |
          python scripts/domain_activation_orchestrator.py
      
      - name: Check for README changes
        id: readme_check
        run: |
          if git diff --quiet README.md; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.readme_check.outputs.changes == 'true'
        run: |
          git add README.md docs/ data/ 2>/dev/null || true
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-update: Domain health checks - $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
      
      - name: Create summary report
        if: always()
        run: |
          python scripts/domain_health_cicd_automation.py
      
      - name: Upload domain health report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: domain-health-report
          path: |
            docs/domain_health_report.json
            docs/domain_health_markdown.md
            docs/ci_cd_automation_report.json
          retention-days: 30
      
      - name: Check domain health status
        id: health_status
        run: |
          if [ -f docs/domain_health_report.json ]; then
            python3 -c "
            import json
            with open('docs/domain_health_report.json', 'r') as f:
              data = json.load(f)
            if data:
              healthy = sum(1 for r in data.values() if isinstance(r, dict) and r.get('overall_healthy', False))
              total = len(data)
              pct = (healthy/total*100) if total > 0 else 0
              print(f'Health: {pct:.1f}%')
              exit(0 if pct >= 95 else 1)
            "
          fi
      
      - name: Post summary to logs
        if: always()
        run: |
          echo "## 🌐 Domain Health Check complete"
          echo ""
          if [ -f docs/domain_health_markdown.md ]; then
            cat docs/domain_health_markdown.md
          fi
