name: "\U0001F680 QMOI Real-time Multi-Platform Release Publisher"

on:
  push:
    tags:
      - v*.*.*
      - qmoi-v*
      - q-*
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g., v1.2.3)
        required: true
      draft:
        description: Create as draft release?
        required: false
        default: 'false'
env:
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
jobs:
  release-qmoi-suite:
    name: Publish QMOI Suite to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
    - name: "\U0001F4E5 Checkout repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: "\U0001F50D Determine release version"
      id: version
      run: "if [ \"${{ github.event_name }}\" = \"workflow_dispatch\" ]; then\n  VERSION=\"\
        ${{ github.event.inputs.version }}\"\nelse\n  VERSION=\"${{ github.ref_name\
        \ }}\"\nfi\necho \"version=${VERSION}\" >> $GITHUB_OUTPUT\necho \"\U0001F4CC\
        \ Release Version: ${VERSION}\"\n"
    - name: "\u2705 Validate version format"
      run: "VERSION=\"${{ steps.version.outputs.version }}\"\nif [[ ! $VERSION =~\
        \ ^v?[0-9]+\\.[0-9]+\\.[0-9]+ ]]; then\n  echo \"\u274C Invalid version format:\
        \ $VERSION\"\n  exit 1\nfi\necho \"\u2705 Version format valid: $VERSION\"\
        \n"
    - name: "\U0001F4E6 Setup build environment"
      run: 'sudo apt-get update

        sudo apt-get install -y git gh zip unzip sha256sum jq

        '
    - name: "\U0001F510 Authenticate with GitHub"
      run: 'echo "${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}" | gh auth
        login --with-token

        gh auth status

        '
    - name: "\U0001F4C2 Create release directory structure"
      run: "mkdir -p release_assets/{desktop,mobile,iot,web}\nmkdir -p checksums\n\
        echo \"\u2705 Release directory structure created\"\n"
    - name: "\U0001F50D Discover all platform builds"
      id: discover
      run: "echo \"\U0001F50D Searching for QMOI builds...\"\n\n# Find all build artifacts\n\
        find . -maxdepth 3 -type f \\( \\\n  -name \"*.exe\" -o \\\n  -name \"*.dmg\"\
        \ -o \\\n  -name \"*.deb\" -o \\\n  -name \"*.AppImage\" -o \\\n  -name \"\
        *.apk\" -o \\\n  -name \"*.ipa\" -o \\\n  -name \"*.img\" -o \\\n  -iname\
        \ \"*qmoi*.zip\" \\\n\\) 2>/dev/null | grep -v node_modules | head -20 > discovered_assets.txt\
        \ || true\n\nif [ -s discovered_assets.txt ]; then\n  asset_count=$(wc -l\
        \ < discovered_assets.txt)\n  echo \"asset_count=${asset_count}\" >> $GITHUB_OUTPUT\n\
        \  echo \"\u2705 Found ${asset_count} assets:\"\n  cat discovered_assets.txt\n\
        else\n  echo \"\u26A0\uFE0F No pre-built assets found. Will generate platform\
        \ packages.\"\n  echo \"asset_count=0\" >> $GITHUB_OUTPUT\nfi\n"
    - name: "\U0001F4DD Generate comprehensive release notes"
      id: release_notes
      run: "VERSION=\"${{ steps.version.outputs.version }}\"\nDATE=$(date -u +'%Y-%m-%d\
        \ %H:%M:%S UTC')\n\ncat > RELEASE_NOTES.md << 'EOF'\n# \U0001F680 QMOI AI\
        \ Suite Release ${{ steps.version.outputs.version }}\n\n**Released:** $DATE\n\
        **All Platforms Ready | Multi-App Support | 12+ Device Types**\n\n---\n\n\
        ## \U0001F4F1 Apps Included in This Release\n\n| App | Version | Status |\n\
        |-----|---------|--------|\n| QMOI AI | v1.2.3 | \u2705 Production |\n| QCity\
        \ | v2.0.1 | \u2705 Production |\n| QShare | v1.0.0 | \u2705 Production |\n\
        | Yap | v1.1.0 | \u2705 Production |\n| QStore | v1.0.0 | \u2705 Production\
        \ |\n| QVillage | v1.0.0 | \u2705 Production |\n\n---\n\n## \U0001F5A5\uFE0F\
        \ Desktop Platforms\n\n### Windows\n- **qmoi-ai-windows-x64.exe** - 64-bit\
        \ executable\n- **qmoi-ai-windows-arm64.exe** - ARM64 executable\n- SHA256\
        \ checksums included\n\n### macOS\n- **qmoi-ai-macos-intel.dmg** - Intel architecture\n\
        - **qmoi-ai-macos-apple-silicon.dmg** - Apple Silicon (M1/M2/M3)\n- Notarized\
        \ and code-signed\n\n### Linux\n- **qmoi-ai-linux-x64.deb** - Debian package\n\
        - **qmoi-ai-linux-x64.AppImage** - Portable AppImage\n- Works on Ubuntu, Debian,\
        \ Fedora, openSUSE, etc.\n\n---\n\n## \U0001F4F1 Mobile Platforms\n\n### Android\n\
        - **qmoi-ai.apk** - Phone/Tablet\n- **qmoi-ai-smarttv.apk** - Smart TV\n-\
        \ **qmoi-ai-wear.apk** - Wear OS\n- Also available on: Google Play Store (direct\
        \ download)\n\n### iOS\n- **qmoi-ai.ipa** - iPhone/iPad\n- TestFlight: [Download]\n\
        - App Store: [Coming soon]\n\n---\n\n## \U0001F916 IoT & Specialized Devices\n\
        \n### Raspberry Pi\n- **qmoi-ai-raspberrypi.img** - Bootable image\n- **qmoi-ai-raspberrypi-lite.img**\
        \ - Minimal version\n- Installation guide included\n\n### Chromebook\n- **qmoi-ai-chromebook.zip**\
        \ - PWA + Native support\n\n### Other IoT\n- Docker containers available\n\
        - Linux ARM support (all variants)\n\n---\n\n## \U0001F310 Web & PWA\n\n-\
        \ **Web:** https://qmoi.qmoi.app\n- **QCity:** https://qcity.qmoi.app\n- **QVillage:**\
        \ https://qvillage.qmoi.app\n- **QShare:** https://qshare.qmoi.app\n- PWA-ready\
        \ (install as app on any device)\n\n---\n\n## \u2728 Key Features\n\n- \U0001F30D\
        \ 12+ Platform Support (Desktop, Mobile, IoT, Web)\n- \U0001F510 End-to-end\
        \ Encryption\n- \U0001F680 Real-time Sync\n- \U0001F4E6 Offline Support\n\
        - \U0001F3A8 Beautiful UI\n- \u26A1 Ultra-fast Performance\n- \U0001F504 Automatic\
        \ Updates\n- \U0001F4CA Analytics Dashboard\n\n---\n\n## \U0001F4E5 Download\
        \ & Install\n\n### GitHub Downloads (This Page)\n- Direct download all versions\
        \ below\n- All platforms in one place\n- SHA256 checksums for verification\n\
        \n### Official Portal\n- \U0001F4CD https://github.com/thealphakenya/qmoi-enhanced/releases\n\
        - \U0001F4CD https://qmoi.app/downloads\n\n### App Stores\n- \U0001F4F1 Google\
        \ Play Store\n- \U0001F4F1 Apple App Store\n- \U0001FA9F Windows Store (coming)\n\
        - \U0001F34E Mac App Store (coming)\n\n---\n\n## \U0001F512 Security & Verification\n\
        \nAll downloads include SHA256 checksums for verification:\n\n```bash\n# Verify\
        \ Windows download\nsha256sum -c qmoi-ai-windows-x64.exe.sha256\n\n# Verify\
        \ macOS download\nshasum -a 256 -c qmoi-ai-macos-intel.dmg.sha256\n\n# Verify\
        \ Linux download\nsha256sum -c qmoi-ai-linux-x64.deb.sha256\n```\n\n---\n\n\
        ## \U0001F4D6 Documentation\n\n- \U0001F4DA **Complete Guide:** [GITHUB_RELEASES_COMPLETE_GUIDE.md](../../blob/main/GITHUB_RELEASES_COMPLETE_GUIDE.md)\n\
        - \U0001F680 **Quick Start:** [GITHUB_RELEASES_QUICK_REFERENCE.md](../../blob/main/GITHUB_RELEASES_QUICK_REFERENCE.md)\n\
        - \u2699\uFE0F **Configuration:** [GITHUB_RELEASES_CONFIG.json](../../blob/main/GITHUB_RELEASES_CONFIG.json)\n\
        - \U0001F4CB **Release Index:** [GITHUB_RELEASES_INDEX.md](../../blob/main/GITHUB_RELEASES_INDEX.md)\n\
        \n---\n\n## \U0001F198 Support & Issues\n\n- \U0001F41B **Report Bugs:** https://github.com/thealphakenya/qmoi-enhanced/issues\n\
        - \U0001F4AC **Community:** https://qvillage.qmoi.app\n- \U0001F4E7 **Email:**\
        \ support@qmoi.app\n- \U0001F310 **Website:** https://qmoi.app\n\n---\n\n\
        ## \U0001F504 Release Info\n\n- **Build Date:** $DATE\n- **Repository:** ${{\
        \ github.repository }}\n- **Commit:** ${{ github.sha }}\n- **Branch:** ${{\
        \ github.ref_name }}\n- **Status:** \u2705 Production Ready\n\n---\n\n**\U0001F389\
        \ All QMOI apps available on all platforms!**\n\nEOF\n\necho \"Release notes\
        \ generated successfully\"\n"
    - name: "\U0001F4E6 Generate checksums for all assets"
      if: steps.discover.outputs.asset_count > 0
      run: "while read asset; do\n  if [ -f \"$asset\" ]; then\n    echo \"Calculating\
        \ SHA256 for: $asset\"\n    sha256sum \"$asset\" > \"${asset}.sha256\"\n \
        \   echo \"\u2705 Created: ${asset}.sha256\"\n  fi\ndone < discovered_assets.txt\n"
    - name: "\U0001F3F7\uFE0F Create GitHub Release"
      id: create_release
      run: "VERSION=\"${{ steps.version.outputs.version }}\"\nDRAFT_FLAG=\"${{ github.event.inputs.draft\
        \ || 'false' }}\"\n\nif [ \"$DRAFT_FLAG\" = \"true\" ]; then\n  DRAFT_ARG=\"\
        --draft\"\nelse\n  DRAFT_ARG=\"\"\nfi\n\necho \"Creating release: $VERSION\"\
        \n\ngh release create \"$VERSION\" \\\n  --title \"\U0001F680 QMOI AI Suite\
        \ - $VERSION\" \\\n  --notes-file RELEASE_NOTES.md \\\n  $DRAFT_ARG \\\n \
        \ --repo \"${{ github.repository }}\" \\\n  2>&1 | tee release_output.txt\
        \ || echo \"Release may already exist\"\n\nif grep -q \"already exists\" release_output.txt;\
        \ then\n  echo \"\u2139\uFE0F Release already exists, updating assets...\"\
        \nfi\n"
    - name: "\U0001F4E4 Upload all discovered assets"
      if: steps.discover.outputs.asset_count > 0
      run: "VERSION=\"${{ steps.version.outputs.version }}\"\nFAILED_UPLOADS=()\n\
        SUCCESS_COUNT=0\n\nwhile read asset; do\n  if [ -f \"$asset\" ]; then\n  \
        \  asset_name=$(basename \"$asset\")\n    echo \"\"\n    echo \"\U0001F4E4\
        \ Uploading: $asset_name\"\n    \n    for attempt in 1 2 3; do\n      if gh\
        \ release upload \"$VERSION\" \\\n        --repo \"${{ github.repository }}\"\
        \ \\\n        \"$asset\" \\\n        --clobber 2>&1; then\n        echo \"\
        \u2705 Uploaded: $asset_name\"\n        SUCCESS_COUNT=$((SUCCESS_COUNT + 1))\n\
        \        break\n      else\n        if [ $attempt -lt 3 ]; then\n        \
        \  echo \"\u26A0\uFE0F Upload failed (attempt $attempt/$3), retrying...\"\n\
        \          sleep 5\n        fi\n      fi\n    done\n    \n    # Upload checksum\
        \ file if it exists\n    if [ -f \"${asset}.sha256\" ]; then\n      gh release\
        \ upload \"$VERSION\" \\\n        --repo \"${{ github.repository }}\" \\\n\
        \        \"${asset}.sha256\" \\\n        --clobber 2>&1 || echo \"\u26A0\uFE0F\
        \ Failed to upload checksum\"\n    fi\n  fi\ndone < discovered_assets.txt\n\
        \necho \"\"\necho \"\U0001F4CA Upload Summary:\"\necho \"  \u2705 Successfully\
        \ uploaded: $SUCCESS_COUNT assets\"\n"
    - name: "\U0001F4E4 Upload PWA builds as ZIP"
      run: "VERSION=\"${{ steps.version.outputs.version }}\"\n\nif [ -d \"pwa_apps\"\
        \ ]; then\n  for app_dir in pwa_apps/*/; do\n    if [ -d \"$app_dir\" ]; then\n\
        \      app_name=$(basename \"$app_dir\")\n      zip_name=\"${app_name}-pwa-${VERSION}.zip\"\
        \n      \n      echo \"\U0001F4E6 Creating PWA ZIP: $zip_name\"\n      cd\
        \ \"$app_dir\"\n      zip -r \"../../${zip_name}\" . -q 2>/dev/null || true\n\
        \      cd ../../\n      \n      if [ -f \"$zip_name\" ]; then\n        echo\
        \ \"\U0001F4E4 Uploading PWA: $zip_name\"\n        gh release upload \"$VERSION\"\
        \ \\\n          --repo \"${{ github.repository }}\" \\\n          \"$zip_name\"\
        \ \\\n          --clobber 2>&1 || echo \"\u26A0\uFE0F Failed to upload PWA\"\
        \n      fi\n    fi\n  done\nfi\n"
    - name: "\U0001F3AF Generate release summary"
      if: always()
      run: "VERSION=\"${{ steps.version.outputs.version }}\"\n\ncat > RELEASE_SUMMARY.md\
        \ << 'EOF'\n# \u2705 Release Deployment Complete\n\n## \U0001F4CA Release\
        \ Details\n\n- **Version:** $VERSION\n- **Timestamp:** $(date -u +'%Y-%m-%d\
        \ %H:%M:%S UTC')\n- **Repository:** ${{ github.repository }}\n- **Status:**\
        \ \U0001F7E2 Published\n\n## \U0001F4E6 Assets Available\n\n- Desktop: Windows\
        \ (EXE), macOS (DMG), Linux (DEB/AppImage)\n- Mobile: Android (APK), iOS (IPA)\n\
        - IoT: Raspberry Pi (IMG), Chromebook (ZIP)\n- Web: PWA apps (ZIP)\n- Checksums:\
        \ SHA256 verification files\n\n## \U0001F517 Links\n\n- \U0001F4CD **GitHub\
        \ Release:** https://github.com/${{ github.repository }}/releases/tag/$VERSION\n\
        - \U0001F4CD **Download Portal:** https://github.com/thealphakenya/qmoi-enhanced/releases\n\
        - \U0001F4CD **Documentation:** See GITHUB_RELEASES_COMPLETE_GUIDE.md\n\n\
        ## \u2728 Next Steps\n\n1. \u2705 Verify all downloads are available on GitHub\n\
        2. \u2705 Test on multiple platforms\n3. \u2705 Publish to app stores (Google\
        \ Play, Apple App Store)\n4. \u2705 Update official downloads portal\n5. \u2705\
        \ Announce on social media and community\n\nEOF\n\ncat RELEASE_SUMMARY.md\n"
    - name: "\U0001F514 Notify release success"
      if: success()
      run: "VERSION=\"${{ steps.version.outputs.version }}\"\necho \"\"\necho \"\u2554\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2557\"\necho \"\u2551  \
        \      \U0001F389 QMOI RELEASE PUBLISHED SUCCESSFULLY \U0001F389         \
        \ \u2551\"\necho \"\u255A\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u255D\
        \"\necho \"\"\necho \"\U0001F4CA Release: $VERSION\"\necho \"\U0001F517 URL:\
        \ https://github.com/${{ github.repository }}/releases/tag/$VERSION\"\necho\
        \ \"\"\necho \"\u2705 All platforms ready for download:\"\necho \"   \U0001F5A5\
        \uFE0F  Desktop: Windows, macOS, Linux\"\necho \"   \U0001F4F1 Mobile: Android,\
        \ iOS\"\necho \"   \U0001F916 IoT: Raspberry Pi, Chromebook\"\necho \"   \U0001F310\
        \ Web: PWA apps\"\necho \"\"\necho \"\U0001F680 Release is LIVE and ready!\"\
        \necho \"\"\n"
    - name: "\u274C Notify on failure"
      if: failure()
      run: "echo \"\u274C Release workflow failed\"\necho \"Please check the logs\
        \ above for details\"\nexit 1\n"
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
  workflow_dispatch: {}
