name: Integration Checks (QMOI)

on:
  push:
    branches: [ main, autosync-backup-20250926-232440 ]
  workflow_dispatch: {}

jobs:
  integration-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Start server
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 120000

      - name: Run integration checks script
        run: bash scripts/ci_run_integration_checks.sh

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: reports/integration_test_results_ci.txt
