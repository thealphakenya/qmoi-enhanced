name: Open Release Inventory PR

on:
  workflow_dispatch:

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit inventory (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release-inventory-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git add REPORT_RELEASE_INVENTORY.md || true
          if git diff --cached --quiet; then
            echo "No changes to REPORT_RELEASE_INVENTORY.md"
            exit 0
          fi
          git commit -m "chore: add release inventory report"
          git push --set-upstream origin "$branch"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add release inventory report"
          branch: "auto/release-inventory"
          base: autosync-backup-20250926-232440
          title: "Release inventory report and next steps"
          body: |
            This PR adds `REPORT_RELEASE_INVENTORY.md` generated by the repository automation.
            Please review the inventory and the suggested next steps in the PR description.
          labels: "automation,release"
