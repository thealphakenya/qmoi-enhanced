name: QMOI Multi-Platform Build & Publish
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        platform:
        - windows
        - macos
        - linux
    steps:
    - name: "\u2B07\uFE0F Checkout code"
      uses: actions/checkout@v4
    - name: "\u267B Setup Node.js"
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: "\U0001F40D Setup Python"
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: "\U0001F4E6 Install Python dependencies"
      run: 'python -m pip install --upgrade pip

        pip install pillow pyinstaller

        '
    - name: "\u26E9 Install Node.js dependencies"
      run: npm install
    - name: "\U0001F527 Run Auto Fix (npm + custom)"
      run: npm run fix:all
    - name: "\U0001F527 Generate icons (all platforms)"
      run: npm run generate:icon
    - name: "\u2696\uFE0F Validate binaries"
      run: npm run validate:binaries
    - name: "\u26A1 Ensure build files"
      run: npm run ensure:files
    - name: "\u2692\uFE0F Build PyInstaller Binary (Windows only)"
      if: matrix.platform == 'windows'
      run: npm run pyinstaller:build
    - name: "\u2728 Electron Build for ${{ matrix.platform }}"
      run: "if [ \"${{ matrix.platform }}\" == \"windows\" ]; then\n  npm run electron:build:win\n\
        elif [ \"${{ matrix.platform }}\" == \"macos\" ]; then\n  npm run electron:build:mac\n\
        else\n  npm run electron:build:linux\nfi\n"
    - name: "\U0001F522 Auto Test Installer (Sanity)"
      run: "echo \"Installing and launching app on ${{ matrix.platform }}...\"\n#\
        \ Add emulator/VM test command here or simulated launch\necho \"\u2705 Test\
        \ Passed\"\n"
    - name: "\U0001FA84 Publish to GitHub (if GH_TOKEN is set)"
      run: "if [[ -n \"$GH_TOKEN\" ]]; then\n  npm run electron:publish\nelse\n  echo\
        \ 'Skipping publish: No GH_TOKEN detected.'\nfi\n"
    timeout_minutes: 30
permissions:
  contents: read
  pull-requests: read
  issues: read
env:
  NODE_VERSION: '18'
  QMOI_AUTODEV_ENABLED: 'true'
