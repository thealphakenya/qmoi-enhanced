name: Release Compliance Check

on:
  schedule:
    - cron: "0 12 * * 0" # weekly on Sunday at noon UTC
  workflow_dispatch: {}

jobs:
  compliance-check:
    name: Check release compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Generate compliance report
        env:
          GITHUB_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_release_compliance_report.py

      - name: Upload report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: release-compliance-report
          path: reports/release_compliance_report.json

      - name: Check compliance status
        id: check
        run: |
          STATUS=$(jq -r '.compliance_status' reports/release_compliance_report.json)
          ALERTS=$(jq '.alerts | length' reports/release_compliance_report.json)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "alerts=$ALERTS" >> $GITHUB_OUTPUT

      - name: Create issue if compliance fails
        if: steps.check.outputs.status == 'FAIL'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('reports/release_compliance_report.json', 'utf8'));
            const alerts = report.alerts || [];

            let body = '## Release Compliance Check Failed\n\n';
            body += `**Status**: ${report.compliance_status}\n`;
            body += `**Checked at**: ${report.timestamp}\n`;
            body += `**Releases**: ${report.total_releases} (${report.releases.filter(r => r.status === 'ALERT').length} with issues)\n\n`;

            if (alerts.length > 0) {
              body += '### Alerts\n\n';
              for (const alert of alerts) {
                body += `- **${alert.release || 'General'}**: ${alert.issue}\n`;
                if (alert.recommendation) {
                  body += `  - Recommendation: ${alert.recommendation}\n`;
                }
              }
            }

            body += '\n**Full Report**: See artifacts for `release_compliance_report.json`\n';

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Release Compliance] ${report.compliance_status === 'FAIL' ? 'Issues Found' : 'Status OK'}`,
              body: body,
              labels: ['release', 'compliance', 'automated']
            });

      - name: Comment on success
        if: steps.check.outputs.status == 'PASS'
        run: echo "✅ All releases are compliant with manifest"
