name: Link Cache Maintenance

on:
  schedule:
  - cron: 0 3 * * *
  workflow_dispatch: {}
jobs:
  prune-cache:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Run link cache maintenance (dry-run)
      run: 'python3 scripts/link_cache_maintenance.py --ttl-days 30 --dry-run

        '
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: link-cache-maintenance-dryrun
        path: .qmoi_validation/**
'on':
  push:
    paths:
    - '**/*.md'
    - tools/**
    - .github/workflows/**
  pull_request:
    paths:
    - '**/*.md'
    - tools/**
    - .github/workflows/**
  workflow_dispatch: {}
