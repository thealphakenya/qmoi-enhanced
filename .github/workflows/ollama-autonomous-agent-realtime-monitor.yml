name: Ollama Autonomous Agent - PR Realtime Tracker

# ============================================================================
# OLLAMA AUTONOMOUS AGENT - PR REALTIME TRACKER
# ============================================================================
#
# PURPOSE
# -------
# Durable monitoring/reconciliation system for:
#
#   * Ollama PR validation workflow
#   * Ollama autonomous-agent workflow
#   * workflow runs
#   * jobs
#   * pull requests
#   * commits / branches / SHAs
#   * check runs
#   * validation results
#   * agent telemetry
#   * current agent state
#
# IMPORTANT
# ---------
# This workflow is a finite reconciler, NOT an infinite daemon.
#
# It uses:
#
#   workflow_run
#       +
#   schedule
#       +
#   workflow_dispatch
#       +
#   persistent ollamatracks/
#       +
#   GitHub Actions artifacts/logs
#
# The Python autonomous agent should additionally emit structured telemetry
# into:
#
#   ollamatracks/agent-events.jsonl
#
# using the schema documented in this workflow.
#
# ============================================================================
# SECURITY MODEL
# ============================================================================
#
# This workflow is privileged because workflow_run executes in the context of
# the base repository.
#
# NEVER checkout an untrusted pull-request head in this workflow.
#
# The checkout below intentionally uses the repository's default branch.
#
# The tracker observes repository state; it does NOT execute PR code.
#
# ============================================================================

on:
  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
      - "Ollama Autonomous Agent Trigger & Live Tracker"
    types:
      - requested
      - in_progress
      - completed

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional workflow run ID to inspect"
        required: false
        type: string
        default: ""

      force_snapshot:
        description: "Create a historical snapshot even when state is unchanged"
        required: false
        type: boolean
        default: true

      inspect_prs:
        description: "Inspect pull requests"
        required: false
        type: boolean
        default: true

      inspect_jobs:
        description: "Inspect workflow jobs"
        required: false
        type: boolean
        default: true

      inspect_checks:
        description: "Inspect check runs"
        required: false
        type: boolean
        default: true


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# Only one writer modifies ollamatracks at a time.
#
# queue: max is supported by GitHub Actions and permits multiple pending
# executions instead of replacing the existing pending execution.
#
# cancel-in-progress MUST remain false.
# ============================================================================

concurrency:
  group: ollama-pr-realtime-tracker-writer
  cancel-in-progress: false
  queue: max


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:
  TRACK_DIR: ollamatracks
  TRACK_SCHEMA_VERSION: "3.0"

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"
  AGENT_WORKFLOW_NAME: "Ollama Autonomous Agent Trigger & Live Tracker"

  MAX_RUNS: "20"
  MAX_JOBS_PER_RUN: "100"
  MAX_CHECKS: "100"
  MAX_PRS: "100"

  PYTHON_VERSION: "3.12"


# ============================================================================
# JOB
# ============================================================================

jobs:

  reconcile:

    name: Realtime Ollama + PR Reconciliation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout tracker state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}


      # ======================================================================
      # INITIALIZE
      # ======================================================================

      - name: Initialize tracking directory
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          touch "$TRACK_DIR/TRACKING_INDEX.txt"
          touch "$TRACK_DIR/CURRENT_STATUS.txt"
          touch "$TRACK_DIR/LATEST_ACTIVITY.txt"
          touch "$TRACK_DIR/STATE.txt"
          touch "$TRACK_DIR/PR_STATUS.txt"
          touch "$TRACK_DIR/LAST_RECONCILIATION.txt"

          if [ ! -f "$TRACK_DIR/TRACKING_INDEX.txt" ] || \
             [ ! -s "$TRACK_DIR/TRACKING_INDEX.txt" ]; then

            cat > "$TRACK_DIR/TRACKING_INDEX.txt" <<'EOF'
          OLLAMA AUTONOMOUS AGENT TRACKING INDEX
          ======================================

          Schema version: 3.0

          Historical records:
            NNNNNN_event_name.txt

          Historical records are append-only.

          Mutable state:
            CURRENT_STATUS.txt
            LATEST_ACTIVITY.txt
            STATE.txt
            PR_STATUS.txt
            LAST_RECONCILIATION.txt

          Structured agent telemetry:
            agent-events.jsonl

          Event categories:
            TRACKER
            WORKFLOW
            JOB
            PR
            CHECK
            VALIDATION
            AGENT
            ITERATION
            TASK
            TOOL
            ERROR
            CHECKPOINT
            SUMMARY
          EOF
          fi


      # ======================================================================
      # COLLECT STATE
      # ======================================================================

      - name: Collect GitHub state
        id: collect
        uses: actions/github-script@v8
        env:
          TRACK_DIR: ${{ env.TRACK_DIR }}

          VALIDATION_WORKFLOW_NAME: ${{ env.VALIDATION_WORKFLOW_NAME }}
          AGENT_WORKFLOW_NAME: ${{ env.AGENT_WORKFLOW_NAME }}

          MAX_RUNS: ${{ env.MAX_RUNS }}
          MAX_JOBS_PER_RUN: ${{ env.MAX_JOBS_PER_RUN }}
          MAX_CHECKS: ${{ env.MAX_CHECKS }}
          MAX_PRS: ${{ env.MAX_PRS }}

          MANUAL_RUN_ID: ${{ inputs.run_id }}
          FORCE_SNAPSHOT: ${{ inputs.force_snapshot }}
          INSPECT_PRS: ${{ inputs.inspect_prs }}
          INSPECT_JOBS: ${{ inputs.inspect_jobs }}
          INSPECT_CHECKS: ${{ inputs.inspect_checks }}

        with:
          github-token: ${{ github.token }}

          script: |
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const trackDir = process.env.TRACK_DIR || "ollamatracks";

            const validationWorkflowName =
              process.env.VALIDATION_WORKFLOW_NAME ||
              "Ollama PR Validation - 293+ Platform Features";

            const agentWorkflowName =
              process.env.AGENT_WORKFLOW_NAME ||
              "Ollama Autonomous Agent Trigger & Live Tracker";

            const maxRuns =
              Number(process.env.MAX_RUNS || "20");

            const maxJobs =
              Number(process.env.MAX_JOBS_PER_RUN || "100");

            const maxChecks =
              Number(process.env.MAX_CHECKS || "100");

            const maxPRs =
              Number(process.env.MAX_PRS || "100");

            const manualRunId =
              String(process.env.MANUAL_RUN_ID || "").trim();

            const forceSnapshot =
              String(process.env.FORCE_SNAPSHOT || "true") !== "false";

            const inspectPRs =
              String(process.env.INSPECT_PRS || "true") !== "false";

            const inspectJobs =
              String(process.env.INSPECT_JOBS || "true") !== "false";

            const inspectChecks =
              String(process.env.INSPECT_CHECKS || "true") !== "false";

            fs.mkdirSync(trackDir, { recursive: true });

            // =================================================================
            // TIME
            // =================================================================

            function utcNow() {
              return new Date().toISOString();
            }

            const timestamp = utcNow();

            // =================================================================
            // HELPERS
            // =================================================================

            function safe(value) {
              return String(value ?? "unknown")
                .replace(/[^a-zA-Z0-9._-]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 100) || "unknown";
            }

            function sha256(value) {
              return crypto
                .createHash("sha256")
                .update(String(value))
                .digest("hex");
            }

            function read(file) {
              try {
                return fs.readFileSync(file, "utf8");
              } catch {
                return "";
              }
            }

            function write(file, content) {
              fs.writeFileSync(file, content, "utf8");
            }

            function append(file, content) {
              fs.appendFileSync(file, content, "utf8");
            }

            function historicalFiles() {
              return fs
                .readdirSync(trackDir)
                .filter(name => /^\d{6}_.+\.txt$/i.test(name));
            }

            function nextSequence() {
              let highest = 0;

              for (const file of historicalFiles()) {
                const match = /^(\d{6})_/.exec(file);

                if (!match) {
                  continue;
                }

                const number = Number(match[1]);

                if (number > highest) {
                  highest = number;
                }
              }

              return highest + 1;
            }

            function recordEvent(eventName, data = {}) {
              const sequence = nextSequence();

              const sequenceText =
                String(sequence).padStart(6, "0");

              const filename =
                `${sequenceText}_${safe(eventName)}.txt`;

              const filepath =
                path.join(trackDir, filename);

              const lines = [
                "OLLAMA AUTONOMOUS AGENT TRACKING EVENT",
                "=======================================",
                "",
                `Schema version: ${process.env.TRACK_SCHEMA_VERSION || "3.0"}`,
                `Sequence: ${sequenceText}`,
                `Event: ${eventName}`,
                `Timestamp UTC: ${timestamp}`,
                `Repository: ${owner}/${repo}`,
                `Tracker workflow: ${context.workflow}`,
                `Tracker run ID: ${context.runId}`,
                `Tracker attempt: ${context.runAttempt}`,
                `GitHub event: ${context.eventName}`,
                ""
              ];

              for (const [key, value] of Object.entries(data)) {
                if (typeof value === "object") {
                  lines.push(`${key}:`);
                  lines.push(JSON.stringify(value, null, 2));
                } else {
                  lines.push(`${key}: ${String(value)}`);
                }
              }

              lines.push("");
              lines.push("END EVENT");
              lines.push("");

              write(filepath, lines.join("\n"));

              return {
               