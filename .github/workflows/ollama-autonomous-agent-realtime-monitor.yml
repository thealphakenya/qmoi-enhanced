name: Ollama Autonomous Agent - PR Realtime Tracker

# ============================================================================
# OLLAMA AUTONOMOUS AGENT - PR REALTIME TRACKER
# ============================================================================
#
# PURPOSE
# -------
# Durable, finite reconciliation and telemetry system for:
#
#   * Ollama PR validation workflow
#   * Ollama autonomous-agent workflow
#   * workflow runs
#   * workflow jobs
#   * job steps
#   * pull requests
#   * commits / branches / SHAs
#   * check runs
#   * commit statuses
#   * autonomous-agent telemetry
#   * current agent state
#   * historical activity
#
# This workflow is OBSERVATIONAL.
#
# It does NOT:
#
#   * execute pull-request code
#   * cancel agent runs
#   * restart agent runs
#   * merge pull requests
#   * approve pull requests
#   * modify agent source
#   * modify validation source
#   * modify unrelated repository files
#
# The Python autonomous agent is expected to emit structured telemetry into:
#
#   ollamatracks/agent-events.jsonl
#
# The tracker consumes that telemetry and combines it with GitHub's authoritative
# workflow/PR/check state.
#
# ============================================================================
# ARCHITECTURE
# ============================================================================
#
#                    GitHub Actions
#                         |
#             +-----------+-----------+
#             |                       |
#       workflow_run              schedule
#             |                       |
#             +-----------+-----------+
#                         |
#                    THIS TRACKER
#                         |
#       +-----------------+------------------+
#       |                 |                  |
#   Workflows           PRs              Telemetry
#       |                 |                  |
#       +-----------------+------------------+
#                         |
#                  ollamatracks/
#                         |
#       +-----------------+------------------+
#       |                 |                  |
#   CURRENT_STATUS    STATE             History
#   LATEST_ACTIVITY   PR_STATUS         NNNNNN_*.txt
#
# This is a finite reconciler, not an infinite daemon.
#
# ============================================================================
# SECURITY MODEL
# ============================================================================
#
# workflow_run workflows execute with privileges associated with the base
# repository. Therefore this workflow MUST NOT checkout or execute untrusted
# pull-request code.
#
# The checkout intentionally targets the repository default branch.
#
# Pull-request information is obtained through the GitHub API only.
#
# Agent telemetry is treated as DATA, not executable code.
#
# ============================================================================
# TRACKING DIRECTORY
# ============================================================================
#
# Mutable state:
#
#   ollamatracks/CURRENT_STATUS.txt
#   ollamatracks/LATEST_ACTIVITY.txt
#   ollamatracks/STATE.txt
#   ollamatracks/PR_STATUS.txt
#   ollamatracks/LAST_RECONCILIATION.txt
#   ollamatracks/TRACKING_INDEX.txt
#
# Structured telemetry:
#
#   ollamatracks/agent-events.jsonl
#
# Immutable historical records:
#
#   ollamatracks/000001_tracker_started.txt
#   ollamatracks/000002_workflow_snapshot.txt
#   ollamatracks/000003_agent_telemetry.txt
#   ...
#
# Historical records are never intentionally overwritten.
#
# ============================================================================
# TELEMETRY CONTRACT
# ============================================================================
#
# Recommended agent-events.jsonl event format:
#
# {
#   "schema_version": "3.0",
#   "timestamp": "2026-08-15T12:34:56.123Z",
#   "event": "task_started",
#   "run_id": "123456",
#   "iteration": 4,
#   "task_id": "validate-build",
#   "tool": "pytest",
#   "status": "running",
#   "message": "Running test suite"
# }
#
# Supported event categories include:
#
#   run_started
#   run_completed
#   iteration_started
#   iteration_completed
#   task_started
#   task_completed
#   tool_started
#   tool_completed
#   command_started
#   command_completed
#   validation_started
#   validation_completed
#   repair_started
#   repair_completed
#   checkpoint_created
#   error
#   agent_state_changed
#   agent_completed
#   agent_failed
#
# The tracker does not require every field to exist.
# Malformed telemetry lines are ignored and counted.
#
# ============================================================================

on:

  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
      - "Ollama Autonomous Agent Trigger & Live Tracker"
    types:
      - requested
      - in_progress
      - completed

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:

      run_id:
        description: "Optional workflow run ID to inspect"
        required: false
        type: string
        default: ""

      force_snapshot:
        description: "Create a historical snapshot even when state is unchanged"
        required: false
        type: boolean
        default: true

      inspect_prs:
        description: "Inspect open pull requests"
        required: false
        type: boolean
        default: true

      inspect_jobs:
        description: "Inspect workflow jobs and steps"
        required: false
        type: boolean
        default: true

      inspect_checks:
        description: "Inspect check runs and commit statuses"
        required: false
        type: boolean
        default: true


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# All tracker writers should use this same repository-level concurrency group.
#
# queue: max permits multiple pending executions while ensuring that only one
# writer is actively modifying the tracking state at a time.
#
# cancel-in-progress MUST remain false.
#
# GitHub documents queue: max as allowing up to 100 pending runs.
# ============================================================================

concurrency:
  group: ollama-pr-realtime-tracker-writer
  cancel-in-progress: false
  queue: max


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  TRACK_DIR: ollamatracks

  TRACK_SCHEMA_VERSION: "3.0"

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  AGENT_WORKFLOW_NAME: "Ollama Autonomous Agent Trigger & Live Tracker"

  MAX_RUNS: "20"

  MAX_JOBS_PER_RUN: "100"

  MAX_CHECKS_PER_PR: "20"

  MAX_TOTAL_CHECKS: "100"

  MAX_PRS: "100"

  MAX_TELEMETRY_LINES: "2000"


# ============================================================================
# JOB
# ============================================================================

jobs:

  reconcile:

    name: Realtime Ollama + PR Reconciliation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout tracker state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}


      # ======================================================================
      # INITIALIZE
      # ======================================================================

      - name: Initialize tracking directory
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          touch "$TRACK_DIR/TRACKING_INDEX.txt"
          touch "$TRACK_DIR/CURRENT_STATUS.txt"
          touch "$TRACK_DIR/LATEST_ACTIVITY.txt"
          touch "$TRACK_DIR/STATE.txt"
          touch "$TRACK_DIR/PR_STATUS.txt"
          touch "$TRACK_DIR/LAST_RECONCILIATION.txt"
          touch "$TRACK_DIR/agent-events.jsonl"

          if [ ! -s "$TRACK_DIR/TRACKING_INDEX.txt" ]; then
            cat > "$TRACK_DIR/TRACKING_INDEX.txt" <<'EOF'
          OLLAMA AUTONOMOUS AGENT TRACKING INDEX
          ======================================

          Tracking schema version: 3.0

          Historical records:
            NNNNNN_event_name.txt

          Historical records are append-only.

          Mutable state:
            CURRENT_STATUS.txt
            LATEST_ACTIVITY.txt
            STATE.txt
            PR_STATUS.txt
            LAST_RECONCILIATION.txt

          Structured autonomous-agent telemetry:
            agent-events.jsonl

          Event categories:

            TRACKER
            WORKFLOW
            JOB
            STEP
            PR
            CHECK
            STATUS
            VALIDATION
            AGENT
            ITERATION
            TASK
            TOOL
            COMMAND
            REPAIR
            CHECKPOINT
            ERROR
            SUMMARY

          The tracker observes and reconciles state.

          It does not:
            - cancel workflows
            - restart workflows
            - merge PRs
            - approve PRs
            - execute PR code
            - modify agent source
          EOF
          fi


      # ======================================================================
      # COLLECT AUTHORITATIVE GITHUB STATE + AGENT TELEMETRY
      # ======================================================================

      - name: Collect GitHub and Ollama state
        id: collect
        uses: actions/github-script@v8
        env:

          TRACK_DIR: ${{ env.TRACK_DIR }}

          TRACK_SCHEMA_VERSION: ${{ env.TRACK_SCHEMA_VERSION }}

          VALIDATION_WORKFLOW_NAME: ${{ env.VALIDATION_WORKFLOW_NAME }}

          AGENT_WORKFLOW_NAME: ${{ env.AGENT_WORKFLOW_NAME }}

          MAX_RUNS: ${{ env.MAX_RUNS }}

          MAX_JOBS_PER_RUN: ${{ env.MAX_JOBS_PER_RUN }}

          MAX_CHECKS_PER_PR: ${{ env.MAX_CHECKS_PER_PR }}

          MAX_TOTAL_CHECKS: ${{ env.MAX_TOTAL_CHECKS }}

          MAX_PRS: ${{ env.MAX_PRS }}

          MAX_TELEMETRY_LINES: ${{ env.MAX_TELEMETRY_LINES }}

          MANUAL_RUN_ID: ${{ inputs.run_id }}

          FORCE_SNAPSHOT: ${{ inputs.force_snapshot }}

          INSPECT_PRS: ${{ inputs.inspect_prs }}

          INSPECT_JOBS: ${{ inputs.inspect_jobs }}

          INSPECT_CHECKS: ${{ inputs.inspect_checks }}

        with:

          github-token: ${{ github.token }}

          script: |

            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");

            // =================================================================
            // CONTEXT
            // =================================================================

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const trackDir =
              process.env.TRACK_DIR || "ollamatracks";

            const schemaVersion =
              process.env.TRACK_SCHEMA_VERSION || "3.0";

            const validationWorkflowName =
              process.env.VALIDATION_WORKFLOW_NAME ||
              "Ollama PR Validation - 293+ Platform Features";

            const agentWorkflowName =
              process.env.AGENT_WORKFLOW_NAME ||
              "Ollama Autonomous Agent Trigger & Live Tracker";

            const maxRuns =
              clampInteger(
                process.env.MAX_RUNS,
                20,
                1,
                100
              );

            const maxJobs =
              clampInteger(
                process.env.MAX_JOBS_PER_RUN,
                100,
                1,
                100
              );

            const maxChecksPerPR =
              clampInteger(
                process.env.MAX_CHECKS_PER_PR,
                20,
                1,
                100
              );

            const maxTotalChecks =
              clampInteger(
                process.env.MAX_TOTAL_CHECKS,
                100,
                1,
                1000
              );

            const maxPRs =
              clampInteger(
                process.env.MAX_PRS,
                100,
                1,
                