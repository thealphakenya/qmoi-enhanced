name: Ollama Autonomous Agent - PR Realtime Tracker

# ============================================================================
# OLLAMA AUTONOMOUS AGENT - PR REALTIME TRACKER
# ============================================================================
#
# PURPOSE
# -------
# Independent telemetry and reconciliation system for:
#
#   - Ollama PR validation workflow
#   - Ollama autonomous-agent workflow activity
#   - workflow runs
#   - workflow jobs
#   - pull requests
#   - commit statuses
#   - check-runs
#   - branches and SHAs
#   - durable agent tracking files
#
# This workflow OBSERVES and RECORDS.
#
# It does NOT:
#   - cancel an agent
#   - restart an agent
#   - merge a PR
#   - modify agent source code
#   - modify validation workflows
#
# The Python autonomous agent can additionally emit internal telemetry into
# ollamatracks/ using the QMOI_TRACK protocol.
#
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # Observe the validation workflow.
  # --------------------------------------------------------------------------
  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - requested
      - in_progress
      - completed

  # --------------------------------------------------------------------------
  # Periodic reconciliation.
  # --------------------------------------------------------------------------
  schedule:
    - cron: "*/5 * * * *"

  # --------------------------------------------------------------------------
  # Manual inspection.
  # --------------------------------------------------------------------------
  workflow_dispatch:
    inputs:

      run_id:
        description: "Optional workflow run ID to inspect"
        required: false
        type: string
        default: ""

      force_snapshot:
        description: "Create a historical snapshot even if no material change occurred"
        required: false
        type: boolean
        default: true

      inspect_prs:
        description: "Inspect associated pull requests"
        required: false
        type: boolean
        default: true

      inspect_jobs:
        description: "Inspect workflow jobs"
        required: false
        type: boolean
        default: true

      inspect_checks:
        description: "Inspect commit check-runs and statuses"
        required: false
        type: boolean
        default: true


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# IMPORTANT:
# GitHub Actions concurrency supports:
#
#   group
#   cancel-in-progress
#
# There is no valid "queue: max" property.
#
# Therefore the invalid queue property from the previous version has been
# removed.
# ============================================================================

concurrency:
  group: ollama-pr-realtime-tracker-writer
  cancel-in-progress: false


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  TRACK_DIR: ollamatracks

  TRACK_SCHEMA_VERSION: "3.0"

  TARGET_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  MAX_RUNS_TO_INSPECT: "20"

  MAX_JOBS_PER_RUN: "100"

  MAX_CHECK_RUNS: "100"

  MAX_PRS_TO_INSPECT: "100"


# ============================================================================
# JOB
# ============================================================================

jobs:

  reconcile:

    name: Realtime Ollama + PR Reconciliation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ======================================================================
      # INITIALIZE TRACKING DIRECTORY
      # ======================================================================

      - name: Initialize tracking infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          touch "$TRACK_DIR/TRACKING_INDEX.txt"
          touch "$TRACK_DIR/CURRENT_STATUS.txt"
          touch "$TRACK_DIR/LATEST_ACTIVITY.txt"
          touch "$TRACK_DIR/STATE.txt"
          touch "$TRACK_DIR/PR_STATUS.txt"
          touch "$TRACK_DIR/LAST_RECONCILIATION.txt"

          echo "Tracking directory initialized:"
          echo "$TRACK_DIR"

      # ======================================================================
      # RECONCILIATION ENGINE
      # ======================================================================
      #
      # IMPORTANT JAVASCRIPT SAFETY:
      #
      # Do NOT write things like:
      #
      #   const x = "${{ github.event.workflow_run.id }}";
      #
      # inside this script.
      #
      # GitHub expressions are evaluated before the JavaScript is executed.
      # Unexpected values can therefore turn into invalid JavaScript.
      #
      # Instead, all event data is passed through env and read using
      # process.env.
      # ======================================================================

      - name: Reconcile Ollama workflow and PR state
        id: reconcile
        uses: actions/github-script@v9

        env:

          EVENT_NAME: ${{ github.event_name }}

          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}

          EVENT_RUN_STATUS: ${{ github.event.workflow_run.status }}

          EVENT_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

          EVENT_RUN_NAME: ${{ github.event.workflow_run.name }}

          EVENT_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}

          EVENT_RUN_SHA: ${{ github.event.workflow_run.head_sha }}

          EVENT_RUN_URL: ${{ github.event.workflow_run.html_url }}

          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

          MANUAL_RUN_ID: ${{ inputs.run_id }}

          FORCE_SNAPSHOT: ${{ inputs.force_snapshot }}

          INSPECT_PRS: ${{ inputs.inspect_prs }}

          INSPECT_JOBS: ${{ inputs.inspect_jobs }}

          INSPECT_CHECKS: ${{ inputs.inspect_checks }}

          TRACK_DIR: ${{ env.TRACK_DIR }}

          TRACK_SCHEMA_VERSION: ${{ env.TRACK_SCHEMA_VERSION }}

          TARGET_WORKFLOW_NAME: ${{ env.TARGET_WORKFLOW_NAME }}

          MAX_RUNS_TO_INSPECT: ${{ env.MAX_RUNS_TO_INSPECT }}

          MAX_JOBS_PER_RUN: ${{ env.MAX_JOBS_PER_RUN }}

          MAX_CHECK_RUNS: ${{ env.MAX_CHECK_RUNS }}

          MAX_PRS_TO_INSPECT: ${{ env.MAX_PRS_TO_INSPECT }}

        with:

          github-token: ${{ github.token }}

          script: |

            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");

            // =================================================================
            // CONTEXT
            // =================================================================

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const trackDir =
              process.env.TRACK_DIR || "ollamatracks";

            const schemaVersion =
              process.env.TRACK_SCHEMA_VERSION || "3.0";

            const targetWorkflow =
              process.env.TARGET_WORKFLOW_NAME ||
              "Ollama PR Validation - 293+ Platform Features";

            const eventName =
              process.env.EVENT_NAME || context.eventName;

            const eventRunId =
              String(process.env.EVENT_RUN_ID || "").trim();

            const manualRunId =
              String(process.env.MANUAL_RUN_ID || "").trim();

            const forceSnapshot =
              String(process.env.FORCE_SNAPSHOT || "true") !== "false";

            const inspectPRs =
              String(process.env.INSPECT_PRS || "true") !== "false";

            const inspectJobs =
              String(process.env.INSPECT_JOBS || "true") !== "false";

            const inspectChecks =
              String(process.env.INSPECT_CHECKS || "true") !== "false";

            const maxRuns =
              Math.max(
                1,
                Number(process.env.MAX_RUNS_TO_INSPECT || "20")
              );

            const maxJobs =
              Math.max(
                1,
                Number(process.env.MAX_JOBS_PER_RUN || "100")
              );

            const maxChecks =
              Math.max(
                1,
                Number(process.env.MAX_CHECK_RUNS || "100")
              );

            const maxPRs =
              Math.max(
                1,
                Number(process.env.MAX_PRS_TO_INSPECT || "100")
              );

            fs.mkdirSync(trackDir, {
              recursive: true
            });

            // =================================================================
            // TIME
            // =================================================================

            const now = new Date();

            const timestamp =
              now.toISOString();

            const fileTimestamp =
              timestamp
                .replace(/\.\d{3}Z$/, "")
                .replace(/[-:]/g, "")
                .replace("T", "_");

            // =================================================================
            // HELPERS
            // =================================================================

            function bool(value, defaultValue = false) {
              if (
                value === undefined ||
                value === null ||
                value === ""
              ) {
                return defaultValue;
              }

              return String(value).toLowerCase() === "true";
            }

            function safe(value, fallback = "unknown") {

              const text =
                String(value ?? fallback)
                  .replace(/[^a-zA-Z0-9._-]+/g, "-")
                  .replace(/-+/g, "-")
                  .replace(/^-+|-+$/g, "");

              return text || fallback;
            }

            function sha256(value) {

              return crypto
                .createHash("sha256")
                .update(String(value))
                .digest("hex");
            }

            function readText(file) {

              try {

                if (!fs.existsSync(file)) {
                  return "";
                }

                return fs.readFileSync(
                  file,
                  "utf8"
                );

              } catch (error) {

                core.warning(
                  `Could not read ${file}: ${error.message}`
                );

                return "";
              }
            }

            function writeText(file, content) {

              const temporary =
                `${file}.tmp-${process.pid}-${Date.now()}`;

              fs.writeFileSync(
                temporary,
                content,
                "utf8"
              );

              fs.renameSync(
                temporary,
                file
              );
            }

            function getHistoricalFiles() {

              return fs
                .readdirSync(trackDir)
                .filter(
                  file =>
                    /^\d{6}_.+\.txt$/i.test(file)
                )
                .sort();
            }

            function getNextSequence() {

              let highest = 0;

              for (
                const file
                of getHistoricalFiles()
              ) {

                const match =
                  /^(\d{6})_.+\.txt$/i.exec(file);

                if (!match) {
                  continue;
                }

                const number =
                  Number(match[1]);

                if (
                  Number.isFinite(number) &&
                  number > highest
                ) {
                  highest = number;
                }
              }

              return highest + 1;
            }

            function recordHistoricalEvent(
              eventName,
              data
            ) {

              const sequence =
                getNextSequence();

              const sequenceText =
                String(sequence).padStart(6, "0");

              const filename =
                `${sequenceText}_${safe(eventName)}.txt`;

              const filepath =
                path.join(
                  trackDir,
                  filename
                );

              const content =
                typeof data === "string"
                  ? data
                  : JSON.stringify(
                      data,
                      null,
                      2
                    );

              const body = [
                "OLLAMA AUTONOMOUS AGENT TRACKING EVENT",
                "=======================================",
                "",
                `Schema version: ${schemaVersion}`,
                `Sequence: ${sequenceText}`,
                `Event: ${eventName}`,
                `Timestamp UTC: ${timestamp}`,
                "",
               