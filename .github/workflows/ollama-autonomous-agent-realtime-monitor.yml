name: Ollama Autonomous Agent - PR Realtime Tracker

# ============================================================================
# OLLAMA AUTONOMOUS AGENT - PR REALTIME TRACKER
# ============================================================================
#
# PURPOSE
# -------
# Independent, durable monitoring and telemetry reconciliation for:
#
#   - Ollama PR validation workflow
#   - Ollama autonomous-agent workflow
#   - workflow runs
#   - workflow jobs
#   - job states
#   - pull requests
#   - commit/SHA/branch information
#   - check-runs
#   - commit statuses
#   - agent runtime telemetry
#   - agent iterations/tasks/tools/actions
#
# IMPORTANT:
# This workflow is OBSERVER-ONLY.
#
# It does NOT:
#   - cancel the agent
#   - restart the agent
#   - merge PRs
#   - modify agent source
#   - modify validation workflows
#   - modify unrelated source files
#
# The actual Ollama/QMOI agent should emit structured telemetry into:
#
#   ollamatracks/runtime/
#
# using JSON Lines:
#
#   {"event":"iteration_started", ...}
#   {"event":"task_started", ...}
#   {"event":"task_completed", ...}
#   {"event":"tool_started", ...}
#   {"event":"tool_completed", ...}
#   {"event":"action_started", ...}
#   {"event":"action_completed", ...}
#   {"event":"error", ...}
#
# This workflow then reconciles that telemetry with GitHub's own
# workflow/run/job/PR/check state.
#
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # Observe the validation workflow.
  # --------------------------------------------------------------------------
  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - requested
      - in_progress
      - completed

  # --------------------------------------------------------------------------
  # Periodic reconciliation.
  #
  # This is intentionally finite.
  # It is NOT an infinite daemon.
  # --------------------------------------------------------------------------
  schedule:
    - cron: "*/5 * * * *"

  # --------------------------------------------------------------------------
  # Manual inspection.
  # --------------------------------------------------------------------------
  workflow_dispatch:
    inputs:

      run_id:
        description: "Optional workflow run ID to inspect"
        required: false
        type: string
        default: ""

      force_snapshot:
        description: "Create a historical snapshot even when state is unchanged"
        required: false
        type: boolean
        default: true

      inspect_prs:
        description: "Inspect pull requests"
        required: false
        type: boolean
        default: true

      inspect_jobs:
        description: "Inspect workflow jobs"
        required: false
        type: boolean
        default: true

      inspect_checks:
        description: "Inspect commit check-runs and statuses"
        required: false
        type: boolean
        default: true

      include_runtime_telemetry:
        description: "Process agent runtime JSONL telemetry"
        required: false
        type: boolean
        default: true


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# IMPORTANT:
# GitHub Actions concurrency supports:
#
#   group
#   cancel-in-progress
#
# There is no "queue:" property.
#
# With cancel-in-progress=false, a later run waits for the existing writer.
# ============================================================================

concurrency:
  group: ollama-pr-realtime-tracker-writer
  cancel-in-progress: false


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  TRACK_DIR: ollamatracks

  RUNTIME_DIR: ollamatracks/runtime

  SNAPSHOT_DIR: ollamatracks/snapshots

  TRACK_SCHEMA_VERSION: "3.0"

  TARGET_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  MAX_RUNS_TO_INSPECT: "20"

  MAX_JOBS_PER_RUN: "100"

  MAX_CHECK_RUNS: "100"

  MAX_PR_COUNT: "50"

  MAX_RUNTIME_EVENTS_PER_RUN: "5000"


# ============================================================================
# RECONCILIATION JOB
# ============================================================================

jobs:

  reconcile:

    name: Realtime Ollama + PR Reconciliation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ======================================================================
      # INITIALIZE
      # ======================================================================

      - name: Initialize tracking directories
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"
          mkdir -p "$RUNTIME_DIR"
          mkdir -p "$SNAPSHOT_DIR"

          touch "$TRACK_DIR/TRACKING_INDEX.txt"
          touch "$TRACK_DIR/CURRENT_STATUS.txt"
          touch "$TRACK_DIR/LATEST_ACTIVITY.txt"
          touch "$TRACK_DIR/STATE.txt"
          touch "$TRACK_DIR/PR_STATUS.txt"
          touch "$TRACK_DIR/LAST_RECONCILIATION.txt"

          echo "Tracking infrastructure initialized."

      # ======================================================================
      # RECONCILE GITHUB STATE
      # ======================================================================

      - name: Reconcile GitHub workflow state
        id: reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          EVENT_NAME: ${{ github.event_name }}

          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}

          MANUAL_RUN_ID: ${{ inputs.run_id }}

          FORCE_SNAPSHOT: ${{ inputs.force_snapshot }}

          INSPECT_PRS: ${{ inputs.inspect_prs }}

          INSPECT_JOBS: ${{ inputs.inspect_jobs }}

          INSPECT_CHECKS: ${{ inputs.inspect_checks }}

          INCLUDE_RUNTIME_TELEMETRY: ${{ inputs.include_runtime_telemetry }}

        run: |
          set -Eeuo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"

          TRACK_DIR="${TRACK_DIR}"
          RUNTIME_DIR="${RUNTIME_DIR}"
          SNAPSHOT_DIR="${SNAPSHOT_DIR}"

          mkdir -p "$TRACK_DIR"
          mkdir -p "$RUNTIME_DIR"
          mkdir -p "$SNAPSHOT_DIR"

          # ------------------------------------------------------------------
          # TIMESTAMP
          # ------------------------------------------------------------------

          timestamp="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
          timestamp_file="$(date -u '+%Y%m%d_%H%M%S_%3N')"

          # ------------------------------------------------------------------
          # HELPERS
          # ------------------------------------------------------------------

          log() {
            printf '[%s] %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')" "$*"
          }

          json_escape() {
            jq -Rs '.' <<< "$1"
          }

          safe_name() {
            printf '%s' "$1" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-zA-Z0-9._-]+/-/g' |
              sed -E 's/-+/-/g' |
              sed -E 's/^-+//;s/-+$//'
          }

          next_sequence() {

            local highest

            highest="$(
              find "$TRACK_DIR" \
                -maxdepth 1 \
                -type f \
                -name '[0-9][0-9][0-9][0-9][0-9][0-9]_*.txt' \
                -printf '%f\n' 2>/dev/null |
              sed -E 's/^([0-9]{6})_.*/\1/' |
              sort -n |
              tail -1
            )"

            highest="${highest:-0}"

            if ! [[ "$highest" =~ ^[0-9]+$ ]]; then
              highest=0
            fi

            printf '%06d' "$((10#$highest + 1))"
          }

          record_event() {

            local event_name="$1"
            local body="$2"

            local seq
            local file

            seq="$(next_sequence)"

            file="$TRACK_DIR/${seq}_$(safe_name "$event_name").txt"

            cat > "$file" <<EOF
          OLLAMA AUTONOMOUS AGENT TRACKING EVENT
          ======================================

          Sequence: $seq

          Event:
          $event_name

          Timestamp UTC:
          $timestamp

          Repository:
          $OWNER/$REPO

          Tracker workflow:
          $GITHUB_WORKFLOW

          Tracker workflow run:
          $GITHUB_RUN_ID

          Tracker workflow attempt:
          $GITHUB_RUN_ATTEMPT

          GitHub event:
          $EVENT_NAME

          Commit:
          $GITHUB_SHA

          Branch:
          $GITHUB_REF_NAME

          ----------------------------------------------------------------
          EVENT DATA
          ----------------------------------------------------------------

          $body

          ----------------------------------------------------------------
          END EVENT
          ----------------------------------------------------------------
          EOF

            printf '%s\n' "$file"
          }

          # ------------------------------------------------------------------
          # DISCOVER TARGET WORKFLOW
          # ------------------------------------------------------------------

          log "Discovering target workflow..."

          workflows_json="$(
            gh api \
              --method GET \
              "repos/$OWNER/$REPO/actions/workflows?per_page=100"
          )"

          workflow_id="$(
            jq -r \
              --arg name "$TARGET_WORKFLOW_NAME" \
              '.workflows[]
               | select(.name == $name)
               | .id' \
              <<< "$workflows_json" |
            head -1
          )"

          if [ -z "$workflow_id" ] || [ "$workflow_id" = "null" ]; then

            log "Target workflow was not found."

            record_event \
              "workflow_not_found" \
              "Target workflow:
          $TARGET_WORKFLOW_NAME

          Result:
          NOT_FOUND"

            cat > "$CURRENT_STATUS" <<EOF
          OLLAMA AUTONOMOUS AGENT - CURRENT STATUS
          =========================================

          Timestamp UTC: $timestamp

          Tracker:
          $GITHUB_WORKFLOW

          Tracker run:
          $GITHUB_RUN_ID

          Target workflow:
          $TARGET_WORKFLOW_NAME

          State:
          TARGET_WORKFLOW_NOT_FOUND

          Agent state:
          UNKNOWN

          Last reconciliation:
          $timestamp
          EOF

            exit 0
          fi

          log "Target workflow ID: $workflow_id"

          # ------------------------------------------------------------------
          # DETERMINE RUN TO INSPECT
          # ------------------------------------------------------------------

          requested_run_id=""

          if [ -n "${MANUAL_RUN_ID:-}" ]; then
            requested_run_id="$MANUAL_RUN_ID"
          elif [ -n "${EVENT_RUN_ID:-}" ]; then
            requested_run_id="$