name: Ollama Autonomous Agent - PR Realtime Monitor

# ============================================================================
# OLLAMA AUTONOMOUS AGENT + PR REALTIME MONITOR
# ============================================================================
#
# PURPOSE
# -------
# Independent observation-only monitoring of:
#
#   1. Ollama Autonomous Agent workflows
#   2. Ollama PR Validation - 293+ Platform Features
#   3. Pull requests being worked on by the agent
#   4. Jobs belonging to those workflows
#   5. Individual GitHub Actions steps
#   6. PR commits
#   7. PR checks / statuses
#   8. PR reviews
#   9. PR comments
#  10. PR mergeability state
#  11. Validation progress
#  12. Failures / cancellations / timeouts
#  13. Current agent activity
#  14. Historical agent activity
#
# DATA STORAGE
# ------------
# Every monitoring pass creates:
#
#   ollamatracks/
#
# containing human-readable .txt files.
#
# The directory is uploaded as a GitHub Actions artifact.
#
# IMPORTANT:
# ----------
# The workflow intentionally DOES NOT commit ollamatracks back into the
# repository every five minutes.
#
# This prevents:
#
#   monitor -> commit -> PR change -> agent -> monitor -> commit -> ...
#
# feedback loops.
#
# The directory is nevertheless created on every monitoring pass and is
# persisted through GitHub Actions artifacts.
#
# ============================================================================
#
# REALTIME MODEL
# --------------
#
# GitHub does not provide a continuously running "monitor forever" runner.
#
# Therefore this workflow uses:
#
#   workflow_run events
#       +
#   pull_request events
#       +
#   schedule fallback every 5 minutes
#       +
#   manual workflow_dispatch
#
# This allows monitoring to continue for as long as the agent/PR remains
# active, without keeping one GitHub-hosted runner alive for days or weeks.
#
# ============================================================================
#
# SAFETY
# ------
#
# This workflow:
#
#   - DOES NOT cancel the Ollama agent
#   - DOES NOT rerun the Ollama agent
#   - DOES NOT modify agent files
#   - DOES NOT modify workflow files
#   - DOES NOT merge PRs
#   - DOES NOT push source code
#   - DOES NOT start Ollama
#   - DOES NOT stop Ollama
#   - DOES NOT execute PR code
#   - DOES NOT checkout untrusted PR code
#
# It only reads GitHub API information.
#
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # OLLAMA / VALIDATION WORKFLOW LIFECYCLE
  # --------------------------------------------------------------------------

  workflow_run:

    workflows:
      - "Ollama Autonomous Agent"
      - "Ollama PR Validation - 293+ Platform Features"

    types:
      - requested
      - in_progress
      - completed

  # --------------------------------------------------------------------------
  # DIRECT PR MONITORING
  # --------------------------------------------------------------------------

  pull_request:

    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed
      - review_requested
      - review_request_removed
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - assigned
      - unassigned

  # --------------------------------------------------------------------------
  # FALLBACK POLLING
  # --------------------------------------------------------------------------
  #
  # GitHub's shortest supported schedule interval is 5 minutes.
  #
  # This is a FALLBACK, not the primary realtime mechanism.
  #
  # --------------------------------------------------------------------------

  schedule:
    - cron: "*/5 * * * *"

  # --------------------------------------------------------------------------
  # MANUAL MONITORING
  # --------------------------------------------------------------------------

  workflow_dispatch:

    inputs:

      pr_number:
        description: "Specific PR number to monitor. Leave empty for automatic discovery."
        required: false
        type: string

      run_id:
        description: "Specific Ollama workflow run ID to monitor."
        required: false
        type: string

      lookback_runs:
        description: "Number of historical workflow runs to inspect."
        required: false
        default: "25"
        type: string

      include_history:
        description: "Collect historical agent and validation information."
        required: false
        default: true
        type: boolean

      update_pr_comment:
        description: "Update one consolidated monitoring comment on the PR."
        required: false
        default: true
        type: boolean


# ============================================================================
# MINIMUM REQUIRED PERMISSIONS
# ============================================================================

permissions:

  actions: read

  contents: read

  checks: read

  statuses: read

  pull-requests: write

  issues: write


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  AGENT_WORKFLOW_NAME: "Ollama Autonomous Agent"

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  MONITOR_VERSION: "4.0"

  TRACK_DIRECTORY: "ollamatracks"

  COMMENT_MARKER: "<!-- ollama-autonomous-agent-realtime-monitor-v4 -->"


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# The monitor itself is allowed to finish.
#
# It does NOT cancel the Ollama agent.
#
# The monitor is short-lived, so repeated scheduled monitoring does not
# require a permanently running GitHub runner.
#
# ============================================================================

concurrency:

  group: ollama-realtime-monitor-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}

  cancel-in-progress: false


# ============================================================================
# JOB 1
# ============================================================================
#
# MAIN OBSERVATION ENGINE
#
# ============================================================================

jobs:

  monitor:

    name: "🔎 Realtime Ollama + PR Monitor"

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================================
      # INITIALIZE
      # ======================================================================

      - name: Initialize monitoring environment
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p "${TRACK_DIRECTORY}"

          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat > "${TRACK_DIRECTORY}/00-monitor-start.txt" <<EOF
          ============================================================
          OLLAMA AUTONOMOUS AGENT MONITOR
          ============================================================

          Monitor version:
          ${MONITOR_VERSION}

          Repository:
          ${GITHUB_REPOSITORY}

          Monitor run:
          ${GITHUB_RUN_ID}

          Attempt:
          ${GITHUB_RUN_ATTEMPT}

          Trigger:
          ${GITHUB_EVENT_NAME}

          Started UTC:
          ${timestamp}

          Mode:
          OBSERVATION ONLY

          The monitor will not:
          - cancel Ollama
          - rerun Ollama
          - modify Ollama
          - merge PRs
          - execute PR source code
          - push repository changes

          ============================================================
          EOF

          echo "============================================================"
          echo " OLLAMA AUTONOMOUS AGENT REALTIME MONITOR"
          echo "============================================================"
          echo ""
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Monitor Run: ${GITHUB_RUN_ID}"
          echo "Trigger: ${GITHUB_EVENT_NAME}"
          echo ""
          echo "Tracking directory:"
          echo "  ${TRACK_DIRECTORY}/"
          echo ""


      # ======================================================================
      # GITHUB API COLLECTION
      # ======================================================================

      - name: Collect Ollama and PR realtime state
        id: collect
        uses: actions/github-script@v7

        continue-on-error: true

        env:

          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}

          MANUAL_RUN_ID: ${{ inputs.run_id }}

          LOOKBACK_RUNS: ${{ inputs.lookback_runs || '25' }}

          INCLUDE_HISTORY: ${{ inputs.include_history || 'true' }}

        with:

          github-token: ${{ secrets.MY_CUSTOM_TOKEN || github.token }}

          script: |

            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const trackDir = process.env.TRACK_DIRECTORY;

            const AGENT_NAME =
              process.env.AGENT_WORKFLOW_NAME;

            const VALIDATION_NAME =
              process.env.VALIDATION_WORKFLOW_NAME;

            const MANUAL_PR =
              String(
                process.env.MANUAL_PR_NUMBER || ""
              ).trim();

            const MANUAL_RUN =
              String(
                process.env.MANUAL_RUN_ID || ""
              ).trim();

            const LOOKBACK =
              Math.max(
                1,
                Math.min(
                  Number(
                    process.env.LOOKBACK_RUNS || 25
                  ),
                  100
                )
              );

            const INCLUDE_HISTORY =
              String(
                process.env.INCLUDE_HISTORY
              ).toLowerCase() !== "false";

            const now =
              new Date();

            const nowISO =
              now.toISOString();

            // ================================================================
            // HELPERS
            // ================================================================

            function safe(
              value,
              fallback = "N/A"
            ) {

              if (
                value === undefined ||
                value === null ||
                value === ""
              ) {
                return fallback;
              }

              return String(value);

            }

            function duration(
              start,
              end = null
            ) {

              if (!start) {
                return "N/A";
              }

              const s =
                new Date(start).getTime();

              const e =
                end
                  ? new Date(end).getTime()
                  : Date.now();

              if (
                !Number.isFinite(s) ||
                !Number.isFinite(e)
              ) {
                return "N/A";
              }

              let seconds =
                Math.max(
                  0,
                  Math.floor(
                    (e - s) / 1000
                  )
                );

              const days =
                Math.floor(
                  seconds / 86400
                );

              seconds %= 86400;

              const hours =
                Math.floor(
                  seconds / 3600
                );

              seconds %= 3600;

              const minutes =
                Math.floor(
                  seconds / 60
                );

              seconds %= 60;

              if (days > 0) {
                return (
                  `${days}d ` +
                  `${hours}h ` +
                  `${minutes}m ` +
                  `${seconds}s`
                );
              }

              if (hours > 0) {
                return (
                  `${hours}h ` +
                  `${minutes}m ` +
                  `${seconds}s`
                );
              }

              if (minutes > 0) {
                return (
                  `${minutes}m ` +
                  `${seconds}s`
                );
              }

              return `${seconds}s`;

            }

            function statusIcon(
              status,
              conclusion
            ) {

              if (
                status === "queued" ||
                status === "requested"
              ) {
                return "⏳";
              }

              if (
                status === "waiting" ||
                status === "pending"
              ) {
                return "⏸️";
              }

              if (
                status === "in_progress"
              ) {
                return "🔄";
              }

              if (
                conclusion === "success"
              ) {
                return "✅";
              }

              if (
                conclusion === "failure"
              ) {
                return "❌";
              }

              if (
                conclusion === "cancelled"
              ) {
                return "🛑";
              }

              if (
                conclusion === "timed_out"
              ) {
                return "⏰";
              }

              if (
                conclusion === "skipped"
              ) {
                return "⏭️";
              }

              return "ℹ️";

            }

            function clean(
              value
            ) {

              return safe(value)
                .replace(/\r?\n/g, " ")
                .replace(/\|/g, "\\|");

            }

            function writeFile(
              filename,
              content
            ) {

              fs.writeFileSync(
                `${trackDir}/${filename}`,
                content
              );

            }

            // ================================================================
            // WORKFLOW DISCOVERY
            // ================================================================

            const workflowsResponse =
              await github.rest.actions.listRepoWorkflows({
                owner,
                repo,
                per_page: 100
              });

            const workflows =
              workflowsResponse.data.workflows || [];

            let agentWorkflow =
              workflows.find(
                workflow =>
                  workflow.name === AGENT_NAME
              );

            if (!agentWorkflow) {

              agentWorkflow =
                workflows.find(
                  workflow =>
                    workflow.name
                      .toLowerCase()
                      .includes("ollama") &&
                    workflow.name
                      .toLowerCase()
                      .includes("autonomous")
                );

            }

            const validationWorkflow =
              workflows.find(
                workflow =>
                  workflow.name ===
                  VALIDATION_NAME
              );

            writeFile(
              "01-workflow-discovery.txt",

              [
                "============================================================",
                "WORKFLOW DISCOVERY",
                "============================================================",
                "",
                `Time: ${nowISO}`,
                "",
                `Agent workflow: ${
                  agentWorkflow
                    ? agentWorkflow.name
                    : "NOT FOUND"
                }`,
                `Agent workflow ID: ${
                  agentWorkflow
                    ? agentWorkflow.id
                    : "N/A"
                }`,
                `Agent workflow path: ${
                  agentWorkflow
                    ? agentWorkflow.path
                    : "N/A"
                }`,
                "",
                `Validation workflow: ${
                  validationWorkflow
                    ? validationWorkflow.name
                    : "NOT FOUND"
                }`,
                `Validation workflow ID: ${
                  validationWorkflow
                    ? validationWorkflow.id
                    : "N/A"
                }`,
                `Validation workflow path: ${
                  validationWorkflow
                    ? validationWorkflow.path
                    : "N/A"
                }`,
                "",
                `Repository workflows discovered: ${workflows.length}`,
                "",
                "============================================================"
              ].join("\n")
            );

            // ================================================================
            // WORKFLOW RUNS
            // ================================================================

            async function getRuns(
              workflow
            ) {

              if (!workflow) {
                return [];
              }

              const result = [];

              for await (
                const page
                of github.paginate.iterator(
                  github.rest.actions.listWorkflowRuns,
                  {
                    owner,
                    repo,
                    workflow_id:
                      workflow.id,
                    per_page: 100
                  }
                )
              ) {

                result.push(
                  ...page.data
                );

                if (
                  result.length >=
                  LOOKBACK
                ) {
                  break;
                }

              }

              return result
                .slice(0, LOOKBACK);

            }

            const agentRuns =
              await getRuns(
                agentWorkflow
              );

            const validationRuns =
              await getRuns(
                validationWorkflow
              );

            // ================================================================
            // SPECIFIC RUN
            // ================================================================

            let selectedRun = null;

            if (MANUAL_RUN) {

              const id =
                Number(MANUAL_RUN);

              if (
                Number.isInteger(id) &&
                id > 0
              ) {

                try {

                  const response =
                    await github.rest.actions.getWorkflowRun({
                      owner,
                      repo,
                      run_id: id
                    });

                  selectedRun =
                    response.data;

                } catch (error) {

                  writeFile(
                    "02-manual-run-error.txt",

                    [
                      "Manual run lookup failed.",
                      "",
                      `Run ID: ${MANUAL_RUN}`,
                      `Error: ${error.message}`
                    ].join("\n")
                  );

                }

              }

            }

            if (
              !selectedRun &&
              context.eventName ===
              "workflow_run"
            ) {

              selectedRun =
                context.payload.workflow_run ||
                null;

            }

            // ================================================================
            // ACTIVE RUNS
            // ================================================================

            const activeAgentRuns =
              agentRuns.filter(
                run =>
                  [
                    "requested",
                    "queued",
                    "waiting",
                    "pending",
                    "in_progress"
                  ].includes(
                    run.status
                  )
              );

            const activeValidationRuns =
              validationRuns.filter(
                run =>
                  [
                    "requested",
                    "queued",
                    "waiting",
                    "pending",
                    "in_progress"
                  ].includes(
                    run.status
                  )
              );

            // ================================================================
            // JOB ANALYSIS
            // ================================================================

            async function analyzeRun(
              run
            ) {

              const result = {

                workflow:
                  run.name,

                id:
                  run.id,

                run_number:
                  run.run_number,

                status:
                  run.status,

                conclusion:
                  run.conclusion,

                event:
                  run.event,

                branch:
                  run.head_branch,

                sha:
                  run.head_sha,

                actor:
                  run.actor?.login,

                created_at:
                  run.created_at,

                updated_at:
                  run.updated_at,

                started_at:
                  run.run_started_at,

                url:
                  run.html_url,

                duration:
                  duration(
                    run.run_started_at ||
                    run.created_at,
                    run.status ===
                    "completed"
                      ? run.updated_at
                      : null
                  ),

                jobs: [],

                metrics: {

                  total: 0,

                  completed: 0,

                  running: 0,

                  queued: 0,

                  waiting: 0,

                  passed: 0,

                  failed: 0,

                  cancelled: 0,

                  skipped: 0,

                  timed_out: 0

                }

              };

              try {

                const jobs = [];

                for await (
                  const page
                  of github.paginate.iterator(
                    github.rest.actions.listJobsForWorkflowRun,
                    {
                      owner,
                      repo,
                      run_id:
                        run.id,
                      per_page: 100
                    }
                  )
                ) {

                  jobs.push(
                    ...page.data
                  );

                }

                result.metrics.total =
                  jobs.length;

                for (
                  const job of jobs
                ) {

                  const jobData = {

                    id:
                      job.id,

                    name:
                      job.name,

                    status:
                      job.status,

                    conclusion:
                      job.conclusion,

                    started_at:
                      job.started_at,

                    completed_at:
                      job.completed_at,

                    duration:
                      duration(
                        job.started_at,
                        job.completed_at
                      ),

                    url:
                      job.html_url,

                    steps: []

                  };

                  if (
                    job.status ===
                    "completed"
                  ) {

                    result.metrics.completed++;

                    if (
                      job.conclusion ===
                      "success"
                    ) {
                      result.metrics.passed++;
                    }

                    else if (
                      job.conclusion ===
                      "failure"
                    ) {
                      result.metrics.failed++;
                    }

                    else if (
                      job.conclusion ===
                      "cancelled"
                    ) {
                      result.metrics.cancelled++;
                    }

                    else if (
                      job.conclusion ===
                      "skipped"
                    ) {
                      result.metrics.skipped++;
                    }

                    else if (
                      job.conclusion ===
                      "timed_out"
                    ) {
                      result.metrics.timed_out++;
                    }

                  }

                  else if (
                    job.status ===
                    "in_progress"
                  ) {

                    result.metrics.running++;

                  }

                  else if (
                    job.status ===
                    "queued"
                  ) {

                    result.metrics.queued++;

                  }

                  else if (
                    job.status ===
                    "waiting" ||
                    job.status ===
                    "pending"
                  ) {

                    result.metrics.waiting++;

                  }

                  // ----------------------------------------------------------
                  // INDIVIDUAL STEPS
                  // ----------------------------------------------------------

                  for (
                    const step of
                    job.steps || []
                  ) {

                    jobData.steps.push({

                      number:
                        step.number,

                      name:
                        step.name,

                      status:
                        step.status,

                      conclusion:
                        step.conclusion,

                      started_at:
                        step.started_at,

                      completed_at:
                        step.completed_at,

                      duration:
                        duration(
                          step.started_at,
                          step.completed_at
                        )

                    });

                  }

                  result.jobs.push(
                    jobData
                  );

                }

              } catch (error) {

                result.jobs_error =
                  error.message;

              }

              return result;

            }

            // ================================================================
            // ANALYZE ACTIVE RUNS
            // ================================================================

            const activeAgent = [];

            for (
              const run of
              activeAgentRuns.slice(0, 10)
            ) {

              activeAgent.push(
                await analyzeRun(run)
              );

            }

            const activeValidation = [];

            for (
              const run of
              activeValidationRuns.slice(0, 10)
            ) {

              activeValidation.push(
                await analyzeRun(run)
              );

            }

            // ================================================================
            // CURRENT AGENT ACTIVITY
            // ================================================================

            const currentAgentActivity = [];

            for (
              const analysis of
              activeAgent
            ) {

              for (
                const job of
                analysis.jobs
              ) {

                if (
                  [
                    "in_progress",
                    "queued",
                    "waiting",
                    "pending"
                  ].includes(
                    job.status
                  )
                ) {

                  currentAgentActivity.push({

                    workflow:
                      analysis.workflow,

                    run_id:
                      analysis.id,

                    run_number:
                      analysis.run_number,

                    job:
                      job.name,

                    status:
                      job.status,

                    started_at:
                      job.started_at,

                    duration:
                      duration(
                        job.started_at
                      ),

                    url:
                      job.url

                  });

                }

                for (
                  const step of
                  job.steps
                ) {

                  if (
                    step.status ===
                    "in_progress"
                  ) {

                    currentAgentActivity.push({

                      workflow:
                        analysis.workflow,

                      run_id:
                        analysis.id,

                      run_number:
                        analysis.run_number,

                      job:
                        job.name,

                      step:
                        step.name,

                      status:
                        step.status,

                      started_at:
                        step.started_at,

                      duration:
                        duration(
                          step.started_at
                        )

                    });

                  }

              }

            }

            // ================================================================
            // CURRENT VALIDATION ACTIVITY
            // ================================================================

            const currentValidationActivity = [];

            for (
              const analysis of
              activeValidation
            ) {

              for (
                const job of
                analysis.jobs
              ) {

                if (
                  [
                    "in_progress",
                    "queued",
                    "waiting",
                    "pending"
                  ].includes(
                    job.status
                  )
                ) {

                  currentValidationActivity.push({

                    workflow:
                      analysis.workflow,

                    run_id:
                      analysis.id,

                    run_number:
                      analysis.run_number,

                    job:
                      job.name,

                    status:
                      job.status,

                    started_at:
                      job.started_at,

                    duration:
                      duration(
                        job.started_at
                      ),

                    url:
                      job.url

                  });

                }

                for (
                  const step of
                  job.steps
                ) {

                  if (
                    step.status ===
                    "in_progress"
                  ) {

                    currentValidationActivity.push({

                      workflow:
                        analysis.workflow,

                      run_id:
                        analysis.id,

                      run_number:
                        analysis.run_number,

                      job:
                        job.name,

                      step:
                        step.name,

                      status:
                        step.status,

                      started_at:
                        step.started_at,

                      duration:
                        duration(
                          step.started_at
                        )

                    });

                  }

                }

              }

            }

            // ================================================================
            // PR DISCOVERY
            // ================================================================

            const discoveredPRs = [];

            function addPR(
              pr
            ) {

              if (!pr) {
                return;
              }

              const number =
                pr.number;

              if (!number) {
                return;
              }

              if (
                discoveredPRs.some(
                  existing =>
                    existing.number ===
                    number
                )
              ) {
                return;
              }

              discoveredPRs.push(pr);

            }

            // ---------------------------------------------------------------
            // PR from pull_request event
            // ---------------------------------------------------------------

            if (
              context.eventName ===
              "pull_request"
            ) {

              addPR(
                context.payload.pull_request
              );

            }

            // ---------------------------------------------------------------
            // PR from workflow_run event
            // ---------------------------------------------------------------

            if (
              context.eventName ===
              "workflow_run"
            ) {

              for (
                const pr of
                context.payload
                  .workflow_run
                  ?.pull_requests || []
              ) {

                addPR(pr);

              }

            }

            // ---------------------------------------------------------------
            // Manual PR
            // ---------------------------------------------------------------

            if (MANUAL_PR) {

              const number =
                Number(MANUAL_PR);

              if (
                Number.isInteger(number) &&
                number > 0
              ) {

                try {

                  const response =
                    await github.rest.pulls.get({

                      owner,

                      repo,

                      pull_number:
                        number

                    });

                  addPR(
                    response.data
                  );

                } catch (error) {

                  writeFile(
                    "03-pr-lookup-error.txt",

                    [
                      "PR lookup failed.",
                      "",
                      `PR: ${MANUAL_PR}`,
                      `Error: ${error.message}`
                    ].join("\n")
                  );

                }

              }

            }

            // ---------------------------------------------------------------
            // PR from active agent runs
            // ---------------------------------------------------------------

            const runsForPRLookup = [
              ...activeAgentRuns,
              ...activeValidationRuns,
              ...(selectedRun
                ? [selectedRun]
                : [])
            ];

            for (
              const run of
              runsForPRLookup
            ) {

              try {

                const response =
                  await github.rest.repos.listPullRequestsAssociatedWithCommit({

                    owner,

                    repo,

                    commit_sha:
                      run.head_sha,

                    per_page:
                      20

                  });

                for (
                  const pr of
                  response.data || []
                ) {

                  addPR(pr);

                }

              } catch (error) {

                console.log(
                  `PR lookup failed for ${run.id}: ${error.message}`
                );

              }

            }

            // ================================================================
            // DEDICATED PR STATE COLLECTION
            // ================================================================

            const prReports = [];

            for (
              const discovered of
