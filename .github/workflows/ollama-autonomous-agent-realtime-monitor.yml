name: Ollama Autonomous Agent - Continuous Monitor

# ============================================================================
# OLLAMA AUTONOMOUS AGENT CONTINUOUS MONITOR
# ============================================================================
#
# PURPOSE
# -------
# Independent, observation-only monitoring system for:
#
#   1. Ollama Autonomous Agent
#   2. Ollama PR Validation - 293+ Platform Features
#
# The monitor:
#
#   - detects agent workflow starts
#   - detects agent workflow completion
#   - detects validation completion
#   - polls active runs every 5 minutes
#   - inspects jobs
#   - inspects individual job steps
#   - records start/end timestamps
#   - records current activity
#   - records completed activity
#   - records failures
#   - records skipped/cancelled activity
#   - records branch and commit
#   - records workflow/run/job/step URLs
#   - generates a simplified human-readable dashboard
#   - generates machine-readable JSON state
#   - generates chronological event history
#   - stores monitoring snapshots as GitHub artifacts
#
# SAFETY
# ------
# This workflow NEVER:
#
#   - cancels agent workflows
#   - reruns agent workflows
#   - pushes source code
#   - modifies agent files
#   - modifies workflow files
#   - merges PRs
#   - creates agent commits
#   - starts Ollama
#   - stops Ollama
#
# It is OBSERVATION ONLY.
#
# ============================================================================
#
# IMPORTANT GITHUB DESIGN
# ----------------------
#
# workflow_run is the primary event mechanism.
#
# schedule is a fallback because scheduled workflows can be delayed.
#
# The monitor does NOT monitor itself.
#
# The monitor's own workflow name is deliberately absent from the monitored
# workflow list.
#
# This prevents an event -> monitor -> event -> monitor feedback loop.
#
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # EVENT-DRIVEN MONITORING
  # --------------------------------------------------------------------------
  #
  # These events give immediate monitoring opportunities when the monitored
  # workflow starts or completes.
  #
  # GitHub supports:
  #   requested
  #   in_progress
  #   completed
  #
  # --------------------------------------------------------------------------

  workflow_run:
    workflows:
      - "Ollama Autonomous Agent"
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - requested
      - in_progress
      - completed

  # --------------------------------------------------------------------------
  # FALLBACK POLLING
  # --------------------------------------------------------------------------
  #
  # GitHub's shortest schedule interval is 5 minutes.
  #
  # This is NOT the primary realtime mechanism.
  #
  # It exists to recover from missed/delayed event delivery and continuously
  # refresh the dashboard while the agent is running.
  #
  # --------------------------------------------------------------------------

  schedule:
    - cron: "*/5 * * * *"

  # --------------------------------------------------------------------------
  # MANUAL MONITORING
  # --------------------------------------------------------------------------

  workflow_dispatch:
    inputs:

      lookback_runs:
        description: "Number of recent runs to inspect"
        required: false
        default: "20"
        type: string

      include_steps:
        description: "Inspect individual job steps"
        required: false
        default: true
        type: boolean

      create_pr_status:
        description: "Create/update PR monitoring status"
        required: false
        default: true
        type: boolean


# ============================================================================
# PERMISSIONS
# ============================================================================
#
# Actions:
#   Read-only monitoring.
#
# Contents:
#   Read-only.
#
# Pull requests:
#   Write is required only for optional PR status reporting.
#
# No repository contents write permission is requested.
# ============================================================================

permissions:
  actions: read
  contents: read
  pull-requests: write


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# We DO NOT use cancel-in-progress here.
#
# Why?
#
# If multiple agent events arrive close together, the monitor must not cancel
# an earlier monitoring snapshot.
#
# Each monitoring pass is therefore allowed to finish.
# ============================================================================

concurrency:
  group: ollama-autonomous-agent-monitor
  cancel-in-progress: false


# ============================================================================
# GLOBAL CONFIGURATION
# ============================================================================

env:

  AGENT_WORKFLOW_NAME: "Ollama Autonomous Agent"

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  VALIDATION_WORKFLOW_FILE: "ollama-pr-validation.yml"

  DEFAULT_LOOKBACK_RUNS: "20"

  MONITOR_VERSION: "3.0"

  MONITOR_COMMENT_MARKER: "<!-- ollama-autonomous-agent-monitor-v3 -->"


# ============================================================================
# MAIN MONITOR
# ============================================================================

jobs:

  monitor:

    name: "🔎 Continuous Ollama Agent Monitor"

    runs-on: ubuntu-latest

    # ------------------------------------------------------------------------
    # Hard safety boundary.
    #
    # Monitoring should never remain stuck indefinitely.
    #
    # If GitHub's API becomes slow or unavailable, this monitoring pass exits
    # rather than consuming runner resources indefinitely.
    # ------------------------------------------------------------------------

    timeout-minutes: 15

    steps:

      # ======================================================================
      # INITIALIZE
      # ======================================================================

      - name: Initialize monitoring engine
        run: |

          echo "============================================================"
          echo " OLLAMA AUTONOMOUS AGENT MONITOR"
          echo "============================================================"
          echo ""
          echo "Monitor version: $MONITOR_VERSION"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Monitor Run ID: $GITHUB_RUN_ID"
          echo ""
          echo "Mode:"
          echo "  Observation only: YES"
          echo "  Agent modification: NO"
          echo "  Agent cancellation: NO"
          echo "  Agent rerun: NO"
          echo "  Repository modification: NO"
          echo ""
          echo "============================================================"

      # ======================================================================
      # COLLECT COMPLETE STATE
      # ======================================================================

      - name: Collect complete agent state
        id: collect
        uses: actions/github-script@v7

        continue-on-error: true

        env:

          LOOKBACK_RUNS: ${{ github.event.inputs.lookback_runs || env.DEFAULT_LOOKBACK_RUNS }}

          INCLUDE_STEPS: ${{ github.event.inputs.include_steps || 'true' }}

        with:

          github-token: ${{ secrets.MY_CUSTOM_TOKEN || github.token }}

          script: |

            const fs = require("fs");

            // =================================================================
            // CONFIGURATION
            // =================================================================

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const AGENT_NAME =
              process.env.AGENT_WORKFLOW_NAME;

            const VALIDATION_NAME =
              process.env.VALIDATION_WORKFLOW_NAME;

            const VALIDATION_FILE =
              process.env.VALIDATION_WORKFLOW_FILE;

            const LOOKBACK =
              Math.max(
                1,
                Math.min(
                  Number(process.env.LOOKBACK_RUNS || 20),
                  100
                )
              );

            const INCLUDE_STEPS =
              String(process.env.INCLUDE_STEPS)
                .toLowerCase() !== "false";

            const generatedAt =
              new Date().toISOString();

            // =================================================================
            // UTILITY FUNCTIONS
            // =================================================================

            function safe(value, fallback = "unknown") {

              if (
                value === undefined ||
                value === null ||
                value === ""
              ) {
                return fallback;
              }

              return value;
            }

            function duration(start, end = null) {

              if (!start) {
                return "unknown";
              }

              const startMs =
                new Date(start).getTime();

              const endMs =
                end
                  ? new Date(end).getTime()
                  : Date.now();

              let seconds =
                Math.max(
                  0,
                  Math.floor(
                    (endMs - startMs) / 1000
                  )
                );

              const hours =
                Math.floor(seconds / 3600);

              seconds %= 3600;

              const minutes =
                Math.floor(seconds / 60);

              seconds %= 60;

              if (hours > 0) {
                return `${hours}h ${minutes}m ${seconds}s`;
              }

              if (minutes > 0) {
                return `${minutes}m ${seconds}s`;
              }

              return `${seconds}s`;
            }

            function icon(status, conclusion) {

              if (
                status === "queued" ||
                status === "requested"
              ) {
                return "⏳";
              }

              if (status === "waiting") {
                return "⏸️";
              }

              if (status === "in_progress") {
                return "🔄";
              }

              if (conclusion === "success") {
                return "✅";
              }

              if (conclusion === "failure") {
                return "❌";
              }

              if (conclusion === "cancelled") {
                return "🛑";
              }

              if (conclusion === "skipped") {
                return "⏭️";
              }

              if (conclusion === "timed_out") {
                return "⏰";
              }

              return "ℹ️";
            }

            function markdown(value) {

              return String(
                safe(value)
              )
                .replace(/\|/g, "\\|")
                .replace(/\r?\n/g, " ");

            }

            function progress(completed, total) {

              if (!total) {
                return 0;
              }

              return Math.min(
                100,
                Math.round(
                  (completed / total) * 100
                )
              );

            }

            function bar(value) {

              const size = 20;

              const filled =
                Math.round(
                  (value / 100) * size
                );

              return (
                "█".repeat(filled) +
                "░".repeat(size - filled)
              );

            }

            // =================================================================
            // GET ALL WORKFLOWS
            // =================================================================

            console.log(
              "Discovering repository workflows..."
            );

            const workflowResponse =
              await github.rest.actions.listRepoWorkflows({
                owner,
                repo,
                per_page: 100
              });

            const workflows =
              workflowResponse.data.workflows;

            // =================================================================
            // FIND TARGET WORKFLOWS
            // =================================================================

            let agentWorkflow =
              workflows.find(
                workflow =>
                  workflow.name === AGENT_NAME
              );

            if (!agentWorkflow) {

              agentWorkflow =
                workflows.find(
                  workflow =>
                    workflow.name
                      .toLowerCase()
                      .includes("ollama") &&
                    workflow.name
                      .toLowerCase()
                      .includes("autonomous") &&
                    workflow.name
                      .toLowerCase()
                      .includes("agent")
                );

            }

            let validationWorkflow =
              workflows.find(
                workflow =>
                  workflow.name === VALIDATION_NAME
              );

            if (!validationWorkflow) {

              validationWorkflow =
                workflows.find(
                  workflow =>
                    workflow.path.endsWith(
                      VALIDATION_FILE
                    )
                );

            }

            // =================================================================
            // WORKFLOW RUN RETRIEVAL
            // =================================================================

            async function getRuns(workflow) {

              if (!workflow) {
                return [];
              }

              const response =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflow.id,
                  per_page: LOOKBACK,
                  sort: "created",
                  direction: "desc"
                });

              return response.data.workflow_runs || [];

            }

            const agentRuns =
              await getRuns(agentWorkflow);

            const validationRuns =
              await getRuns(validationWorkflow);

            // =================================================================
            // EXACT EVENT RUN
            // =================================================================

            const eventRun =
              context.eventName === "workflow_run"
                ? context.payload.workflow_run || null
                : null;

            // =================================================================
            // RUN ANALYSIS
            // =================================================================

            async function analyzeRun(run) {

              const result = {

                workflow: safe(run.name),

                run_id: run.id,

                run_number: run.run_number,

                status: safe(run.status),

                conclusion:
                  run.conclusion || null,

                branch:
                  run.head_branch || null,

                sha:
                  run.head_sha || null,

                event:
                  run.event || null,

                actor:
                  run.actor?.login || null,

                created_at:
                  run.created_at || null,

                updated_at:
                  run.updated_at || null,

                started_at:
                  run.run_started_at || null,

                completed_at:
                  run.updated_at || null,

                duration:
                  duration(
                    run.run_started_at ||
                    run.created_at,
                    run.status === "completed"
                      ? run.updated_at
                      : null
                  ),

                url:
                  run.html_url,

                jobs: [],

                statistics: {

                  total_jobs: 0,

                  queued_jobs: 0,

                  waiting_jobs: 0,

                  running_jobs: 0,

                  completed_jobs: 0,

                  successful_jobs: 0,

                  failed_jobs: 0,

                  cancelled_jobs: 0,

                  skipped_jobs: 0

                }

              };

              // ---------------------------------------------------------------
              // JOBS
              // ---------------------------------------------------------------

              try {

                const jobsResponse =
                  await github.rest.actions.listJobsForWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                    per_page: 100
                  });

                const jobs =
                  jobsResponse.data.jobs || [];

                for (const job of jobs) {

                  const jobRecord = {

                    id: job.id,

                    name: job.name,

                    status:
                      job.status,

                    conclusion:
                      job.conclusion,

                    started_at:
                      job.started_at,

                    completed_at:
                      job.completed_at,

                    duration:
                      duration(
                        job.started_at,
                        job.completed_at
                      ),

                    url:
                      job.html_url,

                    steps: []

                  };

                  result.statistics.total_jobs++;

                  if (job.status === "queued") {
                    result.statistics.queued_jobs++;
                  }

                  else if (
                    job.status === "waiting"
                  ) {
                    result.statistics.waiting_jobs++;
                  }

                  else if (
                    job.status === "in_progress"
                  ) {
                    result.statistics.running_jobs++;
                  }

                  else if (
                    job.status === "completed"
                  ) {

                    result.statistics.completed_jobs++;

                    if (
                      job.conclusion === "success"
                    ) {
                      result.statistics.successful_jobs++;
                    }

                    else if (
                      job.conclusion === "failure"
                    ) {
                      result.statistics.failed_jobs++;
                    }

                    else if (
                      job.conclusion === "cancelled"
                    ) {
                      result.statistics.cancelled_jobs++;
                    }

                    else if (
                      job.conclusion === "skipped"
                    ) {
                      result.statistics.skipped_jobs++;
                    }

                  }

                  // -------------------------------------------------------------
                  // STEPS
                  // -------------------------------------------------------------

                  if (
                    INCLUDE_STEPS &&
                    Array.isArray(job.steps)
                  ) {

                    for (const step of job.steps) {

                      jobRecord.steps.push({

                        number:
                          step.number,

                        name:
                          step.name,

       