name: Update README CLI Usage

on:
  push:
    paths:
      - scripts/qmoi-unified-push.py
      - scripts/update_readme_cli.py
      - README.md
  pull_request:
    paths:
      - scripts/qmoi-unified-push.py
      - scripts/update_readme_cli.py
      - README.md

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run CLI updater
        run: python scripts/update_readme_cli.py || true

      - name: Check for changes
        run: |
          if git diff --quiet README.md; then
            echo "README_UPDATED=false" >> $GITHUB_ENV
          else
            echo "README_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: Commit and push changes
        if: env.README_UPDATED == 'true'
        run: |
          git config user.name "qmoibot"
          git config user.email "qmoibot@users.noreply.github.com"
          git add README.md || true
          git commit -m "docs: auto-update CLI usage in README [skip ci]" || true
          git push || true

permissions:
  contents: write
  pull-requests: read
  issues: read

env:
  NODE_VERSION: "18"
  QMOI_AUTOprod_ENABLED: "true"
