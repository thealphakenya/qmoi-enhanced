name: Placeholder Apply

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Branch to push apply changes to (default: current branch)'
        required: false
        default: ''

jobs:
  apply-placeholders:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run placeholder apply
        run: |
          # Force apply replacements and create backups
          node scripts/qmoi_placeholder_checker.js --scan --apply --force || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply placeholders via workflow" || echo "No changes to commit"
          # Push to target branch or current
          if [ -n "${{ github.event.inputs.target-branch }}" ]; then
            git push origin HEAD:${{ github.event.inputs.target-branch }};
          else
            git push;
          fi

      - name: Comment on issue/PR (if any)
        if: github.event.pull_request != null
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ Placeholder apply run completed by @${{ github.actor }}

