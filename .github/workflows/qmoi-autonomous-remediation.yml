name: QMOI Autonomous Remediation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_major:
        description: "Allow package-manager major upgrades"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: qmoi-remediation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic remediation and validation
        env:
          ALLOW_MAJOR: ${{ inputs.allow_major == true || github.event_name == 'schedule' }}
        run: |
          set -Eeuo pipefail
          args=(--apply)
          if [[ "$ALLOW_MAJOR" == "true" ]]; then args+=(--allow-major); fi
          python scripts/qmoi_autonomous_remediator.py "${args[@]}" --report ollamatracks/autonomous_remediation.json
          python -m compileall -q scripts tests
          pytest -q
      - name: Commit validated repairs
        run: |
          set -Eeuo pipefail
          git config user.name "qmoi-autonomous-remediator[bot]"
          git config user.email "qmoi-autonomous-remediator[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated remediation changes"
            exit 0
          fi
          git commit -m "chore: autonomous vulnerability remediation"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"