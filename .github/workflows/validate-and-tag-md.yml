name: Validate and Tag Markdown

on:
  push:
    branches: [ main, autosync-backup-20250926-232440 ]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  validate-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Generate md index
        run: python3 scripts/generate_test_index.py --out docs/test_index.json || true
      - name: Run link and fix scan (dry-run)
        run: python3 scripts/validate_and_fix_md.py --out docs/link_report.json
      - name: Upload link report
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: docs/link_report.json
