name: Ollama Autonomous Agent Trigger & Live Tracker

# ============================================================================
# QMOI / OLLAMA AUTONOMOUS AGENT
# ============================================================================
#
# PURPOSE
# -------
# Trusted orchestration, validation, autonomous execution, recovery,
# telemetry, repository integrity, and self-healing layer for QMOI/Ollama.
#
# DESIGN PRINCIPLES
# -----------------
# 1. Never execute untrusted PR-head code.
# 2. Always validate repository/Git state before mutation.
# 3. Repair only deterministic/mechanical failures automatically.
# 4. Retry transient failures with bounded exponential backoff.
# 5. Validate after every major mutation.
# 6. Preserve diagnostics even when the workflow fails.
# 7. Never allow autonomous recovery to become an infinite loop.
# 8. Prefer rollback/evidence preservation over destructive guessing.
# 9. Keep human intervention as the final boundary for ambiguous failures.
#
# ============================================================================


# ============================================================================
# EVENTS
# ============================================================================

on:

  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - completed

  workflow_dispatch:

    inputs:

      mode:
        description: "Agent execution mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - validate
          - sync
          - monitor
          - heal

      auto_heal:
        description: "Enable bounded automatic recovery"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      auto_fix:
        description: "Enable safe mechanical repository/workflow fixes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      force_agent:
        description: "Allow autonomous agent execution"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      max_iterations:
        description: "Maximum autonomous-agent iterations"
        required: true
        default: "200"
        type: string

      max_per_iteration:
        description: "Maximum tasks per agent iteration"
        required: true
        default: "200"
        type: string

      max_recovery_attempts:
        description: "Maximum bounded recovery attempts"
        required: true
        default: "3"
        type: string

      reason:
        description: "Reason for manual execution"
        required: false
        default: "Manual autonomous-agent execution"
        type: string

  schedule:
    - cron: "0 */6 * * *"


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  contents: write
  actions: read
  pull-requests: read
  checks: read
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# One active repository writer.
# Up to 100 pending executions are allowed by GitHub's queue:max behavior.
# ============================================================================

concurrency:
  group: ollama-autonomous-agent-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  TRACK_DIR: ollamatracks

  TRACK_SCHEMA_VERSION: "6.0"

  TRACKING_PROTOCOL: "ollamatracks-v6"

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  AGENT_SCRIPT: "scripts/ollama_autonomous_agent.py"

  PYTHON_VERSION: "3.12"

  DEFAULT_MAX_ITERATIONS: "200"

  DEFAULT_MAX_PER_ITERATION: "200"

  DEFAULT_MAX_RECOVERY_ATTEMPTS: "3"

  QMOI_AUTO_HEAL: ${{ github.event.inputs.auto_heal || 'true' }}

  QMOI_AUTO_FIX: ${{ github.event.inputs.auto_fix || 'true' }}

  QMOI_AGENT_MODE: ${{ github.event.inputs.mode || 'full' }}

  QMOI_FORCE_AGENT: ${{ github.event.inputs.force_agent || 'false' }}

  QMOI_RETRY_ATTEMPTS: "5"

  QMOI_RETRY_DELAY: "10"

  QMOI_TIMEOUT_SECONDS: "300"

  OLLAMA_HOST: "http://127.0.0.1:11434"

  OLLAMA_MODEL: "qwen2.5-coder:3b"

  REASON: ${{ github.event.inputs.reason || 'Scheduled/workflow-triggered execution' }}


# ============================================================================
# JOBS
# ============================================================================

jobs:

  # ==========================================================================
  # MAIN TRUSTED AGENT
  # ==========================================================================

  ollama-agent:

    name: Ollama Autonomous Agent + Self-Healing Tracker

    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ======================================================================
      # 1. TRUSTED CHECKOUT
      # ======================================================================

      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: true
          ref: ${{ github.event.repository.default_branch }}

      # ======================================================================
      # 2. RUNNER PREFLIGHT
      # ======================================================================

      - name: Runner and environment preflight
        id: runner_preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "RUNNER PREFLIGHT"
          echo "============================================================"

          echo "Runner:"
          uname -a

          echo
          echo "Disk:"
          df -h

          echo
          echo "Memory:"
          free -h || true

          echo
          echo "Python:"
          python3 --version || true

          echo
          echo "Git:"
          git --version

          echo
          echo "Workspace:"
          pwd

          test -d "$GITHUB_WORKSPACE"

      # ======================================================================
      # 3. PYTHON
      # ======================================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      # ======================================================================
      # 4. INITIALIZE TRACKING
      # ======================================================================

      - name: Initialize durable tracking
        id: initialize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VALIDATION_STATUS: ${{ github.event.workflow_run.status }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VALIDATION_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          agent_run_id="agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          touch \
            "$TRACK_DIR/telemetry.jsonl" \
            "$TRACK_DIR/CURRENT_STATUS.txt" \
            "$TRACK_DIR/LATEST_ACTIVITY.txt" \
            "$TRACK_DIR/STATE.txt" \
            "$TRACK_DIR/PR_STATUS.txt" \
            "$TRACK_DIR/LAST_RECONCILIATION.txt" \
            "$TRACK_DIR/LAST_TEST_RESULT.txt" \
            "$TRACK_DIR/REPAIR_LOG.txt"

          cat > "$TRACK_DIR/TRACKING_PROTOCOL.txt" <<EOF
          OLLAMA AUTONOMOUS TRACKING PROTOCOL

          Protocol:
          $TRACKING_PROTOCOL

          Schema:
          $TRACK_SCHEMA_VERSION

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Agent:
          $AGENT_SCRIPT

          Security:
          Trusted default branch only.

          Recovery:
          Bounded deterministic/mechanical recovery.

          Final boundary:
          Human intervention for ambiguous or unsafe failures.
          EOF

          cat > "$TRACK_DIR/TRACKING_MANIFEST.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT TRACKING MANIFEST

          TRACKING_PROTOCOL.txt
          TRACKING_MANIFEST.txt
          TRACKING_INDEX.txt
          CURRENT_STATUS.txt
          LATEST_ACTIVITY.txt
          STATE.txt
          PR_STATUS.txt
          LAST_RECONCILIATION.txt
          LAST_TEST_RESULT.txt
          REPAIR_LOG.txt
          telemetry.jsonl
          monitoring_summary.json
          EOF

          cat > "$TRACK_DIR/TRACKING_INDEX.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT TRACKING INDEX

          Protocol: $TRACKING_PROTOCOL
          Schema: $TRACK_SCHEMA_VERSION
          Repository: $GITHUB_REPOSITORY
          Workflow: $GITHUB_WORKFLOW
          Run: $GITHUB_RUN_ID
          Attempt: $GITHUB_RUN_ATTEMPT
          Agent run: $agent_run_id
          Initialized: $now
          EOF

          cat > "$TRACK_DIR/CURRENT_STATUS.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT

          State: INITIALIZING
          Status: RUNNING

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Run:
          $GITHUB_RUN_ID

          Attempt:
          $GITHUB_RUN_ATTEMPT

          Event:
          $EVENT_NAME

          Validation:
          ${VALIDATION_CONCLUSION:-unknown}

          Agent run:
          $agent_run_id
          EOF

          cat > "$TRACK_DIR/STATE.txt" <<EOF
          protocol=$TRACKING_PROTOCOL
          schema=$TRACK_SCHEMA_VERSION
          repository=$GITHUB_REPOSITORY
          workflow=$GITHUB_WORKFLOW
          workflow_run_id=$GITHUB_RUN_ID
          workflow_attempt=$GITHUB_RUN_ATTEMPT
          event=$EVENT_NAME
          agent_run_id=$agent_run_id
          state=INITIALIZING
          status=running
          timestamp_utc=$now
          EOF

          cat > "$TRACK_DIR/LATEST_ACTIVITY.txt" <<EOF
          Timestamp UTC: $now
          Event: TRACKER_INITIALIZED
          Status: SUCCESS
          Agent: $agent_run_id
          EOF

          cat > "$TRACK_DIR/PR_STATUS.txt" <<EOF
          Workflow: $GITHUB_WORKFLOW
          Run: $GITHUB_RUN_ID
          Validation: ${VALIDATION_CONCLUSION:-unknown}
          Last update: $now
          EOF

          cat > "$TRACK_DIR/LAST_RECONCILIATION.txt" <<EOF
          $now | INITIALIZATION | SUCCESS | Durable tracking initialized
          EOF

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.path.join(
              os.environ["TRACK_DIR"],
              "telemetry.jsonl",
          )

          event = {
              "event_id": (
                  f"tracker-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}-initialized"
              ),
              "event_type": "STATE",
              "event": "TRACKER_INITIALIZED",
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "actor": os.environ["GITHUB_ACTOR"],
              "status": "SUCCESS",
          }

          with open(path, "a", encoding="utf-8") as f:
              f.write(json.dumps(event, separators=(",", ":")) + "\n")
          PY

          echo "agent_run_id=$agent_run_id" >> "$GITHUB_OUTPUT"
          echo "timestamp_utc=$now" >> "$GITHUB_OUTPUT"

      # ======================================================================
      # 5. GIT FORENSIC / SELF-HEALING
      # ======================================================================

      - name: Repair and validate Git repository
        id: git_recovery_initial
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "GIT INTEGRITY / SELF-HEALING"
          echo "============================================================"

          mkdir -p "$TRACK_DIR"

          repair_log="$TRACK_DIR/REPAIR_LOG.txt"

          git_root="$(git rev-parse --show-toplevel)"
          cd "$git_root"

          echo "Git root: $git_root"

          # ---------------------------------------------------------------
          # Recover interrupted merge/rebase/cherry-pick states.
          # Only remove these states when no active operation is expected
          # from this workflow.
          # ---------------------------------------------------------------

          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "::warning::Stale Git rebase state detected."
            git rebase --abort 2>/dev/null || true
          fi

          if [ -f .git/MERGE_HEAD ]; then
            echo "::warning::Stale Git merge state detected."
            git merge --abort 2>/dev/null || true
          fi

          if [ -f .git/CHERRY_PICK_HEAD ]; then
            echo "::warning::Stale cherry-pick state detected."
            git cherry-pick --abort 2>/dev/null || true
          fi

          # ---------------------------------------------------------------
          # Remove only stale Git lock files.
          # ---------------------------------------------------------------

          find .git \
            -type f \
            \( \
              -name '*.lock' \
              -o \
              -name 'index.lock' \
            \) \
            -print 2>/dev/null |
          while IFS= read -r lock; do
            echo "::warning::Removing stale Git lock: $lock"
            rm -f "$lock"
          done

          # ---------------------------------------------------------------
          # The critical recovery for:
          #
          # error: bad signature ...
          # fatal: index file corrupt
          #
          # The index is disposable; HEAD/tree objects are authoritative.
          # ---------------------------------------------------------------

          if ! git status --porcelain=v1 >/dev/null 2>&1; then

            echo "::warning::Git index is corrupted or unreadable."

            {
              echo "$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ') | GIT_INDEX_REPAIR"
              echo "Git status failed; rebuilding .git/index."
            } >> "$repair_log"

            rm -f .git/index

            git reset --mixed HEAD

            if ! git status --porcelain=v1 >/dev/null 2>&1; then
              echo "::error::Git index could not be rebuilt."
              exit 1
            fi

            echo "Git index successfully rebuilt."

          else
            echo "Git index is readable."
          fi

          # ---------------------------------------------------------------
          # Core Git validation.
          # ---------------------------------------------------------------

          git rev-parse --verify HEAD
          git rev-parse --verify HEAD^{commit}
          git rev-parse --show-toplevel

          git diff --quiet --ignore-submodules -- || true
          git diff --cached --quiet --ignore-submodules -- || true

          # fsck can report dangling/unreachable historical objects without
          # meaning the repository is unusable. Fatal object corruption is
          # treated as failure.
          fsck_log="$TRACK_DIR/git_fsck.txt"

          if ! git fsck --no-progress >"$fsck_log" 2>&1; then
            if grep -Eiq \
              'corrupt|fatal|bad object|missing blob|missing tree|missing commit' \
              "$fsck_log"; then

              echo "::error::Git object database integrity failure."
              cat "$fsck_log"
              exit 1
            fi
          fi

          git status --short

          git config --local user.name \
            "github-actions[bot]"

          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git integrity preflight passed."

      # ======================================================================
      # 6. INSTALL RECOVERY TOOLING
      # ======================================================================

      - name: Install validation and recovery tooling
        id: tooling
        shell: bash
        run: |
          set -Eeuo pipefail

          retry() {
            local attempts="$1"
            local delay="$2"
            shift 2

            local n=1

            while true; do
              if "$@"; then
                return 0
              fi

              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi

              echo "::warning::Command failed; retry $((n + 1))/$attempts in ${delay}s."
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry 5 5 \
            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel

          retry 5 5 \
            python -m pip install \
              pytest \
              PyYAML

          if [ -f requirements.txt ]; then
            retry 5 5 \
              python -m pip install -r requirements.txt
          fi

          python --version
          python -m pip --version

      # ======================================================================
      # 7. SAFE WORKFLOW REPAIRS
      # ======================================================================

      - name: Scan and safely repair deprecated GitHub Actions
        id: action_repair
        if: env.QMOI_AUTO_FIX == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          repair_log="$TRACK_DIR/REPAIR_LOG.txt"

          changed=0

          if [ ! -d .github/workflows ]; then
            echo "::error::.github/workflows does not exist."
            exit 1
          fi

          mapfile -t workflows < <(
            find .github/workflows \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print |
            sort
          )

          for file in "${workflows[@]}"; do

            [ -f "$file" ] || continue

            before="$(sha256sum "$file" | awk '{print $1}')"

            sed -i -E \
              's#actions/upload-artifact@v(1|2|3|4|5)\b#actions/upload-artifact@v6#g' \
              "$file"

            sed -i -E \
              's#actions/download-artifact@v(1|2|3|4|5|6)\b#actions/download-artifact@v7#g' \
              "$file"

            after="$(sha256sum "$file" | awk '{print $1}')"

            if [ "$before" != "$after" ]; then

              changed=1

              {
                echo
                echo "REPAIRED: $file"
                echo "Reason: deprecated artifact action."
                echo "upload-artifact -> v6"
                echo "download-artifact -> v7"
                echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
              } >> "$repair_log"

            fi

          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # ======================================================================
      # 8. STRICT WORKFLOW YAML VALIDATION
      # ======================================================================

      - name: Strictly validate all GitHub workflow YAML
        id: yaml_validation
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import yaml


          class UniqueLoader(yaml.SafeLoader):
              pass


          def construct_mapping(loader, node, deep=False):
              mapping = {}

              for key_node, value_node in node.value:

                  key = loader.construct_object(
                      key_node,
                      deep=deep,
                  )

                  if key in mapping:
                      raise ValueError(
                          f"Duplicate YAML key detected: {key!r}"
                      )

                  mapping[key] = loader.construct_object(
                      value_node,
                      deep=deep,
                  )

              return mapping


          UniqueLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )


          root = Path(".github/workflows")

          if not root.exists():
              raise SystemExit(
                  ".github/workflows does not exist."
              )


          files = sorted(
              list(root.glob("*.yml"))
              + list(root.glob("*.yaml"))
          )


          if not files:
              raise SystemExit(
                  "No workflow files found."
              )


          failures = []


          for path in files:

              try:

                  text = path.read_text(
                      encoding="utf-8"
                  )

                  data = yaml.load(
                      text,
                      Loader=UniqueLoader,
                  )

                  if not isinstance(data, dict):
                      raise ValueError(
                          "Root must be a mapping."
                      )

                  on_value = data.get("on")

                  if on_value is None:
                      on_value = data.get(True)

                  if on_value is None:
                      raise ValueError(
                          "Missing top-level 'on'."
                      )

                  if "jobs" not in data:
                      raise ValueError(
                          "Missing top-level 'jobs'."
                      )

                  if not isinstance(
                      data["jobs"],
                      dict,
                  ):
                      raise ValueError(
                          "'jobs' must be a mapping."
                      )

                  print(f"VALID: {path}")

              except Exception as exc:

                  failures.append(
                      f"{path}: {exc}"
                  )


          if failures:

              print("\n".join(failures))

              raise SystemExit(
                  "Workflow YAML validation failed."
              )

          print(
              f"Validated {len(files)} workflow files."
          )
          PY

      # ======================================================================
      # 9. VERIFY ARTIFACT ACTIONS
      # ======================================================================

      - name: Verify artifact actions
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -RInE \
            'actions/upload-artifact@v([1-5])\b' \
            .github/workflows; then

            echo "::error::Deprecated upload-artifact reference remains."
            exit 1

          fi

          if grep -RInE \
            'actions/download-artifact@v([1-6])\b' \
            .github/workflows; then

            echo "::error::Deprecated download-artifact reference remains."
            exit 1

          fi

          echo "Artifact action validation passed."

      # ======================================================================
      # 10. WORKFLOW STRUCTURAL HAZARD SCAN
      # ======================================================================

      - name: Detect workflow structural hazards
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import re


          root = Path(".github/workflows")

          forbidden = [
              (
                  r"actions/upload-artifact@v[1-5]\b",
                  "Deprecated upload-artifact",
              ),
              (
                  r"actions/download-artifact@v[1-6]\b",
                  "Deprecated download-artifact",
              ),
          ]


          failures = []


          for path in sorted(
              list(root.glob("*.yml"))
              + list(root.glob("*.yaml"))
          ):

              text = path.read_text(
                  encoding="utf-8"
              )

              for pattern, description in forbidden:

                  if re.search(
                      pattern,
                      text,
                  ):

                      failures.append(
                          f"{path}: {description}"
                      )


          if failures:

              print("\n".join(failures))

              raise SystemExit(
                  "Workflow hazard scan failed."
              )


          print("Workflow hazard scan passed.")
          PY

      # ======================================================================
      # 11. VALIDATE PYTHON SOURCE
      # ======================================================================

      - name: Validate Python source syntax
        id: python_syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$AGENT_SCRIPT"

          python -m compileall -q scripts

          if [ -d tests ]; then
            python -m compileall -q tests
          fi

          echo "Python syntax validation passed."

      # ======================================================================
      # 12. VERIFY AGENT CLI
      # ======================================================================

      - name: Verify autonomous agent CLI
        id: agent_cli
        shell: bash
        run: |
          set -Eeuo pipefail

          help_output="$(
            python "$AGENT_SCRIPT" --help 2>&1
          )"

          echo "$help_output"

          supported=0

          for command in \
            validate-all \
            validate-all-platforms \
            validate-all-features \
            auto-heal \
            project-stats; do

            if echo "$help_output" | grep -Fq "$command"; then
              echo "Supported command: $command"
              supported=1
            fi

          done

          if [ "$supported" -eq 0 ]; then
            echo "::error::No supported autonomous-agent command found."
            exit 1
          fi

      # ======================================================================
      # 13. OLLAMA PREFLIGHT
      # ======================================================================

      - name: Ollama preflight and recovery
        id: ollama_preflight
        if: steps.execution_mode.outputs.run_agent == 'true' || env.QMOI_FORCE_AGENT == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "OLLAMA PREFLIGHT"
          echo "============================================================"

          ollama_available="false"

          if command -v ollama >/dev/null 2>&1; then
            ollama_available="true"
          fi

          if [ "$ollama_available" != "true" ]; then
            echo "::warning::Ollama binary is not installed."
            echo "The agent may provide its own Ollama startup/install logic."
            exit 0
          fi

          ollama version || true

          if curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            "$OLLAMA_HOST/api/tags" \
            >/tmp/ollama-tags.json; then

            echo "Ollama service is reachable."

          else

            echo "::warning::Ollama service is not reachable."

            if command -v ollama >/dev/null 2>&1; then

              nohup ollama serve \
                >"$RUNNER_TEMP/ollama.log" \
                2>&1 &

              for attempt in $(seq 1 30); do

                if curl \
                  --fail \
                  --silent \
                  --max-time 5 \
                  "$OLLAMA_HOST/api/tags" \
                  >/tmp/ollama-tags.json; then

                  echo "Ollama service recovered."
                  break
                fi

                sleep 2

              done

            fi

          fi

          if curl \
            --fail \
            --silent \
            --max-time 10 \
            "$OLLAMA_HOST/api/tags" \
            >/tmp/ollama-tags.json; then

            if grep -Fq "\"$OLLAMA_MODEL\"" /tmp/ollama-tags.json; then
              echo "Configured Ollama model is available."
            else
              echo "::warning::Configured model '$OLLAMA_MODEL' is not installed."
              echo "Agent-specific model management will be allowed to handle it."
            fi

          else
            echo "::warning::Ollama API remains unavailable."
          fi

      # ======================================================================
      # 14. TEST SUITE
      # ======================================================================

      - name: Execute repository test suite
        id: tests
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail

          if [ -f tests/test_ollama_autonomous_agent.py ]; then

            python -m pytest \
              tests/test_ollama_autonomous_agent.py \
              -v \
              --tb=short

          elif [ -d tests ]; then

            python -m pytest \
              tests \
              -v \
              --tb=short

          else

            echo "No tests directory found."
          fi

      # ======================================================================
      # 15. TEST FAILURE DIAGNOSTICS
      # ======================================================================

      - name: Diagnose test failure
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "AUTOMATIC TEST FAILURE DIAGNOSTICS"
            echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
            echo
            echo "Python:"
            python --version || true
            echo
            echo "Pip:"
            python -m pip --version || true
            echo
            echo "Git:"
            git --version || true
            echo
            echo "Git status:"
            git status --short || true
            echo
            echo "Git diff:"
            git diff --stat || true
          } > "$TRACK_DIR/test_failure_diagnostics.txt"

          python -m pip freeze \
            >> "$TRACK_DIR/test_failure_diagnostics.txt" \
            2>&1 || true

      # ======================================================================
      # 16. DEPENDENCY RECOVERY
      # ======================================================================

      - name: Attempt bounded dependency recovery
        if: steps.tests.outcome == 'failure' && env.QMOI_AUTO_HEAL == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            pytest \
            PyYAML

          if [ -f requirements.txt ]; then
            python -m pip install --upgrade -r requirements.txt
          fi

      # ======================================================================
      # 17. TEST RETRY
      # ======================================================================

      - name: Retry repository tests after recovery
        id: tests_retry
        if: steps.tests.outcome == 'failure' && env.QMOI_AUTO_HEAL == 'true'
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail

          if [ -f tests/test_ollama_autonomous_agent.py ]; then

            python -m pytest \
              tests/test_ollama_autonomous_agent.py \
              -v \
              --tb=short

          elif [ -d tests ]; then

            python -m pytest \
              tests \
              -v \
              --tb=short

          else

            echo "No tests found."
          fi

      # ======================================================================
      # 18. DETERMINE EXECUTION MODE
      # ======================================================================

      - name: Determine agent execution mode
        id: execution_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FORCE_AGENT: ${{ github.event.inputs.force_agent || 'false' }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'monitor' }}
        run: |
          set -Eeuo pipefail

          run_agent="false"
          command="monitor"
          reason="Monitoring/reconciliation."

          case "$EVENT_NAME" in

            workflow_run)

              # -------------------------------------------------------------
              # Critical safety condition:
              #
              # Only execute the autonomous agent after a successful
              # validation of the trusted default branch.
              #
              # A PR validation completion must not cause this workflow to
              # execute arbitrary PR-head changes.
              # -------------------------------------------------------------

              if [ \
                "$VALIDATION_CONCLUSION" = "success" ] &&
                [ "$WORKFLOW_RUN_HEAD_BRANCH" = "$DEFAULT_BRANCH" ]; then

                run_agent="true"
                command="validate-all"
                reason="Trusted default-branch validation succeeded."

              else

                run_agent="false"
                command="monitor"

                reason="Validation was not a successful trusted-default-branch run."

              fi

              ;;

            workflow_dispatch)

              if [ "$FORCE_AGENT" = "true" ]; then

                case "$REQUESTED_MODE" in

                  full|validate)
                    run_agent="true"
                    command="validate-all"
                    reason="Manual autonomous execution."
                    ;;

                  heal)
                    run_agent="true"
                    command="auto-heal"
                    reason="Manual autonomous healing."
                    ;;

                  sync|monitor)
                    run_agent="false"
                    command="monitor"
                    reason="Manual monitoring/synchronization."
                    ;;

                  *)
                    run_agent="false"
                    command="monitor"
                    reason="Unknown mode; safe fallback."
                    ;;

                esac

              fi

              ;;

            schedule)

              run_agent="false"
              command="monitor"
              reason="Scheduled reconciliation."

              ;;

            *)

              run_agent="false"
              command="monitor"
              reason="Unknown trigger; safe fallback."

              ;;

          esac

          echo "run_agent=$run_agent" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          echo "run_agent=$run_agent"
          echo "command=$command"
          echo "reason=$reason"

      # ======================================================================
      # 19. RECORD TEST STATUS
      # ======================================================================

      - name: Record test status
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TEST_RETRY_OUTCOME: ${{ steps.tests_retry.outcome }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          cat > "$TRACK_DIR/LAST_TEST_RESULT.txt" <<EOF
          Timestamp UTC:
          $now

          Initial test:
          ${TEST_OUTCOME:-unknown}

          Recovery test:
          ${TEST_RETRY_OUTCOME:-not-run}
          EOF

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.path.join(
              os.environ["TRACK_DIR"],
              "telemetry.jsonl",
          )

          event = {
              "event_id": (
                  f"tests-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "event_type": "TEST",
              "event": "TEST_SUITE_COMPLETED",
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
              "status": os.environ.get(
                  "TEST_OUTCOME",
                  "unknown",
              ),
              "retry_status": os.environ.get(
                  "TEST_RETRY_OUTCOME",
                  "not-run",
              ),
          }

          with open(path, "a", encoding="utf-8") as f:
              f.write(json.dumps(event, separators=(",", ":")) + "\n")
          PY

      # ======================================================================
      # 20. CREATE PRE-AGENT CHECKPOINT
      # ======================================================================

      - name: Create pre-agent repository checkpoint
        id: pre_agent_checkpoint
        if: steps.execution_mode.outputs.run_agent == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          git status --short \
            > "$TRACK_DIR/pre_agent_status.txt"

          git diff \
            > "$TRACK_DIR/pre_agent_diff.patch" || true

          git rev-parse HEAD \
            > "$TRACK_DIR/pre_agent_head.txt"

          git ls-files -s \
            > "$TRACK_DIR/pre_agent_index.txt"

          echo "Pre-agent checkpoint created."

      # ======================================================================
      # 21. ACTIVE AUTONOMOUS AGENT
      # ======================================================================

      - name: Execute autonomous agent
        id: agent_execution
        if: steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        timeout-minutes: 300
        shell: bash
        env:
          MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || env.DEFAULT_MAX_ITERATIONS }}
          MAX_PER_ITERATION: ${{ github.event.inputs.max_per_iteration || env.DEFAULT_MAX_PER_ITERATION }}
          QMOI_MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || env.DEFAULT_MAX_ITERATIONS }}
          QMOI_MAX_PER_ITERATION: ${{ github.event.inputs.max_per_iteration || env.DEFAULT_MAX_PER_ITERATION }}
        run: |
          set -Eeuo pipefail

          command="${{ steps.execution_mode.outputs.command }}"

          echo "============================================================"
          echo "OLLAMA AUTONOMOUS AGENT"
          echo "============================================================"

          echo "Command: $command"
          echo "Max iterations: $MAX_ITERATIONS"
          echo "Max tasks/iteration: $MAX_PER_ITERATION"

          case "$command" in

            validate-all)
              python "$AGENT_SCRIPT" validate-all
              ;;

            validate-all-platforms)
              python "$AGENT_SCRIPT" validate-all-platforms
              ;;

            validate-all-features)
              python "$AGENT_SCRIPT" validate-all-features
              ;;

            auto-heal)
              python "$AGENT_SCRIPT" auto-heal
              ;;

            project-stats)
              python "$AGENT_SCRIPT" project-stats
              ;;

            *)
              echo "::error::Unsupported agent command: $command"
              exit 2
              ;;

          esac

      # ======================================================================
      # 22. POST-AGENT GIT REPAIR
      # ======================================================================

      - name: Repair Git repository after autonomous agent
        id: git_recovery_post_agent
        if: always() && steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "POST-AGENT GIT RECOVERY"
          echo "============================================================"

          repair_log="$TRACK_DIR/REPAIR_LOG.txt"

          # Remove stale locks created by interrupted Git operations.
          find .git \
            -type f \
            \( -name '*.lock' -o -name 'index.lock' \) \
            -print 2>/dev/null |
          while IFS= read -r lock; do
            echo "::warning::Removing stale lock: $lock"
            rm -f "$lock"
          done

          # Recover corrupted index.
          if ! git status --porcelain=v1 >/dev/null 2>&1; then

            echo "::warning::Post-agent Git index is corrupted."

            {
              echo "$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ') | POST_AGENT_INDEX_REPAIR"
              echo "Git index rebuilt after autonomous-agent execution."
            } >> "$repair_log"

            rm -f .git/index
            git reset --mixed HEAD

          fi

          git rev-parse --verify HEAD
          git status --short

          git diff --stat || true

          echo "Post-agent Git recovery completed."

      # ======================================================================
      # 23. BOUNDED AGENT RECOVERY
      # ======================================================================

      - name: Attempt bounded autonomous agent recovery
        id: agent_recovery
        if: steps.agent_execution.outcome == 'failure' && env.QMOI_AUTO_HEAL == 'true'
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail

          recovery_log="$TRACK_DIR/agent_recovery.log"

          {
            echo "AUTONOMOUS AGENT RECOVERY"
            echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
            echo
          } > "$recovery_log"

          # ---------------------------------------------------------------
          # First repair Git state.
          # ---------------------------------------------------------------

          find .git \
            -type f \
            \( -name '*.lock' -o -name 'index.lock' \) \
            -delete 2>/dev/null || true

          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            rm -f .git/index
            git reset --mixed HEAD
          fi

          # ---------------------------------------------------------------
          # Refresh dependencies.
          # ---------------------------------------------------------------

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            pytest \
            PyYAML \
            >> "$recovery_log" 2>&1 || true

          if [ -f requirements.txt ]; then
            python -m pip install --upgrade \
              -r requirements.txt \
              >> "$recovery_log" 2>&1 || true
          fi

          # ---------------------------------------------------------------
          # Recompile.
          # ---------------------------------------------------------------

          python -m compileall \
            -q \
            scripts \
            >> "$recovery_log" 2>&1 || true

          # ---------------------------------------------------------------
          # Retry exactly once.
          # ---------------------------------------------------------------

          command="${{ steps.execution_mode.outputs.command }}"

          case "$command" in

            validate-all)
              python "$AGENT_SCRIPT" validate-all \
                >> "$recovery_log" 2>&1
              ;;

            auto-heal)
              python "$AGENT_SCRIPT" auto-heal \
                >> "$recovery_log" 2>&1
              ;;

            validate-all-platforms)
              python "$AGENT_SCRIPT" validate-all-platforms \
                >> "$recovery_log" 2>&1
              ;;

            validate-all-features)
              python "$AGENT_SCRIPT" validate-all-features \
                >> "$recovery_log" 2>&1
              ;;

            project-stats)
              python "$AGENT_SCRIPT" project-stats \
                >> "$recovery_log" 2>&1
              ;;

            *)
              echo "No safe recovery command available." \
                >> "$recovery_log"
              exit 2
              ;;

          esac

      # ======================================================================
      # 24. POST-AGENT SOURCE VALIDATION
      # ======================================================================

      - name: Validate repository after autonomous changes
        id: post_agent_validation
        if: always() && steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "POST-AGENT VALIDATION"
          echo "============================================================"

          # Git index must work.
          git status --short
          git diff --check

          # Python source must compile.
          python -m compileall -q scripts

          if [ -d tests ]; then
            python -m compileall -q tests
          fi

          # Workflow YAML must remain valid.
          python - <<'PY'
          from pathlib import Path
          import yaml


          class Loader(yaml.SafeLoader):
              pass


          def mapping(loader, node, deep=False):
              result = {}

              for key_node, value_node in node.value:

                  key = loader.construct_object(
                      key_node,
                      deep=deep,
                  )

                  if key in result:
                      raise ValueError(
                          f"Duplicate key: {key!r}"
                      )

                  result[key] = loader.construct_object(
                      value_node,
                      deep=deep,
                  )

              return result


          Loader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              mapping,
          )


          root = Path(".github/workflows")

          for path in sorted(
              list(root.glob("*.yml"))
              + list(root.glob("*.yaml"))
          ):

              yaml.load(
                  path.read_text(encoding="utf-8"),
                  Loader=Loader,
              )

              print(f"POST-VALID: {path}")
          PY

          echo "Post-agent validation passed."

      # ======================================================================
      # 25. DETECT CHANGES
      # ======================================================================

      - name: Analyze autonomous repository changes
        id: change_analysis
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          git status --short \
            > "$TRACK_DIR/final_git_status.txt" || true

          git diff --stat \
            > "$TRACK_DIR/final_diff_stat.txt" || true

          git diff \
            > "$TRACK_DIR/final_diff.patch" || true

          changed_files="$(
            git status --short |
            wc -l |
            tr -d ' '
          )"

          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

          echo "Changed files: $changed_files"

      # ======================================================================
      # 26. SAFE COMMIT OF MECHANICAL REPAIRS
      # ======================================================================

      - name: Commit safe mechanical repairs
        id: safe_repair_commit
        if: |
          env.QMOI_AUTO_FIX == 'true' &&
          steps.action_repair.outputs.changed == '1' &&
          steps.post_agent_validation.outcome != 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "SAFE MECHANICAL REPAIR COMMIT"
          echo "============================================================"

          # Revalidate before touching Git.
          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            rm -f .git/index
            git reset --mixed HEAD
          fi

          git diff --check

          # Only workflow files are eligible for this repair commit.
          git add \
            .github/workflows

          if git diff --cached --quiet; then
            echo "No repair changes remain."
            exit 0
          fi

          git diff --cached --name-only

          git commit \
            -m "ci: automatically repair GitHub Actions workflow dependencies"

          # Push with bounded retry.
          for attempt in 1 2 3 4 5; do

            if git push origin \
              "HEAD:${{ github.event.repository.default_branch }}"; then

              echo "Repair commit pushed successfully."
              break

            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Unable to push repair commit."
              exit 1
            fi

            echo "::warning::Push failed; retrying."
            sleep $((attempt * 10))

            git fetch origin \
              "${{ github.event.repository.default_branch }}"

            git rebase \
              "origin/${{ github.event.repository.default_branch }}"

          done

      # ======================================================================
      # 27. FINAL GIT INTEGRITY
      # ======================================================================

      - name: Final Git integrity verification
        id: final_git
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "FINAL GIT INTEGRITY"
          echo "============================================================"

          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            echo "::warning::Final Git index is corrupt; rebuilding."

            rm -f .git/index

            git reset --mixed HEAD
          fi

          git rev-parse --verify HEAD
          git rev-parse --verify HEAD^{commit}
          git status --short
          git diff --check

          git fsck \
            --no-progress \
            > "$TRACK_DIR/final_git_fsck.txt" \
            2>&1 || true

          echo "Final Git integrity check completed."

      # ======================================================================
      # 28. FINAL TEST AFTER ALL REPAIRS
      # ======================================================================

      - name: Final lightweight validation
        id: final_validation
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail

          python -m compileall -q scripts

          if [ -d tests ]; then
            python -m pytest \
              tests \
              -q \
              --tb=short
          fi

      # ======================================================================
      # 29. FINAL TELEMETRY
      # ======================================================================

      - name: Finalize durable telemetry
        id: finalize
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TEST_RETRY_OUTCOME: ${{ steps.tests_retry.outcome }}
          AGENT_OUTCOME: ${{ steps.agent_execution.outcome }}
          RECOVERY_OUTCOME: ${{ steps.agent_recovery.outcome }}
          POST_AGENT_OUTCOME: ${{ steps.post_agent_validation.outcome }}
          FINAL_GIT_OUTCOME: ${{ steps.final_git.outcome }}
          FINAL_VALIDATION_OUTCOME: ${{ steps.final_validation.outcome }}
          REPAIR_COMMIT_OUTCOME: ${{ steps.safe_repair_commit.outcome }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          agent_status="failed"

          if [ "${{ steps.execution_mode.outputs.run_agent }}" != "true" ]; then
            agent_status="monitoring"

          elif [ "${FINAL_VALIDATION_OUTCOME:-failure}" = "success" ] &&
               [ "${FINAL_GIT_OUTCOME:-failure}" = "success" ]; then

            if [ "${AGENT_OUTCOME:-failure}" = "success" ]; then
              agent_status="success"
            elif [ "${RECOVERY_OUTCOME:-failure}" = "success" ]; then
              agent_status="recovered"
            else
              agent_status="validated"
            fi

          elif [ "${RECOVERY_OUTCOME:-failure}" = "success" ]; then

            agent_status="recovered"

          fi

          cat > "$TRACK_DIR/CURRENT_STATUS.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT - FINAL STATUS

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Run:
          $GITHUB_RUN_ID

          Attempt:
          $GITHUB_RUN_ATTEMPT

          Event:
          $GITHUB_EVENT_NAME

          Test:
          ${TEST_OUTCOME:-unknown}

          Test retry:
          ${TEST_RETRY_OUTCOME:-not-run}

          Agent:
          ${AGENT_OUTCOME:-not-run}

          Agent recovery:
          ${RECOVERY_OUTCOME:-not-run}

          Post-agent validation:
          ${POST_AGENT_OUTCOME:-not-run}

          Final Git:
          ${FINAL_GIT_OUTCOME:-unknown}

          Final validation:
          ${FINAL_VALIDATION_OUTCOME:-unknown}

          Repair commit:
          ${REPAIR_COMMIT_OUTCOME:-not-run}

          FINAL STATUS:
          $agent_status
          EOF

          cat > "$TRACK_DIR/STATE.txt" <<EOF
          protocol=$TRACKING_PROTOCOL
          schema=$TRACK_SCHEMA_VERSION
          repository=$GITHUB_REPOSITORY
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          attempt=$GITHUB_RUN_ATTEMPT
          event=$GITHUB_EVENT_NAME
          test=${TEST_OUTCOME:-unknown}
          test_retry=${TEST_RETRY_OUTCOME:-not-run}
          agent=${AGENT_OUTCOME:-not-run}
          recovery=${RECOVERY_OUTCOME:-not-run}
          post_agent=${POST_AGENT_OUTCOME:-not-run}
          final_git=${FINAL_GIT_OUTCOME:-unknown}
          final_validation=${FINAL_VALIDATION_OUTCOME:-unknown}
          repair_commit=${REPAIR_COMMIT_OUTCOME:-not-run}
          final_status=$agent_status
          timestamp_utc=$now
          EOF

          cat > "$TRACK_DIR/LATEST_ACTIVITY.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT

          Timestamp:
          $now

          Event:
          WORKFLOW_FINALIZED

          Status:
          $agent_status

          Agent:
          ${AGENT_OUTCOME:-not-run}

          Recovery:
          ${RECOVERY_OUTCOME:-not-run}

          Final validation:
          ${FINAL_VALIDATION_OUTCOME:-unknown}
          EOF

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          track = os.environ["TRACK_DIR"]

          summary = {
              "schema": os.environ["TRACK_SCHEMA_VERSION"],
              "protocol": os.environ["TRACKING_PROTOCOL"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "test": os.environ.get("TEST_OUTCOME", "unknown"),
              "test_retry": os.environ.get(
                  "TEST_RETRY_OUTCOME",
                  "not-run",
              ),
              "agent": os.environ.get(
                  "AGENT_OUTCOME",
                  "not-run",
              ),
              "recovery": os.environ.get(
                  "RECOVERY_OUTCOME",
                  "not-run",
              ),
              "post_agent": os.environ.get(
                  "POST_AGENT_OUTCOME",
                  "not-run",
              ),
              "final_git": os.environ.get(
                  "FINAL_GIT_OUTCOME",
                  "unknown",
              ),
              "final_validation": os.environ.get(
                  "FINAL_VALIDATION_OUTCOME",
                  "unknown",
              ),
              "repair_commit": os.environ.get(
                  "REPAIR_COMMIT_OUTCOME",
                  "not-run",
              ),
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
          }

          if (
              summary["final_validation"] == "success"
              and
              summary["final_git"] == "success"
          ):
              summary["status"] = "healthy"
          elif summary["recovery"] == "success":
              summary["status"] = "recovered"
          elif summary["event"] == "schedule":
              summary["status"] = "monitoring"
          else:
              summary["status"] = "attention-required"

          with open(
              os.path.join(track, "monitoring_summary.json"),
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  summary,
                  f,
                  indent=2,
                  sort_keys=True,
              )
              f.write("\n")

          telemetry = {
              "event_id": (
                  f"workflow-finalized-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "event_type": "SUMMARY",
              "event": "WORKFLOW_FINALIZED",
              "timestamp_utc": summary["timestamp_utc"],
              "status": summary["status"],
              "summary": summary,
          }

          with open(
              os.path.join(track, "telemetry.jsonl"),
              "a",
              encoding="utf-8",
          ) as f:
              f.write(
                  json.dumps(
                      telemetry,
                      separators=(",", ":"),
                  )
                  + "\n"
              )
          PY

      # ======================================================================
      # 30. JOB SUMMARY
      # ======================================================================

      - name: Publish GitHub Actions summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "# Ollama Autonomous Agent"
            echo
            echo "## Execution"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Repository | $GITHUB_REPOSITORY |"
            echo "| Workflow | $GITHUB_WORKFLOW |"
            echo "| Run | $GITHUB_RUN_ID |"
            echo "| Event | $GITHUB_EVENT_NAME |"
            echo "| Agent | ${{ steps.agent_execution.outcome || 'not-run' }} |"
            echo "| Recovery | ${{ steps.agent_recovery.outcome || 'not-run' }} |"
            echo "| Final Git | ${{ steps.final_git.outcome || 'unknown' }} |"
            echo "| Final validation | ${{ steps.final_validation.outcome || 'unknown' }} |"
            echo
            echo "## Recovery layers"
            echo
            echo "- Git index corruption recovery"
            echo "- Git lock recovery"
            echo "- Interrupted Git operation recovery"
            echo "- Dependency recovery"
            echo "- YAML duplicate-key detection"
            echo "- Deprecated action detection"
            echo "- Python syntax validation"
            echo "- Agent CLI validation"
            echo "- Ollama preflight"
            echo "- Test retry"
            echo "- Autonomous-agent retry"
            echo "- Post-agent Git recovery"
            echo "- Post-agent validation"
            echo "- Final Git integrity verification"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$TRACK_DIR/CURRENT_STATUS.txt" ]; then
            echo "## Final status" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "$TRACK_DIR/CURRENT_STATUS.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ======================================================================
      # 31. ALWAYS PRESERVE DIAGNOSTICS
      # ======================================================================

      - name: Upload autonomous-agent diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ollama-autonomous-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ollamatracks/
            ${{ runner.temp }}/ollama.log
          if-no-files-found: warn
          retention-days: 30

      # ======================================================================
      # 32. FINAL FAILURE GATE
      # ======================================================================
      #
      # Recovery steps above use continue-on-error so finalization can always
      # execute. This final step converts an unrecovered critical state into
      # a failed workflow instead of falsely reporting success.
      # ======================================================================

      - name: Enforce final health gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          execution="${{ steps.execution_mode.outputs.run_agent }}"
          agent="${{ steps.agent_execution.outcome }}"
          recovery="${{ steps.agent_recovery.outcome }}"
          final_git="${{ steps.final_git.outcome }}"
          final_validation="${{ steps.final_validation.outcome }}"

          echo "Final health gate:"
          echo "  execution=$execution"
          echo "  agent=$agent"
          echo "  recovery=$recovery"
          echo "  final_git=$final_git"
          echo "  final_validation=$final_validation"

          # Monitoring runs have no active-agent success requirement.
          if [ "$execution" != "true" ]; then
            echo "Monitoring/reconciliation run completed."
            exit 0
          fi

          # Active agent runs must finish with valid repository state.
          if [ "$final_git" != "success" ]; then
            echo "::error::Final Git integrity validation failed."
            exit 1
          fi

          if [ "$final_validation" != "success" ]; then
            echo "::error::Final repository validation failed."
            exit 1
          fi

          if [ "$agent" = "success" ] ||
             [ "$recovery" = "success" ]; then

            echo "Autonomous agent completed successfully or recovered."
            exit 0

          fi

          echo "::error::Autonomous agent failed and recovery did not succeed."
          exit 1