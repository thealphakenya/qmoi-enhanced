name: Ollama autonomous agent

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ollama-autonomous-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  autonomous-agent:
    runs-on: ubuntu-latest
    env:
      AUTO_CONTINUE: "1"
      AUTO_CONTINUE_MAX: "20"
      AUTO_CONTINUE_BATCH: "200"
      AUTO_PUSH: "1"
      TARGET_BRANCH: "${{ github.ref_name }}"
      AUTO_MERGE: "0"
      GITHUB_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
      OLLAMA_TIMEOUT: "600"
      OLLAMA_BATCH_SIZE: "20"
      OLLAMA_MAX_WORKERS: "8"
      QMOI_CONFIDENCE_THRESHOLD: ${{ vars.QMOI_CONFIDENCE_THRESHOLD || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run regression checks
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_ollama_autonomous_agent.py

      - name: Run Ollama autonomous agent
        env:
          RUN_FULL_TESTS: "1"
        run: |
          set -euo pipefail
          python scripts/ollama_autonomous_agent.py 2>&1 | tee ollama-autonomous-agent.log

      - name: Upload Ollama live logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-autonomous-agent-logs
          path: |
            ollama-autonomous-agent.log
            OLLAMA_ACTIVITY_FEED.md
          if-no-files-found: ignore

      - name: Publish workflow summary
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const feed = path.join(process.cwd(), 'OLLAMA_ACTIVITY_FEED.md');
            const body = fs.existsSync(feed) ? fs.readFileSync(feed, 'utf8') : 'Ollama run completed.';
            core.summary.addRaw(`## Ollama autonomous run\n\n${body.slice(0, 4000)}`);
            await core.summary.write();

      - name: Finalize state
        run: |
          if git status --porcelain | grep .; then
            git add .
            git commit -m "chore: sync autonomous agent manifests and resume state" || true
            git push origin HEAD:${{ env.TARGET_BRANCH }} || echo "Push to ${TARGET_BRANCH} failed; check permissions or branch protection."
          fi
