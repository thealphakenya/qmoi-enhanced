name: Ollama Autonomous Agent & Live Tracker

# ============================================================================
# QMOI / OLLAMA AUTONOMOUS AGENT (SELF-HEALING & LOOP-PROTECTED)
# ============================================================================
#
# PURPOSE
# -------
# Trusted orchestration, validation, autonomous execution, recovery,
# telemetry, repository integrity, and self-healing layer for QMOI/Ollama.
# Fully automated universal error remediation without human intervention.
#
# IMPORTANT CLI COMPATIBILITY
# ---------------------------
# scripts/ollama_autonomous_agent.py currently supports:
#
#   validate-all
#   validate-platforms
#   validate-features
#   validate-file-handlers
#   generate-memory-index
#   generate-model-card
#   proof
#   checkpoint
#
# SECURITY PRINCIPLES
# -------------------
# 1. Never execute untrusted PR-head code.
# 2. Always validate repository/Git state before mutation.
# 3. Repair only deterministic/mechanical failures automatically.
# 4. Retry transient failures with bounded backoff.
# 5. Validate after every major mutation.
# 6. Preserve diagnostics even when the workflow fails.
# 7. Never create an infinite autonomous recovery loop.
# 8. Prefer evidence preservation over destructive guessing.
# 9. Human intervention remains the boundary for ambiguous failures.
#
# ============================================================================

on:
  workflow_run:
    workflows:
      - "Ollama Master Orchestrator - Enhanced Auto-Healing"
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - completed

  workflow_dispatch:
    inputs:
      mode:
        description: "Agent execution mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - validate
          - sync
          - monitor
          - heal

      auto_heal:
        description: "Enable bounded automatic recovery and circuit breaker"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      auto_fix:
        description: "Enable universal automated file and workflow fixes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      force_agent:
        description: "Allow autonomous agent execution"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      max_iterations:
        description: "Maximum autonomous-agent iterations"
        required: true
        default: "200"
        type: string

      max_per_iteration:
        description: "Maximum tasks per agent iteration"
        required: true
        default: "200"
        type: string

      max_recovery_attempts:
        description: "Maximum bounded recovery attempts"
        required: true
        default: "3"
        type: string

      reason:
        description: "Reason for manual execution"
        required: false
        default: "Autonomous self-healing execution"
        type: string

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: ollama-autonomous-agent-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  QSTEPS_MANAGER: "qsteps-v1"
  TRACK_DIR: ollamatracks
  TRACK_SCHEMA_VERSION: "7.4"
  TRACKING_PROTOCOL: "ollamatracks-v7-self-healing"
  VALIDATION_WORKFLOW_NAME: "Ollama Master Orchestrator - Enhanced Auto-Healing"
  AGENT_SCRIPT: "scripts/ollama_autonomous_agent.py"
  PYTHON_VERSION: "3.11"
  DEFAULT_MAX_ITERATIONS: "200"
  DEFAULT_MAX_PER_ITERATION: "200"
  DEFAULT_MAX_RECOVERY_ATTEMPTS: "3"
  QMOI_AUTO_HEAL: ${{ github.event.inputs.auto_heal || 'true' }}
  QMOI_AUTO_FIX: ${{ github.event.inputs.auto_fix || 'true' }}
  QMOI_AGENT_MODE: ${{ github.event.inputs.mode || 'full' }}
  QMOI_FORCE_AGENT: ${{ github.event.inputs.force_agent || 'false' }}
  QMOI_RETRY_ATTEMPTS: "5"
  QMOI_RETRY_DELAY: "10"
  QMOI_TIMEOUT_SECONDS: "300"
  OLLAMA_HOST: "http://127.0.0.1:11434"
  OLLAMA_MODEL: "qwen2.5-coder:3b"
  REASON: ${{ github.event.inputs.reason || 'Scheduled/workflow-triggered execution' }}

jobs:
  ollama-agent:
    name: Ollama Autonomous Agent + Universal Self-Healing Engine
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Q Steps Manager start autonomous agent
        run: python3 scripts/qsteps_manager.py start --step "${GITHUB_JOB}:ollama-agent"

      - name: Runner and environment preflight
        id: runner_preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "============================================================"
          echo "RUNNER PREFLIGHT"
          echo "============================================================"
          uname -a
          cat /etc/os-release || true
          df -h
          free -h || true
          python3 --version || true
          git --version
          pwd
          test -d "$GITHUB_WORKSPACE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Initialize durable tracking
        id: initialize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VALIDATION_STATUS: ${{ github.event.workflow_run.status }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VALIDATION_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$TRACK_DIR"
          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
          agent_run_id="agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          touch \
            "$TRACK_DIR/telemetry.jsonl" \
            "$TRACK_DIR/CURRENT_STATUS.txt" \
            "$TRACK_DIR/LATEST_ACTIVITY.txt" \
            "$TRACK_DIR/STATE.txt" \
            "$TRACK_DIR/PR_STATUS.txt" \
            "$TRACK_DIR/LAST_RECONCILIATION.txt" \
            "$TRACK_DIR/LAST_TEST_RESULT.txt" \
            "$TRACK_DIR/REPAIR_LOG.txt" \
            "$TRACK_DIR/error_fingerprints.log"

          cat > "$TRACK_DIR/TRACKING_PROTOCOL.txt" <<EOF
          OLLAMA AUTONOMOUS TRACKING PROTOCOL
          Protocol: $TRACKING_PROTOCOL
          Schema: $TRACK_SCHEMA_VERSION
          Repository: $GITHUB_REPOSITORY
          Workflow: $GITHUB_WORKFLOW
          Agent: $AGENT_SCRIPT
          Security: Trusted default branch only.
          Recovery: Bounded deterministic/mechanical recovery with circuit breakers.
          EOF

          cat > "$TRACK_DIR/CURRENT_STATUS.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT
          State: INITIALIZING
          Status: RUNNING
          Timestamp UTC: $now
          Run: $GITHUB_RUN_ID
          EOF

          echo "agent_run_id=$agent_run_id" >> "$GITHUB_OUTPUT"
          echo "timestamp_utc=$now" >> "$GITHUB_OUTPUT"

      - name: Repair and validate Git repository
        id: git_recovery_initial
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "============================================================"
          echo "GIT INTEGRITY / SELF-HEALING"
          echo "============================================================"
          mkdir -p "$TRACK_DIR"
          repair_log="$TRACK_DIR/REPAIR_LOG.txt"

          [ -d .git/rebase-merge ] && git rebase --abort 2>/dev/null || true
          [ -f .git/MERGE_HEAD ] && git merge --abort 2>/dev/null || true
          [ -f .git/CHERRY_PICK_HEAD ] && git cherry-pick --abort 2>/dev/null || true

          find .git -type f \( -name '*.lock' -o -name 'index.lock' \) -delete 2>/dev/null || true

          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            echo "::warning::Git index corrupted; rebuilding."
            echo "$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ') | GIT_INDEX_REPAIR" >> "$repair_log"
            rm -f .git/index
            git reset --mixed HEAD
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Git integrity preflight passed."

      - name: Install validation and recovery tooling
        id: tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip setuptools wheel pytest PyYAML
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Universal Autonomous File Auto-Fix Engine
        id: action_repair
        if: env.QMOI_AUTO_FIX == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "============================================================"
          echo "UNIVERSAL AUTONOMOUS FILE & WORKFLOW AUTO-FIX ENGINE"
          echo "============================================================"
          mkdir -p "$TRACK_DIR"
          repair_log="$TRACK_DIR/REPAIR_LOG.txt"
          changed=0

          if [ -d .github/workflows ]; then
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | while read -r wf; do
              before=$(sha256sum "$wf" | awk '{print $1}')
              
              # Fix deprecated or invalid CLI command usage across all workflows
              sed -i 's/validate-all-platforms/validate-platforms/g' "$wf"
              sed -i 's/validate-all-features/validate-features/g' "$wf"

              # Upgrade older actions to v4 compliance
              sed -i -E 's#actions/upload-artifact@v[1-3]#actions/upload-artifact@v4#g' "$wf"
              sed -i -E 's#actions/download-artifact@v[1-3]#actions/download-artifact@v4#g' "$wf"

              after=$(sha256sum "$wf" | awk '{print $1}')
              if [ "$before" != "$after" ]; then
                changed=1
                echo "$(date -u +%FT%TZ) | FIXED_WORKFLOW | $wf" >> "$repair_log"
                echo "Automatically fixed workflow file: $wf"
              fi
            done
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Verify autonomous agent source
        id: verify_agent_source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$AGENT_SCRIPT"
          python "$AGENT_SCRIPT" --help

      - name: Determine agent execution mode
        id: execution_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FORCE_AGENT: ${{ github.event.inputs.force_agent || 'false' }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          set -Eeuo pipefail
          run_agent="false"
          command="monitor"
          reason="Monitoring/reconciliation."

          case "$EVENT_NAME" in
            workflow_run)
              if [ "$VALIDATION_CONCLUSION" = "success" ]; then
                run_agent="true"
                command="validate-all"
                reason="Trusted default-branch validation succeeded."
              fi
              ;;
            workflow_dispatch)
              if [ "$FORCE_AGENT" = "true" ]; then
                run_agent="true"
                case "$REQUESTED_MODE" in
                  full|validate) command="validate-all" ;;
                  heal) command="validate-all" ;;
                  *) command="monitor" ;;
                esac
                reason="Manual autonomous execution."
              fi
              ;;
            schedule)
              run_agent="false"
              command="monitor"
              reason="Scheduled reconciliation."
              ;;
          esac

          echo "run_agent=$run_agent" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Strictly validate all GitHub workflow YAML
        id: yaml_validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          class UniqueLoader(yaml.SafeLoader): pass
          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping: raise ValueError(f"Duplicate key: {key!r}")
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping
          UniqueLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, construct_mapping)
          root = Path(".github/workflows")
          if root.exists():
              for path in root.glob("*.y*ml"):
                  yaml.load(path.read_text(encoding="utf-8"), Loader=UniqueLoader)
          print("Workflow YAML validation passed.")
          PY

      - name: Validate Python source syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q scripts tests || true

      - name: Execute repository test suite
        id: tests
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          if [ -d tests ]; then
            python -m pytest tests -v --tb=short || true
          fi

      - name: Create pre-agent repository checkpoint
        id: pre_agent_checkpoint
        if: steps.execution_mode.outputs.run_agent == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$TRACK_DIR"
          git status --short > "$TRACK_DIR/pre_agent_status.txt"
          git diff > "$TRACK_DIR/pre_agent_diff.patch" || true

      - name: Execute Autonomous Agent with Circuit-Breaker Loop Protection
        id: agent_execution
        if: steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        timeout-minutes: 240
        shell: bash
        env:
          MAX_RETRIES: ${{ github.event.inputs.max_recovery_attempts || env.DEFAULT_MAX_RECOVERY_ATTEMPTS }}
        run: |
          set -Eeuo pipefail
          command="${{ steps.execution_mode.outputs.command }}"
          agent_cmd="python ${AGENT_SCRIPT} ${command}"
          
          attempt=1
          last_fingerprint=""
          success=0

          while [ "$attempt" -le "$MAX_RETRIES" ]; do
            echo "============================================================"
            echo "AUTONOMOUS AGENT RUN: Attempt $attempt / $MAX_RETRIES"
            echo "============================================================"

            set +e
            eval "$agent_cmd" > "$TRACK_DIR/agent_run_$attempt.log" 2>&1
            exit_code=$?
            set -e

            if [ $exit_code -eq 0 ]; then
              echo "Autonomous agent executed successfully."
              success=1
              break
            fi

            current_fingerprint=$(sha256sum "$TRACK_DIR/agent_run_$attempt.log" | awk '{print $1}')
            echo "Failure Fingerprint: $current_fingerprint"

            if [ "$current_fingerprint" = "$last_fingerprint" ]; then
              echo "::error::Circuit Breaker Triggered: Identical error state detected on consecutive attempts."
              break
            fi
            last_fingerprint="$current_fingerprint"

            python -m compileall -q scripts/ tests/ || true
            python -m pip install --upgrade pytest PyYAML || true

            attempt=$((attempt + 1))
            sleep 5
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::Autonomous agent failed after guarded execution attempts."
            exit 1
          fi

      - name: Repair Git repository after autonomous agent
        id: git_recovery_post_agent
        if: always() && steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          find .git -type f \( -name '*.lock' -o -name 'index.lock' \) -delete 2>/dev/null || true
          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            rm -f .git/index
            git reset --mixed HEAD
          fi

      - name: Commit safe mechanical repairs and workflow updates
        id: safe_repair_commit
        if: |
          env.QMOI_AUTO_FIX == 'true' &&
          steps.action_repair.outputs.changed == '1'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          git add .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: autonomous self-healing and automatic workflow remediation [skip ci]" || true

          branch="${{ github.event.repository.default_branch }}"
          for i in 1 2 3; do
            # Safely pull and rebase first to integrate incoming remote updates before pushing
            git pull origin "${branch}" --rebase --autostash || true
            
            if git push origin "HEAD:${branch}"; then
              break
            fi
            sleep 5
          done

      - name: Final lightweight validation
        id: final_validation
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m compileall -q scripts
          if [ -d tests ]; then
            python -m pytest tests -q --tb=short || true
          fi

      - name: Publish GitHub Actions summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "# Ollama Autonomous Agent"
            echo "## Execution Summary"
            echo "- Agent: ${{ steps.agent_execution.outcome || 'not-run' }}"
            echo "- Validation: ${{ steps.final_validation.outcome || 'unknown' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload autonomous-agent diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-autonomous-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TRACK_DIR }}/
          retention-days: 30

      - name: Enforce final health gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          execution="${{ steps.execution_mode.outputs.run_agent }}"
          agent="${{ steps.agent_execution.outcome }}"

          if [ "$execution" != "true" ]; then
            exit 0
          fi
          if [ "$agent" = "success" ]; then
            exit 0
          fi
          exit 1
