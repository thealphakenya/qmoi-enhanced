name: Ollama Autonomous Agent - PR Realtime Tracker

# ============================================================================
# OLLAMA AUTONOMOUS AGENT - PR REALTIME TRACKER
# ============================================================================
#
# PURPOSE
# -------
# Independent monitoring and durable telemetry system for:
#
#   - Ollama PR validation workflow
#   - Ollama autonomous-agent workflow
#   - Pull requests
#   - Workflow runs
#   - Workflow jobs
#   - Job steps
#   - Checks
#   - Commit/branch/SHA information
#   - Validation results
#   - Agent runtime output
#   - Current agent state
#   - Historical agent activity
#
# This workflow DOES NOT:
#
#   - cancel the autonomous agent
#   - restart the autonomous agent
#   - merge PRs
#   - modify agent source code
#   - modify validation workflows
#   - modify unrelated repository files
#
# It only observes and persists monitoring information.
#
#
# ============================================================================
# IMPORTANT ARCHITECTURE
# ============================================================================
#
# A GitHub Actions workflow is not an appropriate infinite daemon.
#
# Therefore this tracker uses:
#
#       workflow_run events
#              +
#       scheduled reconciliation
#              +
#       manual inspection
#              +
#       persistent ollamatracks/
#              +
#       GitHub Actions artifacts
#              +
#       GitHub job summaries
#
# Every invocation is finite.
#
# The monitoring SYSTEM can continue for months because another scheduled
# or event-driven invocation can reconcile the current state.
#
#
# ============================================================================
# TRACKING DIRECTORY
# ============================================================================
#
# The workflow ALWAYS ensures this directory exists:
#
#     ollamatracks/
#
# Persistent state:
#
#     CURRENT_STATUS.txt
#     LATEST_ACTIVITY.txt
#     STATE.txt
#     PR_STATUS.txt
#     TRACKING_INDEX.txt
#     LAST_RECONCILIATION.txt
#
# Historical immutable records:
#
#     000001_tracker_initialized.txt
#     000002_workflow_requested.txt
#     000003_workflow_started.txt
#     000004_job_state_changed.txt
#     000005_pr_status_changed.txt
#     000006_validation_completed.txt
#     ...
#
# Six digits provide deterministic chronological ordering.
#
# Historical files are NEVER intentionally overwritten.
#
# Mutable state files are deliberately separate from historical records.
#
#
# ============================================================================
# EVENT NAMING RULE
# ============================================================================
#
# Historical files:
#
#     NNNNNN_event-type.txt
#
# Example:
#
#     000147_agent_iteration_started.txt
#
# Sequence:
#
#     000001
#     000002
#     000003
#     ...
#
# The sequence is determined from the highest existing historical record.
#
# ============================================================================
#
# EXACT TIME
# ============================================================================
#
# All tracker-generated events use UTC timestamps with milliseconds:
#
#     2026-08-15T12:34:56.123Z
#
# GitHub-provided timestamps are also preserved.
#
# IMPORTANT:
#
# The tracker can only know the exact time an external event was observed
# unless the Ollama Python agent itself emits internal task/iteration
# timestamps.
#
# Therefore the companion Python agent should eventually emit:
#
#     QMOI_TRACK|iteration_started|...
#     QMOI_TRACK|task_started|...
#     QMOI_TRACK|task_completed|...
#     QMOI_TRACK|tool_started|...
#     QMOI_TRACK|tool_completed|...
#
# This workflow is prepared to preserve that telemetry when it is emitted.
#
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # OBSERVE VALIDATION WORKFLOW
  # --------------------------------------------------------------------------

  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - requested
      - in_progress
      - completed

  # --------------------------------------------------------------------------
  # PERIODIC RECONCILIATION
  # --------------------------------------------------------------------------

  schedule:
    - cron: "*/5 * * * *"

  # --------------------------------------------------------------------------
  # MANUAL MONITORING
  # --------------------------------------------------------------------------

  workflow_dispatch:
    inputs:

      run_id:
        description: "Optional Ollama validation workflow run ID to inspect"
        required: false
        type: string

      force_snapshot:
        description: "Create a historical snapshot even when state did not change"
        required: false
        default: true
        type: boolean

      inspect_prs:
        description: "Perform detailed pull-request monitoring"
        required: false
        default: true
        type: boolean

      inspect_jobs:
        description: "Inspect workflow jobs and their states"
        required: false
        default: true
        type: boolean

      inspect_checks:
        description: "Inspect check-runs associated with monitored PR commits"
        required: false
        default: true
        type: boolean

      cleanup_old_files:
        description: "Remove only exact duplicate historical snapshots"
        required: false
        default: false
        type: boolean


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# Only one tracker writer should modify ollamatracks at a time.
#
# cancel-in-progress remains FALSE so an active reconciliation is never
# deliberately terminated by this workflow.
#
# The queue behavior is intentional: monitoring events should not replace
# another active monitoring writer.
# ============================================================================

concurrency:
  group: ollama-pr-realtime-tracker-writer
  cancel-in-progress: false
  queue: max


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  TRACK_DIR: ollamatracks

  TRACK_SCHEMA_VERSION: "2.0"

  TARGET_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  MAX_RUNS_TO_INSPECT: "20"

  MAX_JOBS_PER_RUN: "100"

  MAX_CHECK_RUNS: "100"

  MAX_PRS_TO_INSPECT: "100"


# ============================================================================
# JOB
# ============================================================================

jobs:

  reconcile:

    name: Realtime Ollama + PR Reconciliation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ======================================================================
      # INITIALIZE TRACKING INFRASTRUCTURE
      # ======================================================================

      - name: Ensure ollamatracks exists
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          touch "$TRACK_DIR/TRACKING_INDEX.txt"
          touch "$TRACK_DIR/CURRENT_STATUS.txt"
          touch "$TRACK_DIR/STATE.txt"
          touch "$TRACK_DIR/PR_STATUS.txt"
          touch "$TRACK_DIR/LATEST_ACTIVITY.txt"
          touch "$TRACK_DIR/LAST_RECONCILIATION.txt"

          echo "============================================================"
          echo "OLLAMA TRACKING DIRECTORY"
          echo "============================================================"

          pwd
          echo

          echo "Directory:"
          echo "$TRACK_DIR"

          echo
          echo "Existing tracking files:"
          find "$TRACK_DIR" -maxdepth 1 -type f \
            -printf '%f\n' |
            sort -V

      # ======================================================================
      # RECONCILIATION ENGINE
      # ======================================================================

      - name: Collect Ollama, workflow, job, check and PR state
        id: collect
        uses: actions/github-script@v7
        env:

          MANUAL_RUN_ID: ${{ inputs.run_id }}

          FORCE_SNAPSHOT: ${{ inputs.force_snapshot }}

          INSPECT_PRS: ${{ inputs.inspect_prs }}

          INSPECT_JOBS: ${{ inputs.inspect_jobs }}

          INSPECT_CHECKS: ${{ inputs.inspect_checks }}

          CLEANUP_OLD_FILES: ${{ inputs.cleanup_old_files }}

        with:

          github-token: ${{ github.token }}

          script: |

            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");

            // =================================================================
            // BASIC CONTEXT
            // =================================================================

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const trackDir =
              process.env.TRACK_DIR || "ollamatracks";

            const targetWorkflow =
              process.env.TARGET_WORKFLOW_NAME ||
              "Ollama PR Validation - 293+ Platform Features";

            const manualRunId =
              String(process.env.MANUAL_RUN_ID || "").trim();

            const forceSnapshot =
              String(process.env.FORCE_SNAPSHOT || "true") !== "false";

            const inspectPRs =
              String(process.env.INSPECT_PRS || "true") !== "false";

            const inspectJobs =
              String(process.env.INSPECT_JOBS || "true") !== "false";

            const inspectChecks =
              String(process.env.INSPECT_CHECKS || "true") !== "false";

            const cleanupOldFiles =
              String(process.env.CLEANUP_OLD_FILES || "false") === "true";

            fs.mkdirSync(trackDir, {
              recursive: true
            });

            // =================================================================
            // PRECISE UTC TIMESTAMP
            // =================================================================

            const now = new Date();

            const pad = (value, length = 2) =>
              String(value).padStart(length, "0");

            const timestamp =
              now.getUTCFullYear() +
              "-" +
              pad(now.getUTCMonth() + 1) +
              "-" +
              pad(now.getUTCDate()) +
              "T" +
              pad(now.getUTCHours()) +
              ":" +
              pad(now.getUTCMinutes()) +
              ":" +
              pad(now.getUTCSeconds()) +
              "." +
              pad(now.getUTCMilliseconds(), 3) +
              "Z";

            // =================================================================
            // HELPERS
            // =================================================================

            function safe(value, fallback = "unknown") {

              const result =
                String(value ?? fallback)
                  .replace(/[^a-zA-Z0-9._-]+/g, "-")
                  .replace(/-+/g, "-")
                  .replace(/^-|-$/g, "");

              return result || fallback;
            }

            function sha256(value) {

              return crypto
                .createHash("sha256")
                .update(String(value))
                .digest("hex");
            }

            function readFile(file) {

              if (!fs.existsSync(file)) {
                return "";
              }

              return fs.readFileSync(
                file,
                "utf8"
              );
            }

            function writeFile(file, content) {

              fs.writeFileSync(
                file,
                content,
                "utf8"
              );
            }

            function nextSequence() {

              const files =
                fs.readdirSync(trackDir);

              let highest = 0;

              for (const file of files) {

                const match =
                  /^(\d{6})_.+\.txt$/i.exec(file);

                if (!match) {
                  continue;
                }

                const number =
                  Number(match[1]);

                if (number > highest) {
                  highest = number;
                }
              }

              return highest + 1;
            }

            function recordHistoricalEvent(
              eventName,
              content
            ) {

              const sequence =
                nextSequence();

              const sequenceText =
                String(sequence).padStart(6, "0");

              const filename =
                `${sequenceText}_${safe(eventName)}.txt`;

              const filepath =
                path.join(
                  trackDir,
                  filename
                );

              const body = [
                "OLLAMA AUTONOMOUS AGENT TRACKING EVENT",
                "=======================================",
                "",
                `Sequence: ${sequenceText}`,
                `Event: ${eventName}`,
                `Timestamp UTC: ${timestamp}`,
                `Repository: ${owner}/${repo}`,
                `Tracker workflow run ID: ${context.runId}`,
                `Tracker workflow attempt: ${context.runAttempt}`,
                `GitHub event: ${context.eventName}`,
                "",
                content,
                "",
                "END EVENT",
                ""
              ].join("\n");

              writeFile(
                filepath,
                body
              );

              return filename;
            }

            function updateLatestActivity(
              eventName,
              description
            ) {

              writeFile(
                path.join(
                  trackDir,
                  "LATEST_ACTIVITY.txt"
                ),
                [
                  "OLLAMA AUTONOMOUS AGENT - LATEST ACTIVITY",
                  "==========================================",
                  "",
                  `Timestamp UTC: ${timestamp}`,
                  `Event: ${eventName}`,
                  `Description: ${description}`,
                  `Tracker workflow run: ${context.runId}`,
                  `Tracker workflow attempt: ${context.runAttempt}`,
                  "",
                  "This file represents the latest observed state.",
                  ""
                ].join("\n")
              );
            }

            // =================================================================
            // PREVIOUS STATE
            // =================================================================

            const stateFile =
              path.join(
                trackDir,
                "STATE.txt"
              );

            const currentFile =
              path.join(
                trackDir,
                "CURRENT_STATUS.txt"
              );

            const previousState =
              readFile(stateFile);

            // =================================================================
            // DISCOVER TARGET WORKFLOW
            // =================================================================

            let workflowId = null;

            let workflowDiscoveryError = "";

            try {

              const workflows =
                await github.paginate(
                  github.rest.actions.listRepoWorkflows,
                  {
                    owner,
                    repo,
                    per_page: 100
                  }
                );

              const matching =
                workflows.find(
                  workflow =>
                    workflow.name === targetWorkflow
                );

              if (matching) {

                workflowId =
                  matching.id;

              } else {

                workflowDiscoveryError =
                  `Workflow not found: ${targetWorkflow}`;
              }

            } catch (error) {

              workflowDiscoveryError =
                error.message;

              core.warning(
                `Workflow discovery warning: ${error.message}`
              );
            }

            // =================================================================
            // DISCOVER WORKFLOW RUNS
            // =================================================================

            let runs = [];

            if (workflowId) {

              try {

                const response =
                  await github.rest.actions.listWorkflowRuns({
                    owner,
                    repo,
                    workflow_id: workflowId,
                    per_page: Number(
                      process.env.MAX_RUNS_TO_INSPECT || "20"
                    )
                  });

                runs =
                  response.data.workflow_runs || [];

              } catch (error) {

                core.warning(
                  `Workflow run discovery warning: ${error.message}`
                );
              }
            }

            // =================================================================
            // MANUAL RUN OVERRIDE
            // =================================================================

            if (manualRunId) {

              const requestedId =
                Number(manualRunId);

              if (
                Number.isInteger(requestedId) &&
                requestedId > 0
              ) {

                try {

                  const response =
                    await github.rest.actions.getWorkflowRun({
                      owner,
                      repo,
                      run_id: requestedId
                    });

                  runs = [
                    response.data,
                    ...runs.filter(
                      run =>
                        run.id !== requestedId
                    )
                  ];

                } catch (error) {

                  core.warning(
                    `Manual run lookup warning: ${error.message}`
                  );
                }
              }
            }

            // =================================================================
            // ACTIVE RUNS
            // =================================================================

            const activeStatuses =
              new Set([
                "queued",
                "in_progress",
                "waiting",
                "requested",
                "pending"
              ]);

            const activeRuns =
              runs.filter(
                run =>
                  activeStatuses.has(
                    run.status
                  )
              );

            // =================================================================
            // RUN REPORTS
            // =================================================================

            const runReports = [];

            for (const run of runs) {

              let jobs = [];

              if (inspectJobs) {

                try {

                  jobs =
                    await github.paginate(
                      github.rest.actions.listJobsForWorkflowRun,
                      {
                        owner,
                        repo,
                        run_id: run.id,
                        per_page: Number(
                          process.env.MAX_JOBS_PER_RUN || "100"
                        )
                      }
                    );

                } catch (error) {

                  core.warning(
                    `Could not inspect jobs for run ${run.id}: ${error.message}`
                  );
                }
              }

              const jobCounts = {
                total: jobs.length,
                queued: 0,
                waiting: 0,
                in_progress: 0,
                success: 0,
                failure: 0,
                cancelled: 0,
                skipped: 0,
                timed_out: 0,
                neutral: 0,
                other: 0
              };

              for (const job of jobs) {

                if (job.status === "queued") {
                  jobCounts.queued++;
                }

                if (job.status === "waiting") {
                  jobCounts.waiting++;
                }

                if (job.status === "in_progress") {
                  jobCounts.in_progress++;
                }

                if (job.conclusion === "success") {
                  jobCounts.success++;
                } else if (job.conclusion === "failure") {
                  jobCounts.failure++;
                } else if (job.conclusion === "cancelled") {
                  jobCounts.cancelled++;
                } else if (job.conclusion === "skipped") {
                  jobCounts.skipped++;
                } else if (job.conclusion === "timed_out") {
                  jobCounts.timed_out++;
                } else if (job.conclusion === "neutral") {
                  jobCounts.neutral++;
                } else if (
                  job.conclusion !== null &&
                  job.conclusion !== undefined
                ) {
                  jobCounts.other++;
                }
              }

              // ===============================================================
              // PR DISCOVERY
              // ===============================================================

              let prs = [];

              if (inspectPRs) {

                try {

                  if (
                    Array.isArray(
                      run.pull_requests
                    ) &&
                    run.pull_requests.length > 0
                  ) {

                    prs =
                      run.pull_requests;

                  } else if (
                    run.head_branch
                  ) {

                    const response =
                      await github.rest.pulls.list({
                        owner,
                        repo,
                        state: "open",
                        head:
                          `${owner}:${run.head_branch}`,
                        per_page: 20
                      });

                    prs =
                      response.data || [];
                  }

                } catch (error) {

                  core.warning(
                    `PR lookup warning for run ${run.id}: ${error.message}`
                  );
                }
              }

              // ===============================================================
              // DETAILED PR REPORTS
              // ===============================================================

              const prReports = [];

              for (const pr of prs) {

                let prDetails = pr;

                try {

                  const response =
                    await github.rest.pulls.get({
                      owner,
                      repo,
                      pull_number: pr.number
                    });

                  prDetails =
                    response.data;

                } catch (_) {
                  // Existing PR information remains usable.
                }

                let checkRuns = [];

                if (
                  inspectChecks &&
                  prDetails.head?.sha
                ) {

                  try {

                    const response =
                      await github.rest.checks.listForRef({
                        owner,
                        repo,
                        ref: prDetails.head.sha,
                        per_page: Number(
                          process.env.MAX_CHECK_RUNS || "100"
                        )
                      });

                    checkRuns =
                      response.data.check_runs || [];

                  } catch (error) {

                    core.warning(
                      `Check-run lookup warning for PR #${prDetails.number}: ${error.message}`
                    );
                  }
                }

                const checkSummary = {
                  total: checkRuns.length,
                  queued: 0,
                  in_progress: 0,
                  completed: 0,
                  success: 0,
                  failure: 0,
                  neutral: 0,
                  cancelled: 0,
                  skipped: 0,
                  timed_out: 0,
                  action_required: 0,
                  other: 0
                };

                for (const check of checkRuns) {

                  if (
                    check.status === "queued"
                  ) {
                    checkSummary.queued++;
                  }

                  if (
                    check.status === "in_progress"
                  ) {
                    checkSummary.in_progress++;
                  }

                  if (
                    check.status === "completed"
                  ) {
                    checkSummary.completed++;
                  }

                  switch (
                    check.conclusion
                  ) {

                    case "success":
                      checkSummary.success++;
                      break;

                    case "failure":
                      checkSummary.failure++;
                      break;

                    case "neutral":
                      checkSummary.neutral++;
                      break;

                    case "cancelled":
                      checkSummary.cancelled++;
                      break;

                    case "skipped":
                      checkSummary.skipped++;
                      break;

                    case "timed_out":
                      checkSummary.timed_out++;
                      break;

                    case "action_required":
                      checkSummary.action_required++;
                      break;

                    default:

                      if (
                        check.conclusion !== null &&
                        check.conclusion !== undefined
                      ) {
                        checkSummary.other++;
                      }

                  }
                }

                prReports.push({

                  number:
                    prDetails.number,

                  title:
                    prDetails.title,

                  state:
                    prDetails.state,

                  draft:
                    Boolean(
                      prDetails.draft
                    ),

                  mergeable:
                    prDetails.mergeable,

                  mergeable_state:
                    prDetails.mergeable_state,

                  head_sha:
                    prDetails.head?.sha || "",

                  head_ref:
                    prDetails.head?.ref || "",

                  base_ref:
                    prDetails.base?.ref || "",

                  url:
                    prDetails.html_url || "",

                  updated_at:
                    prDetails.updated_at || "",

                  check_summary:
                    checkSummary,

                  checks:
                    checkRuns.map(
                      check => ({
                        id:
                          check.id,

                        name:
                          check.name,

                        status:
                          check.status,

                        conclusion:
                          check.conclusion,

                        started_at:
                          check.started_at,

                        completed_at:
                          check.completed_at,

                        url:
                          check.html_url
                      })
                    )
                });
              }

              // ===============================================================
              // SAVE RUN REPORT
              // ===============================================================

              runReports.push({

                id:
                  run.id,

                name:
                  run.name,

                status:
                  run.status,

                conclusion:
                  run.conclusion,

                event:
                  run.event,

                branch:
                  run.head_branch,

                sha:
                  run.head_sha,

                created_at:
                  run.created_at,

                updated_at:
                  run.updated_at,

                run_started_at:
                  run.run_started_at,

                url:
                  run.html_url,

                actor:
                  run.actor?.login ||
                  "unknown",

                jobs:
                  jobCounts,

                job_details:
                  jobs.map(
                    job => ({
                      id:
                        job.id,

                      name:
                        job.name,

                      status:
                        job.status,

                      conclusion:
                        job.conclusion,

                      started_at:
                        job.started_at,

                      completed_at:
                        job.completed_at,

                      url:
                        job.html_url,

                      runner_name:
                        job.runner_name
                    })
                  ),

                prs:
                  prReports
              });
            }

            // =================================================================
            // PRIMARY RUN
            // =================================================================

            let primaryRun = null;

            if (manualRunId) {

              primaryRun =
                runReports.find(
                  run =>
                    String(run.id) ===
                    manualRunId
                ) || null;
            }

            if (!primaryRun) {

              primaryRun =
                activeRuns.length > 0
                  ? runReports.find(
                      run =>
                        run.id ===
                        activeRuns[0].id
                    )
                  : runReports[0] || null;
            }

            // =================================================================
            // OVERALL METRICS
            // =================================================================

            const totalRuns =
              runReports.length;

            const successfulRuns =
              runReports.filter(
                run =>
                  run.conclusion === "success"
              ).length;

            const failedRuns =
              runReports.filter(
                run =>
                  run.conclusion === "failure"
              ).length;

            const activeRunCount =
              activeRuns.length;

            const activeJobCount =
              runReports.reduce(
                (sum, run) =>
                  sum +
                  Number(
                    run.jobs.in_progress || 0
                  ) +
                  Number(
                    run.jobs.queued || 0
                  ) +
                  Number(
                    run.jobs.waiting || 0
                  ),
                0
              );

            const allPRs = [];

            for (
              const run of runReports
            ) {

              for (
                const pr of run.prs || []
              ) {

                if (
                  !allPRs.some(
                    existing =>
                      existing.number ===
                      pr.number
                  )
                ) {

                  allPRs.push(pr);
                }
              }
            }

            // =================================================================
            // STATE OBJECT
            // =================================================================

            const stateObject = {

              schema_version:
                process.env.TRACK_SCHEMA_VERSION ||
                "2.0",

              observed_at:
                timestamp,

              repository:
                `${owner}/${repo}`,

              tracker_run_id:
                context.runId,

              tracker_attempt:
                context.runAttempt,

              event:
                context.eventName,

              target_workflow:
                targetWorkflow,

              target_workflow_id:
                workflowId,

              target_workflow_found:
                Boolean(workflowId),

              active_run_count:
                activeRunCount,

              active_job_count:
                activeJobCount,

              total_runs_inspected:
                totalRuns,

              successful_runs:
                successfulRuns,

              failed_runs:
                failedRuns,

              active_runs:
                activeRuns.map(
                  run => ({
                    id:
                      run.id,

                    status:
                      run.status,

                    branch:
                      run.head_branch,

                    sha:
                      run.head_sha,

                    created_at:
                      run.created_at,

                    updated_at:
                      run.updated_at,

                    url:
                      run.html_url
                  })
                ),

              primary_run:
                primaryRun,

              pull_requests:
                allPRs,

              discovery_error:
                workflowDiscoveryError || null
            };

            const stateText =
              JSON.stringify(
                stateObject,
                null,
                2
              );

            const stateHash =
              sha256(
                stateText
              );

            const previousHashMatch =
              previousState.includes(
                `STATE_HASH=${stateHash}`
              );

            const materialChange =
              !previousHashMatch;

            // =================================================================
            // CURRENT STATUS
            // =================================================================

            let currentState =
              "NO_ACTIVE_OLLAMA_RUN";

            if (
              activeRunCount > 0
            ) {

              currentState =
                "OLLAMA_WORKFLOW_ACTIVE";

            } else if (
              primaryRun?.conclusion ===
              "success"
            ) {

              currentState =
                "VALIDATION_COMPLETED_SUCCESSFULLY";

            } else if (
              primaryRun?.conclusion ===
              "failure"
            ) {

              currentState =
                "VALIDATION_FAILED";

            } else if (
              totalRuns === 0
            ) {

              currentState =
                "NO_VALIDATION_RUN_DISCOVERED";
            }

            const currentStatus = [
              "OLLAMA AUTONOMOUS AGENT - CURRENT STATUS",
              "=========================================",
              "",
              `Timestamp UTC: ${timestamp}`,
              "",
              `Current state: ${currentState}`,
              `Target workflow: ${targetWorkflow}`,
              `Target workflow ID: ${workflowId || "NOT FOUND"}`,
              "",
              `Active Ollama runs: ${activeRunCount}`,
              `Active jobs: ${activeJobCount}`,
              `Runs inspected: ${totalRuns}`,
              `Successful runs: ${successfulRuns}`,
              `Failed runs: ${failedRuns}`,
              `Pull requests discovered: ${allPRs.length}`,
              "",
              "PRIMARY RUN",
              "-----------",
              `Run ID: ${primaryRun?.id || "N/A"}`,
              `Status: ${primaryRun?.status || "N/A"}`,
              `Conclusion: ${primaryRun?.conclusion || "N/A"}`,
              `Branch: ${primaryRun?.branch || "N/A"}`,
              `Commit: ${primaryRun?.sha || "N/A"}`,
              `Created: ${primaryRun?.created_at || "N/A"}`,
              `Updated: ${primaryRun?.updated_at || "N/A"}`,
              `URL: ${primaryRun?.url || "N/A"}`,
              "",
              "CURRENT JOBS",
              "------------"
            ];

            if (
              primaryRun &&
              primaryRun.job_details?.length
            ) {

              for (
                const job of
                primaryRun.job_details
              ) {

                currentStatus.push(
                  `- ${job.name}: ${job.status} / ${job.conclusion || "not completed"}`
                );
              }

            } else {

              currentStatus.push(
                "- No job details available."
              );
            }

            currentStatus.push(
              "",
              "PULL REQUESTS",
              "-------------"
            );

            if (
              allPRs.length
            ) {

              for (
                const pr of allPRs
              ) {

                currentStatus.push(
                  `PR #${pr.number}: ${pr.state} | ${pr.head_ref} -> ${pr.base_ref}`
                );

                currentStatus.push(
                  `  SHA: ${pr.head_sha}`
                );

                currentStatus.push(
                  `  Draft: ${pr.draft}`
                );

                currentStatus.push(
                  `  Mergeable: ${pr.mergeable}`
                );

                currentStatus.push(
                  `  Mergeable state: ${pr.mergeable_state}`
                );

                currentStatus.push(
                  `  Checks: ${pr.check_summary?.completed || 0}/${pr.check_summary?.total || 0} completed`
                );

                currentStatus.push(
                  `  Check failures: ${pr.check_summary?.failure || 0}`
                );
              }

            } else {

              currentStatus.push(
                "- No associated pull request discovered."
              );
            }

            currentStatus.push(
              "",
              `State hash: ${stateHash}`,
              "",
              "This file represents the latest reconciled state.",
              ""
            );

            writeFile(
              currentFile,
              currentStatus.join("\n")
            );

            // =================================================================
            // STATE.TXT
            // =================================================================

            writeFile(
              stateFile,
              [
                `STATE_HASH=${stateHash}`,
                `STATE_TIMESTAMP_UTC=${timestamp}`,
                `STATE=${currentState}`,
                "",
                stateText,
                ""
              ].join("\n")
            );

            // =================================================================
            // PR_STATUS.TXT
            // =================================================================

            const prStatus = [
              "OLLAMA AUTONOMOUS AGENT - PR MONITOR",
              "====================================",
              "",
              `Timestamp UTC: ${timestamp}`,
              `Repository: ${owner}/${repo}`,
              `Target workflow: ${targetWorkflow}`,
              ""
            ];

            if (
              allPRs.length === 0
            ) {

              prStatus.push(
                "No associated pull requests were discovered."
              );

            } else {

              for (
                const pr of allPRs
              ) {

                prStatus.push(
                  `PR #${pr.number}`
                );

                prStatus.push(
                  `Title: ${pr.title}`
                );

                prStatus.push(
                  `State: ${pr.state}`
                );

                prStatus.push(
                  `Draft: ${pr.draft}`
                );

                prStatus.push(
                  `Head: ${pr.head_ref}`
                );

                prStatus.push(
                  `Base: ${pr.base_ref}`
                );

                prStatus.push(
                  `Head SHA: ${pr.head_sha}`
                );

                prStatus.push(
                  `Mergeable: ${pr.mergeable}`
                );

                prStatus.push(
                  `Mergeable state: ${pr.mergeable_state}`
                );

                prStatus.push(
                  `Checks total: ${pr.check_summary?.total || 0}`
                );

                prStatus.push(
                  `Checks completed: ${pr.check_summary?.completed || 0}`
                );

                prStatus.push(
                  `Checks in progress: ${pr.check_summary?.in_progress || 0}`
                );

                prStatus.push(
                  `Checks failed: ${pr.check_summary?.failure || 0}`
                );

                prStatus.push(
                  `URL: ${pr.url}`
                );

                prStatus.push("");
              }
            }

            writeFile(
              path.join(
                trackDir,
                "PR_STATUS.txt"
              ),
              prStatus.join("\n")
            );

            // =================================================================
            // LAST RECONCILIATION
            // =================================================================

            writeFile(
              path.join(
                trackDir,
                "LAST_RECONCILIATION.txt"
              ),
              [
                "OLLAMA TRACKER RECONCILIATION",
                "============================",
                "",
                `Timestamp UTC: ${timestamp}`,
                `Tracker workflow run: ${context.runId}`,
                `Tracker attempt: ${context.runAttempt}`,
                `GitHub event: ${context.eventName}`,
                "",
                `Target workflow: ${targetWorkflow}`,
                `Target workflow ID: ${workflowId || "N/A"}`,
                "",
                `Active runs: ${activeRunCount}`,
                `Active jobs: ${activeJobCount}`,
                `PRs: ${allPRs.length}`,
                "",
                `Material state change: ${materialChange}`,
                `Force snapshot: ${forceSnapshot}`,
                "",
                "Reconciliation completed.",
                ""
              ].join("\n")
            );

            // =================================================================
            // HISTORICAL EVENT CREATION
            // =================================================================
            //
            // Create a historical file when:
            //
            //   1. state changed
            //   2. the event is workflow_run
            //   3. a manual force_snapshot was requested
            //   4. an active run exists
            //
            // Scheduled reconciliations with absolutely no change do not
            // generate unlimited duplicate historical files.
            // =================================================================

            let historicalFile = null;

            const shouldRecord =
              forceSnapshot ||
              materialChange ||
              context.eventName === "workflow_run" ||
              manualRunId ||
              activeRunCount > 0;

            if (shouldRecord) {

              let eventName =
                "reconciliation_snapshot";

              if (
                context.eventName ===
                "workflow_run"
              ) {

                const action =
                  context.payload.workflow_run?.status ||
                  context.payload.action ||
                  "event";

                eventName =
                  `workflow_${safe(action)}`;
              }

              if (
                activeRunCount > 0
              ) {

                eventName =
                  "ollama_active_snapshot";
              }

              const historicalContent = [

                `Observation timestamp UTC: ${timestamp}`,

                `GitHub event: ${context.eventName}`,

                `Tracker run ID: ${context.runId}`,

                `Tracker attempt: ${context.runAttempt}`,

                "",

                `Target workflow: ${targetWorkflow}`,

                `Target workflow ID: ${workflowId || "N/A"}`,

                "",

                `Current state: ${currentState}`,

                `Active runs: ${activeRunCount}`,

                `Active jobs: ${activeJobCount}`,

                `Runs inspected: ${totalRuns}`,

                `Successful runs: ${successfulRuns}`,

                `Failed runs: ${failedRuns}`,

                `Pull requests: ${allPRs.length}`,

                "",

                "PRIMARY RUN",

                `ID: ${primaryRun?.id || "N/A"}`,

                `Status: ${primaryRun?.status || "N/A"}`,

                `Conclusion: ${primaryRun?.conclusion || "N/A"}`,

                `Branch: ${primaryRun?.branch || "N/A"}`,

                `SHA: ${primaryRun?.sha || "N/A"}`,

                `Created: ${primaryRun?.created_at || "N/A"}`,

                `Updated: ${primaryRun?.updated_at || "N/A"}`,

                `URL: ${primaryRun?.url || "N/A"}`,

                "",

                "ACTIVE RUNS",

                ...activeRuns.map(
                  run =>
                    `- ${run.id} | ${run.status} | ${run.head_branch} | ${run.head_sha}`
                ),

                "",

                "PR DETAILS",

                ...allPRs.flatMap(
                  pr => [
                    `PR #${pr.number}`,
                    `Title: ${pr.title}`,
                    `State: ${pr.state}`,
                    `Draft: ${pr.draft}`,
                    `Head: ${pr.head_ref}`,
                    `Base: ${pr.base_ref}`,
                    `SHA: ${pr.head_sha}`,
                    `Mergeable: ${pr.mergeable}`,
                    `Mergeable state: ${pr.mergeable_state}`,
                    `Checks: ${JSON.stringify(pr.check_summary || {})}`,
                    `URL: ${pr.url}`,
                    ""
                  ]
                ),

                "COMPLETE MACHINE STATE",

                JSON.stringify(
                  stateObject,
                  null,
                  2
                )
              ].join("\n");

              historicalFile =
                recordHistoricalEvent(
                  eventName,
                  historicalContent
                );

              updateLatestActivity(
                eventName,
                currentState
              );
            }

            // =================================================================
            // TRACKING INDEX
            // =================================================================

            const indexFile =
              path.join(
                trackDir,
                "TRACKING_INDEX.txt"
              );

            const historicalFiles =
              fs.readdirSync(
                trackDir
              )
              .filter(
                file =>
                  /^\d{6}_.+\.txt$/i.test(
                    file
                  )
              )
              .sort();

            const indexContent = [
              "OLLAMA AUTONOMOUS AGENT TRACKING INDEX",
              "=======================================",
              "",
              "Purpose:",
              "Chronological durable monitoring ledger.",
              "",
              `Schema version: ${process.env.TRACK_SCHEMA_VERSION || "2.0"}`,
              `Last rebuilt UTC: ${timestamp}`,
              "",
              "Historical records:",
              ""
            ];

            for (
              const file of historicalFiles
            ) {

              indexContent.push(
                file
              );
            }

            indexContent.push(
              "",
              "Mutable state files:",
              "",
              "CURRENT_STATUS.txt",
              "LATEST_ACTIVITY.txt",
              "STATE.txt",
              "PR_STATUS.txt",
              "LAST_RECONCILIATION.txt",
              "TRACKING_INDEX.txt",
              "",
              "Naming rule:",
              "NNNNNN_event-name.txt",
              "",
              "Historical files are never intentionally overwritten.",
              "",
              "Exact internal agent task timestamps require telemetry emitted",
              "by the autonomous-agent process itself.",
              ""
            );

            writeFile(
              indexFile,
              indexContent.join("\n")
            );

            // =================================================================
            // OPTIONAL DUPLICATE CLEANUP
            // =================================================================
            //
            // Only exact duplicate historical content is removed.
            //
            // This never removes a unique event.
            // =================================================================

            if (cleanupOldFiles) {

              const seen =
                new Map();

              const files =
                fs.readdirSync(
                  trackDir
                )
                .filter(
                  file =>
                    /^\d{6}_.+\.txt$/i.test(
                      file
                    )
                )
                .sort();

              for (
                const file of files
              ) {

                const fullPath =
                  path.join(
                    trackDir,
                    file
                  );

                const content =
                  readFile(
                    fullPath
                  );

                const hash =
                  sha256(
                    content
                  );

                if (
                  seen.has(hash)
                ) {

                  fs.unlinkSync(
                    fullPath
                  );

                } else {

                  seen.set(
                    hash,
                    file
                  );
                }
              }

              // Rebuild index after cleanup.
              const remaining =
                fs.readdirSync(
                  trackDir
                )
                .filter(
                  file =>
                    /^\d{6}_.+\.txt$/i.test(
                      file
                    )
                )
                .sort();

              writeFile(
                indexFile,
                [
                  "OLLAMA AUTONOMOUS AGENT TRACKING INDEX",
                  "=======================================",
                  "",
                  `Rebuilt UTC: ${timestamp}`,
                  "",
                  ...remaining,
                  ""
                ].join("\n")
              );
            }

            // =================================================================
            // OUTPUTS
            // =================================================================

            core.setOutput(
              "current_state",
              currentState
            );

            core.setOutput(
              "active_runs",
              String(activeRunCount)
            );

            core.setOutput(
              "active_jobs",
              String(activeJobCount)
            );

            core.setOutput(
              "prs",
              String(allPRs.length)
            );

            core.setOutput(
              "historical_file",
              historicalFile || ""
            );

            core.setOutput(
              "state_hash",
              stateHash
            );

            core.setOutput(
              "material_change",
              String(materialChange)
            );

            // =================================================================
            // CONSOLE DASHBOARD
            // =================================================================

            console.log("");
            console.log("============================================================");
            console.log("OLLAMA AUTONOMOUS AGENT - REALTIME MONITOR");
            console.log("============================================================");
            console.log("");
            console.log(`Observation UTC: ${timestamp}`);
            console.log(`Repository: ${owner}/${repo}`);
            console.log(`Target workflow: ${targetWorkflow}`);
            console.log(`Workflow ID: ${workflowId || "N/A"}`);
            console.log("");
            console.log(`Current state: ${currentState}`);
            console.log(`Active runs: ${activeRunCount}`);
            console.log(`Active jobs: ${activeJobCount}`);
            console.log(`Runs inspected: ${totalRuns}`);
            console.log(`Successful runs: ${successfulRuns}`);
            console.log(`Failed runs: ${failedRuns}`);
            console.log(`PRs discovered: ${allPRs.length}`);
            console.log("");
            console.log(
              `Historical record: ${historicalFile || "none - unchanged"}`
            );
            console.log(`State changed: ${materialChange}`);
            console.log("");
            console.log("Tracking directory:");
            console.log(trackDir);
            console.log("");
            console.log("============================================================");

      # ======================================================================
      # JOB SUMMARY
      # ======================================================================

      - name: Publish realtime monitoring dashboard
        if: always()
        env:
          CURRENT_STATE: ${{ steps.collect.outputs.current_state }}
          ACTIVE_RUNS: ${{ steps.collect.outputs.active_runs }}
          ACTIVE_JOBS: ${{ steps.collect.outputs.active_jobs }}
          PRS: ${{ steps.collect.outputs.prs }}
          HISTORICAL_FILE: ${{ steps.collect.outputs.historical_file }}
          STATE_HASH: ${{ steps.collect.outputs.state_hash }}
          MATERIAL_CHANGE: ${{ steps.collect.outputs.material_change }}
        shell: bash
        run: |

          set -Eeuo pipefail

          {
            echo "# 🤖 Ollama Autonomous Agent — Realtime PR Tracker"
            echo
            echo "## Current status"
            echo
            echo "| Metric | Current value |"
            echo "|---|---|"
            echo "| State | \`${CURRENT_STATE:-unknown}\` |"
            echo "| Active Ollama runs | \`${ACTIVE_RUNS:-0}\` |"
            echo "| Active jobs | \`${ACTIVE_JOBS:-0}\` |"
            echo "| Pull requests | \`${PRS:-0}\` |"
            echo "| Material state change | \`${MATERIAL_CHANGE:-unknown}\` |"
            echo
            echo "## Historical record"
            echo
            if [ -n "${HISTORICAL_FILE:-}" ]; then
              echo "Created: \`${HISTORICAL_FILE}\`"
            else
              echo "No new historical event was required during this reconciliation."
            fi
            echo
            echo "## Persistent tracking"
            echo
            echo '```text'
            echo "ollamatracks/"
            find "$TRACK_DIR" -maxdepth 1 -type f \
              -printf '%f\n' |
              sort -V
            echo '```'
            echo
            echo "## State hash"
            echo
            echo "\`${STATE_HASH:-unknown}\`"
            echo
            echo "> This workflow observes and records state. It does not cancel,"
            echo "> restart, merge, or otherwise control the autonomous agent."
          } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # ARTIFACT
      # ======================================================================

      - name: Upload complete Ollama tracking artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-pr-tracks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ollamatracks/
          if-no-files-found: warn
          retention-days: 90

      # ======================================================================
      # PERSIST TO REPOSITORY
      # ======================================================================

      - name: Configure Git identity
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # ======================================================================
      # SHOW EXACT CHANGES BEFORE COMMIT
      # ======================================================================

      - name: Inspect tracking changes
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Tracking files:"
          find "$TRACK_DIR" -maxdepth 1 -type f \
            -printf '%f\n' |
            sort -V

          echo
          echo "Git status:"
          git status --short -- "$TRACK_DIR"

      # ======================================================================
      # COMMIT ONLY OLLAMATRACKS
      # ======================================================================
      #
      # CRITICAL SAFETY PROPERTY:
      #
      # This workflow NEVER does:
      #
      #     git add .
      #
      # It stages ONLY ollamatracks/.
      #
      # Therefore unrelated agent/source changes are not accidentally
      # committed by the monitoring workflow.
      # ======================================================================

      - name: Persist ollamatracks
        if: always()
        shell: bash
        run: |

          set -Eeuo pipefail

          git add -- "$TRACK_DIR"

          if git diff --cached --quiet; then
            echo "No tracking changes require persistence."
            exit 0
          fi

          timestamp="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          git commit \
            -m "chore(ollamatracks): realtime monitoring update $timestamp [skip ci]"

          # ------------------------------------------------------------------
          # Retry push safely.
          #
          # Another tracker run may have updated the same branch after this
          # checkout. Rebase and retry rather than blindly force pushing.
          # ------------------------------------------------------------------

          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do

            echo "Push attempt $attempt/$max_attempts"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then

              echo "Tracking information successfully persisted."

              exit 0

            fi

            echo "Push failed. Refreshing remote state."

            git fetch origin "${GITHUB_REF_NAME}"

            git rebase \
              "origin/${GITHUB_REF_NAME}" || {

                echo "Rebase conflict detected."

                git rebase --abort || true

                echo "Unable to automatically rebase tracking commit."

                exit 1
              }

          done

          echo "Unable to persist tracking data after $max_attempts attempts."

          exit 1


  # ==========================================================================
  # FINAL MONITOR RESULT
  # ==========================================================================

  final-status:

    name: Final Tracker Status

    needs:
      - reconcile

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Publish final tracker status
        env:
          RECONCILE_RESULT: ${{ needs.reconcile.result }}
        shell: bash
        run: |

          set -Eeuo pipefail

          echo "============================================================"
          echo "OLLAMA PR REALTIME TRACKER - FINAL STATUS"
          echo "============================================================"
          echo
          echo "Reconciliation result: ${RECONCILE_RESULT}"
          echo

          if [ "${RECONCILE_RESULT}" = "success" ]; then

            echo "✅ Monitoring reconciliation completed."

          elif [ "${RECONCILE_RESULT}" = "skipped" ]; then

            echo "ℹ️ Monitoring reconciliation was skipped."

          else

            echo "⚠️ Monitoring reconciliation completed with warnings/errors."

          fi

          echo
          echo "The tracker itself does not control the Ollama autonomous agent."
          echo "============================================================"