name: Ollama Autonomous Agent Trigger & Live Tracker

# ============================================================================
# OLLAMA AUTONOMOUS AGENT - TRIGGER + DURABLE TELEMETRY TRACKER
# ============================================================================
#
# ARCHITECTURE
# ============================================================================
#
# This workflow has two distinct responsibilities:
#
# 1. AGENT EXECUTION
#    Start the QMOI/Ollama autonomous agent after successful validation or
#    through an explicit workflow_dispatch.
#
# 2. OBSERVABILITY
#    Maintain the durable ./ollamatracks/ protocol.
#
# The Python agent is the authoritative source for internal telemetry.
#
# The workflow is the authoritative source for GitHub-level telemetry.
#
# Together:
#
#   GitHub Actions
#        |
#        +---- workflow_run events
#        +---- schedule reconciliation
#        +---- workflow_dispatch
#        |
#        v
#   ollamatracks/
#        |
#        +---- immutable chronological events
#        +---- CURRENT_STATUS.txt
#        +---- LATEST_ACTIVITY.txt
#        +---- TRACKING_INDEX.txt
#        +---- STATE.txt
#        +---- PR_STATUS.txt
#        +---- agent runtime telemetry
#        |
#        v
#   QMOI/Ollama autonomous agent
#        |
#        +---- run
#        +---- iteration
#        +---- task
#        +---- tool
#        +---- command
#        +---- validation
#        +---- repair
#        +---- checkpoint
#        +---- error
#        +---- completion
#
# IMPORTANT
# ============================================================================
#
# The workflow does NOT attempt to keep a GitHub-hosted runner alive forever.
#
# GitHub-hosted jobs have a maximum execution duration.
#
# Instead:
#
#   - the Python agent emits telemetry continuously
#   - checkpoints are written into ollamatracks/
#   - the workflow persists the final/current state
#   - scheduled reconciliation discovers active workflow runs
#   - workflow_run events provide event-driven monitoring
#   - Actions logs provide live runner-level visibility
#   - artifacts provide a secondary durable copy
#
# This is intentionally event-driven rather than an infinite workflow loop.
#
# ============================================================================


on:

  # --------------------------------------------------------------------------
  # Validation workflow lifecycle
  # --------------------------------------------------------------------------

  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"

    types:
      - requested
      - in_progress
      - completed

  # --------------------------------------------------------------------------
  # Manual execution
  # --------------------------------------------------------------------------

  workflow_dispatch:

    inputs:

      reason:
        description: "Reason for manually starting/reconciling the autonomous agent"
        required: false
        type: string
        default: "Manual autonomous-agent execution"

      run_validation:
        description: "Run validate-all before autonomous execution"
        required: false
        type: boolean
        default: true

      force_agent:
        description: "Start the autonomous agent even if this is not a validation-completed event"
        required: false
        type: boolean
        default: true

      force_snapshot:
        description: "Force creation of a tracking snapshot"
        required: false
        type: boolean
        default: true

  # --------------------------------------------------------------------------
  # Periodic reconciliation
  # --------------------------------------------------------------------------
  #
  # GitHub supports a minimum scheduled interval of five minutes.
  #
  # This is the recovery/reconciliation layer.
  #
  # It does not blindly start another autonomous agent.
  # --------------------------------------------------------------------------

  schedule:
    - cron: "*/5 * * * *"


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:

  # Required to persist ./ollamatracks/
  contents: write

  # Required to inspect workflow runs/jobs.
  actions: read

  # Only read PR information.
  pull-requests: read

  # Required for check/status inspection.
  checks: read
  statuses: read


# ============================================================================
# GLOBAL CONCURRENCY
# ============================================================================
#
# ALL TRACKING WRITERS use the same concurrency group.
#
# This is important.
#
# A group based only on github.event.workflow_run.id would allow different
# workflow events to modify ollamatracks concurrently.
#
# A single writer group prevents two tracker invocations from allocating the
# same sequence number or overwriting CURRENT_STATUS simultaneously.
#
# We intentionally do not cancel an active writer.
# ============================================================================

concurrency:

  group: ollama-autonomous-agent-tracking-writer

  cancel-in-progress: false


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  TRACK_DIR: ollamatracks

  TRACK_SCHEMA_VERSION: "2.0"

  PYTHON_VERSION: "3.11"

  TARGET_VALIDATION_WORKFLOW:
    "Ollama PR Validation - 293+ Platform Features"

  # Number of workflow runs inspected during reconciliation.
  MAX_RUNS_TO_INSPECT: "25"

  # Number of jobs inspected per workflow run.
  MAX_JOBS_PER_RUN: "100"

  # Number of recent immutable records shown in summaries.
  RECENT_EVENTS_TO_DISPLAY: "20"

  # Agent telemetry protocol.
  OLLAMA_TELEMETRY_PROTOCOL: "ollamatracks-v2"


# ============================================================================
# JOB
# ============================================================================
#
# One writer job deliberately handles initialization, execution and final
# persistence.
#
# This avoids the stale-checkout / duplicate-sequence problem that existed in
# the previous multi-job implementation.
# ============================================================================

jobs:

  ollama-agent:

    name: Ollama Autonomous Agent + Live Tracking

    runs-on: ubuntu-latest

    # Keep below GitHub-hosted runner's six-hour maximum.
    timeout-minutes: 350

    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ======================================================================
      # INITIALIZE TRACKING SYSTEM
      # ======================================================================

      - name: Initialize ollamatracks protocol
        id: initialize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_STATUS: ${{ github.event.workflow_run.status }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          MANUAL_REASON: ${{ inputs.reason }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          INDEX="$TRACK_DIR/TRACKING_INDEX.txt"
          CURRENT="$TRACK_DIR/CURRENT_STATUS.txt"
          LATEST="$TRACK_DIR/LATEST_ACTIVITY.txt"
          STATE="$TRACK_DIR/STATE.txt"
          PR_STATUS="$TRACK_DIR/PR_STATUS.txt"
          PROTOCOL="$TRACK_DIR/TRACKING_PROTOCOL.txt"
          MANIFEST="$TRACK_DIR/TRACKING_MANIFEST.txt"

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          # ------------------------------------------------------------------
          # Protocol documentation
          # ------------------------------------------------------------------

          if [ ! -f "$PROTOCOL" ]; then
            cat > "$PROTOCOL" <<'EOF'
          OLLAMA TRACKING PROTOCOL
          ========================

          Protocol: ollamatracks-v2
          Schema: 2.0

          PURPOSE
          -------
          This directory is the durable observability protocol for the
          QMOI/Ollama autonomous agent.

          AUTHORITATIVE EVENT ORDER
          --------------------------
          Historical event records use:

              NNNNNN_event-name.txt

          NNNNNN is a monotonically increasing six-digit sequence.

          The sequence is the authoritative repository record order.

          Every immutable event MUST contain:

              Sequence
              Event ID
              Event type
              Timestamp UTC
              Repository
              Workflow
              Workflow run ID
              Workflow attempt
              Actor
              Agent run ID
              Iteration
              Task ID
              Action
              Status
              Result

          TIMESTAMP RULE
          --------------
          UTC timestamps use:

              YYYY-MM-DDTHH:MM:SS.mmmZ

          EVENT TYPES
          -----------
          RUN
          VALIDATION
          AGENT
          ITERATION
          TASK
          ACTION
          TOOL
          COMMAND
          TEST
          BUILD
          REPAIR
          CHECKPOINT
          PR
          ERROR
          WARNING
          HEARTBEAT
          STATE
          SUMMARY

          IMMUTABILITY
          ------------
          Historical records must never be overwritten.

          Mutable files are:

              CURRENT_STATUS.txt
              LATEST_ACTIVITY.txt
              STATE.txt
              PR_STATUS.txt

          These represent current state and may be replaced.

          RAW TELEMETRY
          -------------
          Structured telemetry may also be retained in:

              telemetry.jsonl

          Each line represents one telemetry event.

          EVENT ID
          --------
          Every event should have a unique event_id.

          The recommended form is:

              agent-run-id + timestamp + sequence

          IDEMPOTENCY
          -----------
          Reconciliation operations should avoid creating duplicate
          historical events when the underlying GitHub state has not changed.

          LIVE STATUS
          -----------
          CURRENT_STATUS.txt is a projection of the latest known state.

          It is NOT a replacement for historical records.

          RECOVERY
          --------
          If the directory does not exist, the workflow must recreate it.

          If mutable state files are missing, they must be recreated.

          If historical records exist, their highest sequence must be
          discovered and the next sequence must be greater than it.

          NEVER reuse an existing sequence.
          EOF
          fi

          # ------------------------------------------------------------------
          # Tracking index
          # ------------------------------------------------------------------

          if [ ! -f "$INDEX" ]; then
            cat > "$INDEX" <<EOF
          OLLAMA AUTONOMOUS AGENT TRACKING INDEX
          ======================================

          Protocol: ollamatracks-v2
          Schema: $TRACK_SCHEMA_VERSION

          Repository: $GITHUB_REPOSITORY

          Created UTC:
          $now

          Historical records:
          NNNNNN_event-name.txt

          Sequence:
          Monotonically increasing six-digit number.

          Mutable state:
          CURRENT_STATUS.txt
          LATEST_ACTIVITY.txt
          STATE.txt
          PR_STATUS.txt

          Structured stream:
          telemetry.jsonl

          Historical records are append-only.
          Mutable state files are projections of the latest state.
          EOF
          fi

          # ------------------------------------------------------------------
          # Manifest
          # ------------------------------------------------------------------

          if [ ! -f "$MANIFEST" ]; then
            cat > "$MANIFEST" <<EOF
          OLLAMA TRACKING MANIFEST
          ========================

          Protocol: ollamatracks-v2
          Schema: $TRACK_SCHEMA_VERSION

          Repository: $GITHUB_REPOSITORY

          Tracking directory:
          $TRACK_DIR

          Required files:

          TRACKING_PROTOCOL.txt
          TRACKING_MANIFEST.txt
          TRACKING_INDEX.txt
          CURRENT_STATUS.txt
          LATEST_ACTIVITY.txt
          STATE.txt
          PR_STATUS.txt
          telemetry.jsonl

          Historical records:

          NNNNNN_<event>.txt

          Timestamp standard:

          UTC
          YYYY-MM-DDTHH:MM:SS.mmmZ
          EOF
          fi

          touch "$CURRENT"
          touch "$LATEST"
          touch "$STATE"
          touch "$PR_STATUS"
          touch "$TRACK_DIR/telemetry.jsonl"

          # ------------------------------------------------------------------
          # Determine next immutable sequence.
          #
          # The job itself is serialized by workflow-level concurrency.
          # ------------------------------------------------------------------

          highest="$(
            find "$TRACK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '[0-9][0-9][0-9][0-9][0-9][0-9]_*.txt' \
              -printf '%f\n' 2>/dev/null |
            sed -E 's/^([0-9]{6})_.*/\1/' |
            sort -n |
            tail -1
          )"

          highest="${highest:-0}"

          if ! [[ "$highest" =~ ^[0-9]+$ ]]; then
            highest=0
          fi

          next=$((10#$highest + 1))

          printf -v sequence "%06d" "$next"

          # ------------------------------------------------------------------
          # Export metadata.
          # ------------------------------------------------------------------

          {
            echo "tracking_sequence=$sequence"
            echo "tracking_timestamp=$now"
          } >> "$GITHUB_OUTPUT"

          # ------------------------------------------------------------------
          # Initialize current status.
          # ------------------------------------------------------------------

          cat > "$CURRENT" <<EOF
          OLLAMA AUTONOMOUS AGENT - CURRENT STATUS
          =========================================

          Protocol: ollamatracks-v2
          Schema: $TRACK_SCHEMA_VERSION

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Workflow run ID:
          $GITHUB_RUN_ID

          Workflow attempt:
          $GITHUB_RUN_ATTEMPT

          Trigger event:
          $EVENT_NAME

          Agent state:
          INITIALIZING

          Current task:
          TRACKING_INITIALIZATION

          Current iteration:
          UNKNOWN

          Current action:
          INITIALIZING

          Status:
          RUNNING

          Next historical sequence:
          $sequence

          Last update UTC:
          $now
          EOF

          cat > "$LATEST" <<EOF
          OLLAMA LATEST ACTIVITY
          ======================

          Timestamp UTC:
          $now

          Event:
          TRACKER_INITIALIZED

          Workflow:
          $GITHUB_WORKFLOW

          Workflow run:
          $GITHUB_RUN_ID

          Attempt:
          $GITHUB_RUN_ATTEMPT

          Status:
          SUCCESS
          EOF

          cat > "$STATE" <<EOF
          OLLAMA AGENT STATE

          protocol=ollamatracks-v2
          schema=$TRACK_SCHEMA_VERSION
          repository=$GITHUB_REPOSITORY
          workflow=$GITHUB_WORKFLOW
          workflow_run_id=$GITHUB_RUN_ID
          workflow_attempt=$GITHUB_RUN_ATTEMPT
          event=$EVENT_NAME
          state=INITIALIZING
          current_iteration=0
          current_task=TRACKING_INITIALIZATION
          current_action=INITIALIZING
          timestamp_utc=$now
          EOF

          echo "Tracking protocol initialized."
          echo "Next sequence: $sequence"


      # ======================================================================
      # RECORD INITIALIZATION
      # ======================================================================

      - name: Record tracking initialization
        shell: bash
        run: |
          set -Eeuo pipefail

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          highest="$(
            find "$TRACK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '[0-9][0-9][0-9][0-9][0-9][0-9]_*.txt' \
              -printf '%f\n' |
            sed -E 's/^([0-9]{6})_.*/\1/' |
            sort -n |
            tail -1
          )"

          highest="${highest:-0}"
          next=$((10#$highest + 1))

          printf -v seq "%06d" "$next"

          cat > "$TRACK_DIR/${seq}_tracker_initialized.txt" <<EOF
          OLLAMA TRACKING EVENT
          =====================

          Sequence:
          $seq

          Event ID:
          tracker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${seq}

          Event type:
          STATE

          Event:
          TRACKER_INITIALIZED

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Workflow run ID:
          $GITHUB_RUN_ID

          Workflow attempt:
          $GITHUB_RUN_ATTEMPT

          Actor:
          $GITHUB_ACTOR

          Trigger:
          ${{ github.event_name }}

          Result:
          SUCCESS
          EOF


      # ======================================================================
      # DECIDE EXECUTION MODE
      # ======================================================================

      - name: Determine execution mode
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FORCE_AGENT: ${{ inputs.force_agent }}
          RUN_VALIDATION: ${{ inputs.run_validation }}
        run: |
          set -Eeuo pipefail

          mode="monitor"
          reason="Monitoring/reconciliation event."

          case "$EVENT_NAME" in

            workflow_dispatch)
              if [ "$FORCE_AGENT" = "true" ]; then
                mode="agent"
                reason="Manual autonomous-agent execution."
              else
                mode="monitor"
                reason="Manual monitoring-only execution."
              fi
              ;;

            workflow_run)
              if [ "$VALIDATION_CONCLUSION" = "success" ]; then
                mode="agent"
                reason="Validation workflow completed successfully."
              else
                mode="monitor"
                reason="Validation workflow is not successfully completed."
              fi
              ;;

            schedule)
              mode="monitor"
              reason="Scheduled reconciliation pass."
              ;;

            *)
              mode="monitor"
              reason="Unknown event; monitoring only."
              ;;

          esac

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          echo "Execution mode: $mode"
          echo "Reason: $reason"


      # ======================================================================
      # RECORD EXECUTION DECISION
      # ======================================================================

      - name: Record execution decision
        shell: bash
        env:
          MODE: ${{ steps.decision.outputs.mode }}
          REASON: ${{ steps.decision.outputs.reason }}
        run: |
          set -Eeuo pipefail

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          highest="$(
            find "$TRACK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '[0-9][0-9][0-9][0-9][0-9][0-9]_*.txt' \
              -printf '%f\n' |
            sed -E 's/^([0-9]{6})_.*/\1/' |
            sort -n |
            tail -1
          )"

          highest="${highest:-0}"
          next=$((10#$highest + 1))

          printf -v seq "%06d" "$next"

          event_name="execution_mode_${MODE}"

          cat > "$TRACK_DIR/${seq}_${event_name}.txt" <<EOF
          OLLAMA EXECUTION DECISION

          Sequence:
          $seq

          Event type:
          STATE

          Event:
          EXECUTION_MODE_SELECTED

          Timestamp UTC:
          $now

          Workflow run:
          $GITHUB_RUN_ID

          Attempt:
          $GITHUB_RUN_ATTEMPT

          Mode:
          $MODE

          Reason:
          $REASON

          Result:
          SUCCESS
          EOF


      # ======================================================================
      # GITHUB-LEVEL RECONCILIATION
      # ======================================================================
      #
      # This step uses GitHub's API to determine what is happening around the
      # validation workflow.
      #
      # It is deliberately independent of the Python agent.
      # ======================================================================

      - name: Reconcile GitHub workflow and PR state
        id: reconcile
        uses: actions/github-script@v7
        env:
          TRACK_DIR: ${{ env.TRACK_DIR }}
          TARGET_WORKFLOW: ${{ env.TARGET_VALIDATION_WORKFLOW }}
          MAX_RUNS: ${{ env.MAX_RUNS_TO_INSPECT }}
          MAX_JOBS: ${{ env.MAX_JOBS_PER_RUN }}
        with:
          github-token: ${{ github.token }}

          script: |
            const fs = require("fs");
            const path = require("path");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const trackDir =
              process.env.TRACK_DIR || "ollamatracks";

            const targetWorkflow =
              process.env.TARGET_WORKFLOW ||
              "Ollama PR Validation - 293+ Platform Features";

            const maxRuns =
              Number(process.env.MAX_RUNS || "25");

            const maxJobs =
              Number(process.env.MAX_JOBS || "100");

            fs.mkdirSync(trackDir, { recursive: true });

            const now = new Date();

            function iso(date = now) {
              return date.toISOString();
            }

            function safe(value, fallback = "unknown") {
              const result = String(value ?? fallback)
                .replace(/[^a-zA-Z0-9._-]+/g, "-")
                .replace(/-+/g, "-")
                .replace(/^-|-$/g, "");

              return result || fallback;
            }

            function nextSequence() {

              const files = fs.readdirSync(trackDir);

              let highest = 0;

              for (const file of files) {

                const match =
                  file.match(/^([0-9]{6})_.*\.txt$/);

                if (!match) continue;

                const value =
                  Number(match[1]);

                if (Number.isFinite(value)) {
                  highest = Math.max(highest, value);
                }
              }

              return String(highest + 1).padStart(6, "0");
            }

            function writeEvent(event) {

              const seq = nextSequence();

              const eventId =
                `${event.type.toLowerCase()}-${context.runId}-${Date.now()}-${seq}`;

              const filename =
                `${seq}_${safe(event.name || event.type.toLowerCase())}.txt`;

              const file =
                path.join(trackDir, filename);

              const lines = [
                "OLLAMA TRACKING EVENT",
                "=====================",
                "",
                `Sequence: ${seq}`,
                `Event ID: ${eventId}`,
                `Event type: ${event.type || "STATE"}`,
                `Event: ${event.name || "UNKNOWN"}`,
                "",
                `Timestamp UTC: ${iso()}`,
                "",
                `Repository: ${owner}/${repo}`,
                `Workflow: ${context.workflow}`,
                `Workflow run ID: ${context.runId}`,
                `Workflow attempt: ${context.runAttempt}`,
                `Actor: ${context.actor}`,
                "",
                `Status: ${event.status || "OBSERVED"}`,
                "",
                "Details:",
                JSON.stringify(event.details || {}, null, 2),
                "",
              ];

              fs.writeFileSync(
                file,
                lines.join("\n"),
                "utf8"
              );

              return {
                sequence: seq,
                eventId,
                file
              };
            }

            // --------------------------------------------------------------
            // Locate target workflow.
            // --------------------------------------------------------------

            let workflow = null;

            try {

              const workflows =
                await github.paginate(
                  github.rest.actions.listRepoWorkflows,
                  {
                    owner,
                    repo,
                    per_page: 100
                  }
                );

              workflow =
                workflows.find(
                  item =>
                    item.name === targetWorkflow
                ) || null;

            } catch (error) {

              writeEvent({
                type: "ERROR",
                name: "workflow_discovery_failed",
                status: "ERROR",
                details: {
                  message: