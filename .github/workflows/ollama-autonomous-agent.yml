name: Ollama Autonomous Agent Trigger & Live Tracker

# ============================================================================
# OLLAMA AUTONOMOUS AGENT
# ============================================================================
#
# PURPOSE
# -------
# This workflow is responsible for:
#
#   1. Starting the autonomous Ollama/QMOI agent after successful validation.
#   2. Allowing an authorized manual agent execution.
#   3. Maintaining durable agent telemetry.
#   4. Recording workflow-level state in ollamatracks/.
#   5. Persisting tracking artifacts and repository state.
#
# IMPORTANT
# ---------
# This is NOT an infinite daemon.
#
# GitHub-hosted runners are finite execution environments. The architecture
# therefore uses:
#
#   workflow_run
#       +
#   workflow_dispatch
#       +
#   schedule
#       +
#   durable tracking
#       +
#   artifacts
#
# The autonomous Python agent remains the authority for internal execution
# telemetry.
#
# GitHub Actions remains the authority for workflow-level telemetry.
#
# ============================================================================
#
# SECURITY
# --------
# This workflow can execute with write permissions.
#
# NEVER checkout and execute arbitrary pull-request head code here.
#
# workflow_run executes in the context of the default branch. We deliberately
# checkout the default branch.
#
# ============================================================================
#
# EXECUTION RULES
# ---------------
#
# workflow_run:
#
#   validation success
#       -> run autonomous agent
#
#   validation failure/cancelled/etc.
#       -> record monitoring event only
#
# workflow_dispatch:
#
#   force_agent=true
#       -> run autonomous agent
#
#   force_agent=false
#       -> tracking/monitoring only
#
# schedule:
#
#   -> monitoring/reconciliation only
#   -> NEVER blindly starts another agent
#
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # Validation lifecycle
  # --------------------------------------------------------------------------

  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"

    types:
      - requested
      - in_progress
      - completed

  # --------------------------------------------------------------------------
  # Manual execution
  # --------------------------------------------------------------------------

  workflow_dispatch:

    inputs:

      reason:
        description: "Reason for this autonomous-agent execution or monitoring run"
        required: false
        type: string
        default: "Manual autonomous-agent execution"

      force_agent:
        description: "Actually execute the autonomous agent"
        required: false
        type: boolean
        default: true

      force_snapshot:
        description: "Create a tracking snapshot even if state did not change"
        required: false
        type: boolean
        default: true

      max_iterations:
        description: "Maximum autonomous-agent iterations"
        required: false
        type: string
        default: "200"

      max_per_iteration:
        description: "Maximum tasks/actions allowed per iteration"
        required: false
        type: string
        default: "200"

  # --------------------------------------------------------------------------
  # Recovery/reconciliation
  # --------------------------------------------------------------------------

  schedule:
    - cron: "*/5 * * * *"


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:

  contents: write
  actions: read
  pull-requests: read
  checks: read
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# A single writer prevents multiple instances from modifying the tracking
# repository state simultaneously.
#
# queue: max is supported by GitHub Actions and permits multiple pending
# executions rather than replacing the previous pending execution.
#
# cancel-in-progress remains false.
# ============================================================================

concurrency:

  group: ollama-autonomous-agent-tracking-writer

  cancel-in-progress: false

  queue: max


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  TRACK_DIR: ollamatracks

  TRACK_SCHEMA_VERSION: "3.0"

  TRACKING_PROTOCOL: "ollamatracks-v3"

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  AGENT_SCRIPT: "scripts/ollama_autonomous_agent.py"

  PYTHON_VERSION: "3.12"

  DEFAULT_MAX_ITERATIONS: "200"

  DEFAULT_MAX_PER_ITERATION: "200"

  TELEMETRY_FILE: "ollamatracks/telemetry.jsonl"


# ============================================================================
# JOBS
# ============================================================================

jobs:

  ollama-agent:

    name: Ollama Autonomous Agent + Live Tracking

    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ======================================================================
      # CHECKOUT TRUSTED DEFAULT-BRANCH STATE
      # ======================================================================

      - name: Checkout trusted repository state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}


      # ======================================================================
      # SETUP PYTHON
      # ======================================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            poetry.lock
            uv.lock


      # ======================================================================
      # EXECUTE TEST SUITE WITH PYTHONPATH CONFIGURED
      # ======================================================================

      - name: Execute Test Suite (40+ Tests)
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python -m pytest tests/test_ollama_autonomous_agent.py -v


      # ======================================================================
      # INITIALIZE TRACKING
      # ======================================================================

      - name: Initialize durable tracking
        id: initialize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VALIDATION_STATUS: ${{ github.event.workflow_run.status }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VALIDATION_URL: ${{ github.event.workflow_run.html_url }}
          MANUAL_REASON: ${{ inputs.reason }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          INDEX="$TRACK_DIR/TRACKING_INDEX.txt"
          CURRENT="$TRACK_DIR/CURRENT_STATUS.txt"
          LATEST="$TRACK_DIR/LATEST_ACTIVITY.txt"
          STATE="$TRACK_DIR/STATE.txt"
          PR_STATUS="$TRACK_DIR/PR_STATUS.txt"
          PROTOCOL="$TRACK_DIR/TRACKING_PROTOCOL.txt"
          MANIFEST="$TRACK_DIR/TRACKING_MANIFEST.txt"
          TELEMETRY="$TRACK_DIR/telemetry.jsonl"

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          # ------------------------------------------------------------------
          # Protocol documentation
          # ------------------------------------------------------------------

          if [ ! -f "$PROTOCOL" ]; then

            cat > "$PROTOCOL" <<'EOF'
          OLLAMA TRACKING PROTOCOL
          ========================

          Protocol:
          ollamatracks-v3

          Schema:
          3.0

          PURPOSE
          -------
          Durable observability protocol for the QMOI/Ollama autonomous agent.

          AUTHORITATIVE SOURCES
          ----------------------
          GitHub Actions:
            workflow lifecycle
            workflow runs
            jobs
            repository state

          Python autonomous agent:
            agent execution
            iterations
            tasks
            tools
            commands
            repairs
            checkpoints
            errors
            completion

          HISTORICAL EVENTS
          -----------------
          Format:

              NNNNNN_event-name.txt

          NNNNNN:
              six-digit monotonically increasing sequence

          Historical event records must never intentionally be overwritten.

          MUTABLE STATE
          -------------
          CURRENT_STATUS.txt
          LATEST_ACTIVITY.txt
          STATE.txt
          PR_STATUS.txt

          STRUCTURED TELEMETRY
          --------------------
          telemetry.jsonl

          One JSON object per line.

          TIMESTAMP
          ---------
          UTC ISO-8601 with milliseconds:

              YYYY-MM-DDTHH:MM:SS.mmmZ

          EVENT TYPES
          -----------
          RUN
          VALIDATION
          AGENT
          ITERATION
          TASK
          ACTION
          TOOL
          COMMAND
          TEST
          BUILD
          REPAIR
          CHECKPOINT
          PR
          ERROR
          WARNING
          HEARTBEAT
          STATE
          SUMMARY

          REQUIRED EVENT FIELDS
          ---------------------
          event_id
          event_type
          timestamp_utc
          repository
          workflow
          workflow_run_id
          workflow_attempt
          actor
          status

          AGENT EVENTS SHOULD ALSO PROVIDE
          --------------------------------
          agent_run_id
          iteration
          task_id
          action
          result

          SECURITY
          --------
          This workflow must not execute arbitrary pull-request head code.

          RECOVERY
          --------
          Missing mutable files must be recreated.

          Existing historical sequence numbers must never be reused.
          EOF

          fi


          # ------------------------------------------------------------------
          # Tracking index
          # ------------------------------------------------------------------

          if [ ! -f "$INDEX" ]; then

            cat > "$INDEX" <<EOF
          OLLAMA AUTONOMOUS AGENT TRACKING INDEX
          ======================================

          Protocol:
          $TRACKING_PROTOCOL

          Schema:
          $TRACK_SCHEMA_VERSION

          Repository:
          $GITHUB_REPOSITORY

          Created UTC:
          $now

          Historical records:
          NNNNNN_event-name.txt

          Mutable state:
          CURRENT_STATUS.txt
          LATEST_ACTIVITY.txt
          STATE.txt
          PR_STATUS.txt

          Structured telemetry:
          telemetry.jsonl

          Historical records are append-only.
          Mutable files are state projections.
          EOF

          fi


          # ------------------------------------------------------------------
          # Manifest
          # ------------------------------------------------------------------

          if [ ! -f "$MANIFEST" ]; then

            cat > "$MANIFEST" <<EOF
          OLLAMA TRACKING MANIFEST
          ========================

          Protocol:
          $TRACKING_PROTOCOL

          Schema:
          $TRACK_SCHEMA_VERSION

          Repository:
          $GITHUB_REPOSITORY

          Required files:

          TRACKING_PROTOCOL.txt
          TRACKING_MANIFEST.txt
          TRACKING_INDEX.txt
          CURRENT_STATUS.txt
          LATEST_ACTIVITY.txt
          STATE.txt
          PR_STATUS.txt
          telemetry.jsonl

          Historical files:

          NNNNNN_<event>.txt

          Timestamp:

          YYYY-MM-DDTHH:MM:SS.mmmZ
          EOF

          fi


          touch "$CURRENT"
          touch "$LATEST"
          touch "$STATE"
          touch "$PR_STATUS"
          touch "$TELEMETRY"


          # ------------------------------------------------------------------
          # Determine highest historical sequence.
          # ------------------------------------------------------------------

          highest="$(
            find "$TRACK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '[0-9][0-9][0-9][0-9][0-9][0-9]_*.txt' \
              -printf '%f\n' 2>/dev/null |
            sed -E 's/^([0-9]{6})_.*/\1/' |
            sort -n |
            tail -1
          )"

          highest="${highest:-0}"

          if ! [[ "$highest" =~ ^[0-9]+$ ]]; then
            highest=0
          fi

          next=$((10#$highest + 1))

          printf -v sequence "%06d" "$next"


          # ------------------------------------------------------------------
          # Agent run identifier.
          # ------------------------------------------------------------------

          agent_run_id="agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"


          # ------------------------------------------------------------------
          # Export metadata.
          # ------------------------------------------------------------------

          {
            echo "tracking_sequence=$sequence"
            echo "tracking_timestamp=$now"
            echo "agent_run_id=$agent_run_id"
          } >> "$GITHUB_OUTPUT"


          # ------------------------------------------------------------------
          # Current state.
          # ------------------------------------------------------------------

          cat > "$CURRENT.tmp" <<EOF
          OLLAMA AUTONOMOUS AGENT - CURRENT STATUS
          =========================================

          Protocol:
          $TRACKING_PROTOCOL

          Schema:
          $TRACK_SCHEMA_VERSION

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Workflow run ID:
          $GITHUB_RUN_ID

          Workflow attempt:
          $GITHUB_RUN_ATTEMPT

          Trigger event:
          $EVENT_NAME

          Validation workflow:
          $VALIDATION_WORKFLOW_NAME

          Validation run ID:
          ${VALIDATION_RUN_ID:-unknown}

          Validation status:
          ${VALIDATION_STATUS:-unknown}

          Validation conclusion:
          ${VALIDATION_CONCLUSION:-unknown}

          Validation URL:
          ${VALIDATION_URL:-unknown}

          Agent run ID:
          $agent_run_id

          Agent state:
          INITIALIZING

          Current iteration:
          0

          Current task:
          TRACKING_INITIALIZATION

          Current action:
          INITIALIZING

          Status:
          RUNNING

          Next historical sequence:
          $sequence

          Last update UTC:
          $now
          EOF

          mv "$CURRENT.tmp" "$CURRENT"


          # ------------------------------------------------------------------
          # Latest activity.
          # ------------------------------------------------------------------

          cat > "$LATEST.tmp" <<EOF
          OLLAMA LATEST ACTIVITY
          ======================

          Timestamp UTC:
          $now

          Event:
          TRACKER_INITIALIZED

          Agent run:
          $agent_run_id

          Workflow:
          $GITHUB_WORKFLOW

          Workflow run:
          $GITHUB_RUN_ID

          Attempt:
          $GITHUB_RUN_ATTEMPT

          Trigger:
          $EVENT_NAME

          Status:
          SUCCESS
          EOF

          mv "$LATEST.tmp" "$LATEST"


          # ------------------------------------------------------------------
          # State.
          # ------------------------------------------------------------------

          cat > "$STATE.tmp" <<EOF
          OLLAMA AGENT STATE

          protocol=$TRACKING_PROTOCOL
          schema=$TRACK_SCHEMA_VERSION
          repository=$GITHUB_REPOSITORY
          workflow=$GITHUB_WORKFLOW
          workflow_run_id=$GITHUB_RUN_ID
          workflow_attempt=$GITHUB_RUN_ATTEMPT
          event=$EVENT_NAME
          agent_run_id=$agent_run_id
          state=INITIALIZING
          current_iteration=0
          current_task=TRACKING_INITIALIZATION
          current_action=INITIALIZING
          timestamp_utc=$now
          EOF

          mv "$STATE.tmp" "$STATE"


          # ------------------------------------------------------------------
          # Initial JSONL telemetry.
          # ------------------------------------------------------------------

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          telemetry = os.environ["TRACK_DIR"] + "/telemetry.jsonl"

          event = {
              "event_id": (
                  f"tracker-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}-initialized"
              ),
              "event_type": "STATE",
              "event": "TRACKER_INITIALIZED",
              "timestamp_utc": datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z"),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
              "status": "SUCCESS",
          }

          with open(telemetry, "a", encoding="utf-8") as fh:
              fh.write(json.dumps(event, separators=(",", ":")) + "\n")
          PY

          echo "Tracking protocol initialized."
          echo "Agent run ID: $agent_run_id"
          echo "Next sequence: $sequence"


      # ======================================================================
      # RECORD INITIALIZATION
      # ======================================================================

      - name: Record initialization event
        shell: bash
        run: |
          set -Eeuo pipefail

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          highest="$(
            find "$TRACK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '[0-9][0-9][0-9][0-9][0-9][0-9]_*.txt' \
              -printf '%f\n' 2>/dev/null |
            sed -E 's/^([0-9]{6})_.*/\1/' |
            sort -n |
            tail -1
          )"

          highest="${highest:-0}"

          if ! [[ "$highest" =~ ^[0-9]+$ ]]; then
            highest=0
          fi

          next=$((10#$highest + 1))

          printf -v seq "%06d" "$next"

          cat > "$TRACK_DIR/${seq}_tracker_initialized.txt" <<EOF
          OLLAMA TRACKING EVENT
          =====================

          Sequence:
          $seq

          Event ID:
          tracker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${seq}

          Event type:
          STATE

          Event:
          TRACKER_INITIALIZED

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Workflow run ID:
          $GITHUB_RUN_ID

          Workflow attempt:
          $GITHUB_RUN_ATTEMPT

          Actor:
          $GITHUB_ACTOR

          Trigger:
          $GITHUB_EVENT_NAME

          Result:
          SUCCESS
          EOF


      # ======================================================================
      # DETERMINE EXECUTION MODE
      # ======================================================================

      - name: Determine execution mode
        id: decision
        shell: bash
        env:
          EVENT_NAME: "${{ github.event_name }}"
          EVENT_ACTION: "${{ github.event.action }}"
          VALIDATION_CONCLUSION: "${{ github.event.workflow_run.conclusion }}"
          FORCE_AGENT_INPUT: "${{ inputs.force_agent }}"
        run: |
          set -Eeuo pipefail

          execute_agent="false"
          reason=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${FORCE_AGENT_INPUT:-true}" = "true" ]; then
              execute_agent="true"
              reason="Manual dispatch with force_agent=true"
            else
              reason="Manual dispatch with force_agent=false"
            fi
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "${VALIDATION_CONCLUSION:-}" = "success" ]; then
              execute_agent="true"
              reason="Validation workflow succeeded"
            else
              reason="Validation workflow did not succeed (conclusion: ${VALIDATION_CONCLUSION:-unknown})"
            fi
          elif [ "$EVENT_NAME" = "schedule" ]; then
            reason="Scheduled reconciliation run (agent execution disabled)"
          else
            reason="Unknown event trigger: $EVENT_NAME"
          fi

          echo "execute_agent=$execute_agent" >> "$GITHUB_OUTPUT"
          echo "Decision reason: $reason"


      # ======================================================================
      # EXECUTE AUTONOMOUS AGENT (IF AUTHORIZED)
      # ======================================================================

      - name: Run Autonomous Agent
        if: steps.decision.outputs.execute_agent == 'true'
        shell: bash
        env:
          OLLAMA_HOST: "http://127.0.0.1:11434"
          OLLAMA_MODEL: "qwen2.5-coder:3b"
          QMOI_MAX_ITERATIONS: "${{ inputs.max_iterations || env.DEFAULT_MAX_ITERATIONS }}"
        run: |
          set -Eeuo pipefail
          python "$AGENT_SCRIPT" validate-all


      # ======================================================================
      # COMMIT & PUSH TRACKING STATE CHANGES
      # ======================================================================

      - name: Commit tracking state updates
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --global user.name "QMOI Autonomous Agent Bot"
          git config --global user.email "action@github.com"

          git add "$TRACK_DIR"

          if git diff --staged --quiet; then
            echo "No tracking changes to commit."
          else
            git commit -m "chore(ollamatracks): update agent telemetry and tracking state [skip ci]"
            git push origin "${{ github.event.repository.default_branch }}" || echo "Push skipped or failed gracefully."
          fi
