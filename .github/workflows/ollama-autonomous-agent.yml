name: Ollama Autonomous Agent Trigger & Live Tracker

# ============================================================================
# OLLAMA AUTONOMOUS AGENT
# ============================================================================
#
# PURPOSE
# -------
# This workflow:
#
#   1. Starts the autonomous Ollama/QMOI agent after successful validation.
#   2. Allows authorized manual execution.
#   3. Maintains durable agent telemetry.
#   4. Records workflow-level state in ollamatracks/.
#   5. Preserves tracking artifacts even when execution encounters errors.
#   6. Performs scheduled health/reconciliation checks.
#
# SECURITY
# --------
# Only the repository default branch is checked out.
# This workflow MUST NOT execute arbitrary pull-request head code.
#
# EXECUTION MODEL
# ---------------
#
# workflow_run:
#   successful validation -> active agent
#   unsuccessful validation -> monitoring only
#
# workflow_dispatch:
#   force_agent=true  -> requested agent mode
#   force_agent=false -> monitoring only
#
# schedule:
#   monitoring/reconciliation only
#
# IMPORTANT
# ---------
# The current Python agent supports these commands:
#
#   validate-all
#   validate-all-platforms
#   validate-all-features
#   auto-heal
#   project-stats
#
# This workflow deliberately does NOT pass unsupported CLI flags to the
# Python agent.
#
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # Validation lifecycle
  # --------------------------------------------------------------------------

  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - completed

  # --------------------------------------------------------------------------
  # Manual execution
  # --------------------------------------------------------------------------

  workflow_dispatch:
    inputs:

      mode:
        description: "Agent execution mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - validate
          - sync
          - monitor
          - heal

      auto_heal:
        description: "Enable auto-healing of errors"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      auto_fix:
        description: "Enable automatic error fixes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      force_agent:
        description: "Run the active agent on manual dispatch"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      max_iterations:
        description: "Reserved agent iteration budget"
        required: true
        default: "200"
        type: string

      max_per_iteration:
        description: "Reserved per-iteration task budget"
        required: true
        default: "200"
        type: string

      reason:
        description: "Reason for manual execution"
        required: false
        default: "Manual autonomous-agent execution"
        type: string

  # --------------------------------------------------------------------------
  # Scheduled health monitoring
  # --------------------------------------------------------------------------

  schedule:
    - cron: "0 */6 * * *"


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  contents: write
  actions: read
  pull-requests: read
  checks: read
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# GitHub Actions does not support "queue: max" here.
#
# A single concurrency group prevents simultaneous tracking writers from
# modifying the same branch concurrently.
#
# cancel-in-progress=false ensures an active run is not cancelled.
# ============================================================================

concurrency:
  group: ollama-autonomous-agent-tracking-writer
  cancel-in-progress: false


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  TRACK_DIR: ollamatracks

  TRACK_SCHEMA_VERSION: "4.0"

  TRACKING_PROTOCOL: "ollamatracks-v4"

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  AGENT_SCRIPT: "scripts/ollama_autonomous_agent.py"

  PYTHON_VERSION: "3.12"

  DEFAULT_MAX_ITERATIONS: "200"

  DEFAULT_MAX_PER_ITERATION: "200"

  TELEMETRY_FILE: "ollamatracks/telemetry.jsonl"

  QMOI_AUTO_HEAL: ${{ github.event.inputs.auto_heal || 'true' }}

  QMOI_AUTO_FIX: ${{ github.event.inputs.auto_fix || 'true' }}

  QMOI_AGENT_MODE: ${{ github.event.inputs.mode || 'full' }}

  QMOI_RETRY_ATTEMPTS: "3"

  QMOI_RETRY_DELAY: "10"

  QMOI_TIMEOUT_SECONDS: "300"

  REASON: ${{ github.event.inputs.reason || 'Scheduled/workflow-triggered execution' }}


# ============================================================================
# JOBS
# ============================================================================

jobs:

  ollama-agent:

    name: Ollama Autonomous Agent + Live Tracking

    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ======================================================================
      # CHECKOUT TRUSTED DEFAULT BRANCH
      # ======================================================================

      - name: Checkout trusted default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}


      # ======================================================================
      # SETUP PYTHON
      # ======================================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt


      # ======================================================================
      # INSTALL PYTHON TOOLING AND PROJECT DEPENDENCIES
      # ======================================================================

      - name: Install required Python tooling
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install pytest PyYAML

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi


      # ======================================================================
      # INITIALIZE DURABLE TRACKING
      # ======================================================================

      - name: Initialize durable tracking
        id: initialize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VALIDATION_STATUS: ${{ github.event.workflow_run.status }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VALIDATION_URL: ${{ github.event.workflow_run.html_url }}
          MANUAL_REASON: ${{ github.event.inputs.reason }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          agent_run_id="agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"


          # ------------------------------------------------------------------
          # Tracking protocol
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/TRACKING_PROTOCOL.txt" <<EOF
          OLLAMA TRACKING PROTOCOL
          ========================

          Protocol:
          $TRACKING_PROTOCOL

          Schema:
          $TRACK_SCHEMA_VERSION

          Repository:
          $GITHUB_REPOSITORY

          Authoritative sources:
          - GitHub Actions: workflow lifecycle and repository state
          - Python agent: agent execution telemetry

          Mutable state:
          CURRENT_STATUS.txt
          LATEST_ACTIVITY.txt
          STATE.txt
          PR_STATUS.txt
          LAST_RECONCILIATION.txt
          monitoring_summary.json
          telemetry.jsonl

          Historical records:
          NNNNNN_event-name.txt

          Security:
          This workflow checks out only the repository default branch.
          It must never execute untrusted pull-request head code.

          Recovery:
          Missing mutable tracking files are recreated automatically.
          EOF


          # ------------------------------------------------------------------
          # Required tracking files
          # ------------------------------------------------------------------

          touch \
            "$TRACK_DIR/telemetry.jsonl" \
            "$TRACK_DIR/CURRENT_STATUS.txt" \
            "$TRACK_DIR/LATEST_ACTIVITY.txt" \
            "$TRACK_DIR/STATE.txt" \
            "$TRACK_DIR/PR_STATUS.txt" \
            "$TRACK_DIR/LAST_RECONCILIATION.txt"


          # ------------------------------------------------------------------
          # Manifest
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/TRACKING_MANIFEST.txt" <<EOF
          OLLAMA TRACKING MANIFEST
          ========================

          Protocol:
          $TRACKING_PROTOCOL

          Schema:
          $TRACK_SCHEMA_VERSION

          Repository:
          $GITHUB_REPOSITORY

          Required mutable files:

          - CURRENT_STATUS.txt
          - LATEST_ACTIVITY.txt
          - STATE.txt
          - PR_STATUS.txt
          - LAST_RECONCILIATION.txt
          - monitoring_summary.json
          - telemetry.jsonl

          Historical files:

          - NNNNNN_event-name.txt
          EOF


          # ------------------------------------------------------------------
          # Tracking index
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/TRACKING_INDEX.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT TRACKING INDEX
          ======================================

          Protocol:
          $TRACKING_PROTOCOL

          Schema:
          $TRACK_SCHEMA_VERSION

          Repository:
          $GITHUB_REPOSITORY

          Initialized UTC:
          $now
          EOF


          # ------------------------------------------------------------------
          # Current state
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/CURRENT_STATUS.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT - CURRENT STATUS
          =========================================

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Workflow run ID:
          $GITHUB_RUN_ID

          Workflow attempt:
          $GITHUB_RUN_ATTEMPT

          Trigger:
          $EVENT_NAME

          Validation run ID:
          ${VALIDATION_RUN_ID:-unknown}

          Validation status:
          ${VALIDATION_STATUS:-unknown}

          Validation conclusion:
          ${VALIDATION_CONCLUSION:-unknown}

          Validation URL:
          ${VALIDATION_URL:-unknown}

          Agent run ID:
          $agent_run_id

          State:
          INITIALIZING

          Status:
          RUNNING
          EOF


          # ------------------------------------------------------------------
          # State projection
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/STATE.txt" <<EOF
          protocol=$TRACKING_PROTOCOL
          schema=$TRACK_SCHEMA_VERSION
          repository=$GITHUB_REPOSITORY
          workflow=$GITHUB_WORKFLOW
          workflow_run_id=$GITHUB_RUN_ID
          workflow_attempt=$GITHUB_RUN_ATTEMPT
          event=$EVENT_NAME
          agent_run_id=$agent_run_id
          state=INITIALIZING
          status=running
          timestamp_utc=$now
          EOF


          # ------------------------------------------------------------------
          # Latest activity
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/LATEST_ACTIVITY.txt" <<EOF
          OLLAMA LATEST ACTIVITY
          ======================

          Timestamp UTC:
          $now

          Event:
          TRACKER_INITIALIZED

          Status:
          SUCCESS

          Agent run ID:
          $agent_run_id

          Trigger:
          $EVENT_NAME
          EOF


          # ------------------------------------------------------------------
          # PR/status projection
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/PR_STATUS.txt" <<EOF
          PR Status:
          tracking

          Workflow:
          $GITHUB_WORKFLOW

          Run:
          $GITHUB_RUN_ID

          Validation conclusion:
          ${VALIDATION_CONCLUSION:-unknown}

          Last update UTC:
          $now
          EOF


          # ------------------------------------------------------------------
          # Reconciliation projection
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/LAST_RECONCILIATION.txt" <<EOF
          $now | tracker_initialized | running | startup | Durable tracking initialized
          EOF


          # ------------------------------------------------------------------
          # Structured telemetry
          # ------------------------------------------------------------------

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.path.join(
              os.environ["TRACK_DIR"],
              "telemetry.jsonl",
          )

          event = {
              "event_id": (
                  f"tracker-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}-initialized"
              ),
              "event_type": "STATE",
              "event": "TRACKER_INITIALIZED",
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
              "status": "SUCCESS",
          }

          with open(path, "a", encoding="utf-8") as handle:
              handle.write(
                  json.dumps(
                      event,
                      separators=(",", ":"),
                  ) + "\n"
              )
          PY


          {
            echo "agent_run_id=$agent_run_id"
            echo "timestamp_utc=$now"
          } >> "$GITHUB_OUTPUT"


      # ======================================================================
      # VALIDATE THIS WORKFLOW ITSELF
      # ======================================================================
      #
      # This catches duplicate YAML keys such as:
      #
      #   env:
      #   env:
      #
      # and:
      #
      #   schedule:
      #   schedule:
      #
      # which the previous workflow contained.
      # ======================================================================

      - name: Validate workflow and repository YAML
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import yaml

          class UniqueLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}

              for key_node, value_node in node.value:
                  key = loader.construct_object(
                      key_node,
                      deep=deep,
                  )

                  if key in mapping:
                      raise ValueError(
                          f"Duplicate YAML key detected: {key!r}"
                      )

                  mapping[key] = loader.construct_object(
                      value_node,
                      deep=deep,
                  )

              return mapping

          UniqueLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )

          workflow = Path(
              ".github/workflows/ollama-autonomous-agent.yml"
          )

          if not workflow.exists():
              raise SystemExit(
                  f"Missing workflow: {workflow}"
              )

          text = workflow.read_text(
              encoding="utf-8"
          )

          data = yaml.load(
              text,
              Loader=UniqueLoader,
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "Workflow root must be a mapping."
              )

          on_value = data.get("on")

          # PyYAML 1.1 interprets "on" as boolean True.
          if on_value is None:
              on_value = data.get(True)

          if on_value is None:
              raise SystemExit(
                  "Missing top-level 'on' configuration."
              )

          if "jobs" not in data:
              raise SystemExit(
                  "Missing top-level 'jobs' configuration."
              )

          if not isinstance(data["jobs"], dict):
              raise SystemExit(
                  "'jobs' must be a mapping."
              )

          if "ollama-agent" not in data["jobs"]:
              raise SystemExit(
                  "Missing ollama-agent job."
              )

          print(
              "Workflow YAML parsed successfully."
          )

          print(
              "Duplicate-key detection passed."
          )

          print(
              f"Job count: {len(data['jobs'])}"
          )
          PY


      # ======================================================================
      # EXECUTE TEST SUITE
      # ======================================================================

      - name: Execute repository test suite
        id: tests
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail

          if [ -f tests/test_ollama_autonomous_agent.py ]; then

            python -m pytest \
              tests/test_ollama_autonomous_agent.py \
              -v

          elif [ -d tests ]; then

            python -m pytest \
              tests \
              -v

          else

            echo "No tests directory found."
            echo "Recording test phase as skipped."

          fi


      # ======================================================================
      # RECORD TEST RESULT
      # ======================================================================

      - name: Record test result
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -Eeuo pipefail

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          status="${TEST_OUTCOME:-unknown}"

          printf \
            '%s | test_suite | %s | validation | Repository pytest result\n' \
            "$now" \
            "$status" \
            > "$TRACK_DIR/LAST_TEST_RESULT.txt"


          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.path.join(
              os.environ["TRACK_DIR"],
              "telemetry.jsonl",
          )

          event = {
              "event_id": (
                  f"tests-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "event_type": "TEST",
              "event": "REPOSITORY_TEST_SUITE",
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
              "status": os.environ.get(
                  "TEST_OUTCOME",
                  "unknown",
              ),
          }

          with open(path, "a", encoding="utf-8") as handle:
              handle.write(
                  json.dumps(
                      event,
                      separators=(",", ":"),
                  ) + "\n"
              )
          PY


      # ======================================================================
      # EXECUTE AGENT OR RECONCILIATION
      # ======================================================================
      #
      # The Python agent at the current repository revision does not accept:
      #
      #   --max-iterations
      #   --max-per-iteration
      #   --reconcile-only
      #
      # Therefore those values are retained as configuration/telemetry only.
      #
      # Supported commands are mapped here to prevent CLI failures.
      # ======================================================================

      - name: Execute autonomous agent or reconciliation
        id: agent_execution
        continue-on-error: true
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FORCE_AGENT: ${{ github.event.inputs.force_agent || 'false' }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'monitor' }}
          MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || env.DEFAULT_MAX_ITERATIONS }}
          MAX_PER_ITERATION: ${{ github.event.inputs.max_per_iteration || env.DEFAULT_MAX_PER_ITERATION }}
        run: |
          set -Eeuo pipefail

          should_run=false
          command=""

          # ------------------------------------------------------------------
          # workflow_run
          # ------------------------------------------------------------------

          if [ "$EVENT_NAME" = "workflow_run" ]; then

            if [ "$VALIDATION_CONCLUSION" = "success" ]; then

              should_run=true
              command="validate-all"

            else

              command="monitor"

            fi


          # ------------------------------------------------------------------
          # workflow_dispatch
          # ------------------------------------------------------------------

          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then

            if [ "$FORCE_AGENT" = "true" ]; then

              case "$REQUESTED_MODE" in

                full|validate)

                  should_run=true
                  command="validate-all"
                  ;;

                heal)

                  should_run=true
                  command="auto-heal"
                  ;;

                sync|monitor)

                  command="monitor"
                  ;;

                *)

                  echo \
                    "Unsupported mode '$REQUESTED_MODE'."

                  echo \
                    "Falling back to monitor."

                  command="monitor"
                  ;;

              esac

            else

              command="monitor"

            fi


          # ------------------------------------------------------------------
          # schedule
          # ------------------------------------------------------------------

          elif [ "$EVENT_NAME" = "schedule" ]; then

            command="monitor"


          # ------------------------------------------------------------------
          # Defensive fallback
          # ------------------------------------------------------------------

          else

            command="monitor"

          fi


          # ------------------------------------------------------------------
          # Active agent execution
          # ------------------------------------------------------------------

          if [ "$should_run" = "true" ]; then

            echo "=========================================="
            echo "Executing trusted autonomous agent"
            echo "=========================================="

            echo "Command: $command"

            echo "Configured iteration budget:"
            echo "$MAX_ITERATIONS"

            echo "Configured per-iteration budget:"
            echo "$MAX_PER_ITERATION"

            python "$AGENT_SCRIPT" "$command"


          # ------------------------------------------------------------------
          # Monitoring/reconciliation
          # ------------------------------------------------------------------

          else

            echo "=========================================="
            echo "Monitoring / Reconciliation Only"
            echo "=========================================="

            now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

            cat > "$TRACK_DIR/LAST_RECONCILIATION.txt" <<EOF
          $now | reconciliation | success | monitor | No active agent execution requested

          Trigger:
          $EVENT_NAME

          Validation conclusion:
          ${VALIDATION_CONCLUSION:-not-applicable}
          EOF


            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.path.join(
              os.environ["TRACK_DIR"],
              "telemetry.jsonl",
          )

          event = {
              "event_id": (
                  f"reconcile-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "event_type": "HEARTBEAT",
              "event": "RECONCILIATION",
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
              "status": "SUCCESS",
          }

          with open(path, "a", encoding="utf-8") as handle:
              handle.write(
                  json.dumps(
                      event,
                      separators=(",", ":"),
                  ) + "\n"
              )
          PY

          fi


      # ======================================================================
      # FINALIZE WORKFLOW TELEMETRY
      # ======================================================================

      - name: Finalize workflow telemetry
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          AGENT_OUTCOME: ${{ steps.agent_execution.outcome }}
        run: |
          set -Eeuo pipefail

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          if [ "${AGENT_OUTCOME:-success}" = "success" ]; then
            final_status="success"
          else
            final_status="agent_failed"
          fi


          # ------------------------------------------------------------------
          # Current status
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/CURRENT_STATUS.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT - CURRENT STATUS
          =========================================

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Workflow run ID:
          $GITHUB_RUN_ID

          Workflow attempt:
          $GITHUB_RUN_ATTEMPT

          Trigger:
          $GITHUB_EVENT_NAME

          Test outcome:
          ${TEST_OUTCOME:-unknown}

          Agent outcome:
          ${AGENT_OUTCOME:-unknown}

          Final tracking status:
          $final_status
          EOF


          # ------------------------------------------------------------------
          # State
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/STATE.txt" <<EOF
          protocol=$TRACKING_PROTOCOL
          schema=$TRACK_SCHEMA_VERSION
          repository=$GITHUB_REPOSITORY
          workflow=$GITHUB_WORKFLOW
          workflow_run_id=$GITHUB_RUN_ID
          workflow_attempt=$GITHUB_RUN_ATTEMPT
          event=$GITHUB_EVENT_NAME
          status=$final_status
          test_outcome=${TEST_OUTCOME:-unknown}
          agent_outcome=${AGENT_OUTCOME:-unknown}
          timestamp_utc=$now
          EOF


          # ------------------------------------------------------------------
          # Latest activity
          # ------------------------------------------------------------------

          cat > "$TRACK_DIR/LATEST_ACTIVITY.txt" <<EOF
          OLLAMA LATEST ACTIVITY
          ======================

          Timestamp UTC:
          $now

          Event:
          WORKFLOW_FINALIZED

          Status:
          $final_status

          Test outcome:
          ${TEST_OUTCOME:-unknown}

          Agent outcome:
          ${AGENT_OUTCOME:-unknown}
          EOF


          # ------------------------------------------------------------------
          # Monitoring summary
          # ------------------------------------------------------------------

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.path.join(
              os.environ["TRACK_DIR"],
              "monitoring_summary.json",
          )

          summary = {
              "schema": os.environ["TRACK_SCHEMA_VERSION"],
              "protocol": os.environ["TRACKING_PROTOCOL"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "test_outcome": os.environ.get(
                  "TEST_OUTCOME",
                  "unknown",
              ),
              "agent_outcome": os.environ.get(
                  "AGENT_OUTCOME",
                  "unknown",
              ),
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
          }

          summary["status"] = (
              "success"
              if summary["agent_outcome"] == "success"
              else "agent_failed"
          )

          with open(path, "w", encoding="utf-8") as handle:
              json.dump(
                  summary,
                  handle,
                  indent=2,
                  sort_keys=True,
              )

              handle.write("\n")
          PY


          # ------------------------------------------------------------------
          # Final telemetry event
          # ------------------------------------------------------------------

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.path.join(
              os.environ["TRACK_DIR"],
              "telemetry.jsonl",
          )

          event = {
              "event_id": (
                  f"workflow-finalized-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
              "event_type": "SUMMARY",
              "event": "WORKFLOW_FINALIZED",
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "actor": os.environ["GITHUB_ACTOR"],
              "status": os.environ.get(
                  "AGENT_OUTCOME",
                  "unknown",
              ),
              "test_outcome": os.environ.get(
                  "TEST_OUTCOME",
                  "unknown",
              ),
          }

          with open(path, "a", encoding="utf-8") as handle:
              handle.write(
                  json.dumps(
                      event,
                      separators=(",", ":"),
                  ) + "\n"
              )
          PY


      # ======================================================================
      # VALIDATE GENERATED TRACKING DATA
      # ======================================================================

      - name: Validate generated tracking data
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d "$TRACK_DIR"

          test -f "$TRACK_DIR/telemetry.jsonl"

          test -f "$TRACK_DIR/CURRENT_STATUS.txt"

          test -f "$TRACK_DIR/LATEST_ACTIVITY.txt"

          test -f "$TRACK_DIR/STATE.txt"

          test -f "$TRACK_DIR/PR_STATUS.txt"

          test -f "$TRACK_DIR/LAST_RECONCILIATION.txt"

          test -f "$TRACK_DIR/monitoring_summary.json"


          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("ollamatracks")

          telemetry = root / "telemetry.jsonl"

          for number, line in enumerate(
              telemetry.read_text(
                  encoding="utf-8"
              ).splitlines(),
              1,
          ):

              if line.strip():

                  try:

                      json.loads(line)

                  except json.JSONDecodeError as exc:

                      raise SystemExit(
                          f"Invalid telemetry JSON on line {number}: {exc}"
                      ) from exc


          summary = root / "monitoring_summary.json"

          json.loads(
              summary.read_text(
                  encoding="utf-8"
              )
          )

          print(
              "Tracking artifacts and JSONL telemetry are valid."
          )
          PY


          git diff --check


      # ======================================================================
      # COMMIT AND PUSH DURABLE TELEMETRY
      # ======================================================================

      - name: Commit and push durable telemetry
        if: always()
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail

          branch="${DEFAULT_BRANCH:-main}"


          # ------------------------------------------------------------------
          # Git identity
          # ------------------------------------------------------------------

          git config user.name \
            "QMOI Autonomous Agent"

          git config user.email \
            "agent@qmoi.internal"


          # ------------------------------------------------------------------
          # Stage telemetry
          # ------------------------------------------------------------------

          git add "$TRACK_DIR/"


          if git diff --cached --quiet; then

            echo "No tracking changes to commit."

            exit 0

          fi


          # ------------------------------------------------------------------
          # Commit
          # ------------------------------------------------------------------

          git commit \
            -m "chore(ollamatracks): reconcile agent telemetry [skip ci]"


          # ------------------------------------------------------------------
          # Retry-safe push
          # ------------------------------------------------------------------

          for attempt in 1 2 3 4 5 6 7 8; do

            echo \
              "Push attempt $attempt/8..."


            # --------------------------------------------------------------
            # Fetch latest default branch
            # --------------------------------------------------------------

            if ! git fetch \
              --prune \
              origin \
              "$branch"; then

              echo \
                "Remote fetch failed; retrying."

              sleep $((attempt * 2))

              continue

            fi


            # --------------------------------------------------------------
            # Rebase local telemetry commit
            # --------------------------------------------------------------

            if ! git rebase \
              "origin/$branch"; then

              echo \
                "Rebase conflict; aborting this attempt and retrying."

              git rebase --abort || true

              sleep $((attempt * 2))

              continue

            fi


            # --------------------------------------------------------------
            # Push
            # --------------------------------------------------------------

            if git push \
              origin \
              "HEAD:$branch"; then

              echo \
                "Telemetry push succeeded."

              exit 0

            fi


            echo \
              "Push rejected. Retrying."

            sleep $((attempt * 2))

          done


          # ------------------------------------------------------------------
          # Do not destroy the workflow solely because telemetry could not be
          # pushed. The artifact upload below still preserves the state.
          # ------------------------------------------------------------------

          echo \
            "Telemetry push did not complete after retries."

          echo \
            "The tracking artifact will still be preserved by upload-artifact."

          exit 0


      # ======================================================================
      # UPLOAD TRACKING ARTIFACTS
      # ======================================================================

      - name: Upload tracking artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-agent-tracking-${{ github.run_id }}-${{ github.run_attempt }}
          path: ollamatracks/
          if-no-files-found: warn
          retention-days: 30


      # ======================================================================
      # FINAL EXECUTION SUMMARY
      # ======================================================================

      - name: Final execution summary
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          AGENT_OUTCOME: ${{ steps.agent_execution.outcome }}
        run: |
          {
            echo "## Ollama Autonomous Agent"
            echo ""
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Run: \`$GITHUB_RUN_ID\`"
            echo "- Attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Tests: \`${TEST_OUTCOME:-unknown}\`"
            echo "- Agent: \`${AGENT_OUTCOME:-unknown}\`"
            echo "- Tracking: \`ollamatracks/\`"
            echo "- Artifact retention: 30 days"
          } >> "$GITHUB_STEP_SUMMARY"