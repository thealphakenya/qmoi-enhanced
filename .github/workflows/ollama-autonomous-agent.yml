name: Ollama Autonomous Agent & Live Tracker

# ============================================================================
# QMOI / OLLAMA AUTONOMOUS AGENT
# ============================================================================
#
# PURPOSE
# -------
# Trusted orchestration, validation, autonomous execution, recovery,
# telemetry, repository integrity, and self-healing layer for QMOI/Ollama.
#
# IMPORTANT CLI COMPATIBILITY
# ---------------------------
# scripts/ollama_autonomous_agent.py currently supports:
#
#   validate-all
#   validate-platforms
#   validate-features
#   validate-file-handlers
#   generate-memory-index
#   generate-model-card
#   proof
#   checkpoint
#
# SECURITY PRINCIPLES
# -------------------
# 1. Never execute untrusted PR-head code.
# 2. Always validate repository/Git state before mutation.
# 3. Repair only deterministic/mechanical failures automatically.
# 4. Retry transient failures with bounded backoff.
# 5. Validate after every major mutation.
# 6. Preserve diagnostics even when the workflow fails.
# 7. Never create an infinite autonomous recovery loop.
# 8. Prefer evidence preservation over destructive guessing.
# 9. Human intervention remains the boundary for ambiguous failures.
#
# ============================================================================


# ============================================================================
# EVENTS
# ============================================================================

on:
  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - completed

  workflow_dispatch:
    inputs:
      mode:
        description: "Agent execution mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - validate
          - sync
          - monitor
          - heal

      auto_heal:
        description: "Enable bounded automatic recovery"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      auto_fix:
        description: "Enable safe mechanical repository/workflow fixes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      force_agent:
        description: "Allow autonomous agent execution"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      max_iterations:
        description: "Maximum autonomous-agent iterations"
        required: true
        default: "200"
        type: string

      max_per_iteration:
        description: "Maximum tasks per agent iteration"
        required: true
        default: "200"
        type: string

      max_recovery_attempts:
        description: "Maximum bounded recovery attempts"
        required: true
        default: "3"
        type: string

      reason:
        description: "Reason for manual execution"
        required: false
        default: "Manual autonomous-agent execution"
        type: string

  schedule:
    - cron: "0 */6 * * *"


# ============================================================================
# PERMISSIONS
# ============================================================================

permissions:
  contents: write
  actions: read
  pull-requests: read
  checks: read
  statuses: read


# ============================================================================
# CONCURRENCY
# ============================================================================

concurrency:
  group: ollama-autonomous-agent-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:
  TRACK_DIR: ollamatracks
  TRACK_SCHEMA_VERSION: "7.0"
  TRACKING_PROTOCOL: "ollamatracks-v7"

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  AGENT_SCRIPT: "scripts/ollama_autonomous_agent.py"

  PYTHON_VERSION: "3.12"

  DEFAULT_MAX_ITERATIONS: "200"
  DEFAULT_MAX_PER_ITERATION: "200"
  DEFAULT_MAX_RECOVERY_ATTEMPTS: "3"

  QMOI_AUTO_HEAL: ${{ github.event.inputs.auto_heal || 'true' }}
  QMOI_AUTO_FIX: ${{ github.event.inputs.auto_fix || 'true' }}
  QMOI_AGENT_MODE: ${{ github.event.inputs.mode || 'full' }}
  QMOI_FORCE_AGENT: ${{ github.event.inputs.force_agent || 'false' }}

  QMOI_RETRY_ATTEMPTS: "5"
  QMOI_RETRY_DELAY: "10"
  QMOI_TIMEOUT_SECONDS: "300"

  OLLAMA_HOST: "http://127.0.0.1:11434"
  OLLAMA_MODEL: "qwen2.5-coder:3b"

  REASON: ${{ github.event.inputs.reason || 'Scheduled/workflow-triggered execution' }}


# ============================================================================
# JOBS
# ============================================================================

jobs:

  # ==========================================================================
  # MAIN TRUSTED AGENT
  # ==========================================================================

  ollama-agent:
    name: Ollama Autonomous Agent + Self-Healing Tracker

    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ======================================================================
      # 1. TRUSTED CHECKOUT
      # ======================================================================

      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: true
          ref: ${{ github.event.repository.default_branch }}

      # ======================================================================
      # 2. RUNNER PREFLIGHT
      # ======================================================================

      - name: Runner and environment preflight
        id: runner_preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "RUNNER PREFLIGHT"
          echo "============================================================"

          echo "Runner:"
          uname -a

          echo
          echo "Operating system:"
          cat /etc/os-release || true

          echo
          echo "Disk:"
          df -h

          echo
          echo "Memory:"
          free -h || true

          echo
          echo "Python:"
          python3 --version || true

          echo
          echo "Git:"
          git --version

          echo
          echo "Workspace:"
          pwd

          test -d "$GITHUB_WORKSPACE"

      # ======================================================================
      # 3. PYTHON
      # ======================================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      # ======================================================================
      # 4. INITIALIZE TRACKING
      # ======================================================================

      - name: Initialize durable tracking
        id: initialize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VALIDATION_STATUS: ${{ github.event.workflow_run.status }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VALIDATION_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          agent_run_id="agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          touch \
            "$TRACK_DIR/telemetry.jsonl" \
            "$TRACK_DIR/CURRENT_STATUS.txt" \
            "$TRACK_DIR/LATEST_ACTIVITY.txt" \
            "$TRACK_DIR/STATE.txt" \
            "$TRACK_DIR/PR_STATUS.txt" \
            "$TRACK_DIR/LAST_RECONCILIATION.txt" \
            "$TRACK_DIR/LAST_TEST_RESULT.txt" \
            "$TRACK_DIR/REPAIR_LOG.txt"

          cat > "$TRACK_DIR/TRACKING_PROTOCOL.txt" <<EOF
          OLLAMA AUTONOMOUS TRACKING PROTOCOL

          Protocol:
          $TRACKING_PROTOCOL

          Schema:
          $TRACK_SCHEMA_VERSION

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Agent:
          $AGENT_SCRIPT

          Security:
          Trusted default branch only.

          Recovery:
          Bounded deterministic/mechanical recovery.

          CLI:
          validate-all
          validate-platforms
          validate-features
          validate-file-handlers
          generate-memory-index
          generate-model-card
          proof
          checkpoint

          Final boundary:
          Human intervention for ambiguous or unsafe failures.
          EOF

          cat > "$TRACK_DIR/TRACKING_MANIFEST.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT TRACKING MANIFEST

          TRACKING_PROTOCOL.txt
          TRACKING_MANIFEST.txt
          TRACKING_INDEX.txt
          CURRENT_STATUS.txt
          LATEST_ACTIVITY.txt
          STATE.txt
          PR_STATUS.txt
          LAST_RECONCILIATION.txt
          LAST_TEST_RESULT.txt
          REPAIR_LOG.txt
          telemetry.jsonl
          monitoring_summary.json
          git_fsck.txt
          final_git_fsck.txt
          final_git_status.txt
          final_diff_stat.txt
          final_diff.patch
          EOF

          cat > "$TRACK_DIR/TRACKING_INDEX.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT TRACKING INDEX

          Protocol: $TRACKING_PROTOCOL
          Schema: $TRACK_SCHEMA_VERSION
          Repository: $GITHUB_REPOSITORY
          Workflow: $GITHUB_WORKFLOW
          Run: $GITHUB_RUN_ID
          Attempt: $GITHUB_RUN_ATTEMPT
          Agent run: $agent_run_id
          Initialized: $now
          EOF

          cat > "$TRACK_DIR/CURRENT_STATUS.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT

          State: INITIALIZING
          Status: RUNNING

          Timestamp UTC:
          $now

          Repository:
          $GITHUB_REPOSITORY

          Workflow:
          $GITHUB_WORKFLOW

          Run:
          $GITHUB_RUN_ID

          Attempt:
          $GITHUB_RUN_ATTEMPT

          Event:
          $EVENT_NAME

          Validation:
          ${VALIDATION_CONCLUSION:-unknown}

          Agent run:
          $agent_run_id
          EOF

          cat > "$TRACK_DIR/STATE.txt" <<EOF
          protocol=$TRACKING_PROTOCOL
          schema=$TRACK_SCHEMA_VERSION
          repository=$GITHUB_REPOSITORY
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          attempt=$GITHUB_RUN_ATTEMPT
          event=$EVENT_NAME
          agent_run_id=$agent_run_id
          state=INITIALIZING
          status=running
          timestamp_utc=$now
          EOF

          cat > "$TRACK_DIR/LATEST_ACTIVITY.txt" <<EOF
          Timestamp UTC: $now
          Event: TRACKER_INITIALIZED
          Status: SUCCESS
          Agent: $agent_run_id
          EOF

          cat > "$TRACK_DIR/PR_STATUS.txt" <<EOF
          Workflow: $GITHUB_WORKFLOW
          Run: $GITHUB_RUN_ID
          Validation: ${VALIDATION_CONCLUSION:-unknown}
          Last update: $now
          EOF

          cat > "$TRACK_DIR/LAST_RECONCILIATION.txt" <<EOF
          $now | INITIALIZATION | SUCCESS | Durable tracking initialized
          EOF

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.path.join(
              os.environ["TRACK_DIR"],
              "telemetry.jsonl",
          )

          event = {
              "event_id": (
                  f"tracker-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}-initialized"
              ),
              "event_type": "STATE",
              "event": "TRACKER_INITIALIZED",
              "timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat(timespec="milliseconds")
                  .replace("+00:00", "Z")
              ),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "actor": os.environ["GITHUB_ACTOR"],
              "status": "SUCCESS",
          }

          with open(path, "a", encoding="utf-8") as f:
              f.write(json.dumps(event, separators=(",", ":")) + "\n")
          PY

          echo "agent_run_id=$agent_run_id" >> "$GITHUB_OUTPUT"
          echo "timestamp_utc=$now" >> "$GITHUB_OUTPUT"

      # ======================================================================
      # 5. GIT FORENSIC / SELF-HEALING
      # ======================================================================

      - name: Repair and validate Git repository
        id: git_recovery_initial
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "GIT INTEGRITY / SELF-HEALING"
          echo "============================================================"

          mkdir -p "$TRACK_DIR"

          repair_log="$TRACK_DIR/REPAIR_LOG.txt"

          git_root="$(git rev-parse --show-toplevel)"
          cd "$git_root"

          echo "Git root: $git_root"

          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "::warning::Stale Git rebase state detected."
            git rebase --abort 2>/dev/null || true
          fi

          if [ -f .git/MERGE_HEAD ]; then
            echo "::warning::Stale Git merge state detected."
            git merge --abort 2>/dev/null || true
          fi

          if [ -f .git/CHERRY_PICK_HEAD ]; then
            echo "::warning::Stale cherry-pick state detected."
            git cherry-pick --abort 2>/dev/null || true
          fi

          find .git \
            -type f \
            \( \
              -name '*.lock' \
              -o \
              -name 'index.lock' \
            \) \
            -print 2>/dev/null |
          while IFS= read -r lock; do
            echo "::warning::Removing stale Git lock: $lock"
            rm -f "$lock"
          done

          if ! git status --porcelain=v1 >/dev/null 2>&1; then

            echo "::warning::Git index is corrupted or unreadable."

            {
              echo "$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ') | GIT_INDEX_REPAIR"
              echo "Git status failed; rebuilding .git/index."
            } >> "$repair_log"

            rm -f .git/index
            git reset --mixed HEAD

            if ! git status --porcelain=v1 >/dev/null 2>&1; then
              echo "::error::Git index could not be rebuilt."
              exit 1
            fi

            echo "Git index successfully rebuilt."

          else
            echo "Git index is readable."
          fi

          git rev-parse --verify HEAD
          git rev-parse --verify HEAD^{commit}
          git rev-parse --show-toplevel

          fsck_log="$TRACK_DIR/git_fsck.txt"

          if ! git fsck --no-progress >"$fsck_log" 2>&1; then
            if grep -Eiq \
              'corrupt|fatal|bad object|missing blob|missing tree|missing commit' \
              "$fsck_log"; then

              echo "::error::Git object database integrity failure."
              cat "$fsck_log"
              exit 1
            fi
          fi

          git status --short

          git config --local user.name \
            "github-actions[bot]"

          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git integrity preflight passed."

      # ======================================================================
      # 6. INSTALL RECOVERY TOOLING
      # ======================================================================

      - name: Install validation and recovery tooling
        id: tooling
        shell: bash
        run: |
          set -Eeuo pipefail

          retry() {
            local attempts="$1"
            local delay="$2"
            shift 2

            local n=1

            while true; do
              if "$@"; then
                return 0
              fi

              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi

              echo "::warning::Command failed; retry $((n + 1))/$attempts in ${delay}s."
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry 5 5 \
            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel

          retry 5 5 \
            python -m pip install \
              pytest \
              PyYAML

          if [ -f requirements.txt ]; then
            retry 5 5 \
              python -m pip install -r requirements.txt
          fi

          python --version
          python -m pip --version

      # ======================================================================
      # 7. SAFE WORKFLOW / CLI REPAIRS
      # ======================================================================

      - name: Scan and safely repair deprecated actions and stale CLI commands
        id: action_repair
        if: env.QMOI_AUTO_FIX == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          repair_log="$TRACK_DIR/REPAIR_LOG.txt"

          changed=0

          if [ ! -d .github/workflows ]; then
            echo "::error::.github/workflows does not exist."
            exit 1
          fi

          mapfile -t workflows < <(
            find .github/workflows \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print |
            sort
          )

          for file in "${workflows[@]}"; do

            [ -f "$file" ] || continue

            before="$(sha256sum "$file" | awk '{print $1}')"

            # ---------------------------------------------------------------
            # Artifact actions.
            # ---------------------------------------------------------------

            sed -i -E \
              's#actions/upload-artifact@v(1|2|3|4|5)\b#actions/upload-artifact@v4#g' \
              "$file"

            sed -i -E \
              's#actions/download-artifact@v(1|2|3|4|5|6)\b#actions/download-artifact@v4#g' \
              "$file"

            # ---------------------------------------------------------------
            # Command Name Fixes
            # ---------------------------------------------------------------

            sed -i \
              's/validate-all-platforms/validate-platforms/g' \
              "$file"

            sed -i \
              's/validate-all-features/validate-features/g' \
              "$file"

            after="$(sha256sum "$file" | awk '{print $1}')"

            if [ "$before" != "$after" ]; then

              changed=1

              {
                echo
                echo "REPAIRED: $file"
                echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
                echo "Repairs:"
                echo "  actions/upload-artifact -> v4"
                echo "  actions/download-artifact -> v4"
                echo "  validate-all-platforms -> validate-platforms"
                echo "  validate-all-features -> validate-features"
              } >> "$repair_log"

            fi

          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # ======================================================================
      # 8. VERIFY AGENT SCRIPT EXISTS
      # ======================================================================

      - name: Verify autonomous agent source
        id: verify_agent_source
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$AGENT_SCRIPT"

          echo "Agent source:"
          echo "$AGENT_SCRIPT"

          python "$AGENT_SCRIPT" --help

      # ======================================================================
      # 9. DETERMINE EXECUTION MODE
      # ======================================================================

      - name: Determine agent execution mode
        id: execution_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          VALIDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FORCE_AGENT: ${{ github.event.inputs.force_agent || 'false' }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'monitor' }}
        run: |
          set -Eeuo pipefail

          run_agent="false"
          command="monitor"
          reason="Monitoring/reconciliation."

          case "$EVENT_NAME" in

            workflow_run)

              if [ \
                "$VALIDATION_CONCLUSION" = "success" ] &&
                [ "$WORKFLOW_RUN_HEAD_BRANCH" = "$DEFAULT_BRANCH" ] &&
                [ "$WORKFLOW_RUN_HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then

                run_agent="true"
                command="validate-all"
                reason="Trusted default-branch validation succeeded."

              else

                run_agent="false"
                command="monitor"
                reason="Validation was not a successful trusted-default-branch run."

              fi

              ;;

            workflow_dispatch)

              if [ "$FORCE_AGENT" = "true" ]; then

                case "$REQUESTED_MODE" in

                  full|validate)
                    run_agent="true"
                    command="validate-all"
                    reason="Manual autonomous execution."
                    ;;

                  heal)
                    run_agent="true"
                    command="auto-heal"
                    reason="Manual autonomous healing."
                    ;;

                  sync|monitor)
                    run_agent="false"
                    command="monitor"
                    reason="Manual monitoring/synchronization."
                    ;;

                  *)
                    run_agent="false"
                    command="monitor"
                    reason="Unknown mode; safe fallback."
                    ;;

                esac

              fi

              ;;

            schedule)

              run_agent="false"
              command="monitor"
              reason="Scheduled reconciliation."

              ;;

            *)

              run_agent="false"
              command="monitor"
              reason="Unknown trigger; safe fallback."

              ;;

          esac

          echo "run_agent=$run_agent" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          echo "run_agent=$run_agent"
          echo "command=$command"
          echo "reason=$reason"

      # ======================================================================
      # 10. STRICT WORKFLOW YAML VALIDATION
      # ======================================================================

      - name: Strictly validate all GitHub workflow YAML
        id: yaml_validation
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import yaml


          class UniqueLoader(yaml.SafeLoader):
              pass


          def construct_mapping(loader, node, deep=False):
              mapping = {}

              for key_node, value_node in node.value:

                  key = loader.construct_object(
                      key_node,
                      deep=deep,
                  )

                  if key in mapping:
                      raise ValueError(
                          f"Duplicate YAML key detected: {key!r}"
                      )

                  mapping[key] = loader.construct_object(
                      value_node,
                      deep=deep,
                  )

              return mapping


          UniqueLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )


          root = Path(".github/workflows")

          if not root.exists():
              raise SystemExit(
                  ".github/workflows does not exist."
              )


          files = sorted(
              list(root.glob("*.yml"))
              + list(root.glob("*.yaml"))
          )


          if not files:
              raise SystemExit(
                  "No workflow files found."
              )


          failures = []


          for path in files:

              try:

                  text = path.read_text(
                      encoding="utf-8"
                  )

                  data = yaml.load(
                      text,
                      Loader=UniqueLoader,
                  )

                  if not isinstance(data, dict):
                      raise ValueError(
                          "Root must be a mapping."
                      )

                  on_value = data.get("on")

                  if on_value is None:
                      on_value = data.get(True)

                  if on_value is None:
                      raise ValueError(
                          "Missing top-level 'on'."
                      )

                  if "jobs" not in data:
                      raise ValueError(
                          "Missing top-level 'jobs'."
                      )

                  if not isinstance(
                      data["jobs"],
                      dict,
                  ):
                      raise ValueError(
                          "'jobs' must be a mapping."
                      )

                  print(f"VALID: {path}")

              except Exception as exc:

                  failures.append(
                      f"{path}: {exc}"
                  )


          if failures:

              print("\n".join(failures))

              raise SystemExit(
                  "Workflow YAML validation failed."
              )

          print(
              f"Validated {len(files)} workflow files."
          )
          PY

      # ======================================================================
      # 11. VERIFY ARTIFACT ACTIONS AND STALE CLI COMMANDS
      # ======================================================================

      - name: Verify workflow action and CLI compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -RInE \
            'actions/upload-artifact@v([1-3])\b' \
            .github/workflows; then

            echo "::error::Deprecated upload-artifact reference remains."
            exit 1

          fi

          if grep -RInE \
            'actions/download-artifact@v([1-3])\b' \
            .github/workflows; then

            echo "::error::Deprecated download-artifact reference remains."
            exit 1

          fi

          if grep -RIn \
            'validate-all-platforms' \
            .github/workflows; then

            echo "::error::Obsolete validate-all-platforms command remains."
            echo "::error::Use validate-platforms."
            exit 1

          fi

          if grep -RIn \
            'validate-all-features' \
            .github/workflows; then

            echo "::error::Obsolete validate-all-features command remains."
            echo "::error::Use validate-features."
            exit 1

          fi

          echo "Workflow action and CLI compatibility validation passed."

      # ======================================================================
      # 12. WORKFLOW STRUCTURAL HAZARD SCAN
      # ======================================================================

      - name: Detect workflow structural hazards
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from pathlib import Path
          import re


          root = Path(".github/workflows")

          forbidden = [
              (
                  r"actions/upload-artifact@v[1-3]\b",
                  "Deprecated upload-artifact",
              ),
              (
                  r"actions/download-artifact@v[1-3]\b",
                  "Deprecated download-artifact",
              ),
              (
                  r"\bvalidate-all-platforms\b",
                  "Obsolete validate-all-platforms command",
              ),
              (
                  r"\bvalidate-all-features\b",
                  "Obsolete validate-all-features command",
              ),
          ]


          failures = []


          for path in sorted(
              list(root.glob("*.yml"))
              + list(root.glob("*.yaml"))
          ):

              text = path.read_text(
                  encoding="utf-8"
              )

              for pattern, description in forbidden:

                  if re.search(
                      pattern,
                      text,
                  ):

                      failures.append(
                          f"{path}: {description}"
                      )


          if failures:

              print("\n".join(failures))

              raise SystemExit(
                  "Workflow hazard scan failed."
              )


          print("Workflow hazard scan passed.")
          PY

      # ======================================================================
      # 13. VALIDATE PYTHON SOURCE
      # ======================================================================

      - name: Validate Python source syntax
        id: python_syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$AGENT_SCRIPT"

          python -m compileall -q scripts

          if [ -d tests ]; then
            python -m compileall -q tests
          fi

          echo "Python syntax validation passed."

      # ======================================================================
      # 14. VERIFY AUTONOMOUS AGENT CLI
      # ======================================================================

      - name: Verify autonomous agent CLI
        id: agent_cli
        shell: bash
        run: |
          set -Eeuo pipefail

          help_output="$(
            python "$AGENT_SCRIPT" --help 2>&1
          )"

          echo "$help_output"

          required_commands=(
            "validate-all"
            "validate-platforms"
            "validate-features"
            "validate-file-handlers"
            "generate-memory-index"
            "generate-model-card"
            "proof"
            "checkpoint"
          )

          for command in "${required_commands[@]}"; do
            if ! echo "$help_output" | grep -Fq "$command"; then
              echo "::error::Required CLI command missing: $command"
              exit 1
            fi
          done

          if echo "$help_output" | grep -Fq "validate-all-platforms"; then
            echo "::error::Obsolete CLI command exposed: validate-all-platforms"
            exit 1
          fi

          if echo "$help_output" | grep -Fq "validate-all-features"; then
            echo "::error::Obsolete CLI command exposed: validate-all-features"
            exit 1
          fi

          echo "Autonomous-agent CLI compatibility passed."

      # ======================================================================
      # 15. OLLAMA PREFLIGHT
      # ======================================================================

      - name: Ollama preflight and recovery
        id: ollama_preflight
        if: steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "OLLAMA PREFLIGHT"
          echo "============================================================"

          ollama_available="false"

          if command -v ollama >/dev/null 2>&1; then
            ollama_available="true"
          fi

          if [ "$ollama_available" != "true" ]; then
            echo "::warning::Ollama binary is not installed."
            exit 0
          fi

          ollama version || true

          if curl \
            --fail \
            --silent \
            --show-error \
            --max-time 10 \
            "$OLLAMA_HOST/api/tags" \
            >/tmp/ollama-tags.json; then

            echo "Ollama service is reachable."

          else

            echo "::warning::Ollama service is not reachable."

            nohup ollama serve \
              >"$RUNNER_TEMP/ollama.log" \
              2>&1 &

            recovered="false"

            for attempt in $(seq 1 30); do

              if curl \
                --fail \
                --silent \
                --max-time 5 \
                "$OLLAMA_HOST/api/tags" \
                >/tmp/ollama-tags.json; then

                echo "Ollama service recovered."
                recovered="true"
                break

              fi

              sleep 2

            done

            if [ "$recovered" != "true" ]; then
              echo "::warning::Ollama service could not be started."
            fi

          fi

      # ======================================================================
      # 16. TEST SUITE
      # ======================================================================

      - name: Execute repository test suite
        id: tests
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail

          if [ -f tests/test_ollama_autonomous_agent.py ]; then

            python -m pytest \
              tests/test_ollama_autonomous_agent.py \
              -v \
              --tb=short

          elif [ -d tests ]; then

            python -m pytest \
              tests \
              -v \
              --tb=short

          else

            echo "No tests directory found."

          fi

      # ======================================================================
      # 17. TEST FAILURE DIAGNOSTICS
      # ======================================================================

      - name: Diagnose test failure
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "AUTOMATIC TEST FAILURE DIAGNOSTICS"
            echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
            echo
            echo "Python:"
            python --version || true
            echo
            echo "Pip:"
            python -m pip --version || true
            echo
            echo "Git status:"
            git status --short || true
          } > "$TRACK_DIR/test_failure_diagnostics.txt"

          python -m pip freeze \
            >> "$TRACK_DIR/test_failure_diagnostics.txt" \
            2>&1 || true

      # ======================================================================
      # 18. DEPENDENCY RECOVERY
      # ======================================================================

      - name: Attempt bounded dependency recovery
        if: steps.tests.outcome == 'failure' && env.QMOI_AUTO_HEAL == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            pytest \
            PyYAML

          if [ -f requirements.txt ]; then
            python -m pip install --upgrade \
              -r requirements.txt
          fi

      # ======================================================================
      # 19. TEST RETRY
      # ======================================================================

      - name: Retry repository tests after recovery
        id: tests_retry
        if: steps.tests.outcome == 'failure' && env.QMOI_AUTO_HEAL == 'true'
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail

          if [ -f tests/test_ollama_autonomous_agent.py ]; then

            python -m pytest \
              tests/test_ollama_autonomous_agent.py \
              -v \
              --tb=short

          elif [ -d tests ]; then

            python -m pytest \
              tests \
              -v \
              --tb=short

          else

            echo "No tests found."

          fi

      # ======================================================================
      # 20. RECORD TEST STATUS
      # ======================================================================

      - name: Record test status
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TEST_RETRY_OUTCOME: ${{ steps.tests_retry.outcome }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"

          cat > "$TRACK_DIR/LAST_TEST_RESULT.txt" <<EOF
          Timestamp UTC:
          $now

          Initial test:
          ${TEST_OUTCOME:-unknown}

          Recovery test:
          ${TEST_RETRY_OUTCOME:-not-run}
          EOF

      # ======================================================================
      # 21. CREATE PRE-AGENT CHECKPOINT
      # ======================================================================

      - name: Create pre-agent repository checkpoint
        id: pre_agent_checkpoint
        if: steps.execution_mode.outputs.run_agent == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          git status --short \
            > "$TRACK_DIR/pre_agent_status.txt"

          git diff \
            > "$TRACK_DIR/pre_agent_diff.patch" || true

          git rev-parse HEAD \
            > "$TRACK_DIR/pre_agent_head.txt"

          echo "Pre-agent checkpoint created."

      # ======================================================================
      # 22. ACTIVE AUTONOMOUS AGENT
      # ======================================================================

      - name: Execute autonomous agent
        id: agent_execution
        if: steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        timeout-minutes: 300
        shell: bash
        env:
          MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || env.DEFAULT_MAX_ITERATIONS }}
          MAX_PER_ITERATION: ${{ github.event.inputs.max_per_iteration || env.DEFAULT_MAX_PER_ITERATION }}
        run: |
          set -Eeuo pipefail

          command="${{ steps.execution_mode.outputs.command }}"

          echo "============================================================"
          echo "OLLAMA AUTONOMOUS AGENT"
          echo "============================================================"

          echo "Command: $command"

          case "$command" in

            validate-all)
              python "$AGENT_SCRIPT" validate-all
              ;;

            validate-platforms)
              python "$AGENT_SCRIPT" validate-platforms
              ;;

            validate-features)
              python "$AGENT_SCRIPT" validate-features
              ;;

            validate-file-handlers)
              python "$AGENT_SCRIPT" validate-file-handlers
              ;;

            generate-memory-index)
              python "$AGENT_SCRIPT" generate-memory-index
              ;;

            generate-model-card)
              python "$AGENT_SCRIPT" generate-model-card
              ;;

            proof)
              python "$AGENT_SCRIPT" proof
              ;;

            checkpoint)
              python "$AGENT_SCRIPT" checkpoint
              ;;

            *)
              echo "::error::Unsupported agent command: $command"
              exit 2
              ;;

          esac

      # ======================================================================
      # 23. POST-AGENT GIT REPAIR
      # ======================================================================

      - name: Repair Git repository after autonomous agent
        id: git_recovery_post_agent
        if: always() && steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "POST-AGENT GIT RECOVERY"
          echo "============================================================"

          find .git \
            -type f \
            \( -name '*.lock' -o -name 'index.lock' \) \
            -print 2>/dev/null |
          while IFS= read -r lock; do
            rm -f "$lock"
          done

          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            rm -f .git/index
            git reset --mixed HEAD
          fi

          git rev-parse --verify HEAD
          git status --short

      # ======================================================================
      # 24. BOUNDED AGENT RECOVERY
      # ======================================================================

      - name: Attempt bounded autonomous agent recovery
        id: agent_recovery
        if: steps.agent_execution.outcome == 'failure' && env.QMOI_AUTO_HEAL == 'true'
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail

          recovery_log="$TRACK_DIR/agent_recovery.log"

          find .git \
            -type f \
            \( -name '*.lock' -o -name 'index.lock' \) \
            -delete 2>/dev/null || true

          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            rm -f .git/index
            git reset --mixed HEAD
          fi

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            pytest \
            PyYAML \
            >> "$recovery_log" 2>&1 || true

          command="${{ steps.execution_mode.outputs.command }}"

          case "$command" in
            validate-all|validate-platforms|validate-features|validate-file-handlers|generate-memory-index|generate-model-card|proof|checkpoint)
              python "$AGENT_SCRIPT" "$command" >> "$recovery_log" 2>&1
              ;;
            *)
              python "$AGENT_SCRIPT" validate-all >> "$recovery_log" 2>&1
              ;;
          esac

      # ======================================================================
      # 25. POST-AGENT SOURCE VALIDATION
      # ======================================================================

      - name: Validate repository after autonomous changes
        id: post_agent_validation
        if: always() && steps.execution_mode.outputs.run_agent == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "POST-AGENT VALIDATION"
          echo "============================================================"

          git status --short
          git diff --check

          python -m compileall -q scripts

          if [ -d tests ]; then
            python -m compileall -q tests
          fi

      # ======================================================================
      # 26. DETECT CHANGES
      # ======================================================================

      - name: Analyze autonomous repository changes
        id: change_analysis
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$TRACK_DIR"

          git status --short \
            > "$TRACK_DIR/final_git_status.txt" || true

          git diff --stat \
            > "$TRACK_DIR/final_diff_stat.txt" || true

          git diff \
            > "$TRACK_DIR/final_diff.patch" || true

          changed_files="$(
            git status --short |
            wc -l |
            tr -d ' '
          )"

          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

      # ======================================================================
      # 27. SAFE COMMIT OF MECHANICAL REPAIRS
      # ======================================================================

      - name: Commit safe mechanical repairs
        id: safe_repair_commit
        if: |
          env.QMOI_AUTO_FIX == 'true' &&
          steps.action_repair.outputs.changed == '1' &&
          steps.post_agent_validation.outcome != 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "SAFE MECHANICAL REPAIR COMMIT"
          echo "============================================================"

          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            rm -f .git/index
            git reset --mixed HEAD
          fi

          git add .github/workflows

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "ci: repair workflow actions and agent CLI commands"

          branch="${{ github.event.repository.default_branch }}"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              break
            fi
            sleep $((attempt * 10))
            git fetch origin "$branch"
            git rebase "origin/$branch"
          done

      # ======================================================================
      # 28. FINAL GIT INTEGRITY
      # ======================================================================

      - name: Final Git integrity verification
        id: final_git
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          if ! git status --porcelain=v1 >/dev/null 2>&1; then
            rm -f .git/index
            git reset --mixed HEAD
          fi

          git fsck \
            --no-progress \
            > "$TRACK_DIR/final_git_fsck.txt" \
            2>&1 || true

      # ======================================================================
      # 29. FINAL TEST / VALIDATION
      # ======================================================================

      - name: Final lightweight validation
        id: final_validation
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m compileall -q scripts
          if [ -d tests ]; then
            python -m pytest tests -q --tb=short
          fi

      # ======================================================================
      # 30. FINAL TELEMETRY
      # ======================================================================

      - name: Finalize durable telemetry
        id: finalize
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          AGENT_OUTCOME: ${{ steps.agent_execution.outcome }}
          RECOVERY_OUTCOME: ${{ steps.agent_recovery.outcome }}
          FINAL_GIT_OUTCOME: ${{ steps.final_git.outcome }}
          FINAL_VALIDATION_OUTCOME: ${{ steps.final_validation.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$TRACK_DIR"
          now="$(date -u '+%Y-%m-%dT%H:%M:%S.%3NZ')"
          
          cat > "$TRACK_DIR/CURRENT_STATUS.txt" <<EOF
          OLLAMA AUTONOMOUS AGENT - FINAL STATUS
          Timestamp UTC: $now
          Agent: ${AGENT_OUTCOME:-not-run}
          Recovery: ${RECOVERY_OUTCOME:-not-run}
          Final Git: ${FINAL_GIT_OUTCOME:-unknown}
          Final validation: ${FINAL_VALIDATION_OUTCOME:-unknown}
          EOF

      # ======================================================================
      # 31. GITHUB ACTIONS SUMMARY
      # ======================================================================

      - name: Publish GitHub Actions summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "# Ollama Autonomous Agent"
            echo "## Execution Summary"
            echo "- Agent: ${{ steps.agent_execution.outcome || 'not-run' }}"
            echo "- Recovery: ${{ steps.agent_recovery.outcome || 'not-run' }}"
            echo "- Final Git: ${{ steps.final_git.outcome || 'unknown' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ======================================================================
      # 32. ALWAYS PRESERVE DIAGNOSTICS
      # ======================================================================

      - name: Upload autonomous-agent diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-autonomous-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ollamatracks/
            ${{ runner.temp }}/ollama.log
          if-no-files-found: warn
          retention-days: 30

      # ======================================================================
      # 33. FINAL FAILURE GATE
      # ======================================================================

      - name: Enforce final health gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          execution="${{ steps.execution_mode.outputs.run_agent }}"
          agent="${{ steps.agent_execution.outcome }}"
          recovery="${{ steps.agent_recovery.outcome }}"
          final_git="${{ steps.final_git.outcome }}"
          final_validation="${{ steps.final_validation.outcome }}"

          if [ "$execution" != "true" ]; then
            exit 0
          fi

          if [ "$final_git" != "success" ] || [ "$final_validation" != "success" ]; then
            exit 1
          fi

          if [ "$agent" = "success" ] || [ "$recovery" = "success" ]; then
            exit 0
          fi

          exit 1
