name: Security Checks (Pre-Merge)
on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main, develop, release/**]

permissions:
  contents: read
  security-events: write

jobs:
  detect-secrets:
    name: Detect Secrets & Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets[all] -q

      - name: Initialize or update baseline
        run: |
          if [ -f .secrets.baseline ]; then
            echo "✅ Using existing .secrets.baseline"
          else
            echo "⚠️ Creating new .secrets.baseline"
            detect-secrets scan --baseline .secrets.baseline --all-files \
              --exclude-files "package-lock.json|yarn.lock|*.lock" \
              --exclude-lines "REDACTED|redacted|\[REDACTED" || true
          fi

      - name: Scan for new secrets
        id: scan
        run: |
          echo "🔍 Scanning for secrets..."
          detect-secrets scan --all-files \
            --exclude-files "package-lock.json|yarn.lock|*.lock" \
            --exclude-lines "REDACTED|redacted|\[REDACTED" \
            > .secrets.scan.json
          
          # Compare with baseline
          if detect-secrets audit .secrets.baseline .secrets.scan.json 2>/dev/null; then
            echo "status=clean" >> $GITHUB_OUTPUT
            echo "✅ No new secrets detected"
          else
            echo "status=found" >> $GITHUB_OUTPUT
            echo "❌ Potential secrets detected"
          fi

      - name: Report results
        if: steps.scan.outputs.status == 'found'
        run: |
          echo "⚠️ Potential secrets found. Please review:"
          cat .secrets.scan.json | jq -r '.results[] | "\(.filename): \(.type)"' || true
          exit 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: detect-secrets-scan
          path: .secrets.scan.json
          retention-days: 30

  link-integrity:
    name: Check Link Integrity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Check links (report only)
        run: |
          if [ -f tools/check_links_clean.py ]; then
            echo "🔗 Checking links in repository..."
            python tools/check_links_clean.py \
              --output link_report.json \
              --timeout 5 \
              --workers 4 \
              || true  # Don't fail workflow on link issues
          else
            echo "⚠️ Link checker not found"
          fi

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: link-integrity-report
          path: link_report.json
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [detect-secrets]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🔒 Security Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### detect-secrets: ${{ needs.detect-secrets.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-secrets.result }}" = "failure" ]; then
            echo "❌ **Security check failed**. Review artifacts for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All security checks passed.**" >> $GITHUB_STEP_SUMMARY
          fi
