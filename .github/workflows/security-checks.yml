name: Security Checks (Pre-Merge)

on:
  push:
    branches:
    - main
    - develop
    - release/**
  pull_request:
    branches:
    - main
    - develop
    - release/**
permissions:
  contents: read
  security-events: write
jobs:
  detect-secrets:
    name: Detect Secrets & Credentials
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install detect-secrets
      run: pip install detect-secrets[all] -q
    - name: Initialize or update baseline
      run: "if [ -f .secrets.baseline ]; then\n  echo \"\u2705 Using existing .secrets.baseline\"\
        \nelse\n  echo \"\u26A0\uFE0F Creating new .secrets.baseline\"\n  detect-secrets\
        \ scan --baseline .secrets.baseline --all-files \\\n    --exclude-files \"\
        package-lock.json|yarn.lock|*.lock\" \\\n    --exclude-lines \"REDACTED|redacted|\\\
        [REDACTED\" || true\nfi\n"
    - name: Scan for new secrets
      id: scan
      run: "echo \"\U0001F50D Scanning for secrets...\"\ndetect-secrets scan --all-files\
        \ \\\n  --exclude-files \"package-lock.json|yarn.lock|*.lock\" \\\n  --exclude-lines\
        \ \"REDACTED|redacted|\\[REDACTED\" \\\n  > .secrets.scan.json\n\n# Compare\
        \ with baseline\nif detect-secrets audit .secrets.baseline .secrets.scan.json\
        \ 2>/dev/null; then\n  echo \"status=clean\" >> $GITHUB_OUTPUT\n  echo \"\u2705\
        \ No new secrets detected\"\nelse\n  echo \"status=found\" >> $GITHUB_OUTPUT\n\
        \  echo \"\u274C Potential secrets detected\"\nfi\n"
    - name: Report results
      if: steps.scan.outputs.status == 'found'
      run: "echo \"\u26A0\uFE0F Potential secrets found. Please review:\"\ncat .secrets.scan.json\
        \ | jq -r '.results[] | \"\\(.filename): \\(.type)\"' || true\nexit 1\n"
    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: detect-secrets-scan
        path: .secrets.scan.json
        retention-days: 30
  link-integrity:
    name: Check Link Integrity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Check links (report only)
      run: "if [ -f tools/check_links_clean.py ]; then\n  echo \"\U0001F517 Checking\
        \ links in repository...\"\n  python tools/check_links_clean.py \\\n    --output\
        \ link_report.json \\\n    --timeout 5 \\\n    --workers 4 \\\n    || true\
        \  # Don't fail workflow on link issues\nelse\n  echo \"\u26A0\uFE0F Link\
        \ checker not found\"\nfi\n"
    - name: Upload link report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: link-integrity-report
        path: link_report.json
        retention-days: 30
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
    - detect-secrets
    if: always()
    steps:
    - name: Generate summary
      run: "echo \"## \U0001F512 Security Check Summary\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"### detect-secrets: ${{ needs.detect-secrets.result\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\nif [\
        \ \"${{ needs.detect-secrets.result }}\" = \"failure\" ]; then\n  echo \"\u274C\
        \ **Security check failed**. Review artifacts for details.\" >> $GITHUB_STEP_SUMMARY\n\
        \  exit 1\nelse\n  echo \"\u2705 **All security checks passed.**\" >> $GITHUB_STEP_SUMMARY\n\
        fi\n"
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
  workflow_dispatch: {}
