name: Placeholder PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  placeholder-pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run placeholder check and fail on find
        run: node scripts/qmoi_placeholder_checker.js --scan --fail-on-find

