productName: QMOI
appId: com.qmoi.app
directories:
  output: dist_electron
files:
  - build/**/*
  - package.json
linux:
  target:
    - AppImage
    - deb
win:
  target:
    - nsis
mac:
  target:
    - dmg
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
electronDownload:
  mirror: https://electronjs.org/headers
appId: com.qmoi.qmoi
productName: QMOI AI
directories:
  output: dist_electron
  buildResources: build
files:
  - '!node_modules'
  - '!**/test/**'
  - '**/*'
win:
  target:
    - nsis
  icon: build/icon
mac:
  target:
    - dmg
  icon: build/icon
linux:
  target:
    - AppImage
  icon: build/icon
publish:
  provider: generic
  url: https://downloads.qmoi.app/releases
