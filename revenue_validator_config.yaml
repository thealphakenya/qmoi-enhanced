# Revenue Validator Configuration
# This file configures the revenue validation system for production deployment

production:
  enabled: true
  api_endpoint: "https://api.qmoi-enhanced.com"
  validation_interval: 300  # 5 minutes
  retry_attempts: 3
  timeout_seconds: 30

security:
  encryption_enabled: true
  audit_logging: true
  rate_limiting: true
  max_requests_per_hour: 1000

monitoring:
  metrics_collection: true
  alert_thresholds:
    revenue_drop_percentage: 10
    transaction_failure_rate: 5
  dashboard_enabled: true

features:
  real_time_validation: true
  predictive_analytics: true
  anomaly_detection: true
  automated_reporting: true

integrations:
  payment_processors:
    - stripe
    - paypal
    - square
  analytics:
    - google_analytics
    - mixpanel
  monitoring:
    - datadog
    - new_relic
