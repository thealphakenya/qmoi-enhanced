apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qmoi-ingress
  namespace: qmoi
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - qmoi.example.com
    secretName: qmoi-tls
  rules:
  - host: qmoi.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qmoi-app
            port:
              number: 3000
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@qmoi.example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
---
apiVersion: v1
kind: Namespace
metadata:
  name: qmoi
  labels:
    name: qmoi
