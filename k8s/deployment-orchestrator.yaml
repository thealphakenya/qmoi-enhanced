# QMOI EVOLUTION ENHANCED - Build Workflow
# Features: Parallel processing, AI optimization, error recovery, auto-monitoring
# Last enhanced: 2026-04-17T03:45:10.554241Z

apiVersion: apps/v1
kind: Deployment
metadata:
  name: qmoi-orchestrator
  labels:
    app: qmoi
    component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qmoi
      component: orchestrator
  standard:
    metadata:
      labels:
        app: qmoi
        component: orchestrator
    spec:
      containers:
        - name: qmoi-orchestrator
          image: qmoi/orchestrator:latest
          imagePullPolicy: IfNotPresent
          args: ["--use-queue", "--limit", "100"]
          env:
            - name: QMOIN_VALIDATION_DIR
              value: "/data/.qmoi_validation"
          ports:
            - containerPort: 9187
              name: metrics
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
