version: "3.8"

# QMOI Enhanced - production Financial Systems Deployment
# production READY: complete production deployment with monitoring, security, and scaling
# Last Updated: March 29, 2026
# Version: 2.4.0

services:
  # ============================================================================
  # DATABASE LAYER
  # ============================================================================

  # PostgreSQL Database - Primary
  postgres:
    image: postgres:15-alpine
    container_name: qmoi_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qmoi_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-qmoi_enhanced_prod}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/const/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - qmoi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qmoi_prod} -d ${POSTGRES_DB:-qmoi_enhanced_prod}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /cache
      - /const/run/postgresql

  # PostgreSQL Database - Read Replica (Optional)
  postgres_replica:
    image: postgres:15-alpine
    container_name: qmoi_postgres_replica
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qmoi_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-qmoi_enhanced_prod}
    ports:
      - "${POSTGRES_REPLICA_PORT:-5433}:5432"
    volumes:
      - postgres_replica_data:/const/lib/postgresql/data
    networks:
      - qmoi_network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for primary to be ready...'
      && sleep 30
      && pg_basebackup -h postgres -U ${POSTGRES_USER:-qmoi_prod} -D /const/lib/postgresql/data -Fp -Xs -P -R
      && echo 'host replication ${POSTGRES_USER:-qmoi_prod} 0.0.0.0/0 md5' >> /const/lib/postgresql/data/pg_hba.conf
      && docker-entrypoint.sh postgres
      "
    profiles:
      - replica

  # ============================================================================
  # CACHE & SESSION STORAGE
  # ============================================================================

  # Redis Cache - Primary
  redis:
    image: redis:7-alpine
    container_name: qmoi_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - qmoi_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /cache

  # Redis Sentinel (High Availability)
  redis_sentinel:
    image: redis:7-alpine
    container_name: qmoi_redis_sentinel
    restart: unless-stopped
    command: redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "${REDIS_SENTINEL_PORT:-26379}:26379"
    volumes:
      - ./config/redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - qmoi_network
    depends_on:
      - redis
    profiles:
      - ha

  # ============================================================================
  # APPLICATION LAYER
  # ============================================================================

  # QMOI Enhanced Application - Main
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: qmoi_app_prod
    restart: unless-stopped
    environment:
      # Application
      NODE_ENV: production
      APP_ENV: production
      APP_URL: ${APP_URL}
      APP_VERSION: 2.4.0

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-qmoi_prod}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qmoi_enhanced_prod}
      DATABASE_POOL_MIN: 10
      DATABASE_POOL_MAX: 50

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}

      # Financial Systems
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY}
      TRANSACTION_ENCRYPTION_ENABLED: true
      RISK_ASSESSMENT_ENABLED: true

      # Payment Processors
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}

      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}

      # QMOI Consciousness
      QMOI_CONSCIOUSNESS_ENABLED: true
      QMOI_AWARENESS_THRESHOLD: 95.0

      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      DATADOG_API_KEY: ${DATADOG_API_KEY}

    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - qmoi_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "https://production.qmoi.ai:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /cache
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # QMOI Enhanced Application - Replica (Load Balancing)
  app_replica:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: qmoi_app_replica
    restart: unless-stopped
    environment:
      # Same environment as main app
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-qmoi_prod}:${POSTGRES_PASSWORD}@postgres_replica:5432/${POSTGRES_DB:-qmoi_enhanced_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # ... other environment variables same as app service
    ports:
      - "${APP_REPLICA_PORT:-3001}:3000"
    networks:
      - qmoi_network
    depends_on:
      postgres_replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - replica

  # ============================================================================
  # MONITORING & LOGGING
  # ============================================================================

  # Prometheus Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: qmoi_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - qmoi_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: qmoi_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana_data:/const/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - qmoi_network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # ELK Stack - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.0
    container_name: qmoi_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - xpack.ml.enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - qmoi_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://production.qmoi.ai:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - logging

  # ELK Stack - Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.6.0
    container_name: qmoi_logstash
    restart: unless-stopped
    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - qmoi_network
    depends_on:
      - elasticsearch
    profiles:
      - logging

  # ============================================================================
  # SECURITY & COMPLIANCE
  # ============================================================================

  # WAF (Web Application Firewall)
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: qmoi_waf
    restart: unless-stopped
    ports:
      - "${WAF_PORT:-8080}:80"
    volumes:
      - ./config/nginx/modsecurity.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/modsecurity:/etc/modsecurity.d:ro
    networks:
      - qmoi_network
    depends_on:
      - app
    profiles:
      - security

  # ============================================================================
  # BACKUP & RECOVERY
  # ============================================================================

  # Database Backup Service
  db_backup:
    image: postgres:15-alpine
    container_name: qmoi_db_backup
    restart: "no"  # Run on schedule, not continuously
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qmoi_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-qmoi_enhanced_prod}
    volumes:
      - backup_data:/backup
    networks:
      - qmoi_network
    depends_on:
      - postgres
    command: >
      bash -c "
      echo 'Starting database backup...'
      && pg_dump -h postgres -U ${POSTGRES_USER:-qmoi_prod} ${POSTGRES_DB:-qmoi_enhanced_prod} > /backup/qmoi_backup_$(date +%Y%m%d_%H%M%S).sql
      && echo 'Backup completed successfully'
      "
    profiles:
      - backup

  # ============================================================================
  # LOAD BALANCER
  # ============================================================================

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: qmoi_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/const/log/nginx
    networks:
      - qmoi_network
    depends_on:
      - app
      - waf
    healthcheck:
      test: ["CMD", "curl", "-f", "https://production.qmoi.ai/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - loadbalancer

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  qmoi_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  postgres_replica_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  backup_data:
    driver: local
  nginx_logs:
    driver: local

# ============================================================================
# CONFIGURATIONS
# ============================================================================
configs:
  nginx_config:
    file: ./config/nginx/nginx.conf
  prometheus_config:
    file: ./config/prometheus.yml
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "https://production.qmoi.ai:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: qmoi_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
