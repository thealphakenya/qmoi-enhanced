# Pre-commit hook configuration for QMOI Enhanced
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

fail_fast: false
minimum_pre_commit_version: 2.15.0

repos:
  # YAML linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Secret detection with detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: detect-secrets scan
        language: python
        types: [text]
        # Generate baseline: detect-secrets scan > .secrets.baseline
        # This prevents false positives from being flagged
        exclude_types: [lock, json]
        exclude: |
          (?x)^(
            package-lock\.json|
            yarn\.lock|
            \.secrets\.baseline|
            CREDENTIAL_ROTATION_PLAYBOOK\.md
          )$

  # Python code quality
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: black
        language_version: python3.11
        args: ["--line-length=100"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        args: ["--fix", "--line-length=100"]

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json]
        additional_dependencies:
          - prettier
          - "@prettier/plugin-xml"

  # Commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.12.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        additional_dependencies: ["pyyaml"]

  # Security scanning with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: bandit
        language_version: python3.11
        exclude: tests/
        args: ["-c", ".bandit", "-ll", "--skip", "B101"] # Skip test assertions

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.36.0
    hooks:
      - id: markdownlint
        args: ["--ignore", "node_modules", "--ignore", ".git"]

# Configuration for individual tools

default_language_version:
  python: python3.11

# Skip CI/CD and large file operations
default_stages: [commit, push]

# Environment setup
ci:
  skip: ["commitizen"] # Skip commitizen in CI (handled by semantic-release)
  autofix_commit_msg: "ci: auto-format and lint"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "ci: auto-update pre-commit hooks"
  autoupdate_schedule: weekly
  submodules: false
