name: Vercel build + autofix

on:
  push:
    branches:
      - autosync-backup-20250926-232440
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  build-and-autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies (node)
        if: ${{ hashFiles('**/package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        shell: bash

      - name: Install dependencies (python)
        if: ${{ hashFiles('**/requirements.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run build (capture logs)
        run: |
          set -o pipefail
          if [ -f package.json ] && grep -q "build" package.json; then
            npm run build 2>&1 | tee build.log || true
          else
            echo "No node build script; skipping npm build" | tee build.log
          fi
        shell: bash

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build-log
          path: build.log

      - name: Attempt autofix for failures
        if: failure()
        run: |
          python tools/auto_fix_build.py --log build.log --apply || true

      - name: Push autofix branch and create PR (if any)
        if: success() || failure()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.MY_CUSTOM_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated build fixes"
          title: "Automated: build fixes (from vercel-autofix)"
          body: "This PR contains automated build-fix attempts (dependency installs) created by CI. Please review before merging."
          branch: auto/vercel-fixes
