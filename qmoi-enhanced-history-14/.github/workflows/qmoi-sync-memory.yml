name: qmoi-memory-sync

on:
  push:
    branches: [autosync-backup-20250926-232440]
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes

jobs:
  sync-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Run sync_memory.py
        env:
          QMOI_SYNC_BACKENDS: ${{ secrets.QMOI_SYNC_BACKENDS }}
          QMOI_GIST_ID: ${{ secrets.QMOI_GIST_ID }}
          QMOI_GH_TOKEN: ${{ secrets.QMOI_GH_TOKEN }}
          QMOI_HF_REPO: ${{ secrets.QMOI_HF_REPO }}
          QMOI_HF_TOKEN: ${{ secrets.QMOI_HF_TOKEN }}
          QMOI_SYNC_API_KEY: ${{ secrets.QMOI_SYNC_API_KEY }}
        run: |
          python3 scripts/sync_memory.py
