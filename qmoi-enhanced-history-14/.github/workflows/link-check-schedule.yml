name: Link & DNS checker (daily)

on:
  push:
    branches: [ main, autosync-backup-20250926-232440, auto/http-to-https-20251110 ]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run link checker
        run: |
          python -m pip install --upgrade pip || true
          python tools/check_links.py --max-workers 8 --timeout 4

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            tools/dns_docs_inventory.json
            tools/dns_links_report.json
            tools/dns_links_report.md
            tools/link_fix_proposals.json
            tools/link_fix_actions.md
