<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>QMOI Space (Redirect)</title>
        <meta http-equiv="refresh" content="0; url=/pwa_apps/qmoi-space/index.html" />
        <script>
            (function(){
                const target = '/pwa_apps/qmoi-space/index.html?_open=' + Date.now();
                if (location.pathname !== target.split('?')[0]) {
                    location.replace(target);
                }
            })();
        </script>
    </head>
    <body>
        <p>Redirecting to QMOI Space... <a href="/pwa_apps/qmoi-space/index.html">Open QMOI Space</a></p>
    </body>
