name: Workflow Status Tracker

# ============================================================================
# OLLAMA WORKFLOW STATUS TRACKER
# ============================================================================
#
# PURPOSE
# -------
# Independent GitHub-level monitoring for:
#
#   - Ollama PR Validation - 293+ Platform Features
#   - validation workflow runs
#   - validation workflow jobs
#   - associated pull requests
#   - validation completion
#   - validation status reporting
#
# This workflow runs on GitHub-hosted infrastructure and does NOT depend on:
#
#   - GitHub Codespaces
#   - a local machine
#   - a local Ollama process
#   - a local terminal
#
# It is intentionally observational.
#
# SECURITY
# --------
# This workflow does NOT checkout or execute pull-request source code merely
# to inspect validation status. GitHub API metadata is used for monitoring.
#
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # Monitor completion of the Ollama validation workflow.
  # --------------------------------------------------------------------------

  workflow_run:
    workflows:
      - "Ollama PR Validation - 293+ Platform Features"
    types:
      - requested
      - in_progress
      - completed

  # --------------------------------------------------------------------------
  # Periodic reconciliation.
  # --------------------------------------------------------------------------

  schedule:
    - cron: "*/5 * * * *"

  # --------------------------------------------------------------------------
  # Allow manual execution.
  # --------------------------------------------------------------------------

  workflow_dispatch:

    inputs:

      post_comment:
        description: "Post/update a validation status comment when validation succeeds"
        required: false
        type: boolean
        default: true

      inspect_jobs:
        description: "Inspect validation workflow jobs"
        required: false
        type: boolean
        default: true


# ============================================================================
# PERMISSIONS
# ============================================================================
#
# The monitoring job only needs read permissions.
#
# The PR comment job receives pull-request write permission separately.
# ============================================================================

permissions:

  actions: read

  contents: read

  pull-requests: write


# ============================================================================
# CONCURRENCY
# ============================================================================

concurrency:

  group: workflow-status-tracker

  cancel-in-progress: false


# ============================================================================
# GLOBAL ENVIRONMENT
# ============================================================================

env:

  VALIDATION_WORKFLOW_NAME: "Ollama PR Validation - 293+ Platform Features"

  MAX_WORKFLOW_RUNS: "10"

  MAX_JOBS: "100"

  MAX_PRS: "100"


# ============================================================================
# JOB 1
# TRACK VALIDATION WORKFLOW
# ============================================================================

jobs:

  track-status:

    name: Track & Report Workflow Status

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      pull-requests: read

    timeout-minutes: 10

    steps:

      # ======================================================================
      # NO CHECKOUT REQUIRED
      # ======================================================================
      #
      # This tracker uses the GitHub API only.
      #
      # Avoiding checkout makes the monitor:
      #
      #   - faster
      #   - safer
      #   - independent of repository source state
      #   - independent of PR code
      #
      # ======================================================================

      - name: Inspect validation workflow status
        id: validation
        uses: actions/github-script@v8
        env:
          VALIDATION_WORKFLOW_NAME: ${{ env.VALIDATION_WORKFLOW_NAME }}
          MAX_WORKFLOW_RUNS: ${{ env.MAX_WORKFLOW_RUNS }}
          MAX_JOBS: ${{ env.MAX_JOBS }}
          MAX_PRS: ${{ env.MAX_PRS }}
          INSPECT_JOBS: ${{ inputs.inspect_jobs }}
        with:
          github-token: ${{ github.token }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const workflowName =
              process.env.VALIDATION_WORKFLOW_NAME ||
              "Ollama PR Validation - 293+ Platform Features";

            const maxRuns =
              Math.max(
                1,
                Number(process.env.MAX_WORKFLOW_RUNS || "10")
              );

            const maxJobs =
              Math.max(
                1,
                Number(process.env.MAX_JOBS || "100")
              );

            const maxPRs =
              Math.max(
                1,
                Number(process.env.MAX_PRS || "100")
              );

            const inspectJobs =
              String(
                process.env.INSPECT_JOBS || "true"
              ).toLowerCase() !== "false";

            const timestamp =
              new Date().toISOString();

            console.log("============================================================");
            console.log("OLLAMA WORKFLOW STATUS TRACKER");
            console.log("============================================================");
            console.log(`Repository: ${owner}/${repo}`);
            console.log(`Workflow:   ${workflowName}`);
            console.log(`Event:      ${context.eventName}`);
            console.log(`Run ID:     ${context.runId}`);
            console.log(`Timestamp:  ${timestamp}`);
            console.log("");

            // =================================================================
            // FIND VALIDATION WORKFLOW DYNAMICALLY
            // =================================================================

            let workflows = [];

            try {

              workflows =
                await github.paginate(
                  github.rest.actions.listRepoWorkflows,
                  {
                    owner,
                    repo,
                    per_page: 100
                  }
                );

            } catch (error) {

              core.warning(
                `Unable to list repository workflows: ${error.message}`
              );

              core.setOutput(
                "workflow_found",
                "false"
              );

              core.setOutput(
                "validation_status",
                "unknown"
              );

              return;
            }

            const validationWorkflow =
              workflows.find(
                workflow =>
                  workflow.name === workflowName
              ) || null;

            if (!validationWorkflow) {

              core.warning(
                `Validation workflow not found: ${workflowName}`
              );

              core.setOutput(
                "workflow_found",
                "false"
              );

              core.setOutput(
                "validation_status",
                "not_found"
              );

              await core.summary
                .addHeading(
                  "Ollama Workflow Status Tracker"
                )
                .addRaw(
                  `Validation workflow not found: ${workflowName}`
                )
                .write();

              return;
            }

            console.log("Validation workflow found:");
            console.log(`  Name: ${validationWorkflow.name}`);
            console.log(`  ID:   ${validationWorkflow.id}`);
            console.log(`  Path: ${validationWorkflow.path}`);
            console.log("");

            // =================================================================
            // GET VALIDATION WORKFLOW RUNS
            // =================================================================

            let validationRuns = [];

            try {

              const response =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: validationWorkflow.id,
                  per_page: Math.min(
                    maxRuns,
                    100
                  )
                });

              validationRuns =
                response.data.workflow_runs || [];

            } catch (error) {

              core.warning(
                `Unable to list validation workflow runs: ${error.message}`
              );

              core.setOutput(
                "workflow_found",
                "true"
              );

              core.setOutput(
                "validation_status",
                "unknown"
              );

              return;
            }

            // =================================================================
            // IDENTIFY RELEVANT RUN
            // =================================================================

            let targetRun = null;

            const workflowRunEvent =
              context.eventName === "workflow_run"
                ? context.payload.workflow_run
                : null;

            if (
              workflowRunEvent &&
              workflowRunEvent.workflow_id === validationWorkflow.id
            ) {

              targetRun =
                validationRuns.find(
                  run =>
                    run.id === workflowRunEvent.id
                ) || null;

              // If the run is too recent to appear in the listing,
              // retrieve it directly.
              if (!targetRun) {

                try {

                  const response =
                    await github.rest.actions.getWorkflowRun({
                      owner,
                      repo,
                      run_id: workflowRunEvent.id
                    });

                  targetRun =
                    response.data;

                } catch (error) {

                  core.warning(
                    `Unable to retrieve workflow_run ${workflowRunEvent.id}: ${error.message}`
                  );
                }
              }
            }

            // Scheduled/manual executions have no workflow_run payload.
            // In that case use the most recently updated validation run.

            if (!targetRun && validationRuns.length > 0) {

              targetRun =
                [...validationRuns]
                  .sort(
                    (a, b) =>
                      new Date(b.updated_at) -
                      new Date(a.updated_at)
                  )[0];
            }

            if (!targetRun) {

              console.log(
                "No validation workflow runs were found."
              );

              core.setOutput(
                "workflow_found",
                "true"
              );

              core.setOutput(
                "validation_status",
                "none"
              );

              await core.summary
                .addHeading(
                  "Ollama Workflow Status Tracker"
                )
                .addTable([
                  [
                    "Metric",
                    "Value"
                  ],
                  [
                    "Validation workflow",
                    "FOUND"
                  ],
                  [
                    "Workflow runs",
                    "0"
                  ],
                  [
                    "Status",
                    "NO RUNS"
                  ]
                ])
                .write();

              return;
            }

            // =================================================================
            // RUN INFORMATION
            // =================================================================

            console.log("Validation Run Details:");
            console.log(`  Run ID:       ${targetRun.id}`);
            console.log(`  Run Number:   ${targetRun.run_number}`);
            console.log(`  Status:       ${targetRun.status}`);
            console.log(`  Conclusion:   ${targetRun.conclusion || "pending"}`);
            console.log(`  Branch:       ${targetRun.head_branch || "unknown"}`);
            console.log(`  SHA:          ${targetRun.head_sha || "unknown"}`);
            console.log(`  Event:        ${targetRun.event || "unknown"}`);
            console.log(`  Created:      ${targetRun.created_at}`);
            console.log(`  Updated:      ${targetRun.updated_at}`);
            console.log(`  URL:          ${targetRun.html_url}`);
            console.log("");

            // =================================================================
            // JOB COLLECTION
            // =================================================================

            let jobs = [];

            if (inspectJobs) {

              try {

                jobs =
                  await github.paginate(
                    github.rest.actions.listJobsForWorkflowRun,
                    {
                      owner,
                      repo,
                      run_id: targetRun.id,
                      per_page: 100
                    }
                  );

                jobs =
                  jobs.slice(
                    0,
                    maxJobs
                  );

              } catch (error) {

                core.warning(
                  `Unable to fetch validation jobs: ${error.message}`
                );
              }
            }

            if (jobs.length > 0) {

              console.log("Validation Jobs:");

              for (const job of jobs) {

                console.log(
                  `  • ${job.name}: ${job.status}` +
                  ` (${job.conclusion || "pending"})`
                );
              }

              console.log("");
            }

            // =================================================================
            // JOB COUNTS
            // =================================================================

            const jobCounts = {
              total: jobs.length,
              queued: 0,
              in_progress: 0,
              completed: 0,
              success: 0,
              failure: 0,
              cancelled: 0,
              skipped: 0,
              other: 0
            };

            for (const job of jobs) {

              const status =
                String(
                  job.status || ""
                ).toLowerCase();

              const conclusion =
                String(
                  job.conclusion || ""
                ).toLowerCase();

              if (status === "queued") {
                jobCounts.queued++;
              } else if (status === "in_progress") {
                jobCounts.in_progress++;
              } else if (status === "completed") {
                jobCounts.completed++;
              }

              if (conclusion === "success") {
                jobCounts.success++;
              } else if (conclusion === "failure") {
                jobCounts.failure++;
              } else if (conclusion === "cancelled") {
                jobCounts.cancelled++;
              } else if (conclusion === "skipped") {
                jobCounts.skipped++;
              } else if (conclusion) {
                jobCounts.other++;
              }
            }

            // =================================================================
            // PULL REQUEST DISCOVERY
            // =================================================================

            let pullRequests = [];

            // First use the workflow_run payload when available.
            if (
              workflowRunEvent &&
              Array.isArray(workflowRunEvent.pull_requests)
            ) {

              pullRequests =
                workflowRunEvent.pull_requests.map(
                  pr => ({
                    number: pr.number,
                    url:
                      `https://github.com/${owner}/${repo}/pull/${pr.number}`
                  })
                );
            }

            // Fallback: search open PRs associated with the run branch.
            if (
              pullRequests.length === 0 &&
              targetRun.head_branch
            ) {

              try {

                const response =
                  await github.rest.pulls.list({
                    owner,
                    repo,
                    state: "open",
                    head:
                      `${owner}:${targetRun.head_branch}`,
                    per_page: Math.min(
                      maxPRs,
                      100
                    )
                  });

                pullRequests =
                  response.data || [];

              } catch (error) {

                core.warning(
                  `Unable to find PRs for branch ${targetRun.head_branch}: ${error.message}`
                );
              }
            }

            // =================================================================
            // STATUS INTERPRETATION
            // =================================================================

            const runStatus =
              String(
                targetRun.status || "unknown"
              ).toLowerCase();

            const runConclusion =
              targetRun.conclusion
                ? String(
                    targetRun.conclusion
                  ).toLowerCase()
                : null;

            let trackerState =
              "UNKNOWN";

            if (
              runStatus === "queued" ||
              runStatus === "requested" ||
              runStatus === "waiting" ||
              runStatus === "pending"
            ) {

              trackerState =
                "QUEUED";

            } else if (
              runStatus === "in_progress"
            ) {

              trackerState =
                "RUNNING";

            } else if (
              runStatus === "completed" &&
              runConclusion === "success"
            ) {

              trackerState =
                "SUCCESS";

            } else if (
              runStatus === "completed" &&
              runConclusion === "failure"
            ) {

              trackerState =
                "FAILED";

            } else if (
              runStatus === "completed" &&
              runConclusion === "cancelled"
            ) {

              trackerState =
                "CANCELLED";

            } else if (
              runStatus === "completed" &&
              runConclusion === "skipped"
            ) {

              trackerState =
                "SKIPPED";

            } else if (
              runStatus === "completed"
            ) {

              trackerState =
                String(
                  runConclusion || "COMPLETED"
                ).toUpperCase();
            }

            // =================================================================
            // STEP SUMMARY
            // =================================================================

            await core.summary
              .addHeading(
                "Ollama Workflow Status Tracker"
              )
              .addTable([
                [
                  "Metric",
                  "Value"
                ],
                [
                  "Repository",
                  `${owner}/${repo}`
                ],
                [
                  "Validation workflow",
                  validationWorkflow.name
                ],
                [
                  "Workflow ID",
                  String(validationWorkflow.id)
                ],
                [
                  "Run ID",
                  String(targetRun.id)
                ],
                [
                  "Run number",
                  String(targetRun.run_number)
                ],
                [
                  "Tracker state",
                  trackerState
                ],
                [
                  "GitHub status",
                  targetRun.status || "unknown"
                ],
                [
                  "Conclusion",
                  targetRun.conclusion || "pending"
                ],
                [
                  "Branch",
                  targetRun.head_branch || "unknown"
                ],
                [
                  "Commit",
                  targetRun.head_sha || "unknown"
                ],
                [
                  "Jobs inspected",
                  String(jobCounts.total)
                ],
                [
                  "Jobs succeeded",
                  String(jobCounts.success)
                ],
                [
                  "Jobs failed",
                  String(jobCounts.failure)
                ],
                [
                  "Open PRs associated",
                  String(pullRequests.length)
                ]
              ])
              .addHeading(
                "Validation Run"
              )
              .addRaw(
                `[Open validation run](${targetRun.html_url})`
              )
              .addRaw(
                `\n\nGenerated: ${timestamp}`
              )
              .write();

            // =================================================================
            // OUTPUTS
            // =================================================================

            core.setOutput(
              "workflow_found",
              "true"
            );

            core.setOutput(
              "workflow_id",
              String(validationWorkflow.id)
            );

            core.setOutput(
              "run_id",
              String(targetRun.id)
            );

            core.setOutput(
              "run_number",
              String(targetRun.run_number)
            );

            core.setOutput(
              "validation_status",
              runStatus
            );

            core.setOutput(
              "validation_conclusion",
              runConclusion || ""
            );

            core.setOutput(
              "tracker_state",
              trackerState
            );

            core.setOutput(
              "head_branch",
              targetRun.head_branch || ""
            );

            core.setOutput(
              "head_sha",
              targetRun.head_sha || ""
            );

            core.setOutput(
              "pr_count",
              String(pullRequests.length)
            );

            // =================================================================
            // FINAL CONSOLE REPORT
            // =================================================================

            console.log("============================================================");
            console.log("TRACKING RESULT");
            console.log("============================================================");
            console.log(`Workflow:       ${validationWorkflow.name}`);
            console.log(`Workflow ID:    ${validationWorkflow.id}`);
            console.log(`Run ID:         ${targetRun.id}`);
            console.log(`Status:         ${runStatus}`);
            console.log(`Conclusion:     ${runConclusion || "pending"}`);
            console.log(`Tracker State:  ${trackerState}`);
            console.log(`Jobs:           ${jobCounts.total}`);
            console.log(`Successful:     ${jobCounts.success}`);
            console.log(`Failed:         ${jobCounts.failure}`);
            console.log(`PRs:            ${pullRequests.length}`);
            console.log(`URL:            ${targetRun.html_url}`);
            console.log("============================================================");

      # ======================================================================
      # JOB-LEVEL REPORT
      # ======================================================================

      - name: Report tracker execution
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "WORKFLOW STATUS TRACKER"
          echo "============================================================"
          echo
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Tracker Run: $GITHUB_RUN_ID"
          echo "Attempt: $GITHUB_RUN_ATTEMPT"
          echo "Event: $GITHUB_EVENT_NAME"
          echo
          echo "The tracker runs independently on GitHub infrastructure."
          echo "Codespace/local-machine availability is not required."
          echo
          echo "============================================================"


  # ==========================================================================
  # JOB 2
  # POST OR UPDATE PR VALIDATION STATUS
  # ==========================================================================

  post-status-comment:

    name: Post Validation Status to PR

    runs-on: ubuntu-latest

    timeout-minutes: 10

    needs:
      - track-status

    # ------------------------------------------------------------------------
    # Only attempt comments for successful validation runs.
    #
    # The condition also ensures that scheduled executions can safely operate
    # because the actual validation result is passed through the previous job.
    # ------------------------------------------------------------------------

    if: >
      needs.track-status.outputs.validation_conclusion == 'success' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.post_comment == true
      )

    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:

      - name: Find associated pull request and update status
        uses: actions/github-script@v8
        env:
          VALIDATION_RUN_ID: ${{ needs.track-status.outputs.run_id }}
          VALIDATION_BRANCH: ${{ needs.track-status.outputs.head_branch }}
          VALIDATION_SHA: ${{ needs.track-status.outputs.head_sha }}
        with:
          github-token: ${{ secrets.MY_CUSTOM_TOKEN || github.token }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const validationRunId =
              Number(
                process.env.VALIDATION_RUN_ID || "0"
              );

            const validationBranch =
              String(
                process.env.VALIDATION_BRANCH || ""
              ).trim();

            const validationSha =
              String(
                process.env.VALIDATION_SHA || ""
              ).trim();

            const marker =
              "<!-- ollama-validation-status-tracker -->";

            console.log("============================================================");
            console.log("OLLAMA VALIDATION PR STATUS");
            console.log("============================================================");
            console.log(`Validation Run: ${validationRunId}`);
            console.log(`Branch:         ${validationBranch || "unknown"}`);
            console.log(`SHA:            ${validationSha || "unknown"}`);
            console.log("");

            // =================================================================
            // FIND PR
            // =================================================================

            let pullRequests = [];

            // Preferred method: workflow run API.
            if (
              Number.isInteger(validationRunId) &&
              validationRunId > 0
            ) {

              try {

                const response =
                  await github.rest.actions.getWorkflowRun({
                    owner,
                    repo,
                    run_id: validationRunId
                  });

                const run =
                  response.data;

                if (
                  Array.isArray(run.pull_requests) &&
                  run.pull_requests.length > 0
                ) {

                  pullRequests =
                    run.pull_requests;
                }

              } catch (error) {

                core.warning(
                  `Unable to retrieve validation run PRs: ${error.message}`
                );
              }
            }

            // Fallback: search by branch.
            if (
              pullRequests.length === 0 &&
              validationBranch
            ) {

              try {

                const response =
                  await github.rest.pulls.list({
                    owner,
                    repo,
                    state: "open",
                    head:
                      `${owner}:${validationBranch}`,
                    per_page: 100
                  });

                pullRequests =
                  response.data || [];

              } catch (error) {

                core.warning(
                  `Unable to search PRs by branch: ${error.message}`
                );
              }
            }

            // Fallback: search by commit SHA.
            if (
              pullRequests.length === 0 &&
              validationSha
            ) {

              try {

                const response =
                  await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner,
                    repo,
                    commit_sha: validationSha,
                    per_page: 100
                  });

                pullRequests =
                  (
                    response.data || []
                  )
                  .filter(
                    pr =>
                      pr.state === "open"
                  );

              } catch (error) {

                core.warning(
                  `Unable to find PRs associated with SHA: ${error.message}`
                );
              }
            }

            if (pullRequests.length === 0) {

              console.log(
                "No open pull request was found for this successful validation run."
              );

              return;
            }

            // =================================================================
            // PROCESS ASSOCIATED PRs
            // =================================================================

            for (const pr of pullRequests) {

              const prNumber =
                pr.number;

              console.log(
                `Processing PR #${prNumber}: ${pr.title}`
              );

              const commentBody = [
                marker,
                "",
                "## ✅ Ollama Validation Complete",
                "",
                "**Status:** All automated validation checks passed.",
                "",
                "### Validation",
                "- ✅ Platform compilation",
                "- ✅ Platform-specific feature validation",
                "- ✅ Automated test suite",
                "- ✅ Documentation/status validation",
                "- ✅ Final validation checks",
                "",
                `**Validation workflow run:** [#${validationRunId}](https://github.com/${owner}/${repo}/actions/runs/${validationRunId})`,
                "",
                `**Commit:** \`${validationSha || "unknown"}\``,
                `**Branch:** \`${validationBranch || "unknown"}\``,
                "",
                "**Ready for merge:** The validation workflow completed successfully.",
                "",
                "---",
                "*Automated status generated by GitHub Actions. This monitor runs independently of Codespaces.*"
              ].join("\n");

              // ---------------------------------------------------------------
              // FIND EXISTING TRACKER COMMENT
              // ---------------------------------------------------------------

              let existingComment = null;

              try {

                const comments =
                  await github.paginate(
                    github.rest.issues.listComments,
                    {
                      owner,
                      repo,
                      issue_number: prNumber,
                      per_page: 100
                    }
                  );

                existingComment =
                  comments.find(
                    comment =>
                      comment.user &&
                      (
                        comment.user.type === "Bot" ||
                        comment.user.login ===
                          "github-actions[bot]"
                      ) &&
                      typeof comment.body === "string" &&
                      comment.body.includes(marker)
                  ) || null;

              } catch (error) {

                core.warning(
                  `Unable to inspect existing PR comments for #${prNumber}: ${error.message}`
                );
              }

              // ---------------------------------------------------------------
              // UPDATE EXISTING COMMENT
              // ---------------------------------------------------------------

              if (existingComment) {

                try {

                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id:
                      existingComment.id,
                    body:
                      commentBody
                  });

                  console.log(
                    `Updated existing validation status comment on PR #${prNumber}.`
                  );

                } catch (error) {

                  core.warning(
                    `Unable to update existing comment on PR #${prNumber}: ${error.message}`
                  );
                }

              } else {

                // -------------------------------------------------------------
                // CREATE NEW COMMENT
                // -------------------------------------------------------------

                try {

                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number:
                      prNumber,
                    body:
                      commentBody
                  });

                  console.log(
                    `Posted validation status comment to PR #${prNumber}.`
                  );

                } catch (error) {

                  core.warning(
                    `Unable to post comment to PR #${prNumber}: ${error.message}`
                  );
                }
              }
            }

            console.log("");
            console.log("============================================================");
            console.log("PR STATUS UPDATE COMPLETE");
            console.log("============================================================");


      # ======================================================================
      # FINAL COMMENT JOB SUMMARY
      # ======================================================================

      - name: Publish PR status summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Ollama Validation Status Tracker

          | Metric | Value |
